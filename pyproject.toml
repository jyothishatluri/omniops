[project]
name = "omniops"
version = "0.1.0"
description = "Tool-agnostic, Slack-native AI incident investigator: SQL over observability APIs (Datadog, Dynatrace, Grafana, Prometheus, New Relic, Splunk, Elastic, CloudWatch, ...), no MCP."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "duckdb>=1.1",
    "pyarrow>=16",
    "sqlglot>=25",
    "openai>=1.60",
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "drain3>=0.9.11",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tzdata>=2024.1",
    "pytz>=2026.5",
    "aiohttp>=3.14.5",
]

[project.optional-dependencies]
aws = ["botocore>=1.34"]
gcp = ["google-auth>=2.30"]

[project.scripts]
omniops = "omniops.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
