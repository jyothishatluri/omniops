  - name: newrelic_alert_policies
    title: Alert policies
    description: >-
      Alert policies from actor.account.alerts.policiesSearch: id, name and incident preference
      (PER_POLICY / PER_CONDITION / PER_CONDITION_AND_TARGET - how incidents roll up into issues). Filter
      id (= / IN) or name (= exact, LIKE -> case-insensitive substring).
    kind: entities
    request:
      method: POST
      path: /graphql
      body_format: graphql
      body:
        query: >-
          query($accountId: Int!, $cursor: String, $criteria: AlertsPoliciesSearchCriteriaInput) { actor {
          account(id: $accountId) { alerts { policiesSearch(cursor: $cursor, searchCriteria: $criteria) {
          nextCursor totalCount policies { id name incidentPreference accountId entityGuid } } } } } }
        variables:
          accountId: "{{ env.NEW_RELIC_ACCOUNT_ID | int }}"
          criteria:
            ids: "{{ (filters.id | as_list | map('string') | list) if filters.id else none }}"
            name: "{{ filters.name if (filters.name and filters.name__op != 'like') else none }}"
            nameLike: "{{ (filters.name | replace('%', '')) if (filters.name and filters.name__op == 'like') else none }}"
    filters:
      - {column: id, type: BIGINT, ops: ["=", "in"], fan_out: false, examples: ["707052"]}
      - {column: name, ops: ["=", "like"], description: "Exact (case-insensitive) name, or LIKE for a substring match"}
    pagination: {type: cursor, cursor_path: "$.data.actor.account.alerts.policiesSearch.nextCursor", cursor_param: body.variables.cursor, max_pages: 10}
    response:
      rows_path: "$.data.actor.account.alerts.policiesSearch.policies[*]"
    columns:
      - {name: id, type: BIGINT, path: id}
      - {name: name, path: name}
      - {name: incident_preference, path: incidentPreference}
      - {name: account_id, type: BIGINT, path: accountId}
      - {name: entity_guid, path: entityGuid}
      - {name: total_count, type: BIGINT, path: "$.data.actor.account.alerts.policiesSearch.totalCount"}
    examples:
      - sql: "SELECT id, name, incident_preference FROM newrelic_alert_policies WHERE name LIKE '%checkout%'"
        description: Find the policies that cover a service.
    fixtures:
      - file: alerts_policies_search.json
        note: "Verbatim from the alert policies NerdGraph tutorial (docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-api-alerts-policies/, cursor pagination result) with the '// ... more policies' comment line removed to make it valid JSON."
        expect_rows: 2
        expect_columns: {id: 3455, name: First Policy Name, incident_preference: PER_POLICY, total_count: 745}
    docs_url: https://docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-api-alerts-policies/

  - name: newrelic_nrql_conditions
    title: NRQL alert conditions (definitions)
    description: >-
      NRQL alert conditions from actor.account.alerts.nrqlConditionsSearch with their NRQL, critical/warning
      thresholds, durations, signal settings (aggregation window/method/delay, fill), expiration (signal
      loss) and runbook. Filter id (the condition id = conditionFamilyId in issues/incidents; looked up
      first, then searched by its policy and name), policy_id, name (= or LIKE) or query (the NRQL, = or
      LIKE substring).
    kind: entities
    steps:
      - name: lookup_id
        when: "filters.id"
        method: POST
        path: /graphql
        body_format: graphql
        body:
          query: "query($accountId: Int!, $id: ID!) { actor { account(id: $accountId) { alerts { nrqlCondition(id: $id) { id name policyId } } } } }"
          variables:
            accountId: "{{ env.NEW_RELIC_ACCOUNT_ID | int }}"
            id: "{{ filters.id | string }}"
        capture:
          policy_id: "$.data.actor.account.alerts.nrqlCondition.policyId"
          name: "$.data.actor.account.alerts.nrqlCondition.name"
      - name: search
        method: POST
        path: /graphql
        body_format: graphql
        body:
          query: >-
            query($accountId: Int!, $cursor: String, $criteria: AlertsNrqlConditionsSearchCriteriaInput) { actor {
            account(id: $accountId) { alerts { nrqlConditionsSearch(searchCriteria: $criteria, cursor: $cursor) {
            nextCursor totalCount nrqlConditions { id name type enabled description policyId runbookUrl entityGuid
            titleTemplate nrql { query dataAccountId } signal { aggregationWindow aggregationMethod aggregationDelay
            aggregationTimer fillOption fillValue slideBy evaluationDelay } terms { operator priority threshold
            thresholdDuration thresholdOccurrences } expiration { closeViolationsOnExpiration expirationDuration
            openViolationOnExpiration } violationTimeLimitSeconds ... on AlertsNrqlBaselineCondition { baselineDirection }
            ... on AlertsNrqlStaticCondition { valueFunction } } } } } } }
          variables:
            accountId: "{{ env.NEW_RELIC_ACCOUNT_ID | int }}"
            criteria:
              policyId: "{{ (captures.policy_id or filters.policy_id) | string if (captures.policy_id or filters.policy_id) else none }}"
              name: "{{ captures.name or (filters.name if (filters.name and filters.name__op != 'like') else none) }}"
              nameLike: "{{ (filters.name | replace('%', '')) if (filters.name and filters.name__op == 'like' and not captures.name) else none }}"
              query: "{{ filters.query if (filters.query and filters.query__op != 'like') else none }}"
              queryLike: "{{ (filters.query | replace('%', '')) if (filters.query and filters.query__op == 'like') else none }}"
    filters:
      - {column: id, type: BIGINT, description: "Condition id (conditionFamilyId in incidents)", examples: ["1284850"]}
      - {column: policy_id, type: BIGINT}
      - {column: name, ops: ["=", "like"], description: "Exact (case-insensitive) or LIKE substring"}
      - {column: query, ops: ["=", "like"], description: "The condition's NRQL, exact or LIKE substring"}
    pagination: {type: cursor, cursor_path: "$.data.actor.account.alerts.nrqlConditionsSearch.nextCursor", cursor_param: body.variables.cursor, max_pages: 10}
    response:
      rows_path: "$.data.actor.account.alerts.nrqlConditionsSearch.nrqlConditions[*]"
    columns:
      - {name: id, type: BIGINT, path: id}
      - {name: name, path: name}
      - {name: type, path: type, description: "STATIC | BASELINE | OUTLIER"}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: policy_id, type: BIGINT, path: policyId}
      - {name: description, path: description}
      - {name: runbook_url, path: runbookUrl}
      - {name: query, path: nrql.query, description: "The condition's NRQL (no SINCE: evaluated per aggregation window)"}
      - {name: data_account_id, type: BIGINT, path: nrql.dataAccountId}
      - {name: operator, expr: "(_.terms or []) | selectattr('priority', 'equalto', 'CRITICAL') | map(attribute='operator') | first"}
      - {name: critical_threshold, type: DOUBLE, expr: "(_.terms or []) | selectattr('priority', 'equalto', 'CRITICAL') | map(attribute='threshold') | first"}
      - {name: critical_duration_s, type: BIGINT, expr: "(_.terms or []) | selectattr('priority', 'equalto', 'CRITICAL') | map(attribute='thresholdDuration') | first"}
      - {name: critical_occurrences, expr: "(_.terms or []) | selectattr('priority', 'equalto', 'CRITICAL') | map(attribute='thresholdOccurrences') | first"}
      - {name: warning_threshold, type: DOUBLE, expr: "(_.terms or []) | selectattr('priority', 'equalto', 'WARNING') | map(attribute='threshold') | first"}
      - {name: terms, type: JSON, path: terms}
      - {name: aggregation_window_s, type: BIGINT, path: signal.aggregationWindow}
      - {name: aggregation_method, path: signal.aggregationMethod, description: "EVENT_FLOW | EVENT_TIMER | CADENCE"}
      - {name: aggregation_delay_s, type: BIGINT, path: signal.aggregationDelay}
      - {name: fill_option, path: signal.fillOption}
      - {name: expiration_duration_s, type: BIGINT, path: expiration.expirationDuration, description: "Signal-loss window"}
      - {name: open_violation_on_expiration, type: BOOLEAN, path: expiration.openViolationOnExpiration}
      - {name: violation_time_limit_s, type: BIGINT, path: violationTimeLimitSeconds}
      - {name: baseline_direction, path: baselineDirection}
      - {name: value_function, path: valueFunction}
      - {name: entity_guid, path: entityGuid}
      - {name: title_template, path: titleTemplate}
      - {name: signal, type: JSON, path: signal}
    pitfalls:
      - "Thresholds are evaluated on aggregation_window_s buckets after aggregation_delay_s; a condition can open minutes after the metric moved."
      - "critical_duration_s with critical_occurrences = ALL means every bucket in that window breached; AT_LEAST_ONCE means any single bucket."
      - "A condition's id equals conditionFamilyId in newrelic_incidents/newrelic_issues."
    examples:
      - sql: >-
          SELECT name, type, query, operator, critical_threshold, critical_duration_s, critical_occurrences,
          aggregation_window_s, aggregation_delay_s, runbook_url
          FROM newrelic_nrql_conditions WHERE id = 1284850
        description: The full definition of the condition that fired (id from the incident/issue).
      - sql: "SELECT id, name, enabled, query FROM newrelic_nrql_conditions WHERE query LIKE '%checkout-service%'"
        description: Which conditions watch a service.
    fixtures:
      - file: nrql_conditions_search.json
        note: "Verbatim from the NRQL condition NerdGraph tutorial (docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-api-nrql-condition-alerts/, 'Request type-specific fields' response)."
        expect_rows: 2
        expect_columns: {id: 342, name: My baseline condition, type: BASELINE, baseline_direction: UPPER_ONLY}
      - file: nrql_conditions_cursor.json
        note: "Verbatim from the same tutorial's cursor pagination response (comment line removed)."
        expect_rows: 2
        expect_columns: {id: 4432, type: BASELINE}
      - file: nrql_conditions_full.json
        note: "Built from the documented static condition example (same tutorial: name, nrql.query, signal, terms, valueFunction, violationTimeLimitSeconds) in the response shape of the field list used by newrelic-client-go pkg/alerts/nrql_conditions.go (graphqlNrqlConditionStructFields)."
        filters: {id: 1284850}
        expect_rows: 1
        expect_columns: {id: 1284850, policy_id: 707052, query: "SELECT uniqueCount(host) FROM Transaction WHERE appName='my-app-name'", operator: BELOW, critical_threshold: 2.0, critical_duration_s: 600, critical_occurrences: AT_LEAST_ONCE, aggregation_window_s: 60, aggregation_delay_s: 120, value_function: SINGLE_VALUE}
    docs_url: https://docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-api-nrql-condition-alerts/

  - name: newrelic_muting_rules
    title: Alert muting rules
    description: >-
      Muting rules of NEW_RELIC_ACCOUNT_ID from actor.account.alerts.mutingRules: name, enabled, the
      condition that selects which alert events are muted (attribute / operator / values on alert event
      attributes such as conditionName, policyName, entity.guid, targetName, tags.host), and the schedule
      window (local time + time zone, optional DAILY/WEEKLY/MONTHLY repeat). Use it to explain an incident
      that opened without notifying anyone (newrelic_alert_events.muted / muting_rule_id,
      newrelic_issues.muting_state). The API takes no filter: one request returns every rule; filter id,
      name, enabled in SQL.
    kind: entities
    request:
      method: POST
      path: /graphql
      body_format: graphql
      body:
        query: >-
          query($accountId: Int!) { actor { account(id: $accountId) { alerts { mutingRules { id accountId name
          description enabled actionOnMutingRuleWindowEnded createdAt updatedAt condition { operator conditions {
          attribute operator values } } schedule { startTime endTime timeZone repeat endRepeat repeatCount
          weeklyRepeatDays } } } } } }
        variables:
          accountId: "{{ env.NEW_RELIC_ACCOUNT_ID | int }}"
    response:
      rows_path: "$.data.actor.account.alerts.mutingRules[*]"
    columns:
      - {name: id, type: BIGINT, path: id, description: "Muting rule id (= NrAiIncident.mutingRuleId)"}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: account_id, type: BIGINT, path: accountId}
      - {name: condition_operator, path: condition.operator, description: "AND | OR - how the sub-conditions combine"}
      - {name: conditions, type: JSON, path: condition.conditions, description: "List of {attribute, operator, values}"}
      - {name: muted_attributes, path: "condition.conditions[*].attribute", transform: join, transform_arg: ", ", description: "Alert event attributes the rule matches on"}
      - {name: schedule_start, path: schedule.startTime, description: "Local ISO time WITHOUT offset, in time_zone (null = always on while enabled)"}
      - {name: schedule_end, path: schedule.endTime, description: "Local ISO time WITHOUT offset, in time_zone"}
      - {name: time_zone, path: schedule.timeZone, description: "IANA zone of schedule_start/schedule_end, e.g. America/Los_Angeles"}
      - {name: repeat, path: schedule.repeat, description: "DAILY | WEEKLY | MONTHLY | null"}
      - {name: end_repeat, path: schedule.endRepeat}
      - {name: repeat_count, type: BIGINT, path: schedule.repeatCount}
      - {name: weekly_repeat_days, type: JSON, path: schedule.weeklyRepeatDays}
      - {name: action_on_window_ended, path: actionOnMutingRuleWindowEnded, description: "CLOSE_ISSUES_ON_INACTIVE | DO_NOTHING"}
      - {name: created_at, type: TIMESTAMP, path: createdAt, transform: auto_time}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt, transform: auto_time}
    pitfalls:
      - "schedule_start/schedule_end are local wall-clock times in time_zone, not UTC: convert before comparing with incident times (e.g. timezone(time_zone, CAST(schedule_start AS TIMESTAMP)))."
      - "An enabled rule with no schedule mutes matching alert events at all times."
      - "A muted incident still opens and appears in newrelic_incidents / newrelic_alert_events; only notifications are suppressed."
      - "Rules are per account: a rule in another account never mutes NEW_RELIC_ACCOUNT_ID's incidents."
    examples:
      - sql: >-
          SELECT id, name, condition_operator, conditions, schedule_start, schedule_end, time_zone, repeat
          FROM newrelic_muting_rules WHERE enabled = true ORDER BY name
        description: Enabled muting rules and their windows - could one have silenced the alert?
      - sql: >-
          SELECT a.ts, a.condition_name, a.service, m.name AS muting_rule, m.conditions
          FROM newrelic_alert_events a JOIN newrelic_muting_rules m ON m.id = a.muting_rule_id
          WHERE a.muted = true AND a.ts > TIMESTAMP '2026-09-30 12:00:00'
        description: Which muting rule silenced which incident in the last day.
    fixtures:
      - file: muting_rules.json
        note: "Built strictly from the documented muting-rule fields (docs.newrelic.com/docs/alerts/get-notified/muting-rules-suppress-notifications/#manage-with-nerdgraph field table) and the doc's example rules ('host-1 mute rule' with tags.host EQUALS host-1; targetName/product OR rule) and schedule example values; id is an ID string and createdAt a DateTime string as in newrelic-client-go pkg/alerts/muting_rules.go. The docs publish no response body."
        expect_rows: 2
        expect_columns: {id: 36578, name: host-1 mute rule, enabled: true, condition_operator: AND, muted_attributes: tags.host, schedule_start: "2020-07-08T14:30:00", time_zone: America/Los_Angeles, action_on_window_ended: CLOSE_ISSUES_ON_INACTIVE, created_at: "2020-07-08T21:20:02Z"}
    docs_url: https://docs.newrelic.com/docs/alerts/get-notified/muting-rules-suppress-notifications/

  # ------------------------------------------------------------------------------------------
  # Change tracking
  # ------------------------------------------------------------------------------------------
  - name: newrelic_change_events
    title: Change events (deployments, feature flags, config, business events)
    description: >-
      Change tracking events across the account from actor.changeTracking.changeTrackingSearch (events
      created with changeTrackingCreateEvent): deployments (version, commit, changelog, deep link),
      feature flags, configuration and custom changes, each tied to an entity. Filter service
      (entity.name), entity_guid, author (user), query (change-tracking search condition, e.g.
      "category = 'Deployment'") and ts (epoch-ms timeWindow; default 48h).
    kind: changes
    request:
      method: POST
      path: /graphql
      body_format: graphql
      body:
        query: >-
          {%- set q = [
            ('(' ~ filters.query ~ ')') if filters.query else none,
            ('entity.name IN (' ~ (filters.service | as_list | map('squote') | join(', ')) ~ ')') if filters.service else none,
            ('entity.guid IN (' ~ (filters.entity_guid | as_list | map('squote') | join(', ')) ~ ')') if filters.entity_guid else none,
            ('user = ' ~ (filters.user | squote)) if filters.user else none
          ] | select | join(' AND ') -%}
          { actor { changeTracking { changeTrackingSearch(filter: { timeWindow: { startTime: {{ time.start | epoch_ms }},
          endTime: {{ time.end | epoch_ms }} }, accountIds: [{{ env.NEW_RELIC_ACCOUNT_ID | int }}], limit: {{ [limit or 1000, 1000] | min }}
          {%- if q %}, query: {{ q | json }}{% endif %} }) { changeEvents { changeTrackingId category type shortDescription
          description groupId timestamp user customAttributes entity { guid name accountId entityType }
          ... on ChangeTrackingDeploymentEvent { version commit changelog deepLink }
          ... on ChangeTrackingFeatureFlagEvent { featureFlagId } } } } } }
    filters:
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Entity name the change is attached to", examples: ["checkout-service"]}
      - {column: entity_guid, ops: ["=", "in"], fan_out: false}
      - {column: author, param: user, description: "user who made the change"}
      - {column: query, description: "Change-tracking search condition (NRQL WHERE syntax without WHERE), e.g. category = 'Deployment'"}
    time: {column: ts, default_lookback: 48h, max_window: 30d, retention: 395d}
    response:
      rows_path: "$.data.actor.changeTracking.changeTrackingSearch.changeEvents[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms}
      - {name: id, path: changeTrackingId}
      - {name: category, path: category, description: "Deployment | Feature Flag | Configuration | ..."}
      - {name: type, path: type}
      - name: title
        expr: "_.shortDescription or ((_.category or 'change') ~ ((' ' ~ _.version) if _.version else '') ~ ((' on ' ~ _.entity.name) if _.entity.name else ''))"
      - {name: short_description, path: shortDescription}
      - {name: description, path: description}
      - {name: version, path: version}
      - {name: commit, path: commit}
      - {name: changelog, path: changelog}
      - {name: url, path: deepLink}
      - {name: author, path: user}
      - {name: group_id, path: groupId}
      - {name: feature_flag_id, path: featureFlagId}
      - {name: service, path: entity.name}
      - {name: entity_guid, path: entity.guid}
      - {name: entity_type, path: entity.entityType}
      - {name: account_id, type: BIGINT, path: entity.accountId}
      - {name: custom_attributes, type: JSON, path: customAttributes}
      - {name: query, filter_only: true}
    pitfalls:
      - "changeTrackingSearch returns events created with the newer changeTrackingCreateEvent API. Deployments recorded with the legacy REST/changeTrackingCreateDeployment APIs live in the Deployment event type: see newrelic_deployments or newrelic_nrql with FROM Deployment."
      - "Events are attached to entities: a deploy recorded on the wrong entity (e.g. the k8s workload, not the APM app) will not match service."
    examples:
      - sql: >-
          SELECT ts, service, category, version, author, title, url FROM newrelic_change_events
          WHERE ts BETWEEN TIMESTAMP '2026-10-01 09:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC
        description: Every change in the account in the hours before the incident.
      - sql: >-
          SELECT ts, version, commit, changelog, author FROM newrelic_change_events
          WHERE service = 'checkout-service' AND category = 'Deployment' AND ts > TIMESTAMP '2026-09-30 12:00:00'
          ORDER BY ts DESC LIMIT 5
        description: Recent deployments of one service (did a deploy precede the alert?).
    fixtures:
      - file: change_tracking_search.json
        note: "Built strictly from the documented changeTrackingSearch selection set (docs.newrelic.com/docs/change-tracking/query-data/: changeTrackingId category type shortDescription description groupId timestamp user customAttributes entity { guid accountId }) plus the ChangeTrackingDeploymentEvent/FeatureFlagEvent fragments used by newrelic-client-go pkg/changetracking; the docs publish no response body."
        expect_rows: 2
        expect_columns: {ts: "2025-10-01T12:30:00Z", id: "8a3a594c-e726-4bc2-8078-26dffec9a3d8", category: Deployment, version: "1.2.3", service: checkout-service, author: ci-bot, title: "checkout-service 1.2.3", url: "https://github.com/example/checkout/actions/runs/1"}
    docs_url: https://docs.newrelic.com/docs/change-tracking/query-data/

  - name: newrelic_deployments
    title: Deployments of one entity (change tracking deploymentSearch)
    description: >-
      Deployment markers of one entity from actor.entity(guid).deploymentSearch - includes deployments
      recorded with the legacy REST v2 / changeTrackingCreateDeployment APIs. Filter guid or service
      (resolved to the first APM/EXT entity with that exact name), author (user), query (search
      condition, e.g. "version = '1.2.3'") and ts (epoch-ms timeWindow; default 48h).
    kind: changes
    steps:
      - *resolve_entity
      - name: deployments
        when: "filters.guid or captures.guid"
        method: POST
        path: /graphql
        body_format: graphql
        body:
          query: >-
            {%- set q = [
              ('(' ~ filters.query ~ ')') if filters.query else none,
              ('user = ' ~ (filters.user | squote)) if filters.user else none
            ] | select | join(' AND ') -%}
            { actor { entity(guid: {{ (filters.guid or captures.guid) | json }}) { guid name
            deploymentSearch(filter: { timeWindow: { startTime: {{ time.start | epoch_ms }}, endTime: {{ time.end | epoch_ms }} },
            limit: {{ [limit or 2000, 2000] | min }}{% if q %}, query: {{ q | json }}{% endif %} }) { results { version entityGuid
            timestamp changelog commit deepLink deploymentId description deploymentType groupId user } } } } }
    filters:
      - {column: guid, description: "Entity GUID", examples: ["MXxBUE18QVBQTElDQVRJT058MzIxNjY2NA"]}
      - {column: service, description: "Exact entity name; resolved to a GUID first"}
      - {column: author, param: user}
      - {column: query, description: "Deployment search condition, e.g. version = '1.2.3' or deploymentType IN ('CANARY')"}
    require_one_of: [[guid, service]]
    time: {column: ts, default_lookback: 48h, max_window: 30d, retention: 395d}
    response:
      rows_path: "$.data.actor.entity.deploymentSearch.results[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms}
      - {name: version, path: version}
      - {name: title, expr: "'Deployment ' ~ (_.version or '') ~ ((': ' ~ _.description) if _.description else '')"}
      - {name: deployment_id, path: deploymentId}
      - {name: deployment_type, path: deploymentType, description: "BASIC | BLUE_GREEN | CANARY | ROLLING | SHADOW | OTHER"}
      - {name: description, path: description}
      - {name: commit, path: commit}
      - {name: changelog, path: changelog}
      - {name: url, path: deepLink}
      - {name: author, path: user}
      - {name: group_id, path: groupId}
      - {name: entity_guid, path: entityGuid}
      - {name: service, path: "$.data.actor.entity.name"}
      - {name: guid, filter_only: true}
      - {name: query, filter_only: true}
    pitfalls:
      - "Needs one entity: with service, the first APM/EXT entity with exactly that name is used (0 rows if none matches - check newrelic_entities)."
      - "Returns at most 2,000 deployments (the API maximum), newest kept."
    examples:
      - sql: >-
          SELECT ts, version, deployment_type, author, commit, url FROM newrelic_deployments
          WHERE service = 'checkout-service' AND ts > TIMESTAMP '2026-09-29 12:00:00' ORDER BY ts DESC
        description: Deploy history of a service for the last few days.
    fixtures:
      - file: deployment_search.json
        note: "Built strictly from the documented deploymentSearch selection set (docs.newrelic.com/docs/change-tracking/query-data/: version entityGuid timestamp changelog commit deepLink deploymentId description deploymentType groupId user) and ChangeTrackingDeployment types in newrelic-client-go; the docs publish no response body."
        filters: {guid: "MXxBUE18QVBQTElDQVRJT058MzIxNjY2NA"}
        expect_rows: 1
        expect_columns: {ts: "2025-10-01T12:30:00Z", version: "1.2.3", deployment_type: ROLLING, author: ci-bot, service: checkout-service, title: "Deployment 1.2.3: Roll out retry budget change"}
    docs_url: https://docs.newrelic.com/docs/change-tracking/query-data/

  - name: newrelic_change_markers
    title: All change markers in the account (NRQL on ChangeTrackingEvent + Deployment)
    description: >-
      Every change marker of NEW_RELIC_ACCOUNT_ID from BOTH change-tracking stores in one NRQL query, as the
      change-tracking docs recommend (FROM ChangeTrackingEvent, Deployment): ChangeTrackingEvent rows
      (changeTrackingCreateEvent: deployments, feature flags, configuration, custom categories) and legacy
      Deployment rows (changeTrackingCreateDeployment and the REST v2 deployment API). One row per change,
      newest first, account-wide - no entity GUID needed. Filter service (entity.name), entity_guid,
      category (category = 'Deployment' also matches every legacy Deployment row), version, author (user),
      query (extra NRQL WHERE) and ts (epoch-ms SINCE/UNTIL).
    kind: changes
    request:
      method: POST
      path: /graphql
      body_format: graphql
      timeout_s: 90
      body:
        query: *nrql_doc
        variables:
          accountId: "{{ env.NEW_RELIC_ACCOUNT_ID | int }}"
          timeout: 60
          nrql: >-
            {%- set cats = filters.category | as_list -%}
            {%- set w = [
              ('(' ~ filters.query ~ ')') if filters.query else none,
              ('entity.name IN (' ~ (filters.service | as_list | map('squote') | join(', ')) ~ ')') if filters.service else none,
              ('entity.guid IN (' ~ (filters.entity_guid | as_list | map('squote') | join(', ')) ~ ')') if filters.entity_guid else none,
              ('version IN (' ~ (filters.version | as_list | map('string') | map('squote') | join(', ')) ~ ')') if filters.version else none,
              ('user = ' ~ (filters.user | squote)) if filters.user else none,
              ('(' ~ ((["eventType() = 'Deployment'"] if ('deployment' in (cats | map('lower') | list)) else []) + ['category IN (' ~ (cats | map('squote') | join(', ')) ~ ')']) | join(' OR ') ~ ')') if cats else none
            ] | select | join(' AND ') -%}
            SELECT * FROM ChangeTrackingEvent, Deployment{% if w %} WHERE {{ w }}{% endif %}
            SINCE {{ time.start | epoch_ms }} UNTIL {{ time.end | epoch_ms }}
            LIMIT {{ limit if (limit and limit < 5000) else 'MAX' }}
    filters:
      - {column: service, ops: ["=", "in"], fan_out: false, description: "entity.name the change is attached to (exact, case-sensitive)", examples: ["checkout-service"]}
      - {column: entity_guid, ops: ["=", "in"], fan_out: false, description: "entity.guid"}
      - {column: category, ops: ["=", "in"], fan_out: false, description: "Deployment | Feature Flag | Configuration | ... ('Deployment' includes legacy Deployment events)", examples: ["Deployment"]}
      - {column: version, ops: ["=", "in"], fan_out: false, examples: ["1.2.3"]}
      - {column: author, param: user, description: "user who made the change"}
      - {column: query, description: "Extra NRQL WHERE condition, e.g. groupId = 'release-42' or deploymentType = 'CANARY'"}
    time: {column: ts, default_lookback: 48h, max_window: 30d, retention: 395d}
    response:
      rows_path: "$.data.actor.account.nrql.results[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms, description: "Start time of the change (epoch ms in NRDB)"}
      - {name: id, expr: "_.changeTrackingId or _.deploymentId or none", description: "changeTrackingId (ChangeTrackingEvent) or deploymentId (legacy Deployment)"}
      - {name: event_type, expr: "'ChangeTrackingEvent' if _.changeTrackingId else ('Deployment' if _.deploymentId else none)", description: "Which store the row came from"}
      - {name: category, expr: "_.category or ('Deployment' if _.deploymentId else none)", description: "Deployment | Feature Flag | ... (legacy rows are always Deployment)"}
      - {name: type, expr: "_.type or _.deploymentType or none", description: "Change type (ChangeTrackingEvent) or deploymentType (BASIC, BLUE_GREEN, CANARY, ROLLING, SHADOW, OTHER)"}
      - name: title
        expr: >-
          _.shortDescription or (((_.category or 'Deployment') ~ ((' ' ~ _.version) if _.version else '')
          ~ ((' of ' ~ _['entity.name']) if _['entity.name'] else '')))
      - {name: description, path: description}
      - {name: version, path: version}
      - {name: commit, path: commit}
      - {name: changelog, path: changelog}
      - {name: url, path: deepLink, description: "deepLink back to the CI/CD system"}
      - {name: author, path: user}
      - {name: group_id, path: groupId}
      - {name: feature_flag_id, path: featureFlagId}
      - {name: service, path: "['entity.name']"}
      - {name: entity_guid, path: "['entity.guid']"}
      - {name: entity_type, path: "['entity.type']"}
      - {name: entity_domain, path: "['entity.domain']"}
      - {name: provider, path: "['instrumentation.provider']", description: "Tool that sent the change (nerdgraph, newrelic-cli, axios ...)"}
      - {name: attributes, type: JSON, path: ".", description: "All attributes (custom attributes of ChangeTrackingEvent included)"}
      - {name: query, filter_only: true}
    max_rows: 5000
    sort_hint: "Newest first."
    pitfalls:
      - "This is the only change table that sees both stores account-wide. newrelic_change_events misses legacy REST/changeTrackingCreateDeployment deployments; newrelic_deployments needs one entity."
      - "entity.name is exact and case-sensitive; a deploy recorded on another entity (k8s workload, browser app) will not match service: try service LIKE via query = \"entity.name LIKE '%checkout%'\"."
      - "Legacy Deployment rows have no category/shortDescription; category and title are derived (category = 'Deployment')."
      - "Change markers are kept 13 months (Original Data) - older ones are gone, not absent."
    examples:
      - sql: >-
          SELECT ts, service, category, version, author, title, url FROM newrelic_change_markers
          WHERE ts BETWEEN TIMESTAMP '2026-10-01 09:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC
        description: Every change (new and legacy deployments, flags, config) in the hours before the incident.
      - sql: >-
          SELECT ts, version, commit, changelog, author, event_type FROM newrelic_change_markers
          WHERE service = 'checkout-service' AND category = 'Deployment' AND ts > TIMESTAMP '2026-09-30 12:00:00'
          ORDER BY ts DESC LIMIT 5
        description: Last deployments of the alerting service, whichever API recorded them.
    fixtures:
      - file: nrql_change_markers.json
        note: "Built from the documented NRQL raw-event result shape (flat objects with dotted keys and epoch-ms timestamp; newrelic-client-go pkg/nrdb fixtures) using only ChangeTrackingEvent and Deployment attributes from the New Relic data dictionary (docs.newrelic.com/attribute-dictionary/?dataSource=Change+tracking); values illustrative. No verbatim response is published."
        filters: {category: "Deployment"}
        expect_rows: 2
        expect_columns: {ts: "2025-10-01T12:30:00Z", id: "8a3a594c-e726-4bc2-8078-26dffec9a3d8", event_type: ChangeTrackingEvent, category: Deployment, title: "checkout-service 1.2.3", version: "1.2.3", url: "https://github.com/example/checkout/actions/runs/1", author: ci-bot, service: checkout-service, provider: nerdgraph}
    docs_url: https://docs.newrelic.com/docs/change-tracking/query-data/

  # ------------------------------------------------------------------------------------------
  # Service levels (SLIs / SLOs)
  # ------------------------------------------------------------------------------------------
  - name: newrelic_service_levels
    title: Service level indicators and objectives of an entity
    description: >-
      SLIs defined on one entity from actor.entity(guid).serviceLevel.indicators, one row per (SLI,
      objective): the SLI id (sli.id in NRQL), its valid/good/bad event definitions (FROM + WHERE), the SLO
      target (%) and rolling window, and New Relic's ready-made attainment NRQL (attainment_query).
      Filter guid or service (resolved to the first APM/EXT entity with that exact name). To see whether
      the SLO is burning, run attainment_query (without SINCE) through newrelic_nrql, or
      FROM Metric SELECT ... newrelic.sli.valid / newrelic.sli.bad WHERE sli.id = '<sli_id>'.
    kind: entities
    steps:
      - *resolve_entity
      - name: indicators
        when: "filters.guid or captures.guid"
        method: POST
        path: /graphql
        body_format: graphql
        body:
          query: >-
            { actor { entity(guid: {{ (filters.guid or captures.guid) | json }}) { guid name serviceLevel {
            indicators { id guid name description entityGuid createdAt updatedAt events { validEvents { from
            where } goodEvents { from where } badEvents { from where } } objectives { name description target
            timeWindow { rolling { count unit } } } resultQueries { indicator { nrql } } } } } } }
    filters:
      - {column: guid, description: "GUID of the entity the SLIs belong to", examples: ["MXxBUE18QVBQTElDQVRJT058MzIxNjY2NA"]}
      - {column: service, description: "Exact entity name; resolved to a GUID first"}
    require_one_of: [[guid, service]]
    response:
      rows_path: "$.data.actor.entity.serviceLevel.indicators[*]"
      expand:
        - {explode: objectives, as: o, keep_empty: true}
    columns:
      - {name: sli_id, path: id, description: "SLI id: NRQL attribute sli.id"}
      - {name: sli_guid, path: guid, description: "Entity GUID of the SLI itself"}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: entity_guid, path: entityGuid, description: "Entity the SLI measures"}
      - {name: service, path: "$.data.actor.entity.name"}
      - {name: valid_events, expr: "('FROM ' ~ _.events.validEvents.from ~ ((' WHERE ' ~ _.events.validEvents.where) if _.events.validEvents.where else '')) if (_.events and _.events.validEvents) else none"}
      - {name: good_events, expr: "('FROM ' ~ _.events.goodEvents.from ~ ((' WHERE ' ~ _.events.goodEvents.where) if _.events.goodEvents.where else '')) if (_.events and _.events.goodEvents) else none"}
      - {name: bad_events, expr: "('FROM ' ~ _.events.badEvents.from ~ ((' WHERE ' ~ _.events.badEvents.where) if _.events.badEvents.where else '')) if (_.events and _.events.badEvents) else none"}
      - {name: target_pct, type: DOUBLE, path: "@o.target", description: "SLO target in percent (e.g. 99.5)"}
      - {name: window_days, type: BIGINT, expr: "o.timeWindow.rolling.count if (o and o.timeWindow and o.timeWindow.rolling and o.timeWindow.rolling.unit == 'DAY') else none", description: "Rolling SLO window (1, 7, 14, 28 or 30 days)"}
      - {name: objective_name, path: "@o.name"}
      - {name: attainment_query, path: resultQueries.indicator.nrql, description: "NRQL that computes SLI attainment (%)"}
      - {name: created_at, type: TIMESTAMP, path: createdAt, transform: epoch_ms}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt, transform: epoch_ms}
      - {name: guid, filter_only: true}
    pitfalls:
      - "Needs one entity: with service, the first APM/EXT entity with exactly that name is used (0 rows if none matches or it has no SLIs - check newrelic_entities)."
      - "An SLI with several objectives yields one row per objective; count SLIs with count(DISTINCT sli_id)."
      - "Attainment is not in this table: run attainment_query (strip any SINCE/UNTIL) through newrelic_nrql for the incident window."
    examples:
      - sql: >-
          SELECT sli_id, name, target_pct, window_days, valid_events, good_events, attainment_query
          FROM newrelic_service_levels WHERE service = 'checkout-service'
        description: The SLOs of the alerting service and how each SLI is defined.
    fixtures:
      - file: service_levels.json
        note: "Built strictly from the documented indicators selection set (docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-slm/ 'Retrieve the configuration of an SLI' and consume-slm resultQueries.indicator.nrql) with the doc's example SLI values (Latency below 0.25 seconds, Transaction valid/good events, target 99.5, rolling 7 DAY) and the documented attainment NRQL; createdAt/updatedAt are EpochMilliseconds per newrelic-client-go pkg/servicelevel. No response body is published."
        filters: {guid: "MXxBUE18QVBQTElDQVRJT058MzIxNjY2NA"}
        expect_rows: 1
        expect_columns: {sli_id: "a1b2c3d4-0000-4000-8000-000000000001", name: Latency below 0.25 seconds, service: checkout-service, target_pct: 99.5, window_days: 7, valid_events: "FROM Transaction WHERE entityGuid = 'MXxBUE18QVBQTElDQVRJT058MzIxNjY2NA'", bad_events: null, created_at: "2025-10-01T10:00:00Z"}
    docs_url: https://docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-slm/

roles:
  metrics:
    table: newrelic_nrql
    query_language: nrql
    columns: {ts: ts, value: value, labels: result, metric: facet}
    notes: "Write NRQL without SINCE/UNTIL; FROM Metric / Transaction / SystemSample / K8s*Sample."
  logs:
    table: newrelic_logs
    filters:
      service: "{{ service }}"
      host: "{{ host }}"
      query: "{{ \"lower(level) IN ('error', 'err', 'fatal', 'critical', 'severe', 'warn', 'warning')\" if error_only else '' }}"
    columns: {ts: ts, service: service, message: message, level: level, host: host, trace_id: trace_id}
    query_language: nrql
    notes: "query is an NRQL WHERE condition on Log."
  log_counts:
    table: newrelic_log_counts
    filters: {service: "{{ service }}"}
    columns: {ts: ts, value: count, level: facet}
  traces:
    table: newrelic_spans
    filters:
      service: "{{ service }}"
      is_error: "{{ true if error_only else '' }}"
    columns: {ts: ts, service: service, trace_id: trace_id, span_id: span_id, duration_ms: duration_ms, resource: name, status_code: status_code}
  trace_detail:
    table: newrelic_trace
    columns: {ts: ts, trace_id: trace_id, span_id: span_id, service: service, duration_ms: duration_ms, resource: name}
  service_map:
    table: newrelic_entity_relationships
    filters: {service: "{{ service }}"}
    columns: {service: entity_name, related: related_name, direction: direction, type: relationship}
  services:
    table: newrelic_entities
    filters: {domain: "{{ ['APM', 'EXT'] }}", name: "{{ service }}"}
    columns: {service: name, id: guid, url: url, state: alert_severity}
  hosts:
    table: newrelic_entities
    filters: {domain: "INFRA", type: "HOST", name: "{{ host }}"}
    columns: {host: host, id: guid, url: url, state: alert_severity}
  change_events:
    - table: newrelic_change_markers
      filters: {service: "{{ service }}"}
      columns: {ts: ts, service: service, title: title, version: version, author: author, url: url, type: category}
      notes: "Account-wide NRQL over ChangeTrackingEvent + legacy Deployment; omit service to see every change."
    - table: newrelic_change_events
      filters: {service: "{{ service }}"}
      columns: {ts: ts, service: service, title: title, version: version, author: author, url: url}
    - table: newrelic_deployments
      filters: {service: "{{ service }}"}
      columns: {ts: ts, service: service, title: title, version: version, author: author, url: url}
  active_alerts:
    table: newrelic_issues
    filters: {state: "ACTIVATED"}
    columns: {ts: activated_at, name: title, state: state, severity: priority, service: service, labels: entity_guids, url: url}
  alert_history:
    table: newrelic_alert_events
    filters: {service: "{{ service }}"}
    columns: {ts: ts, name: condition_name, state: state, severity: priority, service: service, title: title}
  alert_rules:
    table: newrelic_nrql_conditions
    filters: {id: "{{ alert_id }}"}
    columns: {id: id, name: name, query: query, threshold: critical_threshold}
  incidents:
    table: newrelic_issues
    columns: {id: issue_id, ts: created_at, title: title, state: state, severity: priority, service: service, url: url}
  errors:
    table: newrelic_errors
    filters: {service: "{{ service }}"}
    columns: {ts: last_seen, service: service, title: title, count: occurrences, message: message}
  slo:
    table: newrelic_service_levels
    filters: {service: "{{ service }}"}
    columns: {id: sli_id, service: service, name: name, target: target_pct, window_days: window_days, query: attainment_query}
    notes: "Definitions only; run attainment_query through newrelic_nrql for the burn in the incident window."
