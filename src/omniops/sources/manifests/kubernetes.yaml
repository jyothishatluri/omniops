    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/namespace-v1/#get-list

  - name: kubernetes_validating_webhooks
    title: Validating admission webhooks
    description: >-
      One row per webhook of every ValidatingWebhookConfiguration (GET
      /apis/admissionregistration.k8s.io/v1/validatingwebhookconfigurations): failurePolicy
      (Fail blocks matching requests when the webhook is unreachable), target service
      namespace/name/port/path or URL, rules (operations x resources), namespace/object selectors
      and timeout. A Fail-policy webhook whose service is missing blocks every matching CREATE.
    kind: entities
    request:
      method: GET
      path: /apis/admissionregistration.k8s.io/v1/validatingwebhookconfigurations
      query: *q_cluster_named
    filters:
      - {column: name, ops: ["=", "in", "!=", "like"], description: "Configuration name (exact)", examples: [pod-policy]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
      expand:
        - {explode: webhooks, as: w, keep_empty: true}
    columns:
      - {name: kind, expr: "'ValidatingWebhookConfiguration'"}
      - {name: name, path: metadata.name, description: "Configuration name"}
      - &c_webhook {name: webhook, path: "@w.name", description: "Webhook name (e.g. pod-policy.platform-ops.svc)"}
      - &c_failure_policy {name: failure_policy, expr: "(w.failurePolicy or 'Fail') if w else none", description: "Fail (default) | Ignore"}
      - &c_service_namespace {name: service_namespace, path: "@w.clientConfig.service.namespace"}
      - &c_service_name {name: service_name, path: "@w.clientConfig.service.name"}
      - &c_service_port {name: service_port, type: BIGINT, expr: "(w.clientConfig.service.port or 443) if (w and w.clientConfig.service) else none", description: "Service port (default 443)"}
      - &c_service_path {name: service_path, path: "@w.clientConfig.service.path"}
      - &c_url {name: url, path: "@w.clientConfig.url", description: "External webhook URL (instead of a service)"}
      - &c_rules {name: rules, type: JSON, path: "@w.rules", description: "[{operations, apiGroups, apiVersions, resources, scope}]"}
      - &c_operations {name: operations, type: JSON, expr: "(w.rules or []) | map(attribute='operations') | select | sum(start=[]) | unique | list", description: "Union of intercepted operations (CREATE, UPDATE, DELETE, CONNECT, *)"}
      - &c_resources {name: resources, type: JSON, expr: "(w.rules or []) | map(attribute='resources') | select | sum(start=[]) | unique | list", description: "Union of intercepted resources (pods, deployments, */* ...)"}
      - &c_namespace_selector {name: namespace_selector, type: JSON, path: "@w.namespaceSelector"}
      - &c_object_selector {name: object_selector, type: JSON, path: "@w.objectSelector"}
      - &c_match_conditions {name: match_conditions, type: JSON, path: "@w.matchConditions"}
      - &c_side_effects {name: side_effects, path: "@w.sideEffects"}
      - &c_timeout_s {name: timeout_s, type: BIGINT, expr: "(w.timeoutSeconds or 10) if w else none", description: "Call timeout (default 10 s)"}
      - &c_match_policy {name: match_policy, path: "@w.matchPolicy"}
      - *c_last_modified
      - *c_last_manager
      - *c_created
      - *c_labels
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "Check the target service exists and has ready endpoints (kubernetes_services / kubernetes_endpointslices with service_namespace/service_name); 'failed calling webhook ... service \"x\" not found' appears in FailedCreate events."
      - "Webhooks only affect NEW requests: existing pods keep running; the damage appears when pods are recreated (rollouts, evictions, deleted pods)."
    examples:
      - sql: >-
          SELECT name, webhook, failure_policy, service_namespace, service_name, operations, resources, namespace_selector
          FROM kubernetes_validating_webhooks
        description: All validating webhooks and what they intercept.
    fixtures:
      - file: validatingwebhooks_list.json
        note: "Built strictly from the v1.37 admissionregistration.k8s.io/v1 ValidatingWebhookConfigurationList / ValidatingWebhook / WebhookClientConfig / RuleWithOperations schema (no example body in the reference); mirrors the Arena admission-webhook-outage configuration."
        expect_rows: 1
        expect_columns: {kind: ValidatingWebhookConfiguration, name: pod-policy, webhook: pod-policy.platform-ops.svc, failure_policy: Fail, service_namespace: platform-ops, service_name: pod-policy-webhook, service_port: 443, operations: '["CREATE"]', resources: '["pods"]', timeout_s: 5}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/admissionregistration/validating-webhook-configuration-v1/#get-list

