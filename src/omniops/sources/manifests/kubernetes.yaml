    filters:
      - *f_namespace
      - *f_name
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'HorizontalPodAutoscaler'"}
      - *c_namespace
      - *c_name
      - {name: target_kind, path: spec.scaleTargetRef.kind}
      - {name: target_name, path: spec.scaleTargetRef.name}
      - {name: min_replicas, type: BIGINT, path: spec.minReplicas}
      - {name: max_replicas, type: BIGINT, path: spec.maxReplicas}
      - {name: current_replicas, type: BIGINT, path: status.currentReplicas}
      - {name: desired_replicas, type: BIGINT, path: status.desiredReplicas}
      - {name: metrics, type: JSON, path: spec.metrics, description: "Targets, e.g. [{type: Resource, resource:{name: cpu, target:{type: Utilization, averageUtilization: 70}}}]"}
      - {name: current_metrics, type: JSON, path: status.currentMetrics}
