  - name: kubernetes_workload_containers
    title: Workload container specs (pod templates)
    description: >-
      One row per container (and init container rows are separate entries of
      spec.template.spec.initContainers - not included) of the pod TEMPLATE of deployments
      (default), statefulsets, daemonsets, replicasets or jobs: image, requests/limits, probes,
      ports, command/args, env references, volume mounts, plus the template's volumes, node
      selector and tolerations. Use it when pods do not exist (admission failures, scaled to 0)
      or to compare the desired spec with running pods.
    kind: entities
    request:
      method: GET
      path: "{{ '/apis/batch/v1' if (filters.kind or 'deployments') | lower in ['jobs', 'job'] else '/apis/apps/v1' }}{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/{{ {'deployment': 'deployments', 'statefulset': 'statefulsets', 'daemonset': 'daemonsets', 'replicaset': 'replicasets', 'job': 'jobs'}.get((filters.kind or 'deployments') | lower, (filters.kind or 'deployments') | lower) }}"
      query:
        limit: 500
        labelSelector: "{{ filters.label_selector }}"
        fieldSelector: >-
          {{ [('metadata.namespace!=' ~ filters.namespace) if filters.namespace__op == '!=' else none,
              ('metadata.name=' ~ filters.workload) if (filters.workload and not filters.workload__op) else none,
              ('metadata.name!=' ~ filters.workload) if filters.workload__op == '!=' else none,
              filters.field_selector] | select | join(',') }}
    filters:
      - *f_namespace
      - {column: kind, default: deployments, description: "deployments (default) | statefulsets | daemonsets | replicasets | jobs (CronJob templates: use the Jobs they create)", examples: [deployments]}
      - {column: workload, ops: ["=", "in", "!=", "like"], description: "Workload name (exact; fieldSelector metadata.name)", examples: [recommendation]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
      expand:
        - {explode: "spec.template.spec.containers", as: c}
    columns:
      - *c_namespace
      - {name: kind, filter_only: true, description: "Requested kind (plural)"}
      - {name: workload, path: metadata.name}
      - {name: container, path: "@c.name"}
      - {name: image, path: "@c.image"}
      - {name: image_pull_policy, path: "@c.imagePullPolicy"}
      - {name: requests, type: JSON, path: "@c.resources.requests", description: "null = no requests (rejected by a ResourceQuota that requires requests.cpu)"}
      - {name: limits, type: JSON, path: "@c.resources.limits"}
      - {name: cpu_request, path: "@c.resources.requests.cpu"}
      - {name: memory_request, path: "@c.resources.requests.memory"}
      - {name: cpu_limit, path: "@c.resources.limits.cpu"}
      - {name: memory_limit, path: "@c.resources.limits.memory"}
      - {name: liveness_probe, type: JSON, path: "@c.livenessProbe"}
      - {name: readiness_probe, type: JSON, path: "@c.readinessProbe"}
      - {name: startup_probe, type: JSON, path: "@c.startupProbe"}
      - {name: ports, type: JSON, path: "@c.ports"}
      - {name: command, type: JSON, path: "@c.command"}
      - {name: args, type: JSON, path: "@c.args"}
      - {name: env_names, type: JSON, expr: "(c.env or []) | map(attribute='name') | list"}
      - {name: env_refs, type: JSON, expr: "((c.env or []) | selectattr('valueFrom', 'defined') | list) + (c.envFrom or [])", description: "valueFrom / envFrom references only (values: kubernetes_container_env)"}
      - {name: volume_mounts, type: JSON, path: "@c.volumeMounts"}
      - {name: security_context, type: JSON, path: "@c.securityContext"}
      - {name: volumes, type: JSON, path: spec.template.spec.volumes, description: "Template volumes (emptyDir medium/sizeLimit, PVC claimName, configMap, secret ...)"}
      - {name: node_selector, type: JSON, path: spec.template.spec.nodeSelector}
      - {name: tolerations, type: JSON, path: spec.template.spec.tolerations}
      - {name: affinity, type: JSON, path: spec.template.spec.affinity}
      - {name: service_account, path: spec.template.spec.serviceAccountName}
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "Template (desired) spec only: pods created before the last change still run the old spec until replaced."
      - "/dev/shm is the runtime's 64Mi tmpfs unless the template mounts an emptyDir with medium: Memory at /dev/shm - check volumes and volume_mounts."
    examples:
      - sql: >-
          SELECT workload, container, cpu_request, memory_request, cpu_limit, memory_limit
          FROM kubernetes_workload_containers WHERE namespace = 'shop' AND cpu_request IS NULL
        description: Shop containers without a CPU request (blocked by a quota requiring requests.cpu when recreated).
      - sql: >-
          SELECT workload, container, readiness_probe, liveness_probe, ports
          FROM kubernetes_workload_containers WHERE namespace = 'batch' AND workload = 'webhook-relay'
        description: Probe configuration of a workload whose probes fail.
    fixtures:
      - file: deployments_list.json
        filters: {namespace: shop}
        note: "Same deployments body (v1.37 schema-built): one row per template container."
        expect_rows: 2
        expect_columns: {namespace: shop, workload: recommendation, container: recommendation, image: "ghcr.io/open-telemetry/demo:2.0.2-recommendation", cpu_request: null, memory_limit: 500Mi, kind: deployments}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/apps/deployment-v1/#DeploymentSpec

