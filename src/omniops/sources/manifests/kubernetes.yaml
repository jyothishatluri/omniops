  - name: kubernetes_replicasets
    title: ReplicaSets (rollout history)
    description: >-
      ReplicaSets from GET /apis/apps/v1[/namespaces/{namespace}]/replicasets. Each Deployment
      revision is one ReplicaSet (annotation deployment.kubernetes.io/revision) whose creation time
      is when that rollout started - the rollout history with images. ReplicaFailure conditions
      carry pod-creation errors (exceeded quota, admission webhook denied/unavailable). Filter
      namespace, name, owner via label_selector or owner_name locally.
    kind: entities
    request:
      method: GET
      path: "/apis/apps/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/replicasets"
      query: *q_named
    filters:
      - *f_namespace
      - *f_name
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'ReplicaSet'"}
      - *c_namespace
      - *c_name
      - *c_owner_kind
      - *c_owner_name
      - {name: revision, type: BIGINT, path: "metadata.annotations['deployment.kubernetes.io/revision']", description: "Deployment revision this ReplicaSet implements"}
      - {name: change_cause, path: "metadata.annotations['kubernetes.io/change-cause']", description: "kubernetes.io/change-cause annotation when set"}
      - {name: replicas, type: BIGINT, path: spec.replicas, description: "Desired replicas (0 for old revisions)"}
      - {name: status_replicas, type: BIGINT, path: status.replicas}
      - {name: ready_replicas, type: BIGINT, expr: "_.status.readyReplicas or 0"}
      - {name: available_replicas, type: BIGINT, expr: "_.status.availableReplicas or 0"}
      - {name: pod_template_hash, path: "metadata.labels['pod-template-hash']"}
      - {name: images, type: JSON, expr: "(_.spec.template.spec.containers or []) | map(attribute='image') | list"}
      - {name: failure_reason, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'ReplicaFailure') | map(attribute='reason') | first", description: "ReplicaFailure reason (FailedCreate)"}
      - {name: failure_message, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'ReplicaFailure') | map(attribute='message') | first", description: "e.g. 'pods \"recommendation-5d8f7c9b6-\" is forbidden: failed quota: platform-limits: must specify requests.cpu'"}
      - {name: conditions, type: JSON, path: status.conditions}
      - {name: title, expr: "'ReplicaSet ' ~ _.metadata.namespace ~ '/' ~ _.metadata.name ~ ' (revision ' ~ (_.metadata.annotations['deployment.kubernetes.io/revision'] or '?') ~ ') rollout of ' ~ (_.metadata.ownerReferences[0].name if _.metadata.ownerReferences else _.metadata.name) ~ ': image ' ~ ((_.spec.template.spec.containers or []) | map(attribute='image') | join(', '))", description: "Change-feed title"}
      - *c_created
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "Old revisions are kept with replicas = 0 up to the Deployment's revisionHistoryLimit (default 10); created is when that revision was first rolled out (a rollback re-uses the old ReplicaSet and only bumps its revision)."
    examples:
      - sql: >-
          SELECT owner_name AS deployment, revision, created, images, replicas, ready_replicas
          FROM kubernetes_replicasets WHERE namespace = 'shop' AND owner_name = 'product-catalog'
          ORDER BY revision DESC
        description: Rollout history of a deployment (images per revision and when each started).
      - sql: >-
          SELECT namespace, name, failure_message FROM kubernetes_replicasets WHERE failure_message IS NOT NULL
        description: ReplicaSets that cannot create pods (quota, webhook) cluster-wide.
    fixtures:
      - file: replicasets_list.json
        filters: {namespace: shop}
        note: "Built strictly from the v1.37 apps/v1 ReplicaSetList / ReplicaSetStatus / ReplicaSetCondition schema (no example body in the reference); the FailedCreate message follows the Arena quota-trap scenario."
        expect_rows: 2
        expect_columns: {kind: ReplicaSet, name: recommendation-5d8f7c9b6, owner_kind: Deployment, owner_name: recommendation, revision: 3, replicas: 1, ready_replicas: 0, failure_reason: FailedCreate, created: "2026-10-01T11:41:00Z"}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/apps/replica-set-v1/#get-list

