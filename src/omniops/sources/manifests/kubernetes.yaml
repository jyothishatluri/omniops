  - name: kubernetes_horizontalpodautoscalers
    title: HorizontalPodAutoscalers (autoscaling/v2)
    description: >-
      HPAs from GET /apis/autoscaling/v2[/namespaces/{namespace}]/horizontalpodautoscalers:
      target workload, min/max/current/desired replicas, metric targets vs current values,
      conditions (AbleToScale, ScalingActive, ScalingLimited - at max replicas) and last scale time.
    kind: entities
    request:
      method: GET
      path: "/apis/autoscaling/v2{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/horizontalpodautoscalers"
