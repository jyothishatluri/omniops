  # ------------------------------------------------------------------------------------------
  # Cluster
  # ------------------------------------------------------------------------------------------
  - name: kubernetes_nodes
    title: Nodes
    description: >-
      Nodes from GET /api/v1/nodes: Ready condition (status, reason, message, last heartbeat),
      pressure conditions (MemoryPressure, DiskPressure, PIDPressure), unschedulable/cordoned,
      taints, capacity vs allocatable (cpu, memory, pods, ephemeral-storage), labels (zone,
      instance type, custom labels such as storage-tier), kubelet / OS / runtime versions.
    kind: entities
    request:
      method: GET
      path: /api/v1/nodes
      query:
        limit: 500
        labelSelector: "{{ filters.label_selector }}"
        fieldSelector: >-
          {{ [('metadata.name=' ~ filters.node) if (filters.node and not filters.node__op) else none,
              ('spec.unschedulable=' ~ (filters.unschedulable | string | lower)) if (filters.unschedulable is not none and filters.unschedulable is defined and not filters.unschedulable__op) else none,
              filters.field_selector] | select | join(',') }}
    filters:
      - {column: node, ops: ["=", "in", "like"], description: "Node name (exact; fieldSelector metadata.name=)", examples: [incident-bench-worker], variants: hostname}
      - {column: unschedulable, type: BOOLEAN, description: "Cordoned nodes (fieldSelector spec.unschedulable=true)"}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'Node'"}
      - {name: node, path: metadata.name}
      - {name: ready, type: BOOLEAN, expr: "((_.status.conditions or []) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first) == 'True'", description: "Ready condition is True"}
      - {name: ready_reason, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'Ready') | map(attribute='reason') | first", description: "KubeletReady, KubeletNotReady, NodeStatusUnknown ..."}
      - {name: ready_message, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'Ready') | map(attribute='message') | first"}
      - {name: last_heartbeat, type: TIMESTAMP, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'Ready') | map(attribute='lastHeartbeatTime') | first"}
      - {name: memory_pressure, type: BOOLEAN, expr: "((_.status.conditions or []) | selectattr('type', 'equalto', 'MemoryPressure') | map(attribute='status') | first) == 'True'"}
      - {name: disk_pressure, type: BOOLEAN, expr: "((_.status.conditions or []) | selectattr('type', 'equalto', 'DiskPressure') | map(attribute='status') | first) == 'True'"}
      - {name: pid_pressure, type: BOOLEAN, expr: "((_.status.conditions or []) | selectattr('type', 'equalto', 'PIDPressure') | map(attribute='status') | first) == 'True'"}
      - {name: unschedulable, type: BOOLEAN, expr: "_.spec.unschedulable or false", description: "Cordoned"}
      - {name: taints, type: JSON, path: spec.taints}
      - {name: conditions, type: JSON, path: status.conditions}
      - {name: cpu_capacity, path: status.capacity.cpu}
      - {name: memory_capacity, path: status.capacity.memory}
      - {name: cpu_allocatable, path: status.allocatable.cpu}
      - {name: memory_allocatable, path: status.allocatable.memory}
      - {name: pods_allocatable, type: BIGINT, path: status.allocatable.pods}
      - {name: ephemeral_storage_allocatable, path: "status.allocatable['ephemeral-storage']"}
      - {name: allocatable, type: JSON, path: status.allocatable}
      - {name: internal_ip, expr: "(_.status.addresses or []) | selectattr('type', 'equalto', 'InternalIP') | map(attribute='address') | first"}
      - {name: zone, path: "metadata.labels['topology.kubernetes.io/zone']"}
      - {name: instance_type, path: "metadata.labels['node.kubernetes.io/instance-type']"}
      - {name: kubelet_version, path: status.nodeInfo.kubeletVersion}
      - {name: os_image, path: status.nodeInfo.osImage}
      - {name: kernel_version, path: status.nodeInfo.kernelVersion}
      - {name: container_runtime, path: status.nodeInfo.containerRuntimeVersion}
      - {name: architecture, path: status.nodeInfo.architecture}
      - *c_created
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "allocatable is capacity minus system reservations; actual usage is in kubernetes_node_metrics (memory working set), not here."
      - "Custom placement labels (e.g. storage-tier=nvme-archive) required by a PV nodeAffinity or nodeSelector must appear in labels; check labels->>'storage-tier'."
    examples:
      - sql: "SELECT node, ready, ready_reason, memory_pressure, disk_pressure, unschedulable, taints FROM kubernetes_nodes"
        description: Node health at a glance.
      - sql: "SELECT node, labels->>'storage-tier' AS storage_tier, zone FROM kubernetes_nodes"
        description: Which nodes carry a placement label.
    fixtures:
      - file: nodes_list.json
        note: >-
          Built from the v1.37 core/v1 NodeList / NodeStatus / NodeCondition / NodeSystemInfo
          schema; capacity/addresses follow the kubectl JSONPath reference example input and kind
          node defaults (no example body in the API reference).
        expect_rows: 2
        expect_columns: {kind: Node, node: incident-bench-control-plane, ready: true, ready_reason: KubeletReady, memory_pressure: false, unschedulable: false, cpu_capacity: "4", pods_allocatable: 110, internal_ip: 172.18.0.3, kubelet_version: v1.35.0}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/node-v1/#get-list

