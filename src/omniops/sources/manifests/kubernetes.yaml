        expect_rows: 2
        expect_columns: {kind: Deployment, namespace: shop, name: recommendation, replicas: 1, ready_replicas: 0, revision: 3, progressing_reason: ReplicaSetUpdated, available: "False", last_modified: "2026-10-01T09:12:00Z", last_manager: argocd-controller}
