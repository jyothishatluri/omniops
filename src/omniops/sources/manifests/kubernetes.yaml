      - *c_field_selector
    examples:
      - sql: "SELECT name, webhook, failure_policy, service_namespace, service_name, operations, resources FROM kubernetes_mutating_webhooks"
        description: All mutating webhooks and what they intercept.
    fixtures:
      - file: mutatingwebhooks_list.json
        note: "Built strictly from the v1.37 admissionregistration.k8s.io/v1 MutatingWebhookConfigurationList / MutatingWebhook schema (no example body in the reference)."
        expect_rows: 1
        expect_columns: {kind: MutatingWebhookConfiguration, name: sidecar-injector, webhook: inject.sidecar.example.com, failure_policy: Ignore, service_name: sidecar-injector, reinvocation_policy: Never, operations: '["CREATE"]'}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/admissionregistration/mutating-webhook-configuration-v1/#get-list

  # ------------------------------------------------------------------------------------------
  # metrics.k8s.io (metrics-server)
  # ------------------------------------------------------------------------------------------
  - name: kubernetes_pod_metrics
    title: Pod resource usage (metrics.k8s.io)
    description: >-
      Current CPU and memory usage per container from GET
      /apis/metrics.k8s.io/{v1beta1|v1}[/namespaces/{namespace}]/pods (metrics-server; one sample
      over the last window, typically 15-30 s). cpu_cores and memory_bytes are parsed from the
      quantity strings (memory = working set). For history use Prometheus/cAdvisor metrics.
    kind: entities
    request:
      method: GET
      path: "/apis/metrics.k8s.io/{{ env.K8S_METRICS_API_VERSION or 'v1beta1' }}{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/pods"
      query:
        labelSelector: "{{ filters.label_selector }}"
    filters:
      - {column: namespace, ops: ["=", "in", "like"], description: "Namespace (exact)", examples: [batch]}
      - *f_label_selector
    response:
      rows_path: "$.items[*]"
      expand:
        - {explode: containers, as: c}
    columns:
      - *c_namespace
      - {name: pod, path: metadata.name}
      - {name: container, path: "@c.name"}
      - {name: ts, type: TIMESTAMP, path: timestamp, description: "End of the measurement window"}
      - {name: window, path: window, description: "Measurement window, e.g. 30s"}
      - {name: cpu, path: "@c.usage.cpu", description: "Raw quantity, e.g. 9559630n (nanocores)"}
      - {name: memory, path: "@c.usage.memory", description: "Raw quantity, e.g. 22244Ki (working set)"}
      - &c_cpu_cores {name: cpu_cores, type: DOUBLE, expr: "((c.usage.cpu[:-1]|float / 1000000000) if c.usage.cpu.endswith('n') else (c.usage.cpu[:-1]|float / 1000000) if c.usage.cpu.endswith('u') else (c.usage.cpu[:-1]|float / 1000) if c.usage.cpu.endswith('m') else c.usage.cpu|float) if c.usage.cpu else none", description: "CPU in cores (1.0 = one vCPU)"}
      - &c_memory_bytes {name: memory_bytes, type: DOUBLE, expr: "((c.usage.memory[:-2]|float * 1024) if c.usage.memory.endswith('Ki') else (c.usage.memory[:-2]|float * 1048576) if c.usage.memory.endswith('Mi') else (c.usage.memory[:-2]|float * 1073741824) if c.usage.memory.endswith('Gi') else (c.usage.memory[:-2]|float * 1099511627776) if c.usage.memory.endswith('Ti') else (c.usage.memory[:-1]|float * 1000) if c.usage.memory.endswith('k') else (c.usage.memory[:-1]|float * 1000000) if c.usage.memory.endswith('M') else (c.usage.memory[:-1]|float * 1000000000) if c.usage.memory.endswith('G') else (c.usage.memory[:-1]|float / 1000) if c.usage.memory.endswith('m') else c.usage.memory|float) if c.usage.memory else none", description: "Memory working set in bytes"}
      - *c_labels
      - *c_label_selector
    pitfalls:
      - "Needs metrics-server (APIService v1beta1.metrics.k8s.io): HTTP 404 / 503 'the server is currently unable to handle the request' means it is missing or unhealthy. Containers that crash before their first scrape have no row."
      - "One instantaneous sample - compare memory_bytes with kubernetes_pods.limits->>'memory'; a container near its limit before an OOMKilled restart does not stay visible after it."
    examples:
      - sql: >-
          SELECT pod, container, round(cpu_cores, 3) AS cpu, round(memory_bytes / 1048576, 1) AS mem_mib
          FROM kubernetes_pod_metrics WHERE namespace = 'batch' ORDER BY memory_bytes DESC
        description: Current memory/CPU per container in a namespace.
    fixtures:
      - file: pod_metrics_list.json
        filters: {namespace: kube-system}
        note: "PodMetricsList wrapping the PodMetrics sample response from kubernetes.io 'Resource metrics pipeline' (kube-scheduler-minikube: cpu 9559630n, memory 22244Ki); list envelope per the metrics.k8s.io v1beta1 reference."
        expect_rows: 1
        expect_columns: {namespace: kube-system, pod: kube-scheduler-minikube, container: kube-scheduler, ts: "2022-01-27T19:24:31Z", cpu: 9559630n, cpu_cores: 0.00955963, memory_bytes: 22777856.0, window: 30s}
    docs_url: https://kubernetes.io/docs/reference/external-api/metrics.v1beta1/

  - name: kubernetes_node_metrics
    title: Node resource usage (metrics.k8s.io)
    description: >-
      Current CPU and memory usage per node from GET /apis/metrics.k8s.io/{v1beta1|v1}/nodes
      (metrics-server), with cpu_cores and memory_bytes parsed from the quantities. Compare with
      kubernetes_nodes allocatable.
    kind: entities
    request:
      method: GET
      path: "/apis/metrics.k8s.io/{{ env.K8S_METRICS_API_VERSION or 'v1beta1' }}/nodes"
      query:
        labelSelector: "{{ filters.label_selector }}"
    filters:
      - *f_label_selector
    response:
      rows_path: "$.items[*]"
      expand:
        - {explode: ".", as: c}
    columns:
      - {name: node, path: metadata.name}
      - {name: ts, type: TIMESTAMP, path: timestamp}
      - {name: window, path: window}
      - {name: cpu, path: usage.cpu}
      - {name: memory, path: usage.memory}
      - *c_cpu_cores
      - *c_memory_bytes
      - *c_label_selector
    pitfalls:
      - "Needs metrics-server; memory is the working set (what the kubelet uses for eviction), not total RSS + cache."
    examples:
      - sql: >-
          SELECT m.node, round(m.cpu_cores, 2) AS cpu_used, n.cpu_allocatable, round(m.memory_bytes / 1073741824, 2) AS mem_gib, n.memory_allocatable
          FROM kubernetes_node_metrics m JOIN kubernetes_nodes n ON n.node = m.node
        description: Node usage next to allocatable capacity.
    fixtures:
      - file: node_metrics_list.json
        note: "NodeMetricsList wrapping the NodeMetrics sample response from kubernetes.io 'Resource metrics pipeline' (minikube: cpu 487558164n, memory 732212Ki); list envelope per the metrics.k8s.io v1beta1 reference."
        expect_rows: 1
        expect_columns: {node: minikube, ts: "2022-01-27T18:48:33Z", cpu: 487558164n, cpu_cores: 0.487558164, memory_bytes: 749785088.0}
    docs_url: https://kubernetes.io/docs/reference/external-api/metrics.v1beta1/

roles:
  k8s_state:
    - table: kubernetes_pods
      columns: {pod: pod, namespace: namespace, kind: kind, phase: phase, ready: ready, restarts: restarts, waiting: waiting_reason, reason: reason, terminated: last_termination_reason, exit_code: last_exit_code, node: node, container: container, message: waiting_message, service: service}
      notes: "One row per container; last_termination_reason/last_exit_code explain crashloops and OOMKills; unschedulable_message explains Pending pods."
    - table: kubernetes_deployments
      columns: {pod: name, namespace: namespace, kind: kind, replicas: replicas, ready_replicas: ready_replicas, message: replica_failure_message}
    - table: kubernetes_statefulsets
      columns: {pod: name, namespace: namespace, kind: kind, replicas: replicas, ready_replicas: ready_replicas}
    - table: kubernetes_daemonsets
      columns: {pod: name, namespace: namespace, kind: kind, replicas: desired_number_scheduled, ready_replicas: number_ready}
    - table: kubernetes_persistentvolumeclaims
      columns: {pod: name, namespace: namespace, kind: kind, phase: phase}
    - table: kubernetes_jobs
      columns: {pod: name, namespace: namespace, kind: kind, phase: status, message: failure_message}
  k8s_events:
    table: kubernetes_events
    filters: {type: Warning}
    columns: {ts: ts, namespace: namespace, type: type, reason: reason, message: message, object: object_name, kind: object_kind, count: count}
    notes: "Admission failures appear as FailedCreate on ReplicaSets/Jobs; events expire ~1h after their last occurrence."
  k8s_logs:
    table: kubernetes_pod_logs
    columns: {ts: ts, message: message, level: level, namespace: namespace, pod: pod, container: container, previous: previous}
    notes: "namespace + pod required; previous = true for the crashed instance."
  hosts:
    table: kubernetes_nodes
    columns: {host: node, health: ready, ts: last_heartbeat}
  change_events:
    - table: kubernetes_replicasets
      columns: {ts: created, service: owner_name, title: title, version: revision, url: name}
      notes: "Each ReplicaSet is one Deployment revision; created = when that rollout started."
    - table: kubernetes_configmaps
      columns: {ts: last_modified, service: name, title: title, author: last_manager}
      notes: "ConfigMap writes (feature flags, app config) by field manager; last_modified is the newest non-status managedFields time."
