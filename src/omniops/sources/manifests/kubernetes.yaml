      - *c_field_selector
    examples:
      - sql: "SELECT namespace, name, type, cluster_ip, ports, selector FROM kubernetes_services WHERE namespace = 'shop'"
        description: Services of a namespace with ports and selectors.
      - sql: "SELECT count(*) AS present FROM kubernetes_services WHERE namespace = 'platform-ops' AND name = 'pod-policy-webhook'"
        description: Does the Service a webhook points at exist?
    fixtures:
      - file: services_list.json
        filters: {namespace: shop}
        note: "Built strictly from the v1.37 core/v1 ServiceList / ServiceSpec / ServicePort schema (no example body in the reference)."
        expect_rows: 2
        expect_columns: {kind: Service, namespace: shop, name: cart, type: ClusterIP, cluster_ip: 10.96.41.12}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/service-v1/#get-list

  - name: kubernetes_endpointslices
    title: EndpointSlices (service backends)
    description: >-
      Service backends from GET /apis/discovery.k8s.io/v1[/namespaces/{namespace}]/endpointslices,
      one row per endpoint (a slice with no endpoints still gives one row): service, address,
      ready / serving / terminating, backing pod, node, zone and ports. Filter service (label
      kubernetes.io/service-name). No ready endpoints = clients get connection refused / no
      upstream.
    kind: entities
    request:
      method: GET
      path: "/apis/discovery.k8s.io/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/endpointslices"
      query:
        limit: 500
        labelSelector: "{{ [('kubernetes.io/service-name=' ~ filters.service) if (filters.service and not filters.service__op) else none, filters.label_selector] | select | join(',') }}"
        fieldSelector: >-
          {{ [('metadata.namespace!=' ~ filters.namespace) if filters.namespace__op == '!=' else none,
              filters.field_selector] | select | join(',') }}
    filters:
      - *f_namespace
      - {column: service, ops: ["=", "in", "like"], description: "Owning Service name (labelSelector kubernetes.io/service-name=)", examples: [cart]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
      expand:
        - {explode: endpoints, as: ep, keep_empty: true}
    columns:
      - *c_namespace
      - {name: service, path: "metadata.labels['kubernetes.io/service-name']"}
      - {name: endpointslice, path: metadata.name}
      - {name: address_type, path: addressType, description: "IPv4 | IPv6 | FQDN"}
      - {name: address, expr: "((ep.addresses or []) | join(',')) if ep else none", description: "Endpoint address(es); null for a slice without endpoints"}
      - {name: ready, type: BOOLEAN, path: "@ep.conditions.ready", description: "Ready to receive traffic (null = unknown, treat as ready)"}
      - {name: serving, type: BOOLEAN, path: "@ep.conditions.serving"}
      - {name: terminating, type: BOOLEAN, path: "@ep.conditions.terminating"}
      - {name: target_kind, path: "@ep.targetRef.kind"}
      - {name: pod, path: "@ep.targetRef.name", description: "Backing pod"}
      - {name: node, path: "@ep.nodeName"}
      - {name: zone, path: "@ep.zone"}
      - {name: hostname, path: "@ep.hostname"}
      - {name: ports, type: JSON, path: ports, description: "[{name, port, protocol, appProtocol}]"}
      - {name: managed_by, path: "metadata.labels['endpointslice.kubernetes.io/managed-by']"}
      - *c_created
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "A service with a selector that matches no ready pod has a slice with zero endpoints (one row, address null); a service that does not exist has no slice at all (0 rows)."
      - "NetworkPolicy denials do NOT show here: endpoints can be ready while traffic is blocked (see kubernetes_networkpolicies)."
    examples:
      - sql: >-
          SELECT service, count(*) FILTER (WHERE ready) AS ready, count(address) AS endpoints
          FROM kubernetes_endpointslices WHERE namespace = 'shop' GROUP BY 1 ORDER BY ready
        description: Ready backends per service.
    fixtures:
      - file: endpointslices_list.json
        filters: {namespace: shop}
        note: "Built strictly from the v1.37 discovery.k8s.io/v1 EndpointSliceList / Endpoint / EndpointConditions / EndpointPort schema (no example body in the reference). The second slice has no endpoints (keep_empty row)."
        expect_rows: 3
        expect_columns: {namespace: shop, service: cart, address: 10.244.1.17, ready: true, pod: cart-7d9c6b5f4-x2x9q, node: incident-bench-worker, address_type: IPv4}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/discovery/endpoint-slice-v1/#get-list

  - name: kubernetes_networkpolicies
    title: NetworkPolicies
    description: >-
      NetworkPolicies from GET /apis/networking.k8s.io/v1[/namespaces/{namespace}]/networkpolicies:
      selected pods, policy types and ingress/egress rules, with flags for policies that deny all
      ingress/egress to the selected pods. A policy selecting a service's pods with no allowing
      rule cuts its callers off while the pods stay Ready.
    kind: entities
    request:
      method: GET
      path: "/apis/networking.k8s.io/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/networkpolicies"
      query: *q_named
    filters:
      - *f_namespace
      - *f_name
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'NetworkPolicy'"}
      - *c_namespace
      - *c_name
      - {name: pod_selector, type: JSON, path: spec.podSelector, description: "Pods the policy applies to ({} = every pod in the namespace)"}
      - {name: policy_types, type: JSON, path: spec.policyTypes, description: "[Ingress] / [Egress] / both"}
      - {name: ingress, type: JSON, path: spec.ingress, description: "Allowed ingress rules [{from:[podSelector|namespaceSelector|ipBlock], ports}]"}
      - {name: egress, type: JSON, path: spec.egress, description: "Allowed egress rules"}
      - {name: ingress_rule_count, type: BIGINT, expr: "(_.spec.ingress or []) | length"}
      - {name: egress_rule_count, type: BIGINT, expr: "(_.spec.egress or []) | length"}
      - {name: denies_all_ingress, type: BOOLEAN, expr: "'Ingress' in (_.spec.policyTypes or ['Ingress']) and not _.spec.ingress", description: "Ingress policy type with no allow rules: all ingress to the selected pods is dropped"}
      - {name: denies_all_egress, type: BOOLEAN, expr: "'Egress' in (_.spec.policyTypes or []) and not _.spec.egress"}
      - *c_last_modified
      - *c_last_manager
      - *c_created
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "Policies are additive allow-lists: once any policy selects a pod for Ingress, only traffic matching some policy's rules is allowed. Enforcement depends on the CNI (Calico, Cilium and recent kind releases' kindnet enforce it; flannel alone does not): a policy object proves intent, the callers' timeouts prove effect."
    examples:
      - sql: >-
          SELECT namespace, name, pod_selector, policy_types, ingress, denies_all_ingress, created
          FROM kubernetes_networkpolicies WHERE namespace = 'shop'
        description: Network policies in a namespace and whether they block all ingress.
    fixtures:
      - file: networkpolicies_list.json
        filters: {namespace: shop}
        note: "Built strictly from the v1.37 networking.k8s.io/v1 NetworkPolicyList / NetworkPolicySpec schema (no example body in the reference); mirrors the Arena netpol-isolation policy."
        expect_rows: 1
        expect_columns: {kind: NetworkPolicy, namespace: shop, name: restrict-cart-ingress, denies_all_ingress: true, ingress_rule_count: 0, created: "2026-10-01T11:40:00Z"}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/networking/network-policy-v1/#get-list

  - name: kubernetes_ingresses
    title: Ingresses
    description: >-
      Ingresses from GET /apis/networking.k8s.io/v1[/namespaces/{namespace}]/ingresses: class,
      hosts, rules (path -> service:port), TLS and load-balancer address.
    kind: entities
    request:
      method: GET
      path: "/apis/networking.k8s.io/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/ingresses"
      query: *q_named
    filters:
      - *f_namespace
      - *f_name
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'Ingress'"}
      - *c_namespace
      - *c_name
      - {name: ingress_class, path: spec.ingressClassName}
      - {name: hosts, type: JSON, expr: "(_.spec.rules or []) | map(attribute='host') | select | list"}
      - {name: rules, type: JSON, path: spec.rules, description: "[{host, http:{paths:[{path, pathType, backend:{service:{name, port}}}]}}]"}
      - {name: tls, type: JSON, path: spec.tls}
      - {name: default_backend, type: JSON, path: spec.defaultBackend}
      - {name: load_balancer_ingress, type: JSON, path: status.loadBalancer.ingress}
      - *c_last_modified
      - *c_last_manager
      - *c_created
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    examples:
      - sql: "SELECT namespace, name, ingress_class, hosts, rules FROM kubernetes_ingresses"
        description: Ingress routes in the cluster.
    fixtures:
      - file: ingresses_list.json
        note: "Built strictly from the v1.37 networking.k8s.io/v1 IngressList / IngressSpec / IngressRule schema (no example body in the reference)."
        expect_rows: 1
        expect_columns: {kind: Ingress, namespace: shop, name: frontend, ingress_class: nginx, hosts: '["shop.example.test"]'}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/networking/ingress-v1/#get-list

  # ------------------------------------------------------------------------------------------
  # Configuration
  # ------------------------------------------------------------------------------------------
  - name: kubernetes_configmaps
    title: ConfigMaps (with data)
    description: >-
      ConfigMaps from GET /api/v1[/namespaces/{namespace}]/configmaps with their data as JSON
      (data->>'KEY'), the list of keys (data + binaryData), and when / by which field manager the
      object last changed (managedFields) - feature-flag and app-config changes show up as a new
      last_modified. Filter namespace and name.
    kind: entities
    request:
      method: GET
      path: "/api/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/configmaps"
      query: *q_named
    filters:
      - *f_namespace
      - {column: name, ops: ["=", "in", "!=", "like"], description: "ConfigMap name (exact; fieldSelector metadata.name=)", examples: [flagd-config]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'ConfigMap'"}
      - *c_namespace
      - *c_name
      - {name: data, type: JSON, path: data, description: "Key -> string value. A value that is itself JSON (flagd flags) is a string: json_extract(data->>'demo.flagd.json', '$.flags')"}
      - {name: keys, type: JSON, expr: "((_.data or {}) | list) + ((_.binaryData or {}) | list)", description: "All key names (data and binaryData)"}
      - {name: key_count, type: BIGINT, expr: "((_.data or {}) | length) + ((_.binaryData or {}) | length)"}
      - {name: binary_keys, type: JSON, expr: "(_.binaryData or {}) | list", description: "binaryData key names (values not returned)"}
      - {name: immutable, type: BOOLEAN, path: immutable}
      - *c_last_modified
      - *c_last_manager
      - {name: title, expr: "'ConfigMap ' ~ _.metadata.namespace ~ '/' ~ _.metadata.name ~ ' changed by ' ~ (((_.metadata.managedFields or []) | rejectattr('subresource', 'defined') | selectattr('time', 'defined') | sort(attribute='time') | last).manager or 'unknown') ~ ' (keys: ' ~ ((_.data or {}) | list | join(', ')) ~ ')'", description: "Change-feed title"}
      - *c_created
      - *c_owner_kind
      - *c_owner_name
      - *c_labels
      - &c_annotation_keys {name: annotation_keys, type: JSON, expr: "(_.metadata.annotations or {}) | list", description: "Annotation names only (values omitted: last-applied-configuration duplicates the data)"}
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "Listing all namespaces returns every ConfigMap's data (kube-root-ca.crt in each namespace, dashboards ...): filter namespace or name."
      - "last_modified is the newest managedFields entry: it changes on ANY write by that manager, not only on data changes; created never changes."
      - "Running pods read env-var values from a ConfigMap only at container start; mounted ConfigMap files refresh after ~1 minute; flagd watches its file. A changed value is not proof every consumer picked it up."
    examples:
      - sql: >-
          SELECT name, keys, data->>'ENDPOINT_URL' AS endpoint_url FROM kubernetes_configmaps
          WHERE namespace = 'batch' AND name = 'config-loader-settings'
        description: Does a ConfigMap contain the key a container references?
      - sql: >-
          SELECT name, last_modified, last_manager, data FROM kubernetes_configmaps
          WHERE namespace = 'shop' AND name = 'flagd-config'
        description: Current feature-flag configuration and when it last changed.
      - sql: >-
          SELECT namespace, name, last_modified, last_manager FROM kubernetes_configmaps
          WHERE last_modified >= now() - INTERVAL 3 HOUR ORDER BY last_modified DESC
        description: ConfigMaps changed in the last three hours.
    fixtures:
      - file: configmaps_list.json
        filters: {namespace: batch}
        note: "Built strictly from the v1.37 core/v1 ConfigMapList / ConfigMap / ManagedFieldsEntry schema (no example body in the reference); mirrors the Arena missing-config-key ConfigMap (LOG_LEVEL and REGION only)."
        expect_rows: 1
        expect_columns: {kind: ConfigMap, namespace: batch, name: config-loader-settings, keys: '["LOG_LEVEL","REGION"]', key_count: 2, last_modified: "2026-10-01T11:39:58Z", last_manager: kubectl-client-side-apply}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/config-map-v1/#get-list

  - name: kubernetes_secrets
    title: Secrets (metadata and key names only)
    description: >-
      Secret METADATA from GET /api/v1[/namespaces/{namespace}]/secrets: one row per data key
      (secret, type, key, approximate value size) - values are never returned, and annotations are
      reduced to their names. Use it to check that a Secret / key a workload references exists,
      or when a Secret was last changed. A Secret with no keys gives one row with key null.
    kind: entities
    request:
      method: GET
      path: "/api/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/secrets"
      query:
        limit: 500
        labelSelector: "{{ filters.label_selector }}"
        fieldSelector: >-
          {{ [('metadata.namespace!=' ~ filters.namespace) if filters.namespace__op == '!=' else none,
              ('metadata.name=' ~ filters.name) if (filters.name and not filters.name__op) else none,
              ('metadata.name!=' ~ filters.name) if filters.name__op == '!=' else none,
              ('type=' ~ filters.type) if (filters.type and not filters.type__op) else none,
              filters.field_selector] | select | join(',') }}
    filters:
      - *f_namespace
      - {column: name, ops: ["=", "in", "!=", "like"], description: "Secret name (exact)", examples: [catalog-database]}
      - {column: type, ops: ["=", "!="], description: "Secret type (fieldSelector type=): Opaque, kubernetes.io/tls, kubernetes.io/dockerconfigjson, kubernetes.io/service-account-token ...", examples: [Opaque]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: data, as: e, keep_empty: true}
    columns:
      - {name: kind, expr: "'Secret'"}
      - *c_namespace
      - *c_name
      - {name: type, path: type}
      - {name: key, path: "@e.key", description: "Data key name (value never returned)"}
      - {name: value_bytes, type: BIGINT, expr: "((((e.value or '') | length) * 3) // 4 - (e.value or '').count('=')) if e else none", description: "Decoded size of the value in bytes, from the base64 length (0 = empty value); the value itself is never returned"}
      - {name: key_count, type: BIGINT, expr: "(_.data or {}) | length"}
      - {name: immutable, type: BOOLEAN, path: immutable}
      - *c_last_modified
      - *c_last_manager
      - *c_created
      - *c_owner_kind
      - *c_owner_name
      - *c_labels
      - *c_annotation_keys
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "Listing secrets needs RBAC list on secrets (often denied: HTTP 403). The API sends values to the engine; the engine maps only key names and sizes - never ask for values."
      - "A changed Secret does not update env vars of running pods (only mounted files, after a delay). Credentials embedded literally in env (see kubernetes_container_env) do not come from any Secret."
    examples:
      - sql: "SELECT name, type, key, value_bytes, last_modified FROM kubernetes_secrets WHERE namespace = 'shop' AND name = 'catalog-database'"
        description: Which keys a Secret has and when it last changed.
    fixtures:
      - file: secrets_list.json
        filters: {namespace: shop}
        note: "Built strictly from the v1.37 core/v1 SecretList / Secret schema (no example body in the reference). Data values are placeholder base64 of the word 'redacted' - no real secret material."
        expect_rows: 3
        expect_columns: {kind: Secret, namespace: shop, name: catalog-database, type: Opaque, key: url, value_bytes: 8, key_count: 1, annotation_keys: '["kubectl.kubernetes.io/last-applied-configuration"]'}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/secret-v1/#get-list

  # ------------------------------------------------------------------------------------------
  # Storage
  # ------------------------------------------------------------------------------------------
  - name: kubernetes_persistentvolumeclaims
    title: PersistentVolumeClaims
    description: >-
      PVCs from GET /api/v1[/namespaces/{namespace}]/persistentvolumeclaims: phase (Pending /
      Bound / Lost), requested StorageClass, bound volume, requested vs actual capacity, access
      modes, conditions and the provisioner / selected-node annotations. A Pending claim whose
      storage_class does not exist in kubernetes_storageclasses never binds.
    kind: entities
    request:
      method: GET
      path: "/api/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/persistentvolumeclaims"
      query: *q_named
    filters:
      - *f_namespace
      - {column: name, ops: ["=", "in", "!=", "like"], description: "PVC name (exact)", examples: [archive-writer]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'PersistentVolumeClaim'"}
      - *c_namespace
      - *c_name
      - {name: phase, path: status.phase, description: "Pending | Bound | Lost"}
      - {name: storage_class, path: spec.storageClassName, description: "Requested StorageClass (null = cluster default at creation time)"}
      - {name: volume_name, path: spec.volumeName, description: "Bound PersistentVolume"}
      - {name: requested, path: spec.resources.requests.storage, description: "Requested size, e.g. 1Gi"}
      - {name: capacity, path: status.capacity.storage, description: "Actual size once bound"}
      - {name: access_modes, type: JSON, path: spec.accessModes}
      - {name: volume_mode, path: spec.volumeMode}
      - {name: conditions, type: JSON, path: status.conditions}
      - {name: provisioner, expr: "_.metadata.annotations['volume.kubernetes.io/storage-provisioner'] or _.metadata.annotations['volume.beta.kubernetes.io/storage-provisioner']", description: "Provisioner the claim waits for"}
      - {name: selected_node, path: "metadata.annotations['volume.kubernetes.io/selected-node']", description: "Node chosen for WaitForFirstConsumer provisioning"}
      - *c_created
      - *c_owner_kind
      - *c_owner_name
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "Pending with a WaitForFirstConsumer StorageClass is normal until a pod uses the claim; the reason is in kubernetes_events on the PVC (ProvisioningFailed, ExternalProvisioning, WaitForFirstConsumer) and on the pod (FailedScheduling)."
      - "Bound does not mean usable: a local PV with nodeAffinity no node satisfies leaves the pod Pending with 'volume node affinity conflict' (check kubernetes_persistentvolumes.node_affinity and kubernetes_nodes.labels)."
    examples:
      - sql: >-
          SELECT namespace, name, phase, storage_class, requested, volume_name
          FROM kubernetes_persistentvolumeclaims WHERE phase <> 'Bound'
        description: Claims that are not bound, with the StorageClass they need.
    fixtures:
      - file: pvcs_list.json
        filters: {namespace: batch}
        note: "Built strictly from the v1.37 core/v1 PersistentVolumeClaimList / PersistentVolumeClaimSpec / PersistentVolumeClaimStatus schema (no example body in the reference); mirrors the Arena pending-volume-claim and volume-affinity-conflict claims."
        expect_rows: 2
        expect_columns: {kind: PersistentVolumeClaim, namespace: batch, name: archive-writer, phase: Pending, storage_class: gp3-archive, requested: 1Gi, volume_name: null}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/persistent-volume-claim-v1/#get-list

  - name: kubernetes_persistentvolumes
    title: PersistentVolumes
    description: >-
      PVs from GET /api/v1/persistentvolumes (cluster-scoped): phase (Available / Bound / Released
      / Failed), claim, StorageClass, capacity, reclaim policy, volume source (local, hostPath,
      csi, nfs ...) and nodeAffinity - which nodes can mount it.
    kind: entities
    request:
      method: GET
      path: /api/v1/persistentvolumes
      query: &q_cluster_named
        limit: 500
        labelSelector: "{{ filters.label_selector }}"
        fieldSelector: >-
          {{ [('metadata.name=' ~ filters.name) if (filters.name and not filters.name__op) else none,
              ('metadata.name!=' ~ filters.name) if filters.name__op == '!=' else none,
              filters.field_selector] | select | join(',') }}
    filters:
      - {column: name, ops: ["=", "in", "!=", "like"], description: "PV name (exact)", examples: [index-store]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'PersistentVolume'"}
      - *c_name
      - {name: phase, path: status.phase, description: "Pending | Available | Bound | Released | Failed"}
      - {name: reason, path: status.reason}
      - {name: message, path: status.message}
      - {name: claim_namespace, path: spec.claimRef.namespace}
      - {name: claim_name, path: spec.claimRef.name}
      - {name: storage_class, path: spec.storageClassName}
      - {name: capacity, path: spec.capacity.storage}
      - {name: access_modes, type: JSON, path: spec.accessModes}
      - {name: reclaim_policy, path: spec.persistentVolumeReclaimPolicy, description: "Retain | Delete | Recycle"}
      - {name: volume_mode, path: spec.volumeMode}
      - {name: source_type, expr: "'local' if _.spec.local else ('hostPath' if _.spec.hostPath else ('csi' if _.spec.csi else ('nfs' if _.spec.nfs else none)))", description: "local | hostPath | csi | nfs (others: see spec)"}
      - {name: local_path, expr: "_.spec.local.path or _.spec.hostPath.path"}
      - {name: csi_driver, path: spec.csi.driver}
      - {name: node_affinity, type: JSON, path: spec.nodeAffinity.required, description: "Required node selector terms; a pod using this PV can only run on matching nodes"}
      - {name: last_phase_transition, type: TIMESTAMP, path: status.lastPhaseTransitionTime}
      - *c_created
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    examples:
      - sql: >-
          SELECT name, phase, claim_namespace, claim_name, storage_class, source_type, node_affinity
          FROM kubernetes_persistentvolumes WHERE name = 'index-store'
        description: Where a volume can be mounted (nodeAffinity) and which claim holds it.
    fixtures:
      - file: pvs_list.json
        note: "Built strictly from the v1.37 core/v1 PersistentVolumeList / PersistentVolumeSpec (local, nodeAffinity) schema (no example body in the reference); mirrors the Arena volume-affinity-conflict PV."
        expect_rows: 1
        expect_columns: {kind: PersistentVolume, name: index-store, phase: Bound, claim_namespace: batch, claim_name: index-store, source_type: local, local_path: /mnt/nvme-archive/index, reclaim_policy: Retain}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/persistent-volume-v1/#get-list

  - name: kubernetes_storageclasses
    title: StorageClasses
    description: >-
      StorageClasses from GET /apis/storage.k8s.io/v1/storageclasses: provisioner, reclaim
      policy, volume binding mode (Immediate / WaitForFirstConsumer), expansion, parameters and
      which one is the default. A PVC naming a class missing here stays Pending forever.
    kind: entities
    request:
      method: GET
      path: /apis/storage.k8s.io/v1/storageclasses
      query: *q_cluster_named
    filters:
      - {column: name, ops: ["=", "in", "!=", "like"], description: "StorageClass name (exact)", examples: [standard]}
      - *f_label_selector
      - *f_field_selector
    response:
      rows_path: "$.items[*]"
    columns:
