      - {name: scaling_active, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'ScalingActive') | map(attribute='status') | first", description: "False = metrics unavailable (FailedGetResourceMetric)"}
      - {name: conditions, type: JSON, path: status.conditions}
      - {name: last_scale_time, type: TIMESTAMP, path: status.lastScaleTime}
      - {name: behavior, type: JSON, path: spec.behavior}
      - *c_created
      - *c_labels
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    examples:
      - sql: >-
          SELECT namespace, name, target_name, current_replicas, desired_replicas, max_replicas, scaling_limited, last_scale_time
          FROM kubernetes_horizontalpodautoscalers
        description: Autoscalers and whether they are pinned at their maximum.
    fixtures:
