  - name: kubernetes_resourcequotas
    title: ResourceQuotas (one row per resource)
    description: >-
      ResourceQuotas from GET /api/v1[/namespaces/{namespace}]/resourcequotas, one row per quota'd
      resource (requests.cpu, limits.memory, pods, count/...): hard limit vs used. A quota on
      requests.cpu / limits.memory also REJECTS pods that do not declare that request/limit
      (FailedCreate 'must specify requests.cpu'), even with plenty of headroom.
    kind: entities
    request:
      method: GET
      path: "/api/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/resourcequotas"
      query: *q_named
    filters:
      - *f_namespace
      - {column: name, ops: ["=", "in", "!=", "like"], description: "ResourceQuota name (exact)", examples: [platform-limits]}
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: spec.hard, as: h, keep_empty: true}
    columns:
      - {name: kind, expr: "'ResourceQuota'"}
      - *c_namespace
      - *c_name
      - {name: resource, path: "@h.key", description: "Quota'd resource, e.g. requests.cpu, limits.memory, pods, count/deployments.apps"}
      - {name: hard, expr: "(_.status.hard or {})[h.key] or h.value if h else none", description: "Enforced limit (status.hard, else spec.hard)"}
      - {name: used, expr: "(_.status.used or {})[h.key] if h else none", description: "Current usage"}
      - {name: scopes, type: JSON, path: spec.scopes}
      - {name: scope_selector, type: JSON, path: spec.scopeSelector}
      - *c_last_modified
      - *c_last_manager
      - *c_created
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    examples:
      - sql: "SELECT namespace, name, resource, hard, used, created FROM kubernetes_resourcequotas WHERE namespace = 'shop'"
        description: Quotas in a namespace with usage.
    fixtures:
      - file: resourcequotas_list.json
        filters: {namespace: shop}
        note: "Built strictly from the v1.37 core/v1 ResourceQuotaList / ResourceQuotaSpec / ResourceQuotaStatus schema (no example body in the reference); mirrors the Arena quota-trap quota."
        expect_rows: 2
        expect_columns: {kind: ResourceQuota, namespace: shop, name: platform-limits, resource: requests.cpu, hard: "8", used: 950m}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/core/resource-quota-v1/#get-list

  - name: kubernetes_limitranges
    title: LimitRanges (one row per limit item)
    description: >-
      LimitRanges from GET /api/v1[/namespaces/{namespace}]/limitranges, one row per limit item
      (type Container / Pod / PersistentVolumeClaim): default limits and requests injected into
      containers that declare none, and min/max that reject pods at admission.
    kind: entities
    request:
      method: GET
      path: "/api/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/limitranges"
      query: *q_named
    filters:
      - *f_namespace
      - *f_name
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
      expand:
        - {explode: spec.limits, as: l}
    columns:
      - {name: kind, expr: "'LimitRange'"}
      - *c_namespace
      - *c_name
      - {name: type, path: "@l.type", description: "Container | Pod | PersistentVolumeClaim"}
      - {name: default_limits, type: JSON, path: "@l.default", description: "Default limits injected when a container sets none"}
      - {name: default_requests, type: JSON, path: "@l.defaultRequest"}
      - {name: max, type: JSON, path: "@l.max"}
      - {name: min, type: JSON, path: "@l.min"}
      - {name: max_limit_request_ratio, type: JSON, path: "@l.maxLimitRequestRatio"}
      - *c_created
      - *c_labels
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    examples:
      - sql: "SELECT namespace, name, type, default_limits, default_requests, max, min FROM kubernetes_limitranges"
        description: Admission defaults and bounds per namespace.
    fixtures:
