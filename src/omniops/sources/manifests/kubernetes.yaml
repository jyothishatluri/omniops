  - name: kubernetes_jobs
    title: Jobs
    description: >-
      Jobs from GET /apis/batch/v1[/namespaces/{namespace}]/jobs: derived status (Complete /
      Failed / Suspended / Running / Pending), active / ready / succeeded / failed pod counts, start
      and completion time, backoffLimit / activeDeadlineSeconds, the Failed condition reason
      (BackoffLimitExceeded, DeadlineExceeded, PodFailurePolicy) and owning CronJob.
    kind: entities
    request:
      method: GET
      path: "/apis/batch/v1{{ ('/namespaces/' ~ filters.namespace) if (filters.namespace and not filters.namespace__op) else '' }}/jobs"
      query: *q_named
    filters:
      - *f_namespace
      - *f_name
      - *f_label_selector
      - *f_field_selector
    pagination: *k8s_pages
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: kind, expr: "'Job'"}
      - *c_namespace
      - *c_name
      - {name: status, expr: "'Failed' if ((_.status.conditions or []) | selectattr('type', 'equalto', 'Failed') | selectattr('status', 'equalto', 'True') | list) else ('Complete' if ((_.status.conditions or []) | selectattr('type', 'equalto', 'Complete') | selectattr('status', 'equalto', 'True') | list) else ('Suspended' if ((_.status.conditions or []) | selectattr('type', 'equalto', 'Suspended') | selectattr('status', 'equalto', 'True') | list) else ('Running' if _.status.active else 'Pending')))", description: "Failed | Complete | Suspended | Running | Pending (from conditions and active)"}
      - {name: active, type: BIGINT, expr: "_.status.active or 0"}
      - {name: ready, type: BIGINT, expr: "_.status.ready or 0"}
      - {name: succeeded, type: BIGINT, expr: "_.status.succeeded or 0"}
      - {name: failed, type: BIGINT, expr: "_.status.failed or 0", description: "Pods that reached phase Failed"}
      - {name: start_time, type: TIMESTAMP, path: status.startTime}
      - {name: completion_time, type: TIMESTAMP, path: status.completionTime}
      - {name: failure_reason, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'Failed') | map(attribute='reason') | first", description: "BackoffLimitExceeded | DeadlineExceeded | PodFailurePolicy | MaxFailedIndexesExceeded"}
      - {name: failure_message, expr: "(_.status.conditions or []) | selectattr('type', 'equalto', 'Failed') | map(attribute='message') | first"}
      - {name: completions, type: BIGINT, path: spec.completions}
      - {name: parallelism, type: BIGINT, path: spec.parallelism}
      - {name: backoff_limit, type: BIGINT, path: spec.backoffLimit}
      - {name: active_deadline_s, type: BIGINT, path: spec.activeDeadlineSeconds}
      - {name: suspend, type: BOOLEAN, path: spec.suspend}
      - {name: images, type: JSON, expr: "(_.spec.template.spec.containers or []) | map(attribute='image') | list"}
      - {name: conditions, type: JSON, path: status.conditions}
      - *c_owner_kind
      - *c_owner_name
      - *c_created
      - *c_labels
      - *c_annotations
      - *c_uid
      - *c_label_selector
      - *c_field_selector
    pitfalls:
      - "A Job that is still running with a long transaction (e.g. a maintenance job holding a database lock) looks healthy here (status Running): correlate start_time with the onset."
      - "Finished Jobs are deleted after ttlSecondsAfterFinished (and CronJob history limits); their pods and logs go with them."
    examples:
      - sql: >-
          SELECT namespace, name, status, active, failed, start_time, completion_time, failure_reason
          FROM kubernetes_jobs WHERE namespace = 'batch' ORDER BY start_time DESC
        description: Recent jobs in a namespace (who was running at the onset).
    fixtures:
      - file: jobs_list.json
        filters: {namespace: batch}
        note: "Built strictly from the v1.37 batch/v1 JobList / JobSpec / JobStatus / JobCondition schema (no example body in the reference); names follow the Arena pg-lock-hold and stale-db-credentials jobs."
        expect_rows: 2
        expect_columns: {kind: Job, namespace: batch, name: catalog-maintenance, status: Running, active: 1, start_time: "2026-10-01T11:40:05Z", backoff_limit: 0}
    docs_url: https://kubernetes.io/docs/reference/kubernetes-api/batch/job-v1/#get-list

