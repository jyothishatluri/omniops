  # ------------------------------------------------------------------------------------------
  - name: dynatrace_events
    title: Events (deployments, config changes, restarts, Davis events)
    description: >-
      Events in the window, one row per event: CUSTOM_DEPLOYMENT, CUSTOM_CONFIGURATION,
      CUSTOM_INFO, CUSTOM_ANNOTATION, PROCESS_RESTART, Davis anomaly events (e.g.
      SERVICE_ERROR_RATE_INCREASED, OSI_HIGH_CPU), Kubernetes and synthetic events. Filter on
      event_type (one type per request; IN fans out), status, entity_id, service, id or raw
      event_selector / entity_selector. Deployment fields (version, deployment_name, release_stage,
      ci_link) are extracted from properties.
    kind: changes
    request:
      method: GET
      path: /api/v2/events
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        pageSize: 1000
        eventSelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{%- set s -%}{% if filters.event_selector %},{{ filters.event_selector }}{% endif %}{% if filters.event_type %},eventType({{ q(filters.event_type) }}){% endif %}{% if filters.status %},status({{ q(filters.status | upper) }}){% endif %}{% if filters.entity_id %},entityId({{ ql(filters.entity_id) }}){% endif %}{% if filters.id %},eventId({{ ql(filters.id) }}){% endif %}{% if filters.correlation_id %},correlationId({{ ql(filters.correlation_id) }}){% endif %}{%- endset -%}{{ s[1:] }}
        entitySelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{% if filters.entity_selector %}{{ filters.entity_selector }}{% elif filters.service %}type("SERVICE"),entityName.equals({{ q(filters.service) }}){% endif %}
    filters:
      - {column: event_type, ops: ["=", "in"], max_fan_out: 8, description: "Event type (one per request; IN fans out). See dynatrace_event_types", examples: [CUSTOM_DEPLOYMENT]}
      - {column: status, description: "OPEN | CLOSED"}
      - {column: entity_id, ops: ["=", "in"], fan_out: false, description: "Related entity id(s)", examples: ['PROCESS_GROUP_INSTANCE-03F98EA8639FD052']}
      - {column: id, ops: ["=", "in"], fan_out: false, description: "Event id(s)"}
      - {column: correlation_id, ops: ["=", "in"], fan_out: false}
      - {column: service, description: "Events on a SERVICE entity with this name", examples: ['checkout-service']}
      - {column: event_selector, description: "Raw event selector, e.g. property.dt.event.deployment.release_stage(\"production\")"}
      - {column: entity_selector, description: "Raw entity selector, e.g. type(\"PROCESS_GROUP\"),tag(\"app:checkout\")"}
    time: {column: ts, default_lookback: 2h, max_window: 365d}
    response:
      rows_path: "$.events[*]"
    columns:
      - {name: id, path: eventId}
      - {name: ts, type: TIMESTAMP, path: startTime, transform: epoch_ms, description: "Event start"}
      - {name: end_ts, type: TIMESTAMP, path: endTime, transform: epoch_ms, description: "Event end (NULL while active)"}
      - {name: event_type, path: eventType}
      - {name: title, path: title}
      - {name: status, path: status, description: "OPEN | CLOSED"}
      - {name: entity_id, path: "entityId.entityId.id"}
      - {name: entity_name, path: "entityId.name"}
      - {name: entity_type, path: "entityId.entityId.type"}
      - {name: service, expr: "filters.service if filters.service else (_.entityId.name if _.entityId and _.entityId.entityId and _.entityId.entityId.type == 'SERVICE' else none)", description: "Entity name when the event is on a SERVICE"}
      - {name: properties, type: JSON, expr: "dict(_.properties | map('dictsort') | map('map', attribute=1) | map('list') | list) if _.properties else none", description: "Event properties as an object: properties->>'dt.event.deployment.version'"}
      - {name: version, expr: "(_.properties | selectattr('key', 'equalto', 'dt.event.deployment.version') | map(attribute='value') | first) if _.properties else none", description: "dt.event.deployment.version"}
      - {name: deployment_name, expr: "(_.properties | selectattr('key', 'equalto', 'dt.event.deployment.name') | map(attribute='value') | first) if _.properties else none"}
      - {name: release_stage, expr: "(_.properties | selectattr('key', 'equalto', 'dt.event.deployment.release_stage') | map(attribute='value') | first) if _.properties else none"}
      - {name: ci_link, expr: "(_.properties | selectattr('key', 'equalto', 'dt.event.deployment.ci_back_link') | map(attribute='value') | first) if _.properties else none"}
      - {name: tags, expr: "(_.entityTags | map(attribute='stringRepresentation') | join(', ')) if _.entityTags else none"}
      - {name: management_zones, expr: "(_.managementZones | map(attribute='name') | join(', ')) if _.managementZones else none"}
      - {name: correlation_id, path: correlationId}
      - {name: under_maintenance, type: BOOLEAN, path: underMaintenance}
      - {name: suppress_alert, type: BOOLEAN, path: suppressAlert}
      - {name: suppress_problem, type: BOOLEAN, path: suppressProblem}
      - {name: frequent_event, type: BOOLEAN, path: frequentEvent}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')", description: "More than 1000 events matched: narrow event_type/window"}
      - {name: event_selector, filter_only: true}
      - {name: entity_selector, filter_only: true}
    sort_hint: "API order (newest first); sort in SQL."
    pitfalls:
      - "eventSelector accepts ONE eventType per request; event_type IN (...) fans out into one request per type."
      - "Without event_type the window returns every event type (often thousands of Davis/K8s events): filter."
      - "Deployment metadata lives in properties (dt.event.deployment.version/name/release_stage/ci_back_link/remediation_action_link, dt.event.deployment.release_product, dt.event.deployment.release_build_version); whatever the CI sent is what you get."
      - "Deployments are usually attached to PROCESS_GROUP / PROCESS_GROUP_INSTANCE or SERVICE entities; filtering by service only finds events attached to the SERVICE itself."
    examples:
      - sql: >-
          SELECT ts, entity_name, version, deployment_name, release_stage, ci_link
          FROM dynatrace_events WHERE event_type IN ('CUSTOM_DEPLOYMENT', 'CUSTOM_CONFIGURATION')
          ORDER BY ts DESC
        description: Deployments and configuration changes in the window (change correlation).
      - sql: "SELECT ts, entity_name, title FROM dynatrace_events WHERE event_type = 'PROCESS_RESTART' ORDER BY ts"
        description: Process restarts around the incident.
    tests:
      - {sql: "SELECT id, event_type FROM dynatrace_events WHERE event_type = 'CUSTOM_DEPLOYMENT' LIMIT 5", min_rows: 0}
    fixtures:
      - file: events_example.json
        note: "Example response of GET /api/v2/events (eventType PROCESS_RESTART) from the official docs page; one trailing comma removed so it is valid JSON, otherwise verbatim."
        filters: {event_type: PROCESS_RESTART}
        expect_rows: 2
        expect_columns: {id: "-6475311485380369979_1628500180000", event_type: PROCESS_RESTART, ts: "2021-08-09T09:09:40Z", entity_type: PROCESS_GROUP_INSTANCE, status: OPEN, under_maintenance: true, has_more: false}
      - file: events_reference.json
        note: "Verbatim EventList JSON model from the official docs page."
        filters: {event_type: LOW_DISK_SPACE}
        expect_rows: 1
        expect_columns: {event_type: LOW_DISK_SPACE, title: High CPU load on host X, correlation_id: 933613657e1c8fcf, has_more: true}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/events-v2/get-events

  # ------------------------------------------------------------------------------------------
