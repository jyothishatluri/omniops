  # ------------------------------------------------------------------------------------------
  - name: dynatrace_problems
    title: Davis problems
    description: >-
      Davis problems whose start OR end falls in the window, one row per problem, newest first:
      title, status (OPEN/CLOSED), severity, impact level, root-cause entity, affected/impacted
      entities, tags, Kubernetes context. Filter on status, severity, impact_level, id,
      display_id, root_cause_entity_id, service, text, or raw problem_selector / entity_selector.
      Then use dynatrace_problem_evidence / _impacts / _comments with the problem id.
    kind: incidents
    request:
      method: GET
      path: /api/v2/problems
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        pageSize: 500
        sort: "-startTime"
        problemSelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{%- set s -%}{% if filters.problem_selector %},{{ filters.problem_selector }}{% endif %}{% if filters.status %},status({{ q(filters.status | lower) }}){% endif %}{% if filters.severity %},severityLevel({{ ql(filters.severity | as_list | map('upper') | list) }}){% endif %}{% if filters.impact_level %},impactLevel({{ ql(filters.impact_level | as_list | map('upper') | list) }}){% endif %}{% if filters.id %},problemId({{ ql(filters.id) }}){% endif %}{% if filters.display_id %},displayId({{ ql(filters.display_id) }}){% endif %}{% if filters.root_cause_entity_id %},rootCauseEntity({{ ql(filters.root_cause_entity_id) }}){% endif %}{% if filters.affected_entity_id %},affectedEntities({{ ql(filters.affected_entity_id) }}){% endif %}{% if filters.text %},text({{ q(filters.text) }}){% endif %}{% if filters.management_zone %},managementZones({{ q(filters.management_zone) }}){% endif %}{%- endset -%}{{ s[1:] }}
        entitySelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{% if filters.entity_selector %}{{ filters.entity_selector }}{% elif filters.service %}type("SERVICE"),entityName.equals({{ q(filters.service) }}){% endif %}
    filters:
      - {column: status, description: "OPEN | CLOSED", examples: [OPEN]}
      - {column: severity, ops: ["=", "in"], fan_out: false, description: "AVAILABILITY, ERROR, PERFORMANCE, RESOURCE_CONTENTION, CUSTOM_ALERT, MONITORING_UNAVAILABLE, INFO", examples: [ERROR]}
      - {column: impact_level, ops: ["=", "in"], fan_out: false, description: "SERVICES, APPLICATION, INFRASTRUCTURE, ENVIRONMENT"}
      - {column: id, ops: ["=", "in"], fan_out: false, description: "Problem id (problemId, not the P-... display id)"}
      - {column: display_id, ops: ["=", "in"], fan_out: false, description: "Display id, e.g. P-24101234", examples: ['P-24101234']}
      - {column: root_cause_entity_id, ops: ["=", "in"], fan_out: false, description: "Root-cause entity id"}
      - {column: affected_entity_id, ops: ["=", "in"], fan_out: false, description: "Problems affecting these entity ids"}
      - {column: service, description: "Problems on a service (entitySelector type(SERVICE),entityName.equals)", examples: ['checkout-service']}
      - {column: text, description: "Relevance text search over titles, event titles, display id and entity ids (max 30 chars)", examples: ['checkout']}
      - {column: management_zone, description: "Management zone name (contains, case-insensitive)"}
      - {column: problem_selector, description: "Raw problem selector (AND-ed with the other filters)", examples: ['underMaintenance(false)']}
      - {column: entity_selector, description: "Raw entity selector scoping the problems"}
    time: {column: ts, default_lookback: 2h, max_window: 365d, reapply: false}
    response:
      rows_path: "$.problems[*]"
    columns:
      - {name: id, path: problemId, description: "Problem id (use for evidence/impacts/comments)"}
      - {name: display_id, path: displayId, description: "P-xxxxx shown in the UI"}
      - {name: title, path: title}
      - {name: status, path: status, description: "OPEN | CLOSED"}
      - {name: severity, path: severityLevel}
      - {name: impact_level, path: impactLevel}
      - {name: ts, type: TIMESTAMP, path: startTime, transform: epoch_ms, description: "Problem start; ts predicates set the API window (start OR end inside) and are not re-applied"}
      - {name: start_ts, type: TIMESTAMP, path: startTime, transform: epoch_ms, description: "Copy of the problem start that IS filtered locally (use it for 'started after X')"}
      - {name: end_ts, type: TIMESTAMP, expr: "_.endTime if _.endTime and _.endTime > 0 else none", transform: epoch_ms, description: "Problem end (NULL while OPEN; the API sends -1)"}
      - {name: duration_ms, type: DOUBLE, expr: "(_.endTime - _.startTime) if _.endTime and _.endTime > 0 and _.startTime else none", description: "Duration of closed problems"}
      - {name: root_cause_entity_id, path: "rootCauseEntity.entityId.id"}
      - {name: root_cause_entity_name, path: "rootCauseEntity.name"}
      - {name: root_cause_entity_type, path: "rootCauseEntity.entityId.type"}
      - name: service
        expr: >-
          filters.service if filters.service and filters.service in ((_.affectedEntities or []) + (_.impactedEntities or [])) | map(attribute='name') | list
          else ((_.affectedEntities or []) | selectattr('entityId.type', 'equalto', 'SERVICE') | map(attribute='name') | first)
        description: "First affected SERVICE name (or the service filter when it matches)"
      - {name: affected_entities, expr: "(_.affectedEntities | map(attribute='name') | join(', ')) if _.affectedEntities else none"}
      - {name: affected_entity_ids, type: JSON, expr: "(_.affectedEntities | map(attribute='entityId.id') | list) if _.affectedEntities else none"}
      - {name: impacted_entities, expr: "(_.impactedEntities | map(attribute='name') | join(', ')) if _.impactedEntities else none"}
      - {name: tags, expr: "(_.entityTags | map(attribute='stringRepresentation') | join(', ')) if _.entityTags else none"}
      - {name: management_zones, expr: "(_.managementZones | map(attribute='name') | join(', ')) if _.managementZones else none"}
      - {name: k8s_cluster, expr: "_['k8s.cluster.name'] | join(',') if _['k8s.cluster.name'] else none"}
      - {name: namespace, expr: "_['k8s.namespace.name'] | join(',') if _['k8s.namespace.name'] else none"}
      - {name: linked_problem_id, path: "linkedProblemInfo.problemId"}
      - {name: alerting_profiles, expr: "(_.problemFilters | map(attribute='name') | join(', ')) if _.problemFilters else none"}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')", description: "More than 500 problems matched: narrow the window or selector"}
      - {name: affected_entity_id, filter_only: true}
      - {name: text, filter_only: true}
      - {name: management_zone, filter_only: true}
      - {name: problem_selector, filter_only: true}
      - {name: entity_selector, filter_only: true}
    sort_hint: "Newest start first (sort=-startTime)."
    pitfalls:
      - "ts predicates only set the API window (from/to): Dynatrace returns every problem whose start OR end falls inside it, and the engine does NOT re-apply ts in SQL (time.reapply false), so a problem that started before the window but closed inside it is kept. To restrict to problems that STARTED in the window, filter the copy column start_ts (applied locally), e.g. start_ts >= TIMESTAMP '...'."
      - "An OPEN problem that started before the window and is still open may be missing (neither its start nor end is in the window): query status = 'OPEN' with a wider ts window (e.g. 24h) to see everything still open."
      - "id (problemId) and display_id (P-...) differ; detail/evidence/comment endpoints need id."
      - "Status, severity and impact values are UPPERCASE."
      - "Merged/linked problems: check linked_problem_id before counting incidents."
    examples:
      - sql: "SELECT display_id, title, severity, ts, root_cause_entity_name, affected_entities FROM dynatrace_problems WHERE status = 'OPEN' ORDER BY ts DESC"
        description: Currently open problems with Davis root cause.
      - sql: >-
          SELECT display_id, title, status, ts, end_ts, duration_ms / 60000 AS minutes
          FROM dynatrace_problems WHERE service = 'checkout-service'
          ORDER BY ts DESC
        description: Problems involving one service in the window (includes closed ones).
    tests:
      - {sql: "SELECT id, title FROM dynatrace_problems LIMIT 5", min_rows: 0}
    fixtures:
      - file: problems_reference.json
        note: "Verbatim 'Problems' JSON model from the official docs page (placeholder values)."
        expect_rows: 1
        expect_columns: {id: string, status: CLOSED, severity: AVAILABILITY, ts: "1970-01-01T00:00:00Z", has_more: true}
      - file: problems_schema_realistic.json
        note: "Built strictly from the documented Problems/Problem/EntityStub/METag schema (docs only show placeholder values): one OPEN service problem, one CLOSED host problem."
        expect_rows: 2
        expect_columns: {id: "-2045823616914785224_1727778600000V2", display_id: P-24101234, status: OPEN, end_ts: null, root_cause_entity_name: payment-service, service: checkout-service, namespace: shop, ts: "2024-10-01T10:30:00Z"}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/problems-v2/problems/get-problems-list
    ui_link: "{{ source.base_url }}/#problems"

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_problem_evidence
    title: Root-cause evidence of a problem
    description: >-
      Davis root-cause evidence for one or more problems (problem id required): one row per
      evidence item - metric change points (value before/after), events (deployments, restarts,
      config changes), transactional degradations, availability and maintenance windows - with the
      entity it was found on and whether it is root-cause relevant.
    kind: events
    request:
      method: GET
      path: "/api/v2/problems/{{ filters.problem_id | urlencode }}"
      query:
        fields: evidenceDetails
    filters:
      - {column: problem_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Problem id from dynatrace_problems.id (not the P-... display id)", examples: ['-2045823616914785224_1727778600000V2']}
    response:
      rows_path: "$.evidenceDetails.details[*]"
    columns:
      - {name: problem_id, path: "$.problemId"}
      - {name: display_id, path: "$.displayId"}
      - {name: evidence_type, path: evidenceType, description: "EVENT | METRIC | TRANSACTIONAL | AVAILABILITY_EVIDENCE | MAINTENANCE_WINDOW"}
      - {name: title, path: displayName}
      - {name: root_cause_relevant, type: BOOLEAN, path: rootCauseRelevant}
      - {name: entity_id, path: "entity.entityId.id"}
      - {name: entity_name, path: "entity.name"}
      - {name: entity_type, path: "entity.entityId.type"}
      - {name: grouping_entity_name, path: "groupingEntity.name"}
      - {name: ts, type: TIMESTAMP, path: startTime, transform: epoch_ms}
      - {name: end_ts, type: TIMESTAMP, expr: "_.endTime if _.endTime and _.endTime > 0 else none", transform: epoch_ms}
      - {name: metric, path: metricId, description: "METRIC evidence: metric key"}
      - {name: value_before, type: DOUBLE, path: valueBeforeChangePoint}
      - {name: value_after, type: DOUBLE, path: valueAfterChangePoint}
      - {name: unit, path: unit}
      - {name: event_id, path: eventId, description: "EVENT evidence: event id (join dynatrace_events.id)"}
      - {name: event_type, path: eventType, description: "EVENT evidence: e.g. CUSTOM_DEPLOYMENT, PROCESS_RESTART"}
      - {name: event_properties, type: JSON, expr: "dict(_.data.properties | map('dictsort') | map('map', attribute=1) | map('list') | list) if _.data and _.data.properties else none"}
      - {name: maintenance_window_id, path: maintenanceWindowConfigId}
      - {name: details, type: JSON, path: ".", description: "The full evidence object"}
    pitfalls:
      - "Evidence is Davis' reasoning, not ground truth: verify METRIC evidence against dynatrace_metrics and EVENT evidence (e.g. deployments) against dynatrace_events."
      - "unit is the metric unit (MicroSecond for response time)."
    examples:
      - sql: >-
          SELECT evidence_type, title, entity_name, ts, metric, value_before, value_after, unit, event_type
          FROM dynatrace_problem_evidence WHERE problem_id = '-2045823616914785224_1727778600000V2'
          ORDER BY root_cause_relevant DESC, ts
        description: Root-cause evidence chain of one problem, root-cause items first.
    fixtures:
      - file: problem_details_models.json
        note: "Problem object from the official GET problem details docs with evidenceDetails.details = the five verbatim Evidence JSON models (AVAILABILITY_EVIDENCE, EVENT, MAINTENANCE_WINDOW, METRIC, TRANSACTIONAL) from the official Problems API v2 JSON models page."
        filters: {problem_id: string}
        expect_rows: 5
        expect_columns: {evidence_type: AVAILABILITY_EVIDENCE, root_cause_relevant: true, problem_id: string}
      - file: problem_details_reference.json
        note: "Verbatim Problem JSON model from the official GET problem details docs page."
        filters: {problem_id: string}
        expect_rows: 1
        expect_columns: {evidence_type: AVAILABILITY_EVIDENCE, title: string}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/problems-v2/problems/get-problem-details

