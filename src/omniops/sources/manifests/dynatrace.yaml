  # ------------------------------------------------------------------------------------------
  - name: dynatrace_logs
    title: Log search (Log Monitoring Classic)
    description: >-
      Log records matching a classic log search query, newest first, max 1,000 per slice (follows
      nextSliceKey). Filter on query (Dynatrace search query language), level (status), host,
      log_source and ts. Deprecated endpoint (removed end of 2027); on Grail-enabled environments
      prefer dynatrace_grail_logs.
    kind: logs
    request:
      method: GET
      path: /api/v2/logs/search
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        limit: "{{ [limit or 1000, 1000] | min }}"
        sort: "-timestamp"
        query: >-
          {%- set s -%}{% if filters.query %} AND ({{ filters.query }}){% endif %}{% if filters.level %} AND status="{{ filters.level | upper | label_escape }}"{% endif %}{% if filters.host %} AND host.name="{{ filters.host | label_escape }}"{% endif %}{% if filters.log_source %} AND log.source="{{ filters.log_source | label_escape }}"{% endif %}{%- endset -%}{{ s[5:] }}
    filters:
      - {column: query, description: "Classic search query, e.g. content=\"timeout\" AND k8s.namespace.name=\"shop\"", examples: ['content="connection refused"']}
      - {column: level, description: "Log status ERROR | WARN | INFO | NONE", examples: [ERROR]}
      - {column: host, variants: hostname, description: "host.name attribute (exact; add * in query for prefixes)", examples: ['ip-10-0-1-17']}
      - {column: log_source, description: "log.source attribute (file path / source)", examples: ['/var/log/app/app.log']}
    time: {column: ts, default_lookback: 1h, max_window: 35d, retention: 35d}
    pagination: {type: cursor, cursor_path: "$.nextSliceKey", cursor_param: query.nextSliceKey, max_pages: 5}
    response:
      rows_path: "$.results[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms}
      - {name: message, path: content}
      - {name: level, expr: "filters.level if filters.level and (filters.level | upper) == _.status else _.status", description: "Log status derived from the log level: ERROR, WARN, INFO, NONE, NOT_APPLICABLE"}
      - {name: loglevel, path: "additionalColumns.loglevel[0]", description: "Raw log level as written (e.g. SEVERE)"}
      - {name: host, path: "additionalColumns['host.name'][0]"}
      - {name: log_source, path: "additionalColumns['log.source'][0]"}
      - {name: service, expr: "(_.additionalColumns['dt.service.name'] or _.additionalColumns['service.name'] or [none])[0] if _.additionalColumns else none", description: "dt.service.name / service.name attribute when present"}
      - {name: namespace, path: "additionalColumns['k8s.namespace.name'][0]"}
      - {name: pod, path: "additionalColumns['k8s.pod.name'][0]"}
      - {name: trace_id, path: "additionalColumns.trace_id[0]"}
      - {name: span_id, path: "additionalColumns.span_id[0]"}
      - {name: event_type, expr: "_['event.type'] or _.eventType"}
      - {name: attributes, type: JSON, path: additionalColumns, description: "All attributes (each value is an array): attributes->'dt.entity.process_group'->>0"}
      - {name: query, filter_only: true}
    sort_hint: "Newest first (sort=-timestamp)."
    pitfalls:
      - "Each slice returns at most 1,000 records and slices can be empty; the engine follows nextSliceKey for up to 5 slices. Aggregate with dynatrace_log_counts instead of counting raw rows."
      - "Every additionalColumns value is an ARRAY; columns here take element [0]."
      - "Content search only matches whole tokens (or a trailing * wildcard); 'timeou' does not match 'timeout'."
      - "On Log Management and Analytics (Grail) this endpoint needs an OAuth/platform token with storage:logs:read; with an Api-Token it can return nothing. Use dynatrace_grail_logs there."
      - "Service attribution is weak in classic logs: prefer host, k8s.namespace.name, log.source or content filters."
    examples:
      - sql: >-
          SELECT ts, host, log_source, message FROM dynatrace_logs
          WHERE level = 'ERROR' AND query = 'k8s.namespace.name="shop"'
          ORDER BY ts DESC LIMIT 200
        description: Latest error logs in a namespace during the window.
      - sql: "SELECT ts, host, message, trace_id FROM dynatrace_logs WHERE query = 'content=\"connection refused\"' ORDER BY ts"
        description: Phrase search across all logs.
    fixtures:
      - file: logs_search_reference.json
        note: "Verbatim LogRecordsList JSON model from the official docs page (timestamp is a string of epoch ms, key 'event.type')."
        expect_rows: 1
        expect_columns: {ts: "2021-09-09T13:11:29Z", message: example log content, level: ERROR, loglevel: SEVERE, event_type: LOG}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/log-monitoring-v2/get-search-logs
    ui_link: "{{ source.base_url }}/#logs"

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_log_counts
    title: Log volume over time (Log Monitoring Classic)
    description: >-
      Aggregated log counts per time bucket and group value. One row per (group_by attribute,
      bucket, value). Filter on group_by (attribute(s) to group by; default status), query, level,
      host, log_source and ts. Use to see when errors started and which source/host spikes.
    kind: timeseries
    request:
      method: GET
      path: /api/v2/logs/aggregate
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        timeBuckets: "{{ filters.time_buckets or ([time.range_s // ([time.step_s, 60] | max), 1] | max) }}"
        maxGroupValues: "{{ filters.max_group_values or 20 }}"
        groupBy: "{{ filters.group_by | as_list if filters.group_by else ['status'] }}"
        query: >-
          {%- set s -%}{% if filters.query %} AND ({{ filters.query }}){% endif %}{% if filters.level %} AND status="{{ filters.level | upper | label_escape }}"{% endif %}{% if filters.host %} AND host.name="{{ filters.host | label_escape }}"{% endif %}{% if filters.log_source %} AND log.source="{{ filters.log_source | label_escape }}"{% endif %}{%- endset -%}{{ s[5:] }}
    filters:
      - {column: group_by, ops: ["=", "in"], fan_out: false, description: "Attribute(s) to group by: status, log.source, host.name, dt.entity.host, k8s.namespace.name ... (not high-cardinality ones like trace_id)", examples: ['log.source']}
      - {column: query, description: "Classic search query"}
      - {column: level, description: "status ERROR | WARN | INFO", examples: [ERROR]}
      - {column: host, description: "host.name attribute"}
      - {column: log_source, description: "log.source attribute"}
      - {column: time_buckets, type: BIGINT, description: "Number of buckets (default window/step, >= 1)"}
      - {column: max_group_values, type: BIGINT, description: "Values per group, max 100 (default 20)"}
    time: {column: ts, default_lookback: 1h, max_window: 35d, retention: 35d}
    zero_fill: true
    response:
      rows_path: "$.aggregationResult"
      expand:
        - {entries: ".", as: g}
        - {entries: "@g.value", as: b}
        - {entries: "@b.value", as: v}
    columns:
      - {name: group_by, path: "@g.key", description: "Attribute grouped by"}
      - {name: ts, type: TIMESTAMP, path: "@b.key", transform: auto_time, description: "Bucket start"}
      - {name: group_value, path: "@v.key", description: "Attribute value, e.g. ERROR or /var/log/syslog"}
      - {name: value, type: BIGINT, path: "@v.value", description: "Number of log records"}
      - {name: query, filter_only: true}
      - {name: level, filter_only: true}
      - {name: host, filter_only: true}
      - {name: log_source, filter_only: true}
      - {name: time_buckets, type: BIGINT, filter_only: true}
      - {name: max_group_values, type: BIGINT, filter_only: true}
    pitfalls:
      - "Buckets without logs are omitted by the API (zero_fill adds them back)."
      - "Without group_by the API returns ALL possible groupings; this table defaults to status."
      - "The result may cover more time than requested and return fewer buckets than timeBuckets."
    examples:
      - sql: >-
          SELECT ts, group_value AS source, value FROM dynatrace_log_counts
          WHERE group_by = 'log.source' AND level = 'ERROR' ORDER BY ts, value DESC
        description: Error log volume per log source over time (when did errors start, where).
      - sql: "SELECT group_value AS status, sum(value) AS n FROM dynatrace_log_counts WHERE group_by = 'status' GROUP BY 1 ORDER BY n DESC"
        description: Log volume by status in the window.
    fixtures:
      - file: logs_aggregate_reference.json
        note: "Verbatim AggregatedLog JSON model from the official docs page (4 groupings x 2 buckets)."
        expect_rows: 12
        expect_columns: {group_by: hostId, ts: "2020-08-19T11:07:51Z", group_value: localhost, value: 12}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/log-monitoring-v2/get-aggregate-logs

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_slos
    title: Service-level objectives (classic) with evaluation
    description: >-
      SLOs with their evaluation: status (SUCCESS/WARNING/FAILURE), evaluated percentage vs
      target, error budget, burn rate and related open problems. By default each SLO is evaluated
      over its own timeframe (e.g. -1w); set eval_timeframe = 'WINDOW' to evaluate it over the SQL ts
      window instead (incident window). Filter on id, name, text, health_state,
      problem_display_id, management_zone or raw slo_selector.
    kind: entities
    request:
      method: GET
      path: /api/v2/slo
      query:
        evaluate: "{{ 'false' if filters.evaluate == false else 'true' }}"
        pageSize: "{{ 10000 if filters.evaluate == false else 25 }}"
        sort: name
        timeFrame: "{{ 'GTF' if (filters.eval_timeframe or '') | upper == 'WINDOW' else 'CURRENT' }}"
        from: "{{ (time.start | epoch_ms) if (filters.eval_timeframe or '') | upper == 'WINDOW' else None }}"
        to: "{{ (time.end | epoch_ms) if (filters.eval_timeframe or '') | upper == 'WINDOW' else None }}"
        sloSelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{%- set s -%}{% if filters.slo_selector %},{{ filters.slo_selector }}{% endif %}{% if filters.id %},id({{ ql(filters.id) }}){% endif %}{% if filters.name %},name({{ q(filters.name) }}){% endif %}{% if filters.text %},text({{ q(filters.text) }}){% endif %}{% if filters.health_state %},healthState({{ q(filters.health_state | upper) }}){% endif %}{% if filters.management_zone %},managementZone({{ q(filters.management_zone) }}){% endif %}{% if filters.problem_display_id %},problemDisplayName({{ q(filters.problem_display_id) }}){% endif %}{%- endset -%}{{ s[1:] }}
    filters:
      - {column: id, ops: ["=", "in"], fan_out: false}
      - {column: name, description: "Exact SLO name (case-sensitive)", examples: ['Payment service availability']}
      - {column: text, description: "Case-insensitive search in name/description", examples: [checkout]}
      - {column: health_state, description: "UNHEALTHY = has related open problems", examples: [UNHEALTHY]}
      - {column: management_zone, description: "Management zone name"}
      - {column: slo_selector, description: "Raw SLO selector"}
      - {column: evaluate, type: BOOLEAN, description: "false = definitions only (no evaluation, page size up to 10000)"}
      - {column: eval_timeframe, description: "CURRENT (default: SLO's own timeframe) | WINDOW (evaluate over the SQL ts window: timeFrame=GTF)", examples: [WINDOW]}
      - {column: problem_display_id, description: "SLOs related to a problem, e.g. P-24101234 (problemDisplayName)", examples: ['P-24101234']}
    time: {column: ts, default_lookback: 2h, max_window: 365d, reapply: false}
    response:
      rows_path: "$.slo[*]"
    columns:
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: status, path: status, description: "SUCCESS | WARNING | FAILURE"}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: value, type: DOUBLE, path: evaluatedPercentage, description: "Evaluated SLO %, -1 on calculation error or when not evaluated"}
      - {name: target, type: DOUBLE, path: target}
      - {name: warning, type: DOUBLE, path: warning}
      - {name: error_budget, type: DOUBLE, path: errorBudget, description: "Evaluated - target; negative = budget exhausted"}
      - {name: burn_rate, type: DOUBLE, path: "errorBudgetBurnRate.burnRateValue", description: "Burn rate over the last hour"}
      - {name: burn_rate_type, path: "errorBudgetBurnRate.burnRateType", description: "FAST | SLOW | NONE"}
      - {name: hours_to_exhaust, type: DOUBLE, path: "errorBudgetBurnRate.estimatedTimeToConsumeErrorBudget"}
      - {name: timeframe, path: timeframe, description: "SLO evaluation window, e.g. -1w"}
      - {name: metric_expression, path: metricExpression}
      - {name: entity_filter, path: filter}
      - {name: metric_key, path: metricKey, description: "func:slo.* metric: query it with dynatrace_metrics for a time series"}
      - {name: related_open_problems, type: BIGINT, path: relatedOpenProblems}
      - {name: related_total_problems, type: BIGINT, path: relatedTotalProblems}
      - {name: calc_error, path: error, description: "NONE when the calculation is fine"}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')", description: "More SLOs than one page (25 when evaluating): filter by name/text"}
      - {name: text, filter_only: true}
      - {name: health_state, filter_only: true}
      - {name: management_zone, filter_only: true}
      - {name: slo_selector, filter_only: true}
      - {name: evaluate, type: BOOLEAN, filter_only: true}
      - {name: eval_timeframe, expr: "filters.eval_timeframe or 'CURRENT'", description: "CURRENT or WINDOW: which timeframe value/error_budget refer to"}
      - {name: problem_display_id, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true, description: "Evaluation window, used only when eval_timeframe = 'WINDOW'"}
    pitfalls:
      - "With evaluation the API caps the page at 25 SLOs; filter by text/name/health_state when has_more is true."
      - "value/error_budget are -1 when not evaluated or on calculation errors (check calc_error)."
      - "By default values are for the SLO's own timeframe (column timeframe, e.g. -1w), not the incident window: add eval_timeframe = 'WINDOW' (plus a ts range) to evaluate over the incident window; for a curve query metric_key (func:slo.<name>) via dynatrace_metrics."
      - "Classic SLOs are deprecated on latest Dynatrace (new SLOs live in the platform SLO app and are NOT returned here)."
      - "name(...) is case-sensitive and exact; text(...) is a case-insensitive contains over name and description."
    examples:
      - sql: "SELECT name, status, value, target, error_budget, burn_rate_type, hours_to_exhaust FROM dynatrace_slos WHERE status <> 'SUCCESS' ORDER BY error_budget"
        description: SLOs in warning/failure, worst error budget first.
      - sql: "SELECT name, value, target, related_open_problems FROM dynatrace_slos WHERE text = 'checkout'"
        description: SLOs of one service.
      - sql: >-
          SELECT name, status, value, target, error_budget, eval_timeframe FROM dynatrace_slos
          WHERE eval_timeframe = 'WINDOW' AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY error_budget
        description: SLO attainment during the incident hour only (timeFrame=GTF).
    fixtures:
      - file: slos_reference.json
        note: "Verbatim SLOs JSON model from the official docs page."
        filters: {eval_timeframe: CURRENT}
        expect_rows: 1
        expect_columns: {name: Payment service availability, status: WARNING, value: 96.25, target: 95.0, burn_rate_type: SLOW, calc_error: NONE, has_more: true, eval_timeframe: CURRENT, timeframe: "-1d"}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/service-level-objectives-classic/get-all

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_audit_logs
    title: Audit log (who changed which configuration)
    description: >-
      Audit log entries in the window, newest first: configuration CREATE/UPDATE/DELETE with the
      JSON patch (old and new values), tag changes, token operations and logins, with the user.
      Filter on event_type, category (CONFIG for settings changes), author, entity_id, schema_id.
    kind: changes
    request:
      method: GET
      path: /api/v2/auditlogs
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        pageSize: 5000
        sort: "-timestamp"
        filter: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{%- set s -%}{% if filters.event_type %},eventType({{ ql(filters.event_type | as_list | map('upper') | list) }}){% endif %}{% if filters.category %},category({{ ql(filters.category | as_list | map('upper') | list) }}){% endif %}{% if filters.author %},user({{ ql(filters.author) }}){% endif %}{% if filters.entity_id %},entityId({{ q(filters.entity_id | replace('%', '')) }}){% endif %}{% if filters.schema_id %},dt.settings.schema_id({{ ql(filters.schema_id) }}){% endif %}{%- endset -%}{{ s[1:] }}
    filters:
      - {column: event_type, ops: ["=", "in"], fan_out: false, description: "CREATE, UPDATE, DELETE, TAG_ADD, TAG_REMOVE, TAG_UPDATE, LOGIN, LOGOUT, REVOKE, REORDER", examples: [UPDATE]}
      - {column: category, ops: ["=", "in"], fan_out: false, description: "CONFIG, WEB_UI, TOKEN, MANUAL_TAGGING_SERVICE, ACTIVEGATE_TOKEN, BUILD_UNIT_V2, TENANT_LIFECYCLE", examples: [CONFIG]}
      - {column: author, ops: ["=", "in"], fan_out: false, description: "User id (e-mail, token id or service name)"}
      - {column: entity_id, ops: ["=", "like"], description: "Affected config/entity id (CONTAINS match)", examples: ['%SERVICE-5D53A2A6A1F2C3B4%']}
      - {column: schema_id, description: "Settings schema id, e.g. builtin:anomaly-detection.metric-events", examples: ['builtin:anomaly-detection.metric-events']}
    time: {column: ts, default_lookback: 24h, max_window: 365d}
    response:
      rows_path: "$.auditLogs[*]"
    columns:
      - {name: id, path: logId}
      - {name: ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms}
      - {name: event_type, path: eventType}
      - {name: category, path: category}
      - {name: entity_id, path: entityId}
      - {name: author, path: user}
      - {name: author_type, path: userType}
      - {name: origin, path: userOrigin}
      - {name: success, type: BOOLEAN, path: success}
      - {name: message, path: message}
      - {name: patch, type: JSON, path: patch, description: "RFC 6902 patch with oldValue: what changed"}
      - {name: schema_id, path: "['dt.settings.schema_id']"}
      - {name: scope_id, path: "['dt.settings.scope_id']"}
      - {name: scope_name, path: "['dt.settings.scope_name']"}
      - {name: object_summary, path: "['dt.settings.object_summary']"}
      - {name: settings_key, path: "['dt.settings.key']"}
      - {name: environment_id, path: environmentId}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')"}
    sort_hint: "Newest first."
    pitfalls:
      - "Needs the auditLogs.read scope AND audit logging enabled in the environment settings; otherwise the result is empty or 403."
      - "Logins dominate volume: filter category = 'CONFIG' (settings) for change correlation."
    examples:
      - sql: >-
          SELECT ts, author, event_type, schema_id, scope_name, object_summary, patch
          FROM dynatrace_audit_logs WHERE category = 'CONFIG' AND event_type IN ('CREATE', 'UPDATE', 'DELETE')
          ORDER BY ts DESC
        description: Configuration changes (who/what/old->new) before the incident.
    fixtures:
      - file: audit_logs_example.json
        note: "Verbatim example response (filter=eventType(LOGIN)) from the official docs page."
        filters: {event_type: LOGIN}
        expect_rows: 3
        expect_columns: {id: "157607341600050000", event_type: LOGIN, category: WEB_UI, ts: "2019-12-11T14:10:15Z", has_more: true}
      - file: audit_logs_reference.json
        note: "Verbatim AuditLog JSON model from the official docs page (CONFIG update with patch)."
        expect_rows: 1
        expect_columns: {event_type: UPDATE, category: CONFIG, author: test.user@company.com, success: true}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/audit-logs/get-log

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_releases
    title: Releases (versions running per component and stage)
    description: >-
      Releases observed in the window: one row per (component, product, stage, version) with
      instances, problem count, throughput and health. Filter on name (contains), version, stage,
      product, health_state. Use to see which version was running when, and whether a new version
      appeared around the incident.
    kind: changes
    request:
      method: GET
      path: /api/v2/releases
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        pageSize: 1000
        releasesSelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- set s -%}{% if filters.releases_selector %},{{ filters.releases_selector }}{% endif %}{% if filters.name %},entityName({{ q(filters.name | replace('%', '')) }}){% endif %}{% if filters.version %},releasesVersion({{ q(filters.version | replace('%', '')) }}){% endif %}{% if filters.stage %},releasesStage({{ q(filters.stage | replace('%', '')) }}){% endif %}{% if filters.product %},releasesProduct({{ q(filters.product | replace('%', '')) }}){% endif %}{% if filters.health_state %},healthState({{ q(filters.health_state | upper) }}){% endif %}{%- endset -%}{{ s[1:] }}
    filters:
      - {column: name, ops: ["=", "like"], description: "Component name (contains, case-insensitive)", examples: [checkout]}
      - {column: version, ops: ["=", "like"], description: "Version (contains)"}
      - {column: stage, ops: ["=", "like"], description: "Release stage (contains), e.g. production", examples: [production]}
      - {column: product, ops: ["=", "like"], description: "Product (contains)"}
      - {column: health_state, description: "HEALTHY | UNHEALTHY"}
      - {column: releases_selector, description: "Raw releases selector"}
    time: {column: ts, default_lookback: 24h, max_window: 365d}
    response:
      rows_path: "$.releases[*]"
    columns:
      - {name: name, path: name, description: "Component (service / process group) name"}
      - {name: product, path: product}
      - {name: stage, path: stage}
      - {name: version, path: version}
      - {name: release_entity_id, path: releaseEntityId}
      - {name: running, type: BOOLEAN, path: running}
      - {name: affected_by_problems, type: BOOLEAN, path: affectedByProblems}
      - {name: problem_count, type: BIGINT, path: problemCount}
      - {name: throughput, type: DOUBLE, path: throughput, description: "Bytes per second"}
      - {name: instances, type: JSON, path: instances}
      - {name: instance_count, type: BIGINT, path: instances, transform: length}
      - {name: software_techs, type: JSON, path: softwareTechs}
      - {name: vulnerabilities, type: BIGINT, path: securityVulnerabilitiesCount}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')"}
      - {name: health_state, filter_only: true}
      - {name: releases_selector, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Versions come from release-detection (DT_RELEASE_VERSION/STAGE/PRODUCT env vars or k8s labels); components without them have no version."
      - "Name/version/stage/product filters are CONTAINS matches."
    examples:
      - sql: "SELECT name, stage, version, running, problem_count, instance_count FROM dynatrace_releases WHERE name LIKE '%checkout%' ORDER BY stage, version"
        description: Versions of a component per stage, and whether the new one has problems.
    fixtures:
      - file: releases_reference.json
        note: "Verbatim Releases JSON model from the official docs page."
        expect_rows: 1
        expect_columns: {name: cluster, product: Sockshop, stage: staging, version: "1.195.34.12341232423-012342", instance_count: 2, problem_count: 4, has_more: true}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/releaseapi/get-releaseall

roles:
  metrics:
    table: dynatrace_metrics
    query_language: dynatrace_metric_selector
    columns: {query: metric_selector, ts: ts, value: value, labels: dimensions, metric: metric}
  active_alerts:
    table: dynatrace_problems
    filters: {status: OPEN}
    columns: {id: id, ts: ts, title: title, state: status, severity: severity, service: service, labels: tags}
  alert_history:
    table: dynatrace_problems
    columns: {id: id, ts: ts, title: title, state: status, severity: severity, service: service}
  incidents:
    table: dynatrace_problems
    columns: {id: id, ts: ts, title: title, state: status, severity: severity, service: service}
  logs:
    table: dynatrace_logs
    filters:
      level: "{{ 'ERROR' if error_only else '' }}"
      host: "{{ host or '' }}"
      query: "{{ query or '' }}"
    columns: {ts: ts, message: message, level: level, host: host, service: service, trace_id: trace_id}
    query_language: dynatrace_log_search
    notes: "Classic logs rarely carry a service attribute; scope with host, k8s namespace or content. Prefer the dynatrace_grail logs role on Grail environments."
  log_counts:
    table: dynatrace_log_counts
    filters: {level: "{{ 'ERROR' if error_only else '' }}", group_by: "log.source"}
    columns: {ts: ts, value: value, group: group_value}
  services:
    table: dynatrace_entities
    filters: {type: SERVICE}
    columns: {id: entity_id, service: name, tags: tags}
  hosts:
    table: dynatrace_entities
    filters: {type: HOST}
    columns: {id: entity_id, host: name, tags: tags}
  service_map:
    table: dynatrace_relationships_out
    filters: {from_type: SERVICE, relationship: calls}
    columns: {source_id: from_id, source: from_name, target_id: to_id}
    notes: "Join dynatrace_entities on to_id for callee names; callers of a service: dynatrace_relationships_in."
  change_events:
    - table: dynatrace_events
      filters: {event_type: CUSTOM_DEPLOYMENT}
      columns: {ts: ts, service: service, title: title, version: version, url: ci_link}
    - table: dynatrace_events
      filters: {event_type: CUSTOM_CONFIGURATION}
      columns: {ts: ts, service: service, title: title}
    - table: dynatrace_audit_logs
      filters: {category: CONFIG}
      columns: {ts: ts, author: author, title: object_summary}
    - table: dynatrace_releases
      columns: {service: name, version: version, env: stage}
  slo:
    table: dynatrace_slos
    columns: {id: id, title: name, state: status, value: value}
