# Dynatrace Environment API v2 ("classic" API, Api-Token auth).
# Research notes, doc URLs and pitfalls: docs/sources/dynatrace.md
# Grail / DQL (platform API, platform token) lives in a separate source: dynatrace_grail.yaml
#
# Global pagination note (engine gap, see docs/sources/dynatrace.md): Dynatrace rejects follow-up
# pages that repeat any query parameter next to nextPageKey ("must not be used in combination with
# nextPageKey"), and the engine's cursor pagination keeps the first request's parameters. Every
# nextPageKey table therefore asks for ONE maximum-size page and exposes `has_more` so truncation is
# visible. Log search uses nextSliceKey, which the API documents as "all other parameters are
# ignored", so it paginates normally.
source: dynatrace
display_name: Dynatrace (Environment API v2)
vendor: Dynatrace LLC
description: >-
  Dynatrace Environment API v2: metric queries (metric selector), metric descriptors, monitored
  entities and Smartscape relationships, Davis problems (root cause, evidence, impact, comments),
  events (deployments, config changes, restarts), classic log search/aggregation, SLOs, audit log
  and releases.
docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api
categories: [metrics, logs, alerts, incidents, events, changes, topology, slo]
base_url: "{{ env.DT_ENV_URL }}"
env:
  - name: DT_ENV_URL
    description: >-
      Environment API base URL WITHOUT /api/v2. SaaS: https://{env-id}.live.dynatrace.com
      (NOT the *.apps.dynatrace.com platform URL); Managed: https://{domain}/e/{env-id};
      Environment ActiveGate: https://{activegate}:9999/e/{env-id}
  - name: DT_API_TOKEN
    description: >-
      Classic access token (dt0c01.*) sent as "Authorization: Api-Token <token>". Read scopes used:
      metrics.read, entities.read, problems.read, events.read, logs.read, slo.read, auditLogs.read,
      releases.read
    secret: true
required_env: [DT_ENV_URL, DT_API_TOKEN]
auth:
  type: headers
  headers:
    Authorization: "Api-Token {{ env.DT_API_TOKEN }}"
headers:
  Accept: application/json
rate_limit:
  concurrency: 4
  notes: >-
    No fixed per-minute quota for reads: every environment has a bounded request thread pool +
    queue (10 s queue timeout); when both are full the API returns HTTP 429. Expensive calls
    (relationship fields, wide entity selectors, many-metric selectors) hit it first.
retention:
  metrics: 5y (Metrics Classic; resolution coarsens with age)
  logs: 35d (Log Monitoring Classic)
  problems_events: 1-3y (Davis problems and events)
  traces: 10d
errors:
  - path: "$.error.message"
    non_empty: true
    message: "$.error"
    hint: "Dynatrace ErrorEnvelope in a 2xx body: read constraintViolations, fix the selector or parameter"
ui_base_url: "{{ env.DT_ENV_URL }}"
pitfalls:
  - "Timestamps in this API are UTC epoch MILLISECONDS (from/to, startTime, timestamps[]). The engine sends epoch ms; never pass seconds."
  - "Selectors are case-sensitive except entityName.* (case-insensitive) and problem/SLO text(). Status-like values come back UPPERCASE (OPEN, CLOSED, ERROR): compare in SQL with upper-case literals."
  - "An unknown metric dimension key, entity type or tag does NOT fail: it returns empty data (metrics add a `warnings` entry). Discover first: dynatrace_metric_descriptors (dimension keys), dynatrace_entity_types (types, properties, relationships), dynatrace_entities (names/ids)."
  - "Single-page tables: Dynatrace forbids repeating parameters next to nextPageKey, so each nextPageKey table fetches one max-size page. If `has_more` is true, narrow the selector or time window instead of trusting totals."
  - "Entity ids (SERVICE-..., HOST-..., PROCESS_GROUP_INSTANCE-...) are the join keys between tables; names are not unique."
  - "Selector values are double-quoted with ~ as the escape character (~\" and ~~); the tables escape filter values for you. Raw *_selector filters are passed through verbatim, so escape them yourself."
  - "builtin:service.response.time is in MICROseconds; divide by 1000 for ms."
  - "This is the Classic API. Environments on 'latest Dynatrace' (Grail + Smartscape) should prefer the dynatrace_grail source (DQL); Metrics API v2 is not supported there."
query_languages:
  dynatrace_metric_selector: >-
    Metric selector: metric key followed by ':'-chained transformations, max 10 metrics per query.
    builtin:service.response.time:filter(eq("dt.entity.service","SERVICE-5D53A2A6A1F2C3B4")):splitBy("dt.entity.service"):avg:names
    Common: :splitBy("dim",...) (group; :splitBy() = total), :filter(eq("dim","v")|in("dim",entitySelector("type(SERVICE),tag(\"env:prod\")"))|prefix("dim","v")|and(..)|or(..)|not(..)),
    aggregation :avg :min :max :sum :count :median :percentile(95) :value, :fold(avg) (one value
    per series), :sort(value(avg,descending)):limit(10) (top-N), :rate(1m), :default(0), :names (adds
    "<dim>.name" to dimensions). Group several keys: builtin:host.cpu.(usage,idle). Keys with symbols
    are double-quoted with ~ escapes. Key metrics: builtin:service.response.time (µs),
    builtin:service.errors.total.rate (%), builtin:service.errors.fivexx.count,
    builtin:service.requestCount.total, builtin:host.cpu.usage (%), builtin:host.mem.usage (%),
    builtin:host.disk.usedPct, builtin:tech.generic.cpu.usage, builtin:kubernetes.container.restarts,
    builtin:kubernetes.container.oom_kills.
  dynatrace_entity_selector: >-
    Entity selector: exactly one of type("SERVICE") | entityId("SERVICE-1","SERVICE-2") (same type),
    plus comma-separated (AND) criteria: entityName("contains") entityName.startsWith("x")
    entityName.equals("x") entityName.in("a","b") (names case-insensitive), tag("[context]key:value")
    mzName("zone") mzId(123) healthState("UNHEALTHY") <property>("v") <property>.exists()
    fromRelationships.calls(type(SERVICE),entityName("db")) toRelationships.runsOn(...) not(...).
    Quote values containing ( ) or ,. Max 2,000 chars. Types: SERVICE, HOST, PROCESS_GROUP,
    PROCESS_GROUP_INSTANCE, APPLICATION, KUBERNETES_CLUSTER, CLOUD_APPLICATION (k8s workload),
    CLOUD_APPLICATION_NAMESPACE, SYNTHETIC_TEST, HTTP_CHECK, DISK.
  dynatrace_log_search: >-
    Classic log search language (Log Monitoring Classic): attribute="value" pairs joined with AND /
    OR and parentheses; bare words search content (spaces = AND); "a phrase" searches content;
    attr!="v"; trailing wildcard only (host.name="web-*"); attribute names case-sensitive, values
    case-insensitive; max 20 relations. Examples: status="ERROR" AND log.source="/var/log/app.log";
    content="timeout" AND host.name="ip-10-0-1-17*"; k8s.namespace.name="shop" AND status="WARN".
  dynatrace_problem_selector: >-
    Problem selector (comma = AND, values inside one criterion = OR, all values quoted):
    status("open"|"closed") severityLevel("ERROR","AVAILABILITY","PERFORMANCE","RESOURCE_CONTENTION","CUSTOM_ALERT","MONITORING_UNAVAILABLE","INFO")
    impactLevel("SERVICES","APPLICATION","INFRASTRUCTURE","ENVIRONMENT") rootCauseEntity("id")
    affectedEntities("id") impactedEntities("id") affectedEntityTypes("SERVICE") problemId("id")
    displayId("P-123") managementZones("name") entityTags("key:value") underMaintenance(false)
    text("<=30 chars"). Escape ~ and " with ~.
  dynatrace_event_selector: >-
    Event selector: eventType("CUSTOM_DEPLOYMENT") (ONE type per query) status("OPEN"|"CLOSED")
    entityId("id-1","id-2") eventId("id") correlationId("id") managementZoneId("123")
    underMaintenance(true) suppressAlert(true) suppressProblem(true) frequentEvent(true)
    property.<key>("v") (filterable properties only). Comma = AND.
tables:
  # ------------------------------------------------------------------------------------------
  - name: dynatrace_metrics
    title: Metric data points (metric selector)
    description: >-
      Query metric data points with a Dynatrace metric selector. One row per (metric, series,
      timestamp). Filter on metric_selector (required) and ts; optionally scope with service,
      host, entity_id or a raw entity_selector. Resolution defaults to ~300 points over the window
      (minimum 1m); set resolution = 'Inf' for one value per series. Use for latency/error-rate/
      throughput/CPU curves around an incident.
    kind: timeseries
    request:
      method: GET
      path: /api/v2/metrics/query
      query:
        metricSelector: "{{ filters.metric_selector }}"
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        resolution: "{{ filters.resolution or ((([time.step_s, 60] | max) // 60) ~ 'm') }}"
        entitySelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{% if filters.entity_selector %}{{ filters.entity_selector }}{% elif filters.entity_id %}entityId({{ ql(filters.entity_id) }}){% elif filters.service %}type("SERVICE"),entityName.equals({{ q(filters.service) }}){% elif filters.host %}type("HOST"),entityName.equals({{ q(filters.host) }}){% endif %}
        mzSelector: "{{ filters.mz_selector }}"
    filters:
      - column: metric_selector
        required: true
        description: "Metric selector (metric key + transformations), max 10 metric keys"
        examples: ['builtin:service.response.time:splitBy("dt.entity.service"):avg:names']
      - column: resolution
        description: "Resolution: '5m', '1h', 'Inf' (one value per series) or a point count like '120'. Default: ~300 points, >= 1m"
        examples: ['5m']
      - column: entity_selector
        description: "Raw entity selector scoping the primary entity, e.g. type(SERVICE),tag(\"env:prod\")"
        examples: ['type("SERVICE"),tag("env:prod")']
      - column: entity_id
        ops: ["=", "in"]
        fan_out: false
        description: "Primary entity id(s), all of one type (SERVICE-..., HOST-...)"
        examples: ['SERVICE-5D53A2A6A1F2C3B4']
      - column: service
        description: "Service display name (entityName.equals, case-insensitive); only for builtin:service.* style metrics"
        examples: ['checkout-service']
      - column: host
        variants: hostname
        description: "Host display name (entityName.equals); only for host-level metrics"
        examples: ['ip-10-0-1-17.eu-west-1.compute.internal']
      - column: mz_selector
        description: "Management-zone scope, e.g. mzName(\"shop-prod\")"
    time: {column: ts, default_lookback: 1h, max_window: 30d, retention: 1825d}
    response:
      rows_path: "$.result[*]"
      expand:
        - {explode: "data", as: s, keep_empty: true}
        - {zip: {t: "@s.timestamps", v: "@s.values"}, as: p, keep_empty: true}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p.t", transform: epoch_ms, description: "Slot END timestamp (UTC); NULL on a placeholder row for a metric that returned no series"}
      - {name: value, type: DOUBLE, path: "@p.v", description: "Data point value (null = no data in slot); unit as in dynatrace_metric_descriptors"}
      - {name: metric, path: metricId, description: "Metric key as resolved, including transformations"}
      - {name: dimensions, type: JSON, path: "@s.dimensionMap", description: "Series dimensions, e.g. dimensions->>'dt.entity.service'; with :names also dimensions->>'dt.entity.service.name'"}
      - {name: entity_id, path: "@s.dimensions[0]", description: "Value of dimension index 0 (the primary entity id for builtin metrics)"}
      - {name: series_warnings, type: JSON, path: warnings, description: "Per-metric warnings, e.g. unknown dimension key (explains empty data)"}
      - {name: warnings, type: JSON, path: "$.warnings", description: "Query-level warnings"}
      - {name: resolution_used, path: "$.resolution", description: "Resolution actually used by Dynatrace"}
      - {name: resolution, filter_only: true, description: "Requested resolution"}
      - {name: metric_selector, filter_only: true}
      - {name: entity_selector, filter_only: true}
      - {name: service, filter_only: true, description: "Service name filter (filled from the filter)"}
      - {name: host, filter_only: true, description: "Host name filter (filled from the filter)"}
      - {name: mz_selector, filter_only: true}
    sort_hint: "Rows are grouped per metric and series, timestamps ascending within a series."
    pitfalls:
      - "A metric whose selector matches nothing yields ONE placeholder row with NULL ts/value and the reason in series_warnings/warnings; a ts predicate in SQL removes that row, so check warnings when you get 0 rows."
      - "Timestamps are slot END times; values are per-slot aggregates (default aggregation unless you append :avg/:max/:percentile(..))."
      - "Count metrics (requestCount, errors.*.count) are per slot: SUM them over the window, do not AVG; rates (errors.total.rate) are percentages."
      - "Without :splitBy() the metric is split by all its default dimensions; use :splitBy() for one total series or :splitBy(\"dt.entity.service\") per service."
      - "Max 10 metrics per selector, 100,000 series and 10,080 points per series per query; prefer :fold or :sort(...):limit(N) for top-N questions."
      - "service/host filters translate to entitySelector type(SERVICE|HOST),entityName.equals(...): they only work when the metric's primary entity is that type."
    examples:
      - sql: >-
          SELECT dimensions->>'dt.entity.service.name' AS service, max(value) / 1000 AS peak_ms, arg_max(ts, value) AS peak_at
          FROM dynatrace_metrics
          WHERE metric_selector = 'builtin:service.response.time:splitBy("dt.entity.service"):percentile(95):names:sort(value(max,descending)):limit(10)'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY 1 ORDER BY peak_ms DESC
        description: Top-10 services by p95 latency in the incident hour, with when each peaked.
      - sql: >-
          SELECT ts, value AS failure_rate_pct FROM dynatrace_metrics
          WHERE metric_selector = 'builtin:service.errors.total.rate:splitBy():avg' AND service = 'checkout-service'
          ORDER BY ts
        description: Failure-rate curve of one service by name over the analysis window.
      - sql: >-
          SELECT entity_id, value FROM dynatrace_metrics
          WHERE metric_selector = 'builtin:host.cpu.usage:splitBy("dt.entity.host"):max:fold(max)' AND resolution = 'Inf'
          ORDER BY value DESC LIMIT 5
        description: Hosts with the highest CPU peak in the window (one value per host).
    tests:
      - {sql: "SELECT count(*) AS n FROM dynatrace_metrics WHERE metric_selector = 'builtin:host.cpu.usage:splitBy():avg'", min_rows: 1}
    fixtures:
      - file: metrics_query_cpu.json
        note: "Verbatim example response of GET /api/v2/metrics/query (builtin:host.cpu.(usage,idle), 2 hosts) from the official docs page."
        filters: {metric_selector: "builtin:host.cpu.(usage,idle)"}
        expect_rows: 12
        expect_columns: {ts: "2020-05-14T11:35:00Z", value: 81.0, metric: "builtin:host.cpu.idle", entity_id: "HOST-0990886B7D39FE29"}
      - file: metrics_query_fold.json
        note: "Verbatim :fold example response from the official docs page (one data point per series)."
        filters: {metric_selector: "builtin:host.cpu.(usage,idle):fold"}
        expect_rows: 4
        expect_columns: {ts: "2020-05-14T11:22:00Z", value: 79.0, resolution_used: "1m"}
      - file: metrics_query_reference.json
        note: "Verbatim 'Response body JSON model' from the official docs page: second metric has empty data + a warning (exercises the placeholder row)."
        filters: {metric_selector: "builtin:host.disk.avail,builtin:host.cpu.idle"}
        expect_rows: 7
        expect_columns: {metric: "builtin:host.disk.avail", value: 11.1, entity_id: "HOST-F1266E1D0AAC2C3C"}
      - file: error_envelope.json
        note: "Verbatim ErrorEnvelope JSON model from the official docs (shared by every Environment API v2 endpoint); proves the source-level 2xx error rule fires instead of returning 0 rows."
        filters: {metric_selector: "builtin:host.cpu.usage"}
        expect_error: constraintViolations
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/metric-v2/get-data-points
    ui_link: "{{ source.base_url }}/ui/data-explorer"

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_metric_descriptors
    title: Metric descriptors (catalog)
    description: >-
      Metric catalog: one row per metric with unit, dimension keys, entity types, default
      aggregation and last-written time. Filter on metric (exact key, comma list, or LIKE prefix
      'builtin:service.%') or text (free-text search over key/name/description). Use BEFORE
      dynatrace_metrics to get dimension keys and units right.
    kind: entities
    request:
      method: GET
      path: /api/v2/metrics
      query:
        metricSelector: "{{ filters.metric | as_list | join(',') | replace('%', '*') if filters.metric else None }}"
        text: "{{ filters.text }}"
        writtenSince: "{{ filters.written_since }}"
        metadataSelector: "{{ filters.metadata_selector }}"
        fields: "+aggregationTypes,+defaultAggregation,+dimensionDefinitions,+entityType,+lastWritten,+created,+metricValueType,+rootCauseRelevant,+impactRelevant,+tags,+transformations,+latency,+resolutionInfSupported"
        pageSize: 500
    filters:
      - column: metric
        ops: ["=", "in", "like"]
        fan_out: false
        description: "Metric key(s); LIKE 'builtin:service.%' becomes the selector wildcard builtin:service.*"
        examples: ['builtin:service.%']
      - column: text
        description: "Free-text search over key, display name and description"
        examples: ['response time']
      - column: written_since
        description: "Only metrics with data since this time (epoch ms or now-2h)"
        examples: ['now-2h']
      - column: metadata_selector
        description: "e.g. unit(\"MicroSecond\"),dimensionKey(\"dt.entity.service\")"
    response:
      rows_path: "$.metrics[*]"
    columns:
      - {name: metric, path: metricId}
      - {name: display_name, path: displayName}
      - {name: description, path: description}
      - {name: unit, path: unit, description: "Unit, e.g. MicroSecond, Percent, Count, Byte"}
      - {name: entity_types, type: JSON, path: entityType, description: "Primary entity types usable in entitySelector type(...)"}
      - {name: dimension_keys, expr: "(_.dimensionDefinitions | map(attribute='key') | join(',')) if _.dimensionDefinitions else none", description: "Comma-separated dimension keys for :splitBy/:filter"}
      - {name: dimensions, type: JSON, path: dimensionDefinitions}
      - {name: aggregation_types, type: JSON, path: aggregationTypes}
      - {name: default_aggregation, path: "defaultAggregation.type"}
      - {name: transformations, type: JSON, path: transformations}
      - {name: last_written, type: TIMESTAMP, path: lastWritten, transform: epoch_ms, description: "Last time data was written (NULL for metric expressions)"}
      - {name: created, type: TIMESTAMP, path: created, transform: epoch_ms}
      - {name: metric_value_type, path: "metricValueType.type", description: "error | score | unknown"}
      - {name: root_cause_relevant, type: BOOLEAN, path: rootCauseRelevant}
      - {name: impact_relevant, type: BOOLEAN, path: impactRelevant}
      - {name: latency_min, type: BIGINT, path: latency, description: "Expected reporting delay in minutes"}
      - {name: tags, type: JSON, path: tags}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')", description: "True when more metrics exist beyond this single 500-row page: narrow the filter"}
      - {name: text, filter_only: true}
      - {name: written_since, filter_only: true}
      - {name: metadata_selector, filter_only: true}
    pitfalls:
      - "Without metric/text this lists the first 500 of thousands of metrics: always filter."
      - "lastWritten NULL or old means the metric has no recent data in this environment; pick another key."
    examples:
      - sql: "SELECT metric, unit, dimension_keys, default_aggregation FROM dynatrace_metric_descriptors WHERE metric LIKE 'builtin:service.errors.%'"
        description: Which service error metrics exist, their units and splittable dimensions.
      - sql: "SELECT metric, display_name, unit, last_written FROM dynatrace_metric_descriptors WHERE text = 'kafka' ORDER BY last_written DESC"
        description: Find custom/extension metrics by keyword and check they are still reported.
    fixtures:
      - file: metric_descriptors_reference.json
        note: "Verbatim MetricDescriptorCollection JSON model from the official docs page."
        filters: {metric: "builtin:host.cpu.user"}
        expect_rows: 2
        expect_columns: {metric: 'builtin:host.cpu.user:splitBy("dt.entity.host"):max:fold', unit: Percent, dimension_keys: dt.entity.host, default_aggregation: value, last_written: "2020-08-14T10:25:17Z", has_more: true}
      - file: metric_descriptors_example.json
        note: "Verbatim example response (fields=unit,aggregationTypes, metricSelector=builtin:*) from the official docs page."
        filters: {metric: "builtin:%"}
        expect_rows: 4
        expect_columns: {metric: builtin:host.cpu.idle, unit: Percent}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/metric-v2/get-all-metrics

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_entities
    title: Monitored entities (services, hosts, process groups, ...)
    description: >-
      Monitored entities seen in the time window, one row per entity, with tags, management zones
      and properties. Filter on type (default SERVICE), name (= exact, LIKE 'x%' prefix, LIKE
      '%x%' contains), entity_id, tag, or a raw entity_selector. Use to resolve a service/host name
      to its entity id, check health and tags, or list what exists.
    kind: entities
    request:
      method: GET
      path: /api/v2/entities
      query:
        entitySelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{%- macro names(n) -%}{% if n is string and n %}{% set segs = n.split('%') | select | list %}{% if '%' not in n %},entityName.equals({{ q(n) }}){% elif n.endswith('%') and not n.startswith('%') and segs | length == 1 %},entityName.startsWith({{ q(segs[0]) }}){% elif segs %},entityName({{ q(segs | first) }}){% endif %}{% elif n %},entityName.in({{ ql(n) }}){% endif %}{%- endmacro -%}{% if filters.entity_selector %}{{ filters.entity_selector }}{% else %}{% if filters.entity_id %}entityId({{ ql(filters.entity_id) }}){% else %}type({{ q(filters.type or 'SERVICE') }}){% endif %}{{ names(filters.name) }}{% if filters.tag %},tag({{ ql(filters.tag) }}){% endif %}{% if filters.health_state %},healthState({{ q(filters.health_state | upper) }}){% endif %}{% if filters.management_zone %},mzName({{ q(filters.management_zone) }}){% endif %}{% endif %}
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        fields: "{{ filters.fields or '+lastSeenTms,+firstSeenTms,+tags,+managementZones,+properties' }}"
        pageSize: 500
        sort: name
    filters:
      - column: type
        description: "Entity type: SERVICE (default), HOST, PROCESS_GROUP, PROCESS_GROUP_INSTANCE, APPLICATION, KUBERNETES_CLUSTER, CLOUD_APPLICATION, CLOUD_APPLICATION_NAMESPACE, SYNTHETIC_TEST, ..."
        examples: [SERVICE]
      - column: name
        ops: ["=", "in", "like"]
        fan_out: false
        description: "Display name: = (case-insensitive equals), IN, LIKE 'x%' (starts with) or LIKE '%x%' (contains)"
        examples: ['checkout%']
      - column: entity_id
        ops: ["=", "in"]
        fan_out: false
        description: "Entity id(s) of one type"
        examples: ['SERVICE-5D53A2A6A1F2C3B4']
      - column: tag
        description: "Tag in [context]key:value, key:value or value form (escape ':' inside values with a backslash)"
        examples: ['env:prod']
      - column: health_state
        description: "HEALTHY | UNHEALTHY (has open problems)"
        examples: [UNHEALTHY]
      - column: management_zone
        description: "Management zone name (exact)"
      - column: entity_selector
        description: "Raw entity selector; overrides all other entity filters"
        examples: ['type("SERVICE"),fromRelationships.runsOnHost(type("HOST"),entityName("ip-10-0-1-17"))']
      - column: fields
        description: "Override fields (default +lastSeenTms,+firstSeenTms,+tags,+managementZones,+properties)"
    time: {column: ts, default_lookback: 72h, max_window: 400d}
    response:
      rows_path: "$.entities[*]"
    columns:
      - {name: entity_id, path: entityId}
      - {name: name, path: displayName}
      - {name: type, expr: "_.type or (_.entityId.split('-')[0] if _.entityId else none)", description: "Entity type (from the id prefix when not returned)"}
      - {name: first_seen, type: TIMESTAMP, path: firstSeenTms, transform: epoch_ms}
      - {name: last_seen, type: TIMESTAMP, path: lastSeenTms, transform: epoch_ms}
      - {name: tags, type: JSON, path: tags, description: "Tag objects {context,key,value,stringRepresentation}"}
      - {name: tag_list, expr: "(_.tags | map(attribute='stringRepresentation') | join(', ')) if _.tags else none", description: "Tags as text, e.g. 'env:prod, [KUBERNETES]app:checkout'"}
      - {name: management_zones, expr: "(_.managementZones | map(attribute='name') | join(', ')) if _.managementZones else none"}
      - {name: properties, type: JSON, path: properties, description: "Type-specific properties, e.g. properties->>'serviceType', properties->>'osType'"}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')", description: "More than 500 matches: narrow the selector"}
      - {name: health_state, filter_only: true}
      - {name: tag, filter_only: true}
      - {name: management_zone, filter_only: true}
      - {name: entity_selector, filter_only: true}
      - {name: fields, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true, description: "Observation window (entities seen between start and end)"}
    sort_hint: "Sorted by display name."
    pitfalls:
      - "Only entities seen in the time window are returned (API default would be 3 days); widen the window for rarely active entities."
      - "Names are not unique (e.g. one service name per process group); join other tables on entity_id."
      - "LIKE '%x%' is pushed down as entityName(\"x\") (contains); LIKE 'x%' as entityName.startsWith; other LIKE shapes are filtered locally."
      - "SERVICE_METHOD entities include only key requests, top baselined requests and requests that caused problems."
    examples:
      - sql: "SELECT entity_id, name, last_seen, tag_list FROM dynatrace_entities WHERE type = 'SERVICE' AND name LIKE '%checkout%'"
        description: Resolve a service name to its entity id(s).
      - sql: "SELECT entity_id, name, properties->>'osType' AS os, tag_list FROM dynatrace_entities WHERE type = 'HOST' AND health_state = 'UNHEALTHY'"
        description: Hosts that currently have open problems.
    tests:
      - {sql: "SELECT entity_id, name FROM dynatrace_entities WHERE type = 'SERVICE' LIMIT 5", min_rows: 1}
    fixtures:
      - file: entities_services.json
        note: "Verbatim example response (type(SERVICE) in a management zone, fields=lastSeenTms,properties.serviceTechnologyTypes) from the official docs page."
        filters: {type: SERVICE}
        expect_rows: 3
        expect_columns: {entity_id: SERVICE-1125C375A187D27A, name: dotNetBackend_easyTravel_x64, type: SERVICE, last_seen: "2020-05-27T20:00:32Z", has_more: true}
      - file: entities_reference.json
        note: "Verbatim EntitiesList JSON model from the official docs page (host with tags, management zone, relationships)."
        filters: {type: HOST}
        expect_rows: 1
        expect_columns: {entity_id: HOST-06F288EE2A930951, name: my host, type: HOST, tag_list: "architecture:x86, [ENVIRONMENT]Infrastructure:Linux", management_zones: main app}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/entity-v2/get-entities-list

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_relationships_out
    title: Topology edges where the selected entities are the FROM side
    description: >-
      Smartscape edges (from_id -[relationship]-> to_id) for entities matching the selector, read
      from fromRelationships. For SERVICE entities: relationship 'calls' = downstream services it
      calls, 'runsOn' = process group, 'runsOnHost' = host, 'runsOnProcessGroupInstance'. Filter on
      type/name/entity_id/entity_selector like dynatrace_entities, and on relationship.
      UNION with dynatrace_relationships_in for the full neighbourhood.
    kind: entities
    request:
      method: GET
      path: /api/v2/entities
      query:
        entitySelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{%- macro names(n) -%}{% if n is string and n %}{% set segs = n.split('%') | select | list %}{% if '%' not in n %},entityName.equals({{ q(n) }}){% elif n.endswith('%') and not n.startswith('%') and segs | length == 1 %},entityName.startsWith({{ q(segs[0]) }}){% elif segs %},entityName({{ q(segs | first) }}){% endif %}{% elif n %},entityName.in({{ ql(n) }}){% endif %}{%- endmacro -%}{% if filters.entity_selector %}{{ filters.entity_selector }}{% else %}{% if filters.from_id %}entityId({{ ql(filters.from_id) }}){% else %}type({{ q(filters.from_type or 'SERVICE') }}){% endif %}{{ names(filters.from_name) }}{% if filters.tag %},tag({{ ql(filters.tag) }}){% endif %}{% endif %}
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        fields: "+fromRelationships"
        pageSize: 500
    filters:
      - {column: from_type, description: "Type of the FROM entities (default SERVICE)", examples: [SERVICE]}
      - {column: from_name, ops: ["=", "in", "like"], fan_out: false, description: "FROM entity display name (= / IN / LIKE)", examples: ['checkout-service']}
      - {column: from_id, ops: ["=", "in"], fan_out: false, description: "FROM entity id(s)", examples: ['SERVICE-5D53A2A6A1F2C3B4']}
      - {column: tag, description: "Tag filter on the FROM entities", examples: ['env:prod']}
      - {column: entity_selector, description: "Raw entity selector for the FROM entities"}
      - {column: relationship, ops: ["=", "in"], fan_out: false, description: "Relationship name, filtered locally (calls, runsOn, runsOnHost, isProcessOf, isInstanceOf, ...)", examples: [calls]}
    time: {column: ts, default_lookback: 72h, max_window: 400d}
    response:
      rows_path: "$.entities[*]"
      expand:
        - {entries: fromRelationships, as: r}
        - {explode: "@r.value", as: e}
    columns:
      - {name: from_id, path: entityId}
      - {name: from_name, path: displayName}
      - {name: from_type, expr: "_.type or (_.entityId.split('-')[0] if _.entityId else none)"}
      - {name: relationship, path: "@r.key"}
      - {name: to_id, path: "@e.id"}
      - {name: to_type, path: "@e.type"}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')"}
      - {name: tag, filter_only: true}
      - {name: entity_selector, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "to_name is not returned: join dynatrace_entities on entity_id = to_id for names."
      - "Requesting relationships for many entities is expensive and may be throttled (HTTP 429): scope the selector."
    examples:
      - sql: "SELECT from_name, to_id FROM dynatrace_relationships_out WHERE from_name = 'checkout-service' AND relationship = 'calls'"
        description: Downstream services called by checkout-service.
      - sql: >-
          SELECT o.from_name AS caller, e.name AS callee
          FROM dynatrace_relationships_out o JOIN dynatrace_entities e ON e.entity_id = o.to_id
          WHERE o.from_type = 'SERVICE' AND o.relationship = 'calls' AND e.type = 'SERVICE'
        description: Whole service call graph with names (service map).
    fixtures:
      - file: entities_single_service.json
        note: "EntitiesList envelope (schema from the GET entities list docs) wrapping the verbatim 'GET an entity' example entity SERVICE-1125C375A187D27A from the official docs."
        filters: {from_type: SERVICE}
        expect_rows: 6
        expect_columns: {from_id: SERVICE-1125C375A187D27A, relationship: calls, to_id: SERVICE-775060208AAA1058, to_type: SERVICE, has_more: false}
      - file: entities_reference.json
        note: "Verbatim EntitiesList JSON model from the official docs page (host isInstanceOf host group)."
        filters: {from_type: HOST}
        expect_rows: 1
        expect_columns: {from_id: HOST-06F288EE2A930951, relationship: isInstanceOf, to_id: HOST_GROUP-0E489369D663A4BF, to_type: HOST_GROUP}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/entity-v2/get-entities-list

  # ------------------------------------------------------------------------------------------
  - name: dynatrace_relationships_in
    title: Topology edges where the selected entities are the TO side
    description: >-
      Smartscape edges (from_id -[relationship]-> to_id) pointing AT the entities matching the
      selector, read from toRelationships. For a SERVICE, relationship 'calls' lists its callers
      (upstream services/applications). Filter on to_type/to_name/to_id/entity_selector and on
      relationship.
    kind: entities
    request:
      method: GET
      path: /api/v2/entities
      query:
        entitySelector: >-
          {%- macro q(v) -%}"{{ v | string | replace('~', '~~') | replace('"', '~"') }}"{%- endmacro -%}{%- macro ql(v) -%}{% for x in v | as_list %}{{ ',' if not loop.first }}{{ q(x) }}{% endfor %}{%- endmacro -%}{%- macro names(n) -%}{% if n is string and n %}{% set segs = n.split('%') | select | list %}{% if '%' not in n %},entityName.equals({{ q(n) }}){% elif n.endswith('%') and not n.startswith('%') and segs | length == 1 %},entityName.startsWith({{ q(segs[0]) }}){% elif segs %},entityName({{ q(segs | first) }}){% endif %}{% elif n %},entityName.in({{ ql(n) }}){% endif %}{%- endmacro -%}{% if filters.entity_selector %}{{ filters.entity_selector }}{% else %}{% if filters.to_id %}entityId({{ ql(filters.to_id) }}){% else %}type({{ q(filters.to_type or 'SERVICE') }}){% endif %}{{ names(filters.to_name) }}{% if filters.tag %},tag({{ ql(filters.tag) }}){% endif %}{% endif %}
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        fields: "+toRelationships"
        pageSize: 500
    filters:
      - {column: to_type, description: "Type of the TO entities (default SERVICE)", examples: [SERVICE]}
      - {column: to_name, ops: ["=", "in", "like"], fan_out: false, description: "TO entity display name", examples: ['payment-service']}
      - {column: to_id, ops: ["=", "in"], fan_out: false, description: "TO entity id(s)", examples: ['SERVICE-9A1B2C3D4E5F6071']}
      - {column: tag, description: "Tag filter on the TO entities"}
      - {column: entity_selector, description: "Raw entity selector for the TO entities"}
      - {column: relationship, ops: ["=", "in"], fan_out: false, description: "Relationship name, filtered locally", examples: [calls]}
    time: {column: ts, default_lookback: 72h, max_window: 400d}
    response:
      rows_path: "$.entities[*]"
      expand:
        - {entries: toRelationships, as: r}
        - {explode: "@r.value", as: e}
    columns:
      - {name: from_id, path: "@e.id"}
      - {name: from_type, path: "@e.type"}
      - {name: relationship, path: "@r.key"}
      - {name: to_id, path: entityId}
      - {name: to_name, path: displayName}
      - {name: to_type, expr: "_.type or (_.entityId.split('-')[0] if _.entityId else none)"}
      - {name: has_more, type: BOOLEAN, expr: "root.nextPageKey is string and root.nextPageKey not in ('', 'null')"}
      - {name: tag, filter_only: true}
      - {name: entity_selector, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT from_id, from_type FROM dynatrace_relationships_in WHERE to_name = 'payment-service' AND relationship = 'calls'"
        description: Who calls payment-service (upstream blast radius).
    fixtures:
      - file: entities_single_service.json
        note: "EntitiesList envelope wrapping the verbatim 'GET an entity' example entity from the official docs (2 callers)."
        filters: {to_type: SERVICE}
        expect_rows: 2
        expect_columns: {from_id: SERVICE-D20E300A0A6814EF, relationship: calls, to_id: SERVICE-1125C375A187D27A, to_name: dotNetBackend_easyTravel_x64}
      - file: entities_reference.json
        note: "Verbatim EntitiesList JSON model from the official docs page (disk isDiskOf host)."
        filters: {to_type: HOST}
        expect_rows: 1
        expect_columns: {from_id: DISK-0393340DCA3853B0, relationship: isDiskOf, to_id: HOST-06F288EE2A930951}
    docs_url: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/entity-v2/get-entities-list

  # ------------------------------------------------------------------------------------------
