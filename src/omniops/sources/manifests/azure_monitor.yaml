  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_alerts
    title: Fired alerts (Alerts Management - Get All)
    description: >-
      Alert instances in the subscription (GET /subscriptions/{id}/providers/Microsoft.AlertsManagement/alerts,
      api-version 2019-03-01): one row per alert with title (alert rule display name), severity (Sev0..Sev4),
      state (monitor condition Fired / Resolved), alert_state (user state New / Acknowledged / Closed), signal type,
      monitor service, target resource, the rule (alert_rule), start / resolve times and a portal url. Pushdown
      filters: state, severity, alert_state, monitor_service, target_resource (full id), target_resource_group,
      target_resource_type, alert_rule (rule ARM id), smart_group_id; include_context = true adds the monitor
      service's payload (search query, threshold, result count, metric values) in context. The ts window becomes
      customTimeRange (max 30 days back).
    kind: alerts
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.AlertsManagement/alerts"
      query:
        api-version: "2019-03-01"
        targetResource: "{{ filters.target_resource }}"
        targetResourceType: "{{ filters.target_resource_type }}"
        targetResourceGroup: "{{ filters.target_resource_group }}"
        monitorService: "{{ filters.monitor_service }}"
        monitorCondition: "{{ filters.state }}"
        severity: "{{ filters.severity }}"
        alertState: "{{ filters.alert_state }}"
        alertRule: "{{ filters.alert_rule }}"
        smartGroupId: "{{ filters.smart_group_id }}"
        includeContext: "{{ 'true' if filters.include_context else None }}"
        pageCount: "{{ 25 if filters.include_context else 250 }}"
        sortBy: startDateTime
        sortOrder: desc
        customTimeRange: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
    filters:
      - {column: state, description: "Monitor condition: Fired | Resolved", examples: ["Fired"]}
      - {column: severity, ops: ["=", "in"], description: "Sev0 (critical) .. Sev4 (verbose); IN fans out", examples: ["Sev1"]}
      - {column: alert_state, ops: ["=", "in"], description: "User state: New | Acknowledged | Closed", examples: ["New"]}
      - {column: monitor_service, ops: ["=", "in"], description: "Platform, Log Analytics, Application Insights, ActivityLog Administrative, ServiceHealth, Resource Health, SmartDetector, VM Insights, ...", examples: ["Platform"]}
      - {column: target_resource, ops: ["=", "in"], description: "Full ARM id of the target resource (compared case-insensitively)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourcegroups/rg-shop-prod/providers/microsoft.web/sites/checkout-api"]}
      - {column: target_resource_group, ops: ["=", "in"], description: "Resource group name of the target (case-insensitive)", examples: ["rg-shop-prod"]}
      - {column: target_resource_type, ops: ["=", "in"], description: "Target resource type, e.g. microsoft.web/sites, virtualmachines, components", examples: ["microsoft.web/sites"]}
      - {column: alert_rule, ops: ["=", "in"], description: "Alert rule ARM id (as in essentials.alertRule)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/microsoft.insights/metricAlerts/checkout-api-5xx"]}
      - {column: smart_group_id, description: "Smart group id (correlated alerts)", examples: ["23d6b2ce-8c54-468f-aff0-sd32aebb7e56"]}
      - {column: include_context, type: BOOLEAN, description: "true adds context (monitor-service payload); pages shrink to 25 alerts", examples: ["true"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    time: {column: ts, default_lookback: 24h, max_window: 30d, retention: 30d, reapply: false, control_lookback: 7d}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 8}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: id, path: id, description: "Full alert id (/subscriptions/.../providers/Microsoft.AlertsManagement/alerts/<guid>)"}
      - {name: alert_id, expr: "(_.id or '').split('/') | last", description: "Alert GUID"}
      - {name: title, path: name, description: "Alert (rule) name"}
      - {name: severity, path: "properties.essentials.severity"}
      - {name: state, path: "properties.essentials.monitorCondition", description: "Fired | Resolved (is the condition still true)"}
      - {name: alert_state, path: "properties.essentials.alertState", description: "New | Acknowledged | Closed (human workflow state)"}
      - {name: ts, type: TIMESTAMP, path: "properties.essentials.startDateTime", transform: auto_time, description: "When the alert fired"}
      - {name: resolved_at, type: TIMESTAMP, path: "properties.essentials.monitorConditionResolvedDateTime", transform: auto_time}
      - {name: last_modified, type: TIMESTAMP, path: "properties.essentials.lastModifiedDateTime", transform: auto_time}
      - {name: last_modified_by, path: "properties.essentials.lastModifiedUserName"}
      - {name: signal_type, path: "properties.essentials.signalType", description: "Metric | Log | Unknown"}
      - {name: monitor_service, path: "properties.essentials.monitorService"}
      - name: target_resource
        expr: "filters.target_resource if (filters.target_resource is string and filters.target_resource | lower == (_.properties.essentials.targetResource or '') | lower) else _.properties.essentials.targetResource"
        description: "Target ARM id (lower-cased by the service)"
      - {name: target_resource_name, path: "properties.essentials.targetResourceName"}
      - name: target_resource_group
        expr: "filters.target_resource_group if (filters.target_resource_group is string and filters.target_resource_group | lower == (_.properties.essentials.targetResourceGroup or '') | lower) else _.properties.essentials.targetResourceGroup"
      - name: target_resource_type
        expr: "filters.target_resource_type if (filters.target_resource_type is string and filters.target_resource_type | lower == (_.properties.essentials.targetResourceType or '') | lower) else _.properties.essentials.targetResourceType"
      - name: alert_rule
        expr: "filters.alert_rule if (filters.alert_rule is string and filters.alert_rule | lower == (_.properties.essentials.alertRule or '') | lower) else _.properties.essentials.alertRule"
        description: "Rule that fired: ARM id for metric / log search / activity log alerts (a portal URL for legacy Log Analytics alerts)"
      - {name: alert_rule_name, expr: "((_.properties.essentials.alertRule or '').split('?')[0].rstrip('/').split('/') | last) or none"}
      - {name: description, path: "properties.essentials.description"}
      - {name: smart_group_id, path: "properties.essentials.smartGroupId"}
      - {name: is_suppressed, type: BOOLEAN, path: "properties.essentials.actionStatus.isSuppressed", description: "Notifications suppressed by an alert processing rule"}
      - {name: context, type: JSON, path: "properties.context", description: "Monitor-service payload (with include_context = true)"}
      - {name: url, expr: "'https://portal.azure.com/#view/Microsoft_Azure_Monitoring_Alerts/AlertDetails.ReactView/alertId~/' ~ ((_.id or '') | urlencode | replace('/', '%2F'))"}
      - {name: include_context, type: BOOLEAN, filter_only: true}
      - {name: subscription_id, filter_only: true}
    max_rows: 2000
    sort_hint: "newest first (sortBy=startDateTime desc)"
    pitfalls:
      - "state (monitorCondition) and alert_state are different things: Fired/Resolved is the signal, New/Acknowledged/Closed is what humans did. 'Currently firing' = state = 'Fired'."
      - "Alerts are kept 30 days; customTimeRange older than that is rejected or empty."
      - "Alerts from rules in other subscriptions (e.g. a central monitoring subscription) are only visible with subscription_id set to that subscription."
      - "Stateless log search alerts fire a new alert instance at every evaluation and never resolve on their own; count instances, not 'still Fired'."
    examples:
      - sql: >-
          SELECT ts, title, severity, target_resource_name, monitor_service, url FROM azure_monitor_alerts
          WHERE state = 'Fired' AND ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC
        description: Alerts firing around the incident (other symptoms of the same outage).
      - sql: >-
          SELECT title, count(*) AS instances, min(ts) AS first_fired, max(resolved_at) AS last_resolved
          FROM azure_monitor_alerts WHERE target_resource_group = 'rg-shop-prod'
          GROUP BY title ORDER BY instances DESC
        description: Which alert rules fired for one resource group, and how often (flapping check).
      - sql: >-
          SELECT ts, title, context FROM azure_monitor_alerts
          WHERE include_context = true AND monitor_service = 'Log Analytics' ORDER BY ts DESC LIMIT 10
        description: Recent log search alerts with their query, threshold and result count.
    fixtures:
      - file: alerts.json
        filters: {include_context: true}
        note: "Verbatim 200 response of the official example 'ListAlerts' (Alerts - Get All, stable 2019-03-01, Alerts_List.json)."
        expect_rows: 2
        expect_columns: {title: cpu alert, severity: Sev3, state: Fired, alert_state: Acknowledged, ts: "2018-09-13T15:51:02Z", monitor_service: Application Insights, alert_id: 66114d64-d9d9-478b-95c9-b789d6502100, is_suppressed: false, context: {not_null: true}, url: {not_null: true}}
    docs_url: https://learn.microsoft.com/en-us/rest/api/alerts-management/alerts/alerts/get-all?view=rest-alerts-management-alerts-2019-03-01

