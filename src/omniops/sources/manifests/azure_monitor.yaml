  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_alert_processing_rules
    title: Alert processing rules (suppression / added action groups)
    description: >-
      Alert processing rules of the subscription (GET /subscriptions/{id}/providers/Microsoft.AlertsManagement/
      actionRules, api-version 2021-08-08): one row per rule with its scopes, conditions (field operator values on
      Severity, MonitorService, MonitorCondition, TargetResource, AlertRuleId, Description, ...), the action
      (RemoveAllActionGroups = notifications suppressed, AddActionGroups = extra notifications), the schedule
      (maintenance windows) and who changed it last. Answers 'why did nobody get paged?' and 'was a suppression or
      maintenance window active during the incident?' (fired alerts show is_suppressed in azure_monitor_alerts).
    kind: entities
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.AlertsManagement/actionRules"
      query:
        api-version: "2021-08-08"
    filters:
      - {column: name, ops: ["=", "in"], fan_out: false, description: "Rule name (case-insensitive, filtered after fetch)", examples: ["DailySuppression"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 10}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: id, path: id}
      - name: name
        expr: "filters.name if (filters.name is string and filters.name | lower == (_.name or '') | lower) else _.name"
      - {name: description, path: "properties.description"}
      - {name: enabled, type: BOOLEAN, path: "properties.enabled"}
      - {name: action_type, path: "properties.actions[*].actionType", transform: join, transform_arg: ", ", description: "RemoveAllActionGroups (suppression) | AddActionGroups"}
      - {name: suppresses, type: BOOLEAN, expr: "'RemoveAllActionGroups' in ((_.properties.actions or []) | map(attribute='actionType') | list)", description: "true when the rule removes all action groups (no notifications) for matching alerts"}
      - {name: action_group_ids, type: JSON, path: "properties.actions[*].actionGroupIds[*]", description: "Action groups added by AddActionGroups"}
      - {name: scopes, type: JSON, path: "properties.scopes", description: "Subscriptions / resource groups / resources the rule applies to"}
      - {name: conditions, type: JSON, path: "properties.conditions", description: "[{field, operator, values}] - all must match"}
      - name: query
        expr: "((_.properties.conditions or []) | map('json') | join(' AND ')) or none"
        description: "All conditions as text ({field, operator, values} AND ...); empty conditions = every alert in scope"
      - {name: schedule, type: JSON, path: "properties.schedule", description: "{effectiveFrom, effectiveUntil, timeZone, recurrences[{recurrenceType, startTime, endTime, daysOfWeek|daysOfMonth}]}; null = always active"}
      - {name: effective_from, path: "properties.schedule.effectiveFrom", description: "Local time in time_zone (no offset), not UTC"}
      - {name: effective_until, path: "properties.schedule.effectiveUntil", description: "Local time in time_zone (no offset), not UTC"}
      - {name: time_zone, path: "properties.schedule.timeZone"}
      - {name: author, path: "systemData.lastModifiedBy", description: "Who last modified the rule"}
      - {name: created_by, path: "systemData.createdBy"}
      - {name: ts, type: TIMESTAMP, path: "systemData.lastModifiedAt", transform: auto_time, description: "Last modification (UTC)"}
      - {name: url, expr: "'https://portal.azure.com/#resource' ~ (_.id or '')"}
      - {name: subscription_id, filter_only: true}
    max_rows: 1000
    pitfalls:
      - "A rule applies only while enabled AND inside its schedule; effective_from / effective_until and recurrences are in the rule's time_zone, not UTC."
      - "Suppression hides notifications, not alerts: the alerts still fire (azure_monitor_alerts.is_suppressed = true)."
      - "Rules can be scoped to another subscription's resources only from that subscription; set subscription_id to look there."
    examples:
      - sql: "SELECT name, enabled, suppresses, scopes, conditions, schedule, author, ts FROM azure_monitor_alert_processing_rules WHERE suppresses ORDER BY ts DESC"
        description: Suppression rules (maintenance windows) that could have silenced the incident's alerts.
      - sql: "SELECT name, action_type, action_group_ids, conditions FROM azure_monitor_alert_processing_rules WHERE enabled AND ts >= TIMESTAMP '2026-09-30 00:00:00'"
        description: Processing rules changed recently.
    fixtures:
      - file: alert_processing_rules.json
        note: "Verbatim 200 response of the official example 'GetAlertProcessingRulesSubscriptionWide' (Alert Processing Rules - List By Subscription, 2021-08-08, AlertProcessingRules_List_Subscription.json)."
        expect_rows: 2
        expect_columns: {name: DailySuppression, enabled: true, action_type: RemoveAllActionGroups, suppresses: true, time_zone: Pacific Standard Time, effective_from: "2018-01-10T22:05:09", author: xyz@microsoft.com, ts: "2018-06-12T22:05:09Z", conditions: {not_null: true}}
    docs_url: https://learn.microsoft.com/en-us/rest/api/alerts-management/processing-rules/alert-processing-rules/list-by-subscription?view=rest-alerts-management-processing-rules-2021-08-08

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_autoscale_settings
    title: Autoscale settings (profiles, capacity limits and scale rules)
    description: >-
      Autoscale settings of the subscription (GET /subscriptions/{id}/providers/Microsoft.Insights/autoscalesettings,
      api-version 2022-10-01): one row per setting x profile x rule with the target resource (VM scale set, App
      Service plan, ...), enabled flag, min / max / default capacity, the metric trigger (metric, statistic, time
      aggregation, operator, threshold, window) and the scale action (direction, type, value, cooldown). Answers
      'was autoscale capped at its maximum?' and 'did a scale-in rule remove capacity?'. Actual scale actions are
      in azure_monitor_activity_log (category Autoscale).
    kind: entities
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.Insights/autoscalesettings"
      query:
        api-version: "2022-10-01"
    filters:
      - {column: name, ops: ["=", "in"], fan_out: false, description: "Autoscale setting name (case-insensitive, filtered after fetch)", examples: ["MySetting"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 10}
    response:
      rows_path: "$.value[*]"
      expand:
        - {explode: "properties.profiles", as: p, keep_empty: true}
        - {explode: "@p.rules", as: r, keep_empty: true}
    columns:
      - {name: id, path: id}
      - name: name
        expr: "filters.name if (filters.name is string and filters.name | lower == (_.name or '') | lower) else _.name"
      - {name: enabled, type: BOOLEAN, path: "properties.enabled"}
      - {name: target_resource_id, path: "properties.targetResourceUri", description: "Resource that is scaled (VMSS, App Service plan, ...)"}
      - {name: target_resource_name, expr: "((_.properties.targetResourceUri or '').rstrip('/').split('/') | last) or none"}
      - {name: profile, path: "@p.name"}
      - {name: min_capacity, type: BIGINT, path: "@p.capacity.minimum"}
      - {name: max_capacity, type: BIGINT, path: "@p.capacity.maximum", description: "Hard ceiling: at max, autoscale cannot add instances"}
      - {name: default_capacity, type: BIGINT, path: "@p.capacity.default"}
      - {name: profile_schedule, type: JSON, expr: "p.fixedDate or p.recurrence if p else none", description: "fixedDate {start, end, timeZone} or weekly recurrence; null = default profile"}
      - {name: metric_name, path: "@r.metricTrigger.metricName"}
      - {name: metric_resource_id, path: "@r.metricTrigger.metricResourceUri"}
      - {name: statistic, path: "@r.metricTrigger.statistic", description: "How instances are combined: Average | Min | Max | Sum | Count"}
      - {name: time_aggregation, path: "@r.metricTrigger.timeAggregation"}
      - {name: operator, path: "@r.metricTrigger.operator"}
      - {name: threshold, type: DOUBLE, path: "@r.metricTrigger.threshold"}
      - {name: time_grain, path: "@r.metricTrigger.timeGrain"}
      - {name: time_window, path: "@r.metricTrigger.timeWindow"}
      - {name: direction, path: "@r.scaleAction.direction", description: "Increase | Decrease"}
      - {name: scale_type, path: "@r.scaleAction.type", description: "ChangeCount | PercentChangeCount | ExactCount | ServiceAllowedNextValue"}
      - {name: scale_value, path: "@r.scaleAction.value"}
      - {name: cooldown, path: "@r.scaleAction.cooldown"}
      - name: query
        expr: "(r.metricTrigger.timeAggregation ~ '(' ~ r.metricTrigger.metricName ~ ') ' ~ r.metricTrigger.operator ~ ' ' ~ r.metricTrigger.threshold ~ ' over ' ~ r.metricTrigger.timeWindow ~ ' -> ' ~ r.scaleAction.direction ~ ' by ' ~ r.scaleAction.value) if r else none"
        description: "Readable rule: Aggregation(metric) operator threshold over window -> direction by value"
      - {name: predictive_mode, path: "properties.predictiveAutoscalePolicy.scaleMode"}
      - {name: location, path: location}
      - {name: tags, type: JSON, path: tags}
      - {name: url, expr: "'https://portal.azure.com/#resource' ~ (_.id or '')"}
      - {name: subscription_id, filter_only: true}
    max_rows: 5000
    pitfalls:
      - "Capacity values are strings in the API (converted to numbers here); the subscription's core quota can cap scale-out below max_capacity."
      - "Only one profile is active at a time: a fixedDate profile overrides recurrence profiles, which override the default profile."
      - "Scale actions (and failures such as quota errors) are logged in azure_monitor_activity_log with category = 'Autoscale'."
    examples:
      - sql: "SELECT name, target_resource_name, profile, min_capacity, max_capacity, query, cooldown FROM azure_monitor_autoscale_settings WHERE enabled ORDER BY name, profile"
        description: Every autoscale rule with its capacity limits.
      - sql: >-
          SELECT ts, operation, status, description FROM azure_monitor_activity_log
          WHERE category = 'Autoscale' AND ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00' ORDER BY ts
        description: The scale actions autoscale actually took during the incident (activity log).
    fixtures:
      - file: autoscale_settings.json
        note: "Verbatim 200 response of the official example 'List autoscale settings by subs' (Autoscale Settings - List By Subscription, 2022-10-01, listAutoscaleSettingBySubscription.json): 1 setting x 2 profiles x 2 rules."
        expect_rows: 4
        expect_columns: {name: MySetting, enabled: true, target_resource_name: testingsc, profile: adios, min_capacity: 1, max_capacity: 10, metric_name: Percentage CPU, operator: GreaterThan, threshold: 10.0, direction: Increase, cooldown: PT5M, query: "Average(Percentage CPU) GreaterThan 10 over PT5M -> Increase by 1", profile_schedule: {not_null: true}}
    docs_url: https://learn.microsoft.com/en-us/rest/api/monitor/autoscale-settings/list-by-subscription

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_activity_log
    title: Activity log (control-plane operations and events)
    description: >-
      The subscription's activity log (GET /subscriptions/{id}/providers/Microsoft.Insights/eventtypes/management/
      values, api-version 2015-04-01): every ARM write / delete / action (deployments, scale, restarts, config and
      RBAC changes), Service Health, Resource Health, autoscale, alert and policy events. One row per event with
      ts, operation, status (Started / Succeeded / Failed), level, category, caller (author), resource, resource
      group, correlation id and properties. The API filter accepts ONE scope besides time: resource_group, resource_id
      (resourceUri), resource_provider or correlation_id (in that priority); everything else filters in SQL.
    kind: changes
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.Insights/eventtypes/management/values"
      query:
        api-version: "2015-04-01"
        $filter: >-
          eventTimestamp ge '{{ time.start | rfc3339 }}' and eventTimestamp le '{{ time.end | rfc3339 }}'
          {%- if filters.resource_group %} and resourceGroupName eq '{{ filters.resource_group | replace("'", "''") }}'
          {%- elif filters.resource_id %} and resourceUri eq '{{ filters.resource_id | replace("'", "''") }}'
          {%- elif filters.resource_provider %} and resourceProvider eq '{{ filters.resource_provider | replace("'", "''") }}'
          {%- elif filters.correlation_id %} and correlationId eq '{{ filters.correlation_id | replace("'", "''") }}'
          {%- endif %}
    filters:
      - {column: resource_group, description: "Resource group name (case-insensitive)", examples: ["rg-shop-prod"]}
      - {column: resource_id, description: "Full ARM id of one resource (case-insensitive)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api"]}
      - {column: resource_provider, description: "Resource provider namespace, e.g. Microsoft.Web (case-insensitive)", examples: ["Microsoft.Web"]}
      - {column: correlation_id, description: "Correlation id shared by all events of one operation", examples: ["1e121103-0ba6-4300-ac9d-952bb5d0c80f"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    time: {column: ts, default_lookback: 6h, max_window: 31d, retention: 90d, control_lookback: 3d}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 10}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: eventTimestamp, transform: auto_time, description: "When the service processed the event (UTC)"}
      - {name: submitted_at, type: TIMESTAMP, path: submissionTimestamp, transform: auto_time, description: "When it became queryable"}
      - {name: operation, path: "operationName.value", description: "e.g. Microsoft.Web/sites/restart/action, Microsoft.Resources/deployments/write"}
      - {name: operation_display, path: "operationName.localizedValue"}
      - {name: status, path: "status.value", description: "Started | Accepted | Succeeded | Failed | Active | Resolved"}
      - {name: sub_status, path: "subStatus.value", description: "Often the HTTP status (Created, BadRequest, Conflict...)"}
      - {name: level, path: level, description: "Critical | Error | Warning | Informational | Verbose"}
      - {name: category, path: "category.value", description: "Administrative, ServiceHealth, ResourceHealth, Alert, Autoscale, Security, Policy, Recommendation"}
      - {name: author, path: caller, description: "Caller UPN or service principal id"}
      - name: resource_id
        expr: "filters.resource_id if (filters.resource_id is string and filters.resource_id | lower == (_.resourceId or _.authorization.scope or '') | lower) else (_.resourceId or _.authorization.scope)"
        description: "resourceId of the event (falls back to authorization.scope when the event has no resourceId)"
      - {name: resource_name, expr: "((_.resourceId or _.authorization.scope or '').rstrip('/').split('/') | last) or none", description: "Last segment of the resource id"}
      - name: resource_group
        expr: "filters.resource_group if (filters.resource_group is string and filters.resource_group | lower == (_.resourceGroupName or '') | lower) else _.resourceGroupName"
      - name: resource_provider
        expr: "filters.resource_provider if (filters.resource_provider is string and filters.resource_provider | lower == (_.resourceProviderName.value or '') | lower) else _.resourceProviderName.value"
      - {name: resource_type, path: "resourceType.value"}
      - {name: correlation_id, path: correlationId}
      - {name: operation_id, path: operationId}
      - {name: event_data_id, path: eventDataId}
      - {name: event_name, path: "eventName.value", description: "BeginRequest | EndRequest | ..."}
      - {name: description, path: description}
      - {name: http_method, path: "httpRequest.method"}
      - {name: properties, type: JSON, path: properties, description: "Event details (statusCode, statusMessage with the error, responseBody, ...)"}
      - {name: title, expr: "(_.operationName.localizedValue or _.operationName.value or '') ~ ' ' ~ (_.status.value or '')"}
      - {name: id, path: id}
      - {name: subscription_id, path: subscriptionId}
    max_rows: 10000
    sort_hint: "newest first (as returned)"
    pitfalls:
      - "Only one scope filter is accepted by the API besides the time range; with resource_group set, resource_id / resource_provider / correlation_id are applied in SQL over the fetched page(s)."
      - "Each operation logs several events (Started, Accepted, Succeeded / Failed) sharing correlation_id: group by correlation_id and look at the final status; a Failed write's reason is in properties->>'statusMessage'."
      - "Reads (GET) are not logged; data-plane operations (blob reads, SQL queries) are not in the activity log - they are in resource logs (Log Analytics)."
      - "Events can take a few minutes to become queryable (submitted_at); the last minutes of a window may be incomplete."
      - "Busy subscriptions produce thousands of events per hour: narrow with resource_group and a short window, and paginate at most 10 pages."
    examples:
      - sql: >-
          SELECT ts, operation_display, status, author, resource_name FROM azure_monitor_activity_log
          WHERE resource_group = 'rg-shop-prod' AND category = 'Administrative'
            AND ts BETWEEN TIMESTAMP '2026-10-01 09:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
            AND (operation LIKE '%/write' OR operation LIKE '%/action' OR operation LIKE '%/delete') AND status IN ('Succeeded', 'Failed')
          ORDER BY ts DESC
        description: What changed in the resource group before the incident (deployments, config writes, restarts, deletes).
      - sql: >-
          SELECT ts, operation, status, properties->>'statusMessage' AS error FROM azure_monitor_activity_log
          WHERE resource_id = '/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api'
            AND status = 'Failed' ORDER BY ts DESC
        description: Failed control-plane operations on one app with their error message.
      - sql: >-
          SELECT ts, level, title, description FROM azure_monitor_activity_log
          WHERE category IN ('ServiceHealth', 'ResourceHealth') ORDER BY ts DESC LIMIT 50
        description: Platform health events delivered through the activity log.
    fixtures:
      - file: activity_log.json
        filters: {resource_group: MSSupportGroup}
        note: "Verbatim 200 response of the official example 'Get Activity Logs with filter' (Activity Logs - List 2015-04-01, GetActivityLogsFiltered.json)."
        expect_rows: 1
        expect_columns: {ts: "2015-01-21T22:14:26.9792776Z", operation: microsoft.support/supporttickets/write, status: Succeeded, level: Informational, author: admin@contoso.com, resource_group: MSSupportGroup, resource_provider: microsoft.support, correlation_id: 1e121103-0ba6-4300-ac9d-952bb5d0c80f}
      - file: activity_log_selected.json
        filters: {resource_group: mssupportgroup}
        note: "Verbatim 200 response of the official example 'Get Activity Logs with filter and select' (GetActivityLogsFilteredAndSelected.json); proves the case-insensitive resource_group filter keeps the row."
        expect_rows: 1
        expect_columns: {resource_group: mssupportgroup, author: null, sub_status: null, status: Succeeded}
    docs_url: https://learn.microsoft.com/en-us/rest/api/monitor/activity-logs/list

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_resource_graph
    title: Azure Resource Graph query (KQL over inventory, changes and health)
    description: >-
      Run any Resource Graph query (POST /providers/Microsoft.ResourceGraph/resources, api-version 2024-04-01)
      across the subscription(s) or management group(s): resources, resourcecontainers, resourcechanges,
      healthresources, servicehealthresources, alertsmanagementresources, advisorresources, policyresources... One
      row per result object; every output column becomes a SQL column (lower-cased, nested objects flattened
      with _) and the whole row is in result. Pages of up to 1000 rows follow $skipToken (max 5 pages).
    kind: generic
    request:
      method: POST
      path: /providers/Microsoft.ResourceGraph/resources
      query:
        api-version: "2024-04-01"
      body:
        query: "{{ filters.query }}"
        subscriptions: "{{ (filters.subscription_id | as_list) if filters.subscription_id else (None if filters.management_group else [env.AZURE_SUBSCRIPTION_ID]) }}"
        managementGroups: "{{ (filters.management_group | as_list) if filters.management_group else None }}"
        options:
          resultFormat: objectArray
          $top: "{{ [limit or 1000, 1000] | min }}"
    filters:
      - column: query
        required: true
        description: "Resource Graph KQL (see query_languages.azure_resource_graph); project id to allow paging"
        examples: ["resources | where type =~ 'microsoft.web/sites' | project id, name, location, state = tostring(properties.state)"]
      - {column: subscription_id, ops: ["=", "in"], fan_out: false, description: "Subscriptions to query (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
      - {column: management_group, ops: ["=", "in"], fan_out: false, description: "Management group ids to query instead of subscriptions", examples: ["mg-production"]}
    pagination: {type: cursor, cursor_path: "$['$skipToken']", cursor_param: "body.options.$skipToken", max_pages: 5}
    response:
      rows_path: "$.data[*]"
      dynamic: "."
      dynamic_max_columns: 60
      errors:
        - path: "$.resultTruncated"
          equals: "true"
          message: "$.resultTruncated"
          hint: "Resource Graph truncated the result (rows dropped, no $skipToken): add | project id, ... so it can page, summarize, or narrow the query"
    columns:
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: type, path: type}
      - {name: location, path: location}
      - {name: resource_group, path: resourceGroup}
      - {name: result, type: JSON, path: ".", description: "The whole result row"}
      - {name: query, filter_only: true}
      - {name: subscription_id, filter_only: true}
      - {name: management_group, filter_only: true}
    max_rows: 5000
    pitfalls:
      - "Results are capped at 1000 rows per page and 5 pages here; a query without an id column cannot be paged and comes back truncated (raised as an error)."
      - "Resource Graph is eventually consistent (seconds to minutes behind ARM); a resource created or deleted during the incident may not be reflected yet."
      - "Only subscriptions the app registration can read are searched; results silently exclude others."
      - "type, location and resourceGroup values are lower-case in Resource Graph for most resources: compare with =~ in KQL."
    examples:
      - sql: >-
          SELECT name, location, result->>'state' AS state FROM azure_monitor_resource_graph
          WHERE query = 'resources | where type =~ ''microsoft.web/sites'' | project id, name, location, state = tostring(properties.state)'
        description: All web apps and whether they are running.
      - sql: >-
          SELECT result->>'availabilityState' AS state, count(*) AS resources FROM azure_monitor_resource_graph
          WHERE query = 'healthresources | where type =~ ''microsoft.resourcehealth/availabilitystatuses'' | project id, availabilityState = tostring(properties.availabilityState)'
          GROUP BY 1
        description: Resource Health availability across the subscription in one query.
      - sql: >-
          SELECT result->>'title' AS title, result->>'status' AS status FROM azure_monitor_resource_graph
          WHERE query = 'servicehealthresources | where type =~ ''Microsoft.ResourceHealth/events'' | extend status = tostring(properties.Status), title = tostring(properties.Title) | where status == ''Active'' | project id, title, status'
        description: Active Service Health issues through Resource Graph.
    fixtures:
      - file: resource_graph_basic.json
        filters: {query: "Resources | project id, name, type, location, tags | limit 3"}
        note: "Verbatim 200 response of the official example 'Basic query' (Resources - Resources 2024-04-01, ResourcesBasicQuery.json)."
        expect_rows: 3
        expect_columns: {name: myNetworkInterface, type: microsoft.network/networkinterfaces, location: centralus, tags_tag1: Value1, result: {not_null: true}}
      - file: resource_graph_first_page.json
        filters: {query: "Resources | where name contains 'test' | project id, name, type, location"}
        note: "Verbatim 200 response of the official example 'First page query' (ResourcesFirstPageQuery.json), which carries a $skipToken for the next page."
        expect_rows: 3
        expect_columns: {name: yetanothertest_OsDisk_1_f396cbcb625a457bb69fe2abf5975820, type: microsoft.compute/disks}
      - file: resource_graph_truncated.json
        filters: {query: "resources | project name, type"}
        note: "Built strictly from the documented QueryResponse schema (resultTruncated enum 'true' / 'false', no $skipToken when truncated): truncated results must raise, not look complete."
        expect_error: "truncated"
    docs_url: https://learn.microsoft.com/en-us/rest/api/azureresourcegraph/resourcegraph/resources/resources

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_resources
    title: Azure resource inventory (Resource Graph 'resources')
    description: >-
      Inventory of Azure resources through Resource Graph: one row per resource with id, name, type (lower-case,
      e.g. microsoft.web/sites), kind, location, resource group, subscription, sku, tags, provisioning state, power
      state (VMs) and a portal url. Pushdown filters (case-insensitive): type, resource_group, name (=, IN, LIKE),
      location, tag ('key=value'), plus a raw kql_filter; include_properties = true adds the full properties JSON.
    kind: entities
    request:
      method: POST
      path: /providers/Microsoft.ResourceGraph/resources
      query:
        api-version: "2024-04-01"
      body:
        subscriptions: "{{ (filters.subscription_id | as_list) if filters.subscription_id else [env.AZURE_SUBSCRIPTION_ID] }}"
        options:
          resultFormat: objectArray
          $top: 1000
        query: |-
          {%- macro sf(col, v, op) -%}
          {%- if v is defined and v is not none and v != '' -%}
          {%- if op == 'like' -%}
          {%- for f in (v | string).replace('_', '%').split('%') if f %} | where {{ col }} contains {{ f | squote }}{% endfor -%}
          {%- elif op == '!=' %} | where {{ col }} !in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- else %} | where {{ col }} in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- endif -%}
          {%- endif -%}
          {%- endmacro -%}
          resources
          {{- sf('type', filters.type, filters.type__op) }}
          {{- sf('resourceGroup', filters.resource_group, filters.resource_group__op) }}
          {{- sf('name', filters.name, filters.name__op) }}
          {{- sf('location', filters.location, filters.location__op) }}
          {%- if filters.tag %}{% set kv = (filters.tag | string).split('=', 1) %} | where tostring(tags[{{ kv[0] | squote }}]) =~ {{ (kv[1] if kv | length > 1 else '') | squote }}{% endif %}
          {%- if filters.kql_filter %} | where {{ filters.kql_filter }}{% endif %}
          | project id, name, type, kind, location, resourceGroup, subscriptionId, sku, tags, zones, provisioningState = tostring(properties.provisioningState), powerState = tostring(properties.extended.instanceView.powerState.code){{ ', properties' if filters.include_properties else '' }}
          | order by type asc, name asc
    filters:
      - {column: type, ops: ["=", "in", "!=", "like"], fan_out: false, description: "Resource type, e.g. microsoft.compute/virtualmachines, microsoft.web/sites, microsoft.containerservice/managedclusters", examples: ["microsoft.web/sites"]}
      - {column: resource_group, ops: ["=", "in", "!=", "like"], fan_out: false, description: "Resource group name", examples: ["rg-shop-prod"]}
      - {column: name, ops: ["=", "in", "like"], fan_out: false, description: "Resource name; LIKE '%checkout%' becomes contains", examples: ["checkout-api"]}
      - {column: location, ops: ["=", "in"], fan_out: false, description: "Region, e.g. westeurope", examples: ["westeurope"]}
      - {column: tag, description: "Tag filter 'key=value' (value compared case-insensitively)", examples: ["env=prod"]}
      - {column: kql_filter, description: "Extra raw Resource Graph KQL predicate", examples: ["properties.state =~ 'Stopped'"]}
      - {column: include_properties, type: BOOLEAN, description: "true adds the full properties object", examples: ["true"]}
      - {column: subscription_id, ops: ["=", "in"], fan_out: false, description: "Subscriptions (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    pagination: {type: cursor, cursor_path: "$['$skipToken']", cursor_param: "body.options.$skipToken", max_pages: 5}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.resultTruncated", equals: "true", message: "$.resultTruncated", hint: "Resource Graph truncated the inventory: narrow type / resource_group"}
    columns:
      - {name: id, path: id}
      - name: name
        expr: "filters.name if (filters.name is string and filters.name | lower == (_.name or '') | lower) else _.name"
      - name: type
        expr: "filters.type if (filters.type is string and filters.type | lower == (_.type or '') | lower) else _.type"
      - {name: kind, path: kind}
      - {name: location, expr: "filters.location if (filters.location is string and filters.location | lower == (_.location or '') | lower) else _.location"}
      - name: resource_group
        expr: "filters.resource_group if (filters.resource_group is string and filters.resource_group | lower == (_.resourceGroup or '') | lower) else _.resourceGroup"
      - {name: subscription_id, path: subscriptionId}
      - {name: sku, type: JSON, path: sku}
      - {name: tags, type: JSON, path: tags}
      - {name: zones, type: JSON, path: zones}
      - {name: provisioning_state, path: provisioningState}
      - {name: power_state, path: powerState, description: "VMs: PowerState/running, PowerState/deallocated, ..."}
      - {name: properties, type: JSON, path: properties, description: "Full properties (include_properties = true)"}
      - {name: url, expr: "'https://portal.azure.com/#resource' ~ (_.id or '')"}
      - {name: tag, filter_only: true}
      - {name: kql_filter, filter_only: true}
      - {name: include_properties, type: BOOLEAN, filter_only: true}
    max_rows: 5000
    sort_hint: "by type, then name"
    pitfalls:
      - "power_state is only populated for VMs whose instance view Resource Graph has; empty does not mean stopped."
      - "Resource Graph lags ARM by seconds to minutes."
    examples:
      - sql: "SELECT name, location, provisioning_state, url FROM azure_monitor_resources WHERE type = 'microsoft.web/sites' AND resource_group = 'rg-shop-prod'"
        description: Web apps in a resource group.
      - sql: "SELECT name, power_state, resource_group FROM azure_monitor_resources WHERE type = 'microsoft.compute/virtualmachines' AND power_state <> 'PowerState/running'"
        description: VMs that are not running.
      - sql: "SELECT type, count(*) AS n FROM azure_monitor_resources WHERE tag = 'env=prod' GROUP BY 1 ORDER BY n DESC"
        description: What production is made of.
    fixtures:
      - file: resource_graph_basic.json
        filters: {type: microsoft.network/networkinterfaces}
        note: "Verbatim 200 response of the official example 'Basic query' (ResourcesBasicQuery.json; columns id, name, type, location, tags - the others this table projects are null)."
        expect_rows: 3
        expect_columns: {name: myNetworkInterface, type: microsoft.network/networkinterfaces, location: centralus, tags: {not_null: true}, url: "https://portal.azure.com/#resource/subscriptions/cfbbd179-59d2-4052-aa06-9270a38aa9d6/resourceGroups/RG1/providers/Microsoft.Network/networkInterfaces/myNetworkInterface"}
    docs_url: https://learn.microsoft.com/en-us/azure/governance/resource-graph/samples/starter

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_resource_changes
    title: Resource changes (Resource Graph change analysis)
    description: >-
      Property-level changes to Azure resources from Resource Graph change analysis (resourcechanges, 14 days):
      one row per change with ts (change time), change type (Create / Update / Delete), target resource id and type,
      resource group, who changed it (changed_by, changed_by_type, client_type), the RBAC operation, correlation id,
      the number of changed properties and changes (JSON: {"properties.x": {previousValue, newValue}}). Filters:
      resource_id, resource_group, resource_type, change_type, changed_by; change_table = resourcecontainerchanges
      for resource groups / subscriptions, healthresourcechanges for health. The best 'what changed before the
      incident' source for configuration (SKU, settings, scale, network rules) - complements the activity log.
    kind: changes
    request:
      method: POST
      path: /providers/Microsoft.ResourceGraph/resources
      query:
        api-version: "2024-04-01"
      body:
        subscriptions: "{{ (filters.subscription_id | as_list) if filters.subscription_id else [env.AZURE_SUBSCRIPTION_ID] }}"
        options:
          resultFormat: objectArray
          $top: 1000
        query: |-
          {%- macro sf(col, v, op) -%}
          {%- if v is defined and v is not none and v != '' -%}
          {%- if op == 'like' -%}
          {%- for f in (v | string).replace('_', '%').split('%') if f %} | where {{ col }} contains {{ f | squote }}{% endfor -%}
          {%- elif op == '!=' %} | where {{ col }} !in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- else %} | where {{ col }} in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- endif -%}
          {%- endif -%}
          {%- endmacro -%}
          {{ {'resourcecontainerchanges': 'resourcecontainerchanges', 'healthresourcechanges': 'healthresourcechanges'}.get((filters.change_table or '') | lower, 'resourcechanges') }}
          | extend changeTime = todatetime(properties.changeAttributes.timestamp), targetResourceId = tostring(properties.targetResourceId), targetResourceType = tostring(properties.targetResourceType), changeType = tostring(properties.changeType), changedBy = tostring(properties.changeAttributes.changedBy)
          | where changeTime between (datetime({{ time.start | rfc3339 }}) .. datetime({{ time.end | rfc3339 }}))
          {{- sf('resourceGroup', filters.resource_group, filters.resource_group__op) }}
          {{- sf('targetResourceId', filters.resource_id, filters.resource_id__op) }}
          {{- sf('targetResourceType', filters.resource_type, filters.resource_type__op) }}
          {{- sf('changeType', filters.change_type, filters.change_type__op) }}
          {{- sf('changedBy', filters.changed_by, filters.changed_by__op) }}
          | project id, changeTime, changeType, targetResourceId, targetResourceType, resourceGroup, subscriptionId, changedBy, changedByType = tostring(properties.changeAttributes.changedByType), clientType = tostring(properties.changeAttributes.clientType), operation = tostring(properties.changeAttributes.operation), correlationId = tostring(properties.changeAttributes.correlationId), changesCount = toint(properties.changeAttributes.changesCount), changes = properties.changes
          | order by changeTime desc
    filters:
      - {column: resource_id, ops: ["=", "in", "like"], fan_out: false, description: "Changed resource ARM id (case-insensitive)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api"]}
      - {column: resource_group, ops: ["=", "in", "!="], fan_out: false, description: "Resource group name", examples: ["rg-shop-prod"]}
      - {column: resource_type, ops: ["=", "in", "!=", "like"], fan_out: false, description: "Changed resource type, e.g. microsoft.web/sites", examples: ["microsoft.web/sites"]}
      - {column: change_type, ops: ["=", "in", "!="], fan_out: false, description: "Create | Update | Delete", examples: ["Update"]}
      - {column: changed_by, ops: ["=", "in", "like"], fan_out: false, description: "UPN, app id, System or Unspecified", examples: ["deploy-pipeline@contoso.com"]}
      - {column: change_table, description: "resourcechanges (default) | resourcecontainerchanges | healthresourcechanges", examples: ["resourcechanges"]}
      - {column: subscription_id, ops: ["=", "in"], fan_out: false, description: "Subscriptions (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    time: {column: ts, default_lookback: 24h, max_window: 14d, retention: 14d, control_lookback: 3d}
    pagination: {type: cursor, cursor_path: "$['$skipToken']", cursor_param: "body.options.$skipToken", max_pages: 5}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.resultTruncated", equals: "true", message: "$.resultTruncated", hint: "Resource Graph truncated the change list: narrow resource_group / resource_type or the window"}
    columns:
      - {name: ts, type: TIMESTAMP, path: changeTime, transform: auto_time, description: "When the change was detected (UTC)"}
      - {name: change_type, path: changeType, description: "Create | Update | Delete"}
      - name: resource_id
        expr: "filters.resource_id if (filters.resource_id is string and filters.resource_id | lower == (_.targetResourceId or '') | lower) else _.targetResourceId"
      - {name: resource_name, expr: "((_.targetResourceId or '').rstrip('/').split('/') | last) or none"}
      - name: resource_type
        expr: "filters.resource_type if (filters.resource_type is string and filters.resource_type | lower == (_.targetResourceType or '') | lower) else _.targetResourceType"
      - name: resource_group
        expr: "filters.resource_group if (filters.resource_group is string and filters.resource_group | lower == (_.resourceGroup or '') | lower) else _.resourceGroup"
      - {name: subscription_id, path: subscriptionId}
      - {name: changed_by, path: changedBy, description: "Who made the change (UPN / app id / System / Unspecified)"}
      - {name: author, path: changedBy}
      - {name: changed_by_type, path: changedByType, description: "User | Application | System | Unspecified"}
      - {name: client_type, path: clientType, description: "Azure Portal, Azure CLI, ARM template, ... or the client app id"}
      - {name: operation, path: operation, description: "RBAC permission used, e.g. microsoft.web/sites/write (use change_type for what happened)"}
      - {name: correlation_id, path: correlationId, description: "Joins with azure_monitor_activity_log.correlation_id"}
      - {name: changes_count, type: BIGINT, path: changesCount, description: "0 for Create and Delete"}
      - {name: changes, type: JSON, path: changes, description: "{'<property path>': {previousValue, newValue, isTruncated}}"}
      - {name: title, expr: "(_.changeType or '') ~ ' ' ~ (((_.targetResourceId or '').rstrip('/').split('/') | last) or '') ~ ((' (' ~ ((_.changes or {}).keys() | list | join(', '))[:200] ~ ')') if _.changes else '')"}
      - {name: id, path: id}
      - {name: url, expr: "'https://portal.azure.com/#resource' ~ (_.targetResourceId or '') ~ '/changes'"}
      - {name: change_table, filter_only: true}
    max_rows: 5000
    sort_hint: "newest first"
    pitfalls:
      - "Kept 14 days only; older windows are beyond retention (missing data)."
      - "Create and Delete records have changes_count 0 and no property diff; Delete has no snapshot."
      - "New properties introduced by an API version, and tags added without values, are not reported as changes."
      - "changes keys are full property paths containing dots ('properties.siteConfig.numberOfWorkers'): read them as ONE key, changes->'properties.siteConfig.numberOfWorkers'->>'newValue'; json_keys(changes) lists them. previousValue / newValue are strings ('null' for absent)."
      - "changed_by can be 'System' (platform background change) or 'Unspecified' (no identity information); correlate with azure_monitor_activity_log on correlation_id for the request details."
    examples:
      - sql: >-
          SELECT ts, change_type, resource_name, changed_by, client_type, changes FROM azure_monitor_resource_changes
          WHERE resource_group = 'rg-shop-prod' AND ts BETWEEN TIMESTAMP '2026-10-01 06:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC
        description: Configuration changes in the resource group in the 6 hours before the incident.
      - sql: >-
          SELECT ts, json_keys(changes) AS changed_properties, changed_by, client_type, correlation_id FROM azure_monitor_resource_changes
          WHERE resource_id = '/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api'
            AND change_type = 'Update' ORDER BY ts DESC
        description: Which properties of one app changed and who changed them.
      - sql: >-
          SELECT ts, resource_name, changes->'properties.hardwareProfile.vmSize'->>'previousValue' AS old_size,
                 changes->'properties.hardwareProfile.vmSize'->>'newValue' AS new_size, changed_by
          FROM azure_monitor_resource_changes
          WHERE resource_type = 'microsoft.compute/virtualmachines' AND change_type = 'Update'
            AND changes->'properties.hardwareProfile.vmSize' IS NOT NULL
        description: VM resizes (a property path with dots is one JSON key - use changes->'full.path').
    fixtures:
      - file: resource_changes.json
        filters: {resource_group: rg-shop-prod}
        note: "Built strictly from the documented Resource Graph QueryResponse schema (count, data objectArray, facets, resultTruncated, totalRecords) and the documented change resource properties (targetResourceId, targetResourceType, changeType, changeAttributes {correlationId, changedByType, changesCount, clientType, changedBy, operation, timestamp}, changes {path: {newValue, previousValue}}) as this table's KQL projects them; the docs show the change payload but no projected query response."
        expect_rows: 2
        expect_columns: {ts: "2026-10-01T10:51:07.347Z", change_type: Update, resource_name: checkout-api, resource_group: rg-shop-prod, changed_by: deploy-pipeline@contoso.com, client_type: Azure CLI, changes_count: 2, changes: {not_null: true}}
    docs_url: https://learn.microsoft.com/en-us/azure/governance/resource-graph/changes/get-resource-changes

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_service_health_events
    title: Service Health events (Azure outages, maintenance, advisories)
    description: >-
      Service Health events affecting the subscription (GET /subscriptions/{id}/providers/Microsoft.ResourceHealth/
      events, api-version 2025-05-01): one row per event (tracking id) with title, summary, event type
      (ServiceIssue = outage, PlannedMaintenance, HealthAdvisory, SecurityAdvisory, ...), status (Active / Resolved),
      level, impacted services and regions, impact start / mitigation and last update (ts). Answers 'is Azure
      itself broken in our region?'. Optional pushdown: service (else region) as the documented $filter; the other
      one is matched against the impacted services / regions in SQL. The window start becomes queryStartTime (date
      granularity, M/D/YYYY; events updated since that day).
    kind: incidents
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.ResourceHealth/events"
      query:
        api-version: "2025-05-01"
        queryStartTime: "{{ time.start.month }}/{{ time.start.day }}/{{ time.start.year }}"
        $filter: >-
          {% if filters.service %}service eq '{{ filters.service | replace("'", "''") }}'{% elif filters.region %}region eq '{{ filters.region | replace("'", "''") }}'{% endif %}
    filters:
      - {column: service, description: "Impacted Azure service display name, e.g. 'Virtual Machines', 'App Service', 'SQL Database' (pushed down as $filter service eq '...')", examples: ["Virtual Machines"]}
      - {column: region, description: "Impacted region display name, e.g. 'West Europe' (pushed down only when service is not given; always matched in SQL)", examples: ["West US"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    time: {column: ts, default_lookback: 3d, max_window: 90d, retention: 90d, reapply: false, control_lookback: 30d}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 5}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: id, path: name, description: "Tracking id (e.g. BC_1-FXZ) - quoted in Azure status communications"}
      - {name: title, path: "properties.title"}
      - {name: summary, path: "properties.summary", description: "Summary (HTML)"}
      - {name: header, path: "properties.header"}
      - {name: event_type, path: "properties.eventType", description: "ServiceIssue | PlannedMaintenance | HealthAdvisory | SecurityAdvisory | RCA | EmergingIssues | Billing"}
      - {name: event_source, path: "properties.eventSource", description: "ServiceHealth | ResourceHealth"}
      - {name: state, path: "properties.status", description: "Active | Resolved"}
      - {name: severity, path: "properties.eventLevel", description: "Critical | Error | Warning | Informational"}
      - {name: level, path: "properties.level", description: "Critical | Warning"}
      - {name: ts, type: TIMESTAMP, path: "properties.lastUpdateTime", transform: auto_time, description: "Last update of the event"}
      - {name: impact_start, type: TIMESTAMP, path: "properties.impactStartTime", transform: auto_time}
      - {name: impact_mitigation, type: TIMESTAMP, path: "properties.impactMitigationTime", transform: auto_time}
      - {name: impacted_services, path: "properties.impact[*].impactedService", transform: join, transform_arg: ", "}
      - {name: impacted_regions, path: "properties.impact[*].impactedRegions[*].impactedRegion", transform: join, transform_arg: ", "}
      - {name: impact, type: JSON, path: "properties.impact", description: "Per service and region status and update history"}
      - {name: event_tags, type: JSON, path: "properties.eventTags", description: "Action Recommended, False Positive, Preliminary PIR, Final PIR"}
      - {name: is_hir, type: BOOLEAN, path: "properties.isHIR"}
      - {name: priority, type: BIGINT, path: "properties.priority", description: "0 (highest) .. 23"}
      - name: service
        expr: >-
          filters.service if (filters.service is string and (filters.service | lower) in ((_.properties.impact or []) | map(attribute='impactedService') | map('lower') | list))
          else ((_.properties.impact or []) | map(attribute='impactedService') | first)
        description: "The impacted service matching the service filter (case-insensitive), else the first impacted service"
      - name: region
        expr: >-
          filters.region if (filters.region is string and (filters.region | lower) in ((_.properties.impact or []) | map(attribute='impactedRegions') | map('default', [], true) | sum(start=[]) | map(attribute='impactedRegion') | map('lower') | list))
          else ((_.properties.impact or []) | map(attribute='impactedRegions') | map('default', [], true) | sum(start=[]) | map(attribute='impactedRegion') | first)
        description: "The impacted region matching the region filter (case-insensitive), else the first impacted region"
      - {name: subscription_id, filter_only: true}
    max_rows: 2000
    sort_hint: "as returned (highest priority first)"
    pitfalls:
      - "queryStartTime has day granularity and filters on lastUpdateTime: an outage that started earlier but is still updated is included; the ts predicate is not re-applied (use impact_start / impact_mitigation to test overlap with the incident)."
      - "Only events affecting the queried subscription's services and regions are returned; an empty result for one subscription does not clear other subscriptions."
      - "service / region use display names ('Virtual Machines', 'West Europe'), not resource types or region codes (westeurope); when unsure, leave them out and use impacted_services / impacted_regions ILIKE in SQL."
      - "The documented $filter example combines service and region with 'or'; this table pushes down only one of them (service first) and matches the other in SQL, so service AND region means both."
      - "Sensitive events (isEventSensitive, e.g. security advisories) have their summary withheld here; the portal or the fetchEventDetails endpoint with elevated access shows it."
    examples:
      - sql: >-
          SELECT id, title, state, event_type, impacted_services, impacted_regions, impact_start, impact_mitigation
          FROM azure_monitor_service_health_events
          WHERE event_type = 'ServiceIssue' AND impact_start <= TIMESTAMP '2026-10-01 12:00:00'
            AND (impact_mitigation IS NULL OR impact_mitigation >= TIMESTAMP '2026-10-01 11:00:00')
        description: Azure outages overlapping the incident window.
      - sql: "SELECT id, title, impacted_regions FROM azure_monitor_service_health_events WHERE state = 'Active' AND impacted_regions ILIKE '%West Europe%'"
        description: Anything currently active in our region.
    fixtures:
      - file: service_health_events.json
        note: "Verbatim 200 response of the official example 'ListEventsBySubscriptionId' (Events - List By Subscription Id 2025-05-01, Events_ListBySubscriptionId.json)."
        expect_rows: 1
        expect_columns: {id: BC_1-FXZ, title: "ACTIVE: Virtual machines in West US", event_type: ServiceIssue, state: Active, impacted_services: Virtual Machines, impacted_regions: West US, impact_start: "2025-05-12T14:45:48.1203530Z", ts: "2025-05-13T15:43:48.1203530Z", service: Virtual Machines, region: West US}
      - file: service_health_events.json
        filters: {service: virtual machines, region: west us}
        note: "Same verbatim example; proves service / region match case-insensitively (the SQL predicate service = 'virtual machines' keeps the row)."
        expect_rows: 1
        expect_columns: {service: virtual machines, region: west us}
    docs_url: https://learn.microsoft.com/en-us/rest/api/resourcehealth/events/list-by-subscription-id

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_service_health_impacted_resources
    title: Our resources impacted by one Service Health event
    description: >-
      The subscription's resources that Azure lists as impacted by one Service Health event (GET /subscriptions/
      {id}/providers/Microsoft.ResourceHealth/events/{trackingId}/impactedResources, api-version 2025-05-01): one
      row per resource with its ARM id, type, region and extra info. event_id (the tracking id, e.g. BC_1-FXZ,
      from azure_monitor_service_health_events.id) is required; region (code, e.g. westus) is pushed down as
      $filter targetRegion eq '...'. Confirms whether an Azure outage actually touched the incident's resources.
    kind: entities
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.ResourceHealth/events/{{ filters.event_id | urlencode }}/impactedResources"
      query:
        api-version: "2025-05-01"
        $filter: "{% if filters.region %}targetRegion eq '{{ filters.region | replace(\"'\", \"''\") }}'{% endif %}"
    filters:
      - {column: event_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Service Health tracking id (azure_monitor_service_health_events.id)", examples: ["BC_1-FXZ"]}
      - {column: region, description: "Region code of the impacted resources, e.g. westus, westeurope", examples: ["westus"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 10}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: resource_id, path: "properties.targetResourceId", description: "ARM id of the impacted resource (null for non-ARM impacts, see info)"}
      - {name: resource_name, expr: "((_.properties.targetResourceId or '').rstrip('/').split('/') | last) or none"}
      - name: resource_group
        expr: "(_.properties.targetResourceId[(_.properties.targetResourceId | lower).find('/resourcegroups/') + 16:].split('/')[0]) if '/resourcegroups/' in (_.properties.targetResourceId or '') | lower else none"
        description: "Resource group parsed from the ARM id (any casing of /resourceGroups/)"
      - {name: resource_type, path: "properties.targetResourceType"}
      - {name: region, path: "properties.targetRegion"}
      - {name: info, type: JSON, path: "properties.info", description: "[{key, value}] extra details (e.g. container group, application id)"}
      - {name: id, path: name, description: "Impacted-resource record id"}
      - {name: event_id, expr: "(_.id or '').split('/events/')[1].split('/')[0] if '/events/' in (_.id or '') else none", description: "Tracking id of the event"}
      - {name: url, expr: "('https://portal.azure.com/#resource' ~ _.properties.targetResourceId) if _.properties.targetResourceId else none"}
      - {name: subscription_id, filter_only: true}
    max_rows: 5000
    pitfalls:
      - "Only resources Azure could attribute are listed; an empty list does not prove the outage missed you (check azure_monitor_resource_health_history for the resource)."
      - "region here is the region code (westus), unlike the display names (West US) on azure_monitor_service_health_events."
    examples:
      - sql: >-
          SELECT e.id, e.title, i.resource_name, i.resource_type, i.region
          FROM azure_monitor_service_health_events e JOIN azure_monitor_service_health_impacted_resources i ON i.event_id = e.id
          WHERE e.event_type = 'ServiceIssue' AND i.event_id = 'BC_1-FXZ'
        description: Which of our resources an Azure outage impacted.
      - sql: "SELECT resource_name, resource_group, resource_type FROM azure_monitor_service_health_impacted_resources WHERE event_id = 'BC_1-FXZ' AND resource_group = 'rg-shop-prod'"
        description: Was the incident's resource group among the impacted resources?
    fixtures:
      - file: service_health_impacted_resources.json
        filters: {event_id: BC_1-FXZ}
        note: "Verbatim 200 response of the official example 'ListImpactedResourcesBySubscriptionId' (Impacted Resources - List By Subscription Id And Event Id, 2025-05-01); the second record has only info (no ARM id)."
        expect_rows: 3
        expect_columns: {resource_id: "/subscriptions/4970d23e-ed41-4670-9c19-02a1d2808dd9/resourceGroups/TEST/providers/Microsoft.Compute/virtualMachines/testvm", resource_name: testvm, resource_group: TEST, resource_type: Microsoft.Compute/VirtualMachines, region: westus, event_id: BC_1-FXZ}
    docs_url: https://learn.microsoft.com/en-us/rest/api/resourcehealth/impacted-resources/list-by-subscription-id-and-event-id

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_resource_health
    title: Current Resource Health of every resource (Availability Statuses)
    description: >-
      Current Resource Health availability of all resources in the subscription, or one resource group (GET
      .../providers/Microsoft.ResourceHealth/availabilityStatuses, api-version 2025-05-01): one row per resource with
      state (Available / Unavailable / Degraded / Unknown), title, summary, reason type (Unplanned, Planned,
      UserInitiated, ...), whether the platform or the customer caused it, since when (ts = occuredTime), resolution
      ETA and recently resolved incidents. Filter resource_group to narrow; state etc. filter in SQL.
    kind: entities
    request:
      method: GET
      path: >-
        /subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}{{ ('/resourceGroups/' ~ filters.resource_group) if filters.resource_group else '' }}/providers/Microsoft.ResourceHealth/availabilityStatuses
      query:
        api-version: "2025-05-01"
        $expand: "{{ 'recommendedactions' if filters.include_actions else None }}"
    filters:
      - {column: resource_group, description: "Resource group name (Availability Statuses - List By Resource Group)", examples: ["rg-shop-prod"]}
      - {column: include_actions, type: BOOLEAN, description: "true expands recommended actions", examples: ["true"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 10}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: resource_id, expr: "(_.id or '').split('/providers/Microsoft.ResourceHealth/')[0]", description: "ARM id of the resource"}
      - {name: resource_name, expr: "((_.id or '').split('/providers/Microsoft.ResourceHealth/')[0].rstrip('/').split('/') | last) or none"}
      - {name: state, path: "properties.availabilityState", description: "Available | Unavailable | Degraded | Unknown"}
      - {name: title, path: "properties.title"}
      - {name: summary, path: "properties.summary"}
      - {name: detailed_status, path: "properties.detailedStatus"}
      - {name: reason_type, path: "properties.reasonType", description: "Unplanned, Planned, UserInitiated, ..."}
      - {name: reason_chronicity, path: "properties.reasonChronicity", description: "Transient | Persistent"}
      - {name: context, path: "properties.context", description: "Platform Initiated | Customer Initiated"}
      - {name: category, path: "properties.category", description: "Planned | Unplanned (when platform initiated)"}
      - {name: ts, type: TIMESTAMP, path: "properties.occuredTime", transform: auto_time, description: "When the current state started (API field occuredTime)"}
      - {name: reported_at, type: TIMESTAMP, path: "properties.reportedTime", transform: auto_time}
      - {name: root_cause_attributed_at, type: TIMESTAMP, path: "properties.rootCauseAttributionTime", transform: auto_time}
      - {name: resolution_eta, type: TIMESTAMP, path: "properties.resolutionETA", transform: auto_time}
      - {name: health_event_type, path: "properties.healthEventType"}
      - {name: health_event_cause, path: "properties.healthEventCause", description: "PlatformInitiated | UserInitiated ..."}
      - {name: health_event_category, path: "properties.healthEventCategory"}
      - {name: health_event_id, path: "properties.healthEventId"}
      - {name: recently_resolved, type: JSON, path: "properties.recentlyResolved", description: "{unavailableOccuredTime, resolvedTime, unavailableSummary}"}
      - {name: service_impacting_events, type: JSON, path: "properties.serviceImpactingEvents"}
      - {name: recommended_actions, type: JSON, path: "properties.recommendedActions"}
      - {name: location, path: location}
      - {name: resource_group, filter_only: true}
      - {name: include_actions, type: BOOLEAN, filter_only: true}
      - {name: subscription_id, filter_only: true}
    max_rows: 10000
    pitfalls:
      - "Only resource types that Resource Health supports appear (VMs, App Service, SQL, storage, AKS, ...)."
      - "The API spells the field 'occuredTime' (sic); ts is when the CURRENT state began, not the last check (reported_at)."
      - "Available with recently_resolved set means the resource WAS unavailable recently - check recently_resolved->>'unavailableOccuredTime'."
    examples:
      - sql: "SELECT resource_name, state, title, reason_type, context, ts FROM azure_monitor_resource_health WHERE state <> 'Available' ORDER BY ts DESC"
        description: Resources currently unhealthy and since when.
      - sql: "SELECT resource_name, recently_resolved->>'unavailableOccuredTime' AS down_at, recently_resolved->>'resolvedTime' AS up_at FROM azure_monitor_resource_health WHERE resource_group = 'rg-shop-prod' AND recently_resolved IS NOT NULL"
        description: Resources that recently recovered from an outage.
    fixtures:
      - file: resource_health.json
        note: "Verbatim 200 response of the official example 'ListHealthBySubscriptionId' (Availability Statuses - List By Subscription Id 2025-05-01)."
        expect_rows: 2
        expect_columns: {resource_name: virtualMachineName, state: Available, title: Available, reason_type: Unplanned, ts: "2016-03-29T09:12:00Z", recently_resolved: {not_null: true}}
    docs_url: https://learn.microsoft.com/en-us/rest/api/resourcehealth/availability-statuses/list-by-subscription-id

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_resource_health_history
    title: Resource Health history of one resource
    description: >-
      Historical availability transitions and impacting events of one resource (GET {resource_id}/providers/
      Microsoft.ResourceHealth/availabilityStatuses, api-version 2025-05-01): one row per state period with state,
      title, summary, reason, ts (when it began) and any service-impacting Azure incident linked to it. resource_id
      is required. Answers 'was this VM / app / database down, and was it Azure's fault?'.
    kind: events
    request:
      method: GET
      path: "/{{ filters.resource_id.strip('/') }}/providers/Microsoft.ResourceHealth/availabilityStatuses"
      query:
        api-version: "2025-05-01"
    filters:
      - {column: resource_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Full ARM id of the resource", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Compute/virtualMachines/web-vm-01"]}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 5}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: "properties.occuredTime", transform: auto_time, description: "When this state began"}
      - {name: state, path: "properties.availabilityState"}
      - {name: title, path: "properties.title"}
      - {name: summary, path: "properties.summary"}
      - {name: detailed_status, path: "properties.detailedStatus"}
      - {name: reason_type, path: "properties.reasonType"}
      - {name: reason_chronicity, path: "properties.reasonChronicity"}
      - {name: context, path: "properties.context"}
      - {name: category, path: "properties.category"}
      - {name: root_cause_attributed_at, type: TIMESTAMP, path: "properties.rootCauseAttributionTime", transform: auto_time}
      - {name: resolution_eta, type: TIMESTAMP, path: "properties.resolutionETA", transform: auto_time}
      - {name: service_impacting_events, type: JSON, path: "properties.serviceImpactingEvents", description: "Linked Azure incidents [{eventStartTime, status, incidentProperties {title, service, region, incidentType}}]"}
      - {name: azure_incident, path: "properties.serviceImpactingEvents[0].incidentProperties.title", description: "Title of the first linked Azure incident"}
      - {name: name, path: name}
      - {name: resource_id, filter_only: true}
    max_rows: 2000
    sort_hint: "current state first, then older transitions"
    pitfalls:
      - "History covers a limited period (typically the last weeks); older outages are not listed."
      - "A row with no state (availability_state null) describes an availability-impacting event rather than a state."
    examples:
      - sql: >-
          SELECT ts, state, title, reason_type, context, azure_incident FROM azure_monitor_resource_health_history
          WHERE resource_id = '/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Compute/virtualMachines/web-vm-01'
          ORDER BY ts DESC
        description: Was the VM unavailable, and was an Azure incident attributed?
    fixtures:
      - file: resource_health_history.json
        filters: {resource_id: "/subscriptions/4abcdefgh-ijkl-mnop-qrstuvwxyz/resourceGroups/rhctestenv/providers/Microsoft.ClassicCompute/virtualMachines/rhctestenvV1PI"}
        note: "Verbatim 200 response of the official example 'GetHealthHistoryByResource' (Availability Statuses - List 2025-05-01, AvailabilityStatuses_List.json)."
        expect_rows: 2
        expect_columns: {ts: "2016-03-29T09:12:00Z", state: Unavailable, reason_type: Unplanned, azure_incident: "Virtual Machines - West Europe [West Europe]"}
    docs_url: https://learn.microsoft.com/en-us/rest/api/resourcehealth/availability-statuses/list

roles:
  metrics:
    table: azure_monitor_metrics
    columns: {ts: ts, value: value, metric: metric, labels: dimensions}
    notes: "Platform metrics of one resource: resource_id + metric are required (azure_monitor_metric_definitions lists the names); azure_monitor_subscription_metrics ranks all resources of a type in a region."
  active_alerts:
    table: azure_monitor_alerts
    filters: {state: Fired}
    columns: {id: id, name: title, title: title, state: state, ts: ts, severity: severity, labels: target_resource, url: url, query: alert_rule}
  alert_history:
    table: azure_monitor_alerts
    filters:
      alert_rule: "{{ rule_id if (rule_id and '/' in rule_id) else '' }}"
    columns: {ts: ts, name: title, title: title, state: state, severity: severity}
    notes: "Alert instances of the rule over the window (Fired/Resolved times); azure_monitor_alert_history has the state changes of one instance by alert_id."
  alert_rules:
    - table: azure_monitor_metric_alert_rules
      columns: {id: id, name: name, query: query, threshold: threshold, url: url}
      notes: "Metric alerts: threshold, operator, time_aggregation, window_size describe the rule."
    - table: azure_monitor_log_alert_rules
      query_language: kql
      columns: {id: id, name: name, query: query, threshold: threshold, url: url}
      notes: "Log search alerts: query is KQL - rerun it with azure_log_analytics_query."
    - table: azure_monitor_activity_log_alert_rules
      columns: {id: id, name: name, query: query, url: url}
      notes: "Activity log / Service Health / Resource Health alert rules."
  change_events:
    - table: azure_monitor_resource_changes
      columns: {ts: ts, service: resource_name, title: title, author: changed_by, url: url, type: change_type}
      notes: "Property-level config changes (14 days)."
    - table: azure_monitor_activity_log
      columns: {ts: ts, service: resource_name, title: title, author: author, type: category}
      notes: "Control-plane operations (deployments, restarts, scale, RBAC); filter category = 'Administrative' and status in SQL."
  hosts:
    table: azure_monitor_resources
    filters: {type: microsoft.compute/virtualmachines}
    columns: {host: name, health: power_state, id: id, url: url}
  services:
    table: azure_monitor_resources
    filters: {type: "{{ ['microsoft.web/sites', 'microsoft.containerservice/managedclusters', 'microsoft.app/containerapps'] }}"}
    columns: {service: name, id: id, url: url, type: type}
    notes: "App Service / Functions apps, AKS clusters and Container Apps."
