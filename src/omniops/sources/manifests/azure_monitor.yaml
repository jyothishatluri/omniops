  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_metric_definitions
    title: Metrics available on a resource (Metric Definitions - List)
    description: >-
      The metrics a resource emits (GET {resource_id}/providers/Microsoft.Insights/metricDefinitions, 2023-10-01):
      one row per metric with its exact name, display name, unit, primary and supported aggregations, dimensions,
      time grains and retention. Look metrics up here before querying azure_monitor_metrics.
    kind: entities
    request:
      method: GET
      path: "/{{ filters.resource_id.strip('/') }}/providers/Microsoft.Insights/metricDefinitions"
      query:
        api-version: "2023-10-01"
        metricnamespace: "{{ filters.metric_namespace }}"
    filters:
      - {column: resource_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Full ARM id of the resource", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api"]}
      - {column: metric_namespace, description: "Restrict to one namespace (custom metrics live in their own namespace)", examples: ["Microsoft.Web/sites"]}
    response:
      rows_path: "$.value[*]"
    columns:
      - {name: metric, path: "name.value", description: "Exact metric name for azure_monitor_metrics"}
      - {name: display_name, path: "name.localizedValue"}
      - {name: description, path: displayDescription}
      - {name: unit, path: unit}
      - {name: primary_aggregation, path: primaryAggregationType}
      - {name: supported_aggregations, type: JSON, path: supportedAggregationTypes}
      - {name: dimensions, type: JSON, path: dimensions, description: "[{value, localizedValue}] - value is the name for $filter"}
      - {name: dimension_names, expr: "(_.dimensions or []) | map(attribute='value') | join(', ')"}
      - {name: is_dimension_required, type: BOOLEAN, path: isDimensionRequired}
      - {name: time_grains, expr: "(_.metricAvailabilities or []) | map(attribute='timeGrain') | join(', ')"}
      - {name: retention, path: "metricAvailabilities[0].retention"}
      - {name: namespace, path: namespace}
      - {name: category, path: category}
      - {name: metric_class, path: metricClass}
      - {name: resource_id, path: resourceId}
      - {name: metric_namespace, filter_only: true}
    max_rows: 2000
    examples:
      - sql: >-
          SELECT metric, unit, primary_aggregation, dimension_names FROM azure_monitor_metric_definitions
          WHERE resource_id = '/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api'
