# Azure Monitor control plane over Azure Resource Manager (management.azure.com), reached directly over REST (no SDK,
# no MCP). One Microsoft Entra app (client credentials, scope https://management.azure.com/.default) reads:
#
#   GET  {resourceUri}/providers/Microsoft.Insights/metrics                       Metrics - List (2023-10-01)
#   GET  /subscriptions/{id}/providers/Microsoft.Insights/metrics?region=        Metrics - List At Subscription Scope (2023-10-01)
#   GET  {resourceUri}/providers/Microsoft.Insights/metricDefinitions            Metric Definitions - List (2023-10-01)
#   GET  {resourceUri}/providers/microsoft.insights/metricNamespaces             Metric Namespaces - List (2017-12-01-preview)
#   GET  /subscriptions/{id}/providers/Microsoft.AlertsManagement/alerts         Alerts - Get All (2019-03-01 stable)
#   GET  {alertId} and {alertId}/history                                          Alerts - Get By Id / Get History (2019-03-01)
#   GET  /subscriptions/{id}/providers/Microsoft.AlertsManagement/alertsSummary  Alerts - Get Summary (2019-03-01)
#   GET  /subscriptions/{id}/providers/Microsoft.AlertsManagement/actionRules    Alert processing rules (2021-08-08)
#   GET  /subscriptions/{id}/providers/Microsoft.Insights/metricAlerts           Metric alert rules (2018-03-01)
#   GET  /subscriptions/{id}/providers/Microsoft.Insights/scheduledQueryRules    Log search alert rules (2023-12-01 GA)
#   GET  /subscriptions/{id}/providers/Microsoft.Insights/activityLogAlerts      Activity log alert rules (2020-10-01)
#   GET  /subscriptions/{id}/providers/Microsoft.Insights/autoscalesettings      Autoscale settings (2022-10-01)
#   GET  /subscriptions/{id}/providers/Microsoft.Insights/eventtypes/management/values   Activity log (2015-04-01)
#   POST /providers/Microsoft.ResourceGraph/resources                             Resource Graph KQL (2024-04-01)
#   GET  /subscriptions/{id}/providers/Microsoft.ResourceHealth/events           Service Health events (2025-05-01)
#   GET  .../Microsoft.ResourceHealth/events/{trackingId}/impactedResources      Service Health impacted resources (2025-05-01)
#   GET  .../providers/Microsoft.ResourceHealth/availabilityStatuses             Resource Health (2025-05-01)
#
# 2xx-with-error bodies: Metrics - List returns HTTP 200 with a per-metric errorCode/errorMessage (e.g.
# InvalidSamplingType); Resource Graph returns resultTruncated = "true" when rows were dropped.
# Docs index: https://learn.microsoft.com/en-us/rest/api/monitor/   Research notes: docs/sources/azure_monitor.md
source: azure_monitor
display_name: Azure Monitor (metrics, alerts, activity log, Resource Graph, Service Health)
vendor: Microsoft Azure
description: >-
  Azure Resource Manager APIs of Azure Monitor and friends: platform metrics per resource or per region across a
  subscription, metric definitions and namespaces, fired alerts with their history and summary counts, metric / log
  search / activity log alert rules, alert processing rules (suppression), autoscale settings, the activity log
  (control-plane changes), Resource Graph inventory and resource changes, Service Health events with their impacted
  resources and Resource Health availability.
docs_url: https://learn.microsoft.com/en-us/rest/api/monitor/
categories: [metrics, alerts, changes, events, inventory, health]
base_url: "{{ (env.AZURE_RESOURCE_MANAGER_ENDPOINT or 'https://management.azure.com').rstrip('/') }}"
env:
  - {name: AZURE_TENANT_ID, description: "Microsoft Entra tenant (directory) ID of the app registration"}
  - {name: AZURE_CLIENT_ID, description: "App registration (client) ID; needs Monitoring Reader (alerts, metrics, rules, activity log) and Reader (Resource Graph, Resource Health) on the subscription"}
  - {name: AZURE_CLIENT_SECRET, description: "App registration client secret", secret: true}
  - {name: AZURE_SUBSCRIPTION_ID, description: "Default subscription GUID for subscription-scoped tables (override per query with subscription_id)"}
  - {name: AZURE_REGION, description: "Optional default region for azure_monitor_subscription_metrics, e.g. westeurope (the API requires one region per request)"}
  - {name: AZURE_AUTHORITY_HOST, description: "Entra authority host (sovereign clouds: https://login.chinacloudapi.cn, https://login.microsoftonline.us)", default: "https://login.microsoftonline.com"}
  - {name: AZURE_RESOURCE_MANAGER_ENDPOINT, description: "ARM endpoint (China: https://management.chinacloudapi.cn, US Gov: https://management.usgovcloudapi.net)", default: "https://management.azure.com"}
  - {name: AZURE_RESOURCE_MANAGER_SCOPE, description: "Token scope for ARM (China: https://management.chinacloudapi.cn/.default, US Gov: https://management.usgovcloudapi.net/.default)", default: "https://management.azure.com/.default"}
  - {name: AZURE_PORTAL_URL, description: "Portal base for deep links", default: "https://portal.azure.com"}
required_env: [AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SUBSCRIPTION_ID]
auth:
  type: azure_ad
  token_url: "{{ env.AZURE_AUTHORITY_HOST.rstrip('/') }}/{{ env.AZURE_TENANT_ID }}/oauth2/v2.0/token"
  client_id: "{{ env.AZURE_CLIENT_ID }}"
  client_secret: "{{ env.AZURE_CLIENT_SECRET }}"
  scope: "{{ env.AZURE_RESOURCE_MANAGER_SCOPE }}"
rate_limit:
  concurrency: 6
  requests_per_minute: 600
  notes: >-
    ARM reads (token bucket, per subscription and service principal, per region): bucket 250, refill 25/s; tenant
    reads the same; global subscription limit 15x that. 429 carries Retry-After (honoured). The metrics API is the
    most common cause of subscription throttling. Alerts Management: Get All 100 calls/min/subscription, Get Summary
    50/min, other alert calls 1000/min. Resource Graph: about 15 queries per 5 s per user (x-ms-user-quota-remaining,
    x-ms-user-quota-resets-after), max 1000 rows per page. Activity log: 50 queries per 30 s, 75 s timeout.
retention:
  metrics: 93d
  timeseries: 93d
  alerts: 30d
  changes: "activity log 90 days; Resource Graph resourcechanges 14 days"
  events: "activity log 90 days"
errors: []
ui_base_url: "{{ env.AZURE_PORTAL_URL }}"
query_languages:
  azure_metrics_filter: >-
    Metrics $filter (OData on dimensions, NOT on values): Dim eq 'v' and Other eq '*' splits by Other; one dimension may
    OR several values (StatusCode eq '500' or StatusCode eq '503') but OR cannot join two different dimensions.
    Dimension names are case-insensitive and come back lower-cased. A dimension filter splits the result into one
    series per value, capped by top (default 10) and ordered by orderby (e.g. 'total desc'). metric names are exact,
    comma-separated (max 20) and include spaces, e.g. 'Percentage CPU', 'Http5xx', 'requests/failed'.
  azure_resource_graph: >-
    Resource Graph KQL over tables resources, resourcecontainers (subscriptions, resource groups), resourcechanges,
    resourcecontainerchanges, healthresources, servicehealthresources, alertsmanagementresources, advisorresources,
    policyresources: resources | where type =~ 'microsoft.web/sites' and resourceGroup =~ 'rg' | project id, name,
    location, properties.state | order by name asc. String compare with =~ (case-insensitive); type values are
    lower-case; tags['env']. Max 1000 rows per page; project id so results can be paged.
pitfalls:
  - "Azure resource ids, resource groups and types are case-insensitive but come back in inconsistent casing (alerts and Resource Graph lower-case them, the activity log mixes cases). Filter with the pushdown columns here (they compare case-insensitively) and use lower() for joins across tables."
  - "Subscription-scoped tables only see AZURE_SUBSCRIPTION_ID unless subscription_id is given; an alert, rule or resource in another subscription returns 0 rows, which is not evidence of absence."
  - "Platform metrics are kept 93 days; alerts in Alerts Management 30 days; the activity log 90 days; Resource Graph resourcechanges 14 days. Older windows are missing data, not 'nothing happened'."
  - "Metric values per interval: a total over PT5M is a 5-minute sum. Requests with no data in an interval return a timestamp with no value (value = null), not 0."
  - "ARM throttling (HTTP 429, Retry-After) is per subscription and principal: fan-outs over many resources or regions slow down; prefer azure_monitor_subscription_metrics (one call per region) over per-resource calls."
tables:
  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_metrics
    title: Platform / custom metric values for one resource (Metrics - List)
    description: >-
      Azure Monitor metric values for one Azure resource (GET {resource_id}/providers/Microsoft.Insights/metrics,
      api-version 2023-10-01). One row per (metric, dimension series, timestamp). resource_id (full ARM id) and
      metric (exact name; IN list up to 20 names) are required. aggregation picks the statistics (average, minimum,
      maximum, total, count; comma list); value is the first one requested (default average). interval is the
      time grain (default: auto from the window, PT1M..P1D, or FULL for one point), filter is the OData dimension
      filter that splits series (e.g. StatusCode eq '*'), top/orderby keep the N largest series. Dimensions of each
      series are in dimensions (JSON object, lower-case keys): dimensions->>'statuscode'. List the metric names
      and dimensions of a resource with azure_monitor_metric_definitions first.
    kind: timeseries
    request:
      method: GET
      path: "/{{ filters.resource_id.strip('/') }}/providers/Microsoft.Insights/metrics"
      query:
        api-version: "2023-10-01"
        metricnames: "{{ filters.metric | as_list | join(',') }}"
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        interval: >-
          {{ filters.interval or ('PT1M' if time.step_s <= 60 else 'PT5M' if time.step_s <= 300 else 'PT15M' if time.step_s <= 900 else 'PT30M' if time.step_s <= 1800 else 'PT1H' if time.step_s <= 3600 else 'PT6H' if time.step_s <= 21600 else 'PT12H' if time.step_s <= 43200 else 'P1D') }}
        aggregation: "{{ filters.aggregation }}"
        metricnamespace: "{{ filters.metric_namespace }}"
        $filter: "{{ filters.filter }}"
        top: "{{ filters.top }}"
        orderby: "{{ filters.orderby }}"
        rollupby: "{{ filters.rollupby }}"
        AutoAdjustTimegrain: "true"
    filters:
      - column: resource_id
        required: true
        ops: ["=", "in"]
        max_fan_out: 20
        description: "Full ARM id of the resource (IN fans out one request per resource), e.g. /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Web/sites/<app>"
        examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api"]
      - column: metric
        required: true
        ops: ["=", "in"]
        fan_out: false
        description: "Metric name(s), exact: e.g. Http5xx, Requests, AverageResponseTime (App Service); Percentage CPU (VM); requests/failed (App Insights); node_cpu_usage_percentage (AKS)"
        examples: ["Http5xx"]
      - {column: aggregation, description: "Comma list of average, minimum, maximum, total, count (default: the metric's primary aggregation, average when unset); value = the first one", examples: ["total"]}
      - {column: interval, description: "Time grain: PT1M, PT5M, PT15M, PT30M, PT1H, PT6H, PT12H, P1D or FULL (default auto, ~300 points; AutoAdjustTimegrain=true picks the closest supported grain)", examples: ["PT1M"]}
      - {column: metric_namespace, description: "Metric namespace, e.g. Microsoft.Web/sites, microsoft.insights/components, or a custom namespace (azure.applicationinsights)", examples: ["Microsoft.Web/sites"]}
      - {column: filter, description: "OData dimension filter: Instance eq '*' splits by instance; StatusCode eq '500' or StatusCode eq '503'", examples: ["Instance eq '*'"]}
      - {column: top, type: BIGINT, description: "Max series per resource when filter splits (API default 10)", examples: ["10"]}
      - {column: orderby, description: "Aggregation and direction used with top, e.g. 'total desc'", examples: ["total desc"]}
      - {column: rollupby, description: "Dimension(s) to roll up after filtering (one series instead of one per value)", examples: ["Instance"]}
    time: {column: ts, default_lookback: 1h, max_window: 30d, retention: 93d, min_step: 60s, control_lookback: 24h}
    response:
      rows_path: "$.value[*]"
      expand:
        - {explode: timeseries, as: s}
        - {explode: "@s.data", as: p}
      errors:
        - path: "$.value[*].errorMessage"
          non_empty: true
          message: "$.value[*].errorMessage"
          hint: >-
            Metrics - List returned HTTP 200 but at least one metric failed (errorCode is not Success, e.g.
            InvalidSamplingType for an unsupported aggregation, or an unknown dimension): check the metric's
            supported_aggregations and dimensions in azure_monitor_metric_definitions and fix aggregation / filter
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p.timeStamp", transform: auto_time, description: "Start of the time grain (UTC)"}
      - {name: metric, path: "name.value", description: "Metric name"}
      - name: value
        type: DOUBLE
        expr: "p[(filters.aggregation | string).split(',')[0].strip().lower()] if filters.aggregation else ([p.average, p.total, p.maximum, p.minimum, p.count] | select('number') | first)"
        description: "The first requested aggregation (without aggregation: whichever the API returned, average first); null when the grain had no data"
      - {name: average, type: DOUBLE, path: "@p.average"}
      - {name: minimum, type: DOUBLE, path: "@p.minimum"}
      - {name: maximum, type: DOUBLE, path: "@p.maximum"}
      - {name: total, type: DOUBLE, path: "@p.total"}
      - {name: count, type: DOUBLE, path: "@p.count", description: "Number of samples in the grain"}
      - name: dimensions
        type: JSON
        expr: >-
          dict([[s.metadatavalues[0].name.value, s.metadatavalues[0].value], [s.metadatavalues[1].name.value, s.metadatavalues[1].value],
          [s.metadatavalues[2].name.value, s.metadatavalues[2].value], [s.metadatavalues[3].name.value, s.metadatavalues[3].value],
          [s.metadatavalues[4].name.value, s.metadatavalues[4].value], [s.metadatavalues[5].name.value, s.metadatavalues[5].value]][:(s.metadatavalues or []) | length])
        description: "Dimension values of the series as {dimension: value} (lower-case dimension names; first 6 dimensions)"
      - {name: unit, path: unit, description: "Count, Bytes, Seconds, MilliSeconds, Percent, CountPerSecond, ..."}
      - {name: metric_display_name, path: "name.localizedValue"}
      - {name: namespace, path: "$.namespace"}
      - {name: interval_used, path: "$.interval", description: "Grain the API actually used (AutoAdjustTimegrain may change it)"}
      - {name: resource_region, path: "$.resourceregion"}
      - {name: resource_id, filter_only: true}
      - {name: aggregation, filter_only: true}
      - {name: interval, filter_only: true}
      - {name: metric_namespace, filter_only: true}
      - {name: filter, filter_only: true}
      - {name: top, type: BIGINT, filter_only: true}
      - {name: orderby, filter_only: true}
      - {name: rollupby, filter_only: true}
    max_rows: 20000
    sort_hint: "ascending time within each series; series ordered by orderby when given"
    pitfalls:
      - "Without filter you get ONE aggregated series across all dimension values; add filter = '<Dim> eq ''*''' to split, and remember top defaults to 10 series."
      - "Unsupported aggregation for a metric (e.g. total on a gauge) is a 200 with errorCode InvalidSamplingType - raised as an error; check supported_aggregations."
      - "Metric names are exact and case-sensitive in practice ('Percentage CPU', 'Http5xx'); an unknown name is HTTP 400 with the list of valid names."
      - "A grain with no data has a timestamp but no aggregation values (value null). For counters (total/count) null usually means 0; for gauges it means no samples."
      - "PT1M data over long windows is heavy: windows beyond a few days get coarser grains automatically (interval auto); FULL returns one point for the whole window."
      - "AKS / managed Prometheus metrics are not here: use the azure_prometheus source (PromQL)."
    examples:
      - sql: >-
          SELECT ts, value AS http_5xx FROM azure_monitor_metrics
          WHERE resource_id = '/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/sites/checkout-api'
            AND metric = 'Http5xx' AND aggregation = 'total' AND interval = 'PT1M'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts
        description: Per-minute HTTP 5xx count of an App Service during the incident.
      - sql: >-
          SELECT dimensions->>'instance' AS instance, max(value) AS peak_cpu, arg_max(ts, value) AS peak_at
          FROM azure_monitor_metrics
          WHERE resource_id = '/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Web/serverfarms/plan-shop-prod'
            AND metric = 'CpuPercentage' AND aggregation = 'maximum' AND filter = 'Instance eq ''*'''
          GROUP BY 1 ORDER BY peak_cpu DESC
        description: Peak CPU per App Service plan instance (dimension split).
      - sql: >-
          SELECT metric, ts, value FROM azure_monitor_metrics
          WHERE resource_id = '/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/Microsoft.Sql/servers/sql-shop-prod/databases/orders'
            AND metric IN ('cpu_percent', 'dtu_consumption_percent', 'deadlock') AND aggregation = 'maximum'
          ORDER BY metric, ts
        description: Several metrics of a SQL database in one call.
    fixtures:
      - file: metrics.json
        filters: {resource_id: "/subscriptions/1f3fa6d2-851c-4a91-9087-1a050f3a9c38/resourceGroups/todking/providers/Microsoft.Storage/storageAccounts/tkfileserv/blobServices/default", metric: "BlobCount,BlobCapacity", aggregation: "average,minimum,maximum"}
        note: "Verbatim 200 response of the official example 'Get Metric for data' (Metrics - List 2023-10-01, GetMetric.json): 2 metrics x 5 tier series x 5 hourly points."
        expect_rows: 50
        expect_columns: {ts: "2021-04-20T09:00:00Z", metric: BlobCount, value: 7.0, average: 7.0, maximum: 7.0, unit: Count, dimensions: {not_null: true}, namespace: microsoft.storage/storageaccounts/blobservices}
      - file: metrics_error.json
        filters: {resource_id: "/subscriptions/ac41e21f-afd6-4a79-8070-f01eba278f97/resourceGroups/todking/providers/Microsoft.DocumentDb/databaseAccounts/tk-cosmos-mongo", metric: "MongoRequestsCount,MongoRequests", aggregation: average}
        note: "Verbatim 200 response of the official example 'Get Metric with error' (GetMetricError.json): one metric has errorCode InvalidSamplingType inside a 200 - must fail loudly."
        expect_error: "Sampling type is not found"
    docs_url: https://learn.microsoft.com/en-us/rest/api/monitor/metrics/list

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_subscription_metrics
    title: One metric across every resource of a type in a region (Metrics - List At Subscription Scope)
    description: >-
      Metric values for all resources of one namespace (resource type) in one region of the subscription, in one
      call (GET /subscriptions/{id}/providers/Microsoft.Insights/metrics?region=..., api-version 2023-10-01). By
      default the result is split per resource (filter Microsoft.ResourceId eq '*') and the top 25 resources by the
      chosen aggregation are returned, so 'which VM / app / database spiked' needs no inventory first. Required:
      metric, metric_namespace (e.g. microsoft.compute/virtualmachines) and region (or AZURE_REGION).
    kind: timeseries
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.Insights/metrics"
      query:
        api-version: "2023-10-01"
        region: "{{ filters.region or env.AZURE_REGION }}"
        metricnames: "{{ filters.metric | as_list | join(',') }}"
        metricnamespace: "{{ filters.metric_namespace }}"
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        interval: >-
          {{ filters.interval or ('PT1M' if time.step_s <= 60 else 'PT5M' if time.step_s <= 300 else 'PT15M' if time.step_s <= 900 else 'PT30M' if time.step_s <= 1800 else 'PT1H' if time.step_s <= 3600 else 'PT6H' if time.step_s <= 21600 else 'PT12H' if time.step_s <= 43200 else 'P1D') }}
        aggregation: "{{ filters.aggregation }}"
        $filter: "{{ filters.filter or \"Microsoft.ResourceId eq '*'\" }}"
        top: "{{ filters.top or 25 }}"
        orderby: "{{ filters.orderby or ((((filters.aggregation or 'average') | string).split(',')[0].strip().lower()) ~ ' desc') }}"
        rollupby: "{{ filters.rollupby }}"
        AutoAdjustTimegrain: "true"
    filters:
      - {column: metric, required: true, ops: ["=", "in"], fan_out: false, description: "Metric name(s), exact", examples: ["Percentage CPU"]}
      - {column: metric_namespace, required: true, description: "Resource type namespace, e.g. microsoft.compute/virtualmachines, microsoft.web/sites, microsoft.sql/servers/databases", examples: ["microsoft.compute/virtualmachines"]}
      - {column: region, ops: ["=", "in"], description: "Region name, e.g. westeurope (IN fans out one call per region); default AZURE_REGION", examples: ["westeurope"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
      - {column: aggregation, description: "average, minimum, maximum, total, count (comma list; value = first)", examples: ["average"]}
      - {column: interval, description: "Time grain (default auto)", examples: ["PT5M"]}
      - {column: filter, description: "OData dimension filter (default Microsoft.ResourceId eq '*' = one series per resource)", examples: ["Microsoft.ResourceId eq '*'"]}
      - {column: top, type: BIGINT, description: "Max series (default 25)", examples: ["25"]}
      - {column: orderby, description: "Default '<first aggregation> desc'", examples: ["maximum desc"]}
      - {column: rollupby, description: "Dimension(s) to roll up", examples: ["LUN"]}
    time: {column: ts, default_lookback: 1h, max_window: 30d, retention: 93d, min_step: 60s, control_lookback: 24h}
    response:
      rows_path: "$.value[*]"
      expand:
        - {explode: timeseries, as: s}
        - {explode: "@s.data", as: p}
      errors:
        - path: "$.value[*].errorMessage"
          non_empty: true
          message: "$.value[*].errorMessage"
          hint: "At least one metric failed inside a 200 (unsupported aggregation or dimension): fix aggregation / filter"
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p.timeStamp", transform: auto_time}
      - {name: metric, path: "name.value"}
      - {name: value, type: DOUBLE, expr: "p[(filters.aggregation | string).split(',')[0].strip().lower()] if filters.aggregation else ([p.average, p.total, p.maximum, p.minimum, p.count] | select('number') | first)"}
      - {name: average, type: DOUBLE, path: "@p.average"}
      - {name: minimum, type: DOUBLE, path: "@p.minimum"}
      - {name: maximum, type: DOUBLE, path: "@p.maximum"}
      - {name: total, type: DOUBLE, path: "@p.total"}
      - {name: count, type: DOUBLE, path: "@p.count"}
      - name: resource_id
        expr: "s.metadatavalues | selectattr('name.value', 'equalto', 'microsoft.resourceid') | map(attribute='value') | first"
        description: "ARM id of the resource the series belongs to (from the microsoft.resourceid dimension)"
      - name: resource_name
        expr: "(s.metadatavalues | selectattr('name.value', 'equalto', 'microsoft.resourceid') | map(attribute='value') | first | default('', true)).split('/') | last"
      - name: dimensions
        type: JSON
        expr: >-
          dict([[s.metadatavalues[0].name.value, s.metadatavalues[0].value], [s.metadatavalues[1].name.value, s.metadatavalues[1].value],
          [s.metadatavalues[2].name.value, s.metadatavalues[2].value], [s.metadatavalues[3].name.value, s.metadatavalues[3].value]][:(s.metadatavalues or []) | length])
      - {name: unit, path: unit}
      - {name: namespace, path: "$.namespace"}
      - {name: interval_used, path: "$.interval"}
      - {name: region, path: "$.resourceregion"}
      - {name: metric_namespace, filter_only: true}
      - {name: subscription_id, filter_only: true}
      - {name: aggregation, filter_only: true}
      - {name: interval, filter_only: true}
      - {name: filter, filter_only: true}
      - {name: top, type: BIGINT, filter_only: true}
      - {name: orderby, filter_only: true}
      - {name: rollupby, filter_only: true}
    max_rows: 20000
    sort_hint: "series ordered by orderby (default first aggregation desc), ascending time within a series"
    pitfalls:
      - "region is mandatory (HTTP 400 'Missing required region params'); resources in other regions are not included - fan out region IN (...)."
      - "Only the top N series (default 25) come back: a quiet resource being absent is expected, not an outage."
      - "metric_namespace must be the resource type of the metric (microsoft.compute/virtualmachines), not a resource id."
    examples:
      - sql: >-
          SELECT resource_name, max(value) AS peak_cpu, arg_max(ts, value) AS peak_at FROM azure_monitor_subscription_metrics
          WHERE metric = 'Percentage CPU' AND metric_namespace = 'microsoft.compute/virtualmachines' AND region = 'westeurope'
            AND aggregation = 'maximum' AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY 1 ORDER BY peak_cpu DESC LIMIT 10
        description: The 10 hottest VMs of a region during the incident.
      - sql: >-
          SELECT resource_name, sum(value) AS errors_5xx FROM azure_monitor_subscription_metrics
          WHERE metric = 'Http5xx' AND metric_namespace = 'microsoft.web/sites' AND region IN ('westeurope', 'northeurope') AND aggregation = 'total'
          GROUP BY 1 ORDER BY errors_5xx DESC
        description: Which web apps returned 5xx, across two regions.
    fixtures:
      - file: subscription_metrics.json
        filters: {metric: "Data Disk Max Burst IOPS", metric_namespace: microsoft.compute/virtualmachines, region: westus2, aggregation: count}
        note: "Verbatim 200 response of the official example 'Get subscription level metric data' (Metrics - List At Subscription Scope 2023-10-01, GetMultiResourceMetric.json): 5 VM series x 13 six-hour points."
