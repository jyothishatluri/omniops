      - {column: id, ops: ["=", "in"], fan_out: false, description: "Rule ARM id (case-insensitive, filtered after fetch)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/microsoft.insights/activityLogAlerts/servicehealth-west-europe"]}
