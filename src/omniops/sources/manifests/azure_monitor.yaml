        expect_rows: 16
        expect_columns: {metric: CpuTime, display_name: "CPU Time", unit: Seconds, primary_aggregation: Total, dimension_names: Instance, time_grains: "PT1M, PT5M, PT15M, PT30M, PT1H, PT6H, PT12H, P1D", retention: P93D}
    docs_url: https://learn.microsoft.com/en-us/rest/api/monitor/metric-definitions/list

