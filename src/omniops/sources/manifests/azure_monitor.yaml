  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_alerts_summary
    title: Alert counts grouped by severity / state / rule (Alerts Management - Get Summary)
    description: >-
      Server-side counts of alert instances in the subscription (GET /subscriptions/{id}/providers/
      Microsoft.AlertsManagement/alertsSummary, api-version 2019-03-01), grouped by one or two fields (group_by,
      default 'severity,alertState'; allowed: severity, alertState, monitorCondition, monitorService, signalType,
      alertRule). One row per (group value, sub-group value) with count; total is the grand total. Same pushdown
      filters as azure_monitor_alerts (state, severity, alert_state, monitor_service, target_resource,
      target_resource_group, target_resource_type, alert_rule); the ts window becomes customTimeRange (max 30 days
      back). Cheapest way to see 'how noisy is it right now' and which rules fire the most (group_by = 'alertRule').
    kind: alerts
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.AlertsManagement/alertsSummary"
      query:
        api-version: "2019-03-01"
        groupby: "{{ filters.group_by or 'severity,alertState' }}"
        targetResource: "{{ filters.target_resource }}"
        targetResourceType: "{{ filters.target_resource_type }}"
        targetResourceGroup: "{{ filters.target_resource_group }}"
        monitorService: "{{ filters.monitor_service }}"
        monitorCondition: "{{ filters.state }}"
        severity: "{{ filters.severity }}"
        alertState: "{{ filters.alert_state }}"
        alertRule: "{{ filters.alert_rule }}"
        customTimeRange: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
    filters:
      - {column: group_by, description: "One or two comma-separated fields: severity, alertState, monitorCondition, monitorService, signalType, alertRule (default 'severity,alertState')", examples: ["severity,alertState"]}
      - {column: state, description: "Monitor condition: Fired | Resolved", examples: ["Fired"]}
      - {column: severity, ops: ["=", "in"], description: "Sev0 .. Sev4 (IN fans out)", examples: ["Sev1"]}
      - {column: alert_state, ops: ["=", "in"], description: "New | Acknowledged | Closed", examples: ["New"]}
      - {column: monitor_service, ops: ["=", "in"], description: "Platform, Log Analytics, Application Insights, ActivityLog Administrative, ServiceHealth, Resource Health, SmartDetector, VM Insights, ...", examples: ["Platform"]}
      - {column: target_resource, description: "Full ARM id of the target resource", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourcegroups/rg-shop-prod/providers/microsoft.web/sites/checkout-api"]}
      - {column: target_resource_group, description: "Resource group name of the targets", examples: ["rg-shop-prod"]}
      - {column: target_resource_type, description: "Target resource type, e.g. microsoft.web/sites", examples: ["microsoft.web/sites"]}
      - {column: alert_rule, description: "Alert rule ARM id", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/microsoft.insights/metricAlerts/checkout-api-5xx"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    time: {column: ts, default_lookback: 24h, max_window: 30d, retention: 30d, reapply: false, control_lookback: 7d}
    response:
      rows_path: "$.properties.values[*]"
      expand:
        - {explode: values, as: v, keep_empty: true}
    columns:
      - {name: group_field, path: "$.properties.groupedby", description: "First group-by field (e.g. severity)"}
      - {name: group_value, path: name, description: "Value of the first field (e.g. Sev1)"}
      - {name: group_count, type: BIGINT, path: count, description: "Alerts with this first-field value"}
      - {name: subgroup_field, path: groupedby, description: "Second group-by field (null with a single field)"}
      - {name: subgroup_value, path: "@v.name"}
      - {name: count, type: BIGINT, expr: "v['count'] if v else _['count']", description: "Alerts in this (group, sub-group) cell"}
      - {name: total, type: BIGINT, path: "$.properties.total", description: "Total alerts matching the filters"}
      - {name: smart_groups_count, type: BIGINT, path: "$.properties.smartGroupsCount"}
      - {name: group_by, filter_only: true}
      - {name: state, filter_only: true}
      - {name: severity, filter_only: true}
      - {name: alert_state, filter_only: true}
      - {name: monitor_service, filter_only: true}
      - {name: target_resource, filter_only: true}
      - {name: target_resource_group, filter_only: true}
      - {name: target_resource_type, filter_only: true}
      - {name: alert_rule, filter_only: true}
      - {name: subscription_id, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    max_rows: 2000
    pitfalls:
      - "Only the fields listed in group_by are valid; misspelled fields are HTTP 400. Values come back with their API casing (Sev0, New, Fired)."
      - "Rows with count 0 are included (every alertState is listed even when empty)."
      - "Get Summary is limited to 50 calls per minute per subscription; do not fan out over many severities - group instead."
    examples:
      - sql: >-
          SELECT group_value AS severity, subgroup_value AS alert_state, count FROM azure_monitor_alerts_summary
          WHERE ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00' AND count > 0
          ORDER BY severity, alert_state
        description: How many alerts by severity and user state fired around the incident.
      - sql: >-
          SELECT group_value AS alert_rule, group_count AS alerts FROM azure_monitor_alerts_summary
          WHERE group_by = 'alertRule' AND state = 'Fired' ORDER BY alerts DESC LIMIT 10
        description: The 10 noisiest alert rules that are still firing.
    fixtures:
      - file: alerts_summary.json
        note: "Verbatim 200 response of the official example 'Summary' (Alerts - Get Summary, 2019-03-01, groupby=severity,alertState): 5 severities x 3 alert states."
        expect_rows: 15
        expect_columns: {group_field: severity, group_value: Sev0, group_count: 6517, subgroup_field: alertState, subgroup_value: New, count: 6517, total: 14189, smart_groups_count: 100}
    docs_url: https://learn.microsoft.com/en-us/rest/api/alerts-management/alerts/alerts/get-summary?view=rest-alerts-management-alerts-2019-03-01

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_metric_alert_rules
    title: Metric alert rules (Microsoft.Insights/metricAlerts)
    description: >-
      Metric alert rule definitions in the subscription (GET /subscriptions/{id}/providers/Microsoft.Insights/
      metricAlerts, api-version 2018-03-01): one row per rule x criterion with the metric, operator, threshold
      (static) or sensitivity (dynamic), time aggregation, window, evaluation frequency, scopes, severity (0-4) and
      whether it is enabled. query is a readable condition ('Average(Percentage CPU) GreaterThan 80'). Look a
      fired alert's rule up by id (its ARM id, compared case-insensitively) or name.
    kind: entities
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.Insights/metricAlerts"
      query:
        api-version: "2018-03-01"
    filters:
      - {column: id, ops: ["=", "in"], fan_out: false, description: "Rule ARM id (matched case-insensitively, filtered after fetch)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/microsoft.insights/metricAlerts/checkout-api-5xx"]}
      - {column: name, ops: ["=", "in"], fan_out: false, description: "Rule name (matched case-insensitively, filtered after fetch)", examples: ["checkout-api-5xx"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 10}
    response:
      rows_path: "$.value[*]"
      expand:
        - {explode: "properties.criteria.allOf", as: c, keep_empty: true}
    columns:
      - name: id
        expr: "filters.id if (filters.id is string and filters.id | lower == (_.id or '') | lower) else _.id"
      - name: name
        expr: "filters.name if (filters.name is string and filters.name | lower == ((_.name or (_.id or '').split('/') | last) | lower)) else (_.name or (_.id or '').split('/') | last)"
      - {name: description, path: "properties.description"}
      - {name: severity, type: BIGINT, path: "properties.severity", description: "0 critical .. 4 verbose (fired alerts show Sev0..Sev4)"}
      - {name: enabled, type: BOOLEAN, path: "properties.enabled"}
      - {name: scopes, type: JSON, path: "properties.scopes"}
      - {name: evaluation_frequency, path: "properties.evaluationFrequency"}
      - {name: window_size, path: "properties.windowSize"}
      - {name: criteria_type, path: "properties.criteria['odata.type']", description: "SingleResource / MultipleResource MultipleMetricCriteria or WebtestLocationAvailabilityCriteria"}
      - {name: criterion_name, path: "@c.name"}
      - {name: threshold_type, path: "@c.criterionType", description: "StaticThresholdCriterion | DynamicThresholdCriterion"}
      - {name: metric_name, path: "@c.metricName"}
      - {name: metric_namespace, path: "@c.metricNamespace"}
      - {name: operator, path: "@c.operator"}
      - {name: threshold, type: DOUBLE, path: "@c.threshold"}
      - {name: time_aggregation, path: "@c.timeAggregation"}
      - {name: alert_sensitivity, path: "@c.alertSensitivity", description: "Dynamic thresholds: Low | Medium | High"}
      - {name: failing_periods, type: JSON, path: "@c.failingPeriods"}
      - {name: dimensions, type: JSON, path: "@c.dimensions"}
      - name: query
        expr: "(c.timeAggregation ~ '(' ~ c.metricName ~ ') ' ~ c.operator ~ ' ' ~ (c.threshold if c.threshold is not none else ('dynamic ' ~ (c.alertSensitivity or '')))) if c else none"
        description: "Readable condition: Aggregation(metric) operator threshold"
      - {name: target_resource_type, path: "properties.targetResourceType"}
      - {name: target_resource_region, path: "properties.targetResourceRegion"}
      - {name: auto_mitigate, type: BOOLEAN, path: "properties.autoMitigate"}
      - {name: actions, type: JSON, path: "properties.actions"}
      - {name: tags, type: JSON, path: tags}
      - {name: url, expr: "'https://portal.azure.com/#resource' ~ (_.id or '') ~ '/overview'"}
      - {name: subscription_id, filter_only: true}
    max_rows: 5000
    pitfalls:
      - "Fired alerts carry the rule as an ARM id whose casing can differ from the rule listing (metricAlerts vs metricalerts): id and name compare case-insensitively here, but other SQL comparisons should use lower()."
      - "Multi-resource rules (scopes = a resource group or subscription) fire one alert per resource; the threshold applies per resource and dimension combination."
      - "Dynamic-threshold rules have no threshold (null): the boundary is learned; see alert_sensitivity and failing_periods."
      - "api-version 2018-03-01 is the latest GA. PromQL criteria (managed Prometheus) are documented only in 2024-03-01-preview: such rules may be missing here or come without criteria - Prometheus rule groups are in azure_prometheus."
    examples:
      - sql: "SELECT name, query, window_size, evaluation_frequency, severity, enabled, scopes FROM azure_monitor_metric_alert_rules WHERE name = 'checkout-api-5xx'"
        description: The definition of the metric alert that fired.
      - sql: "SELECT name, metric_name, threshold, scopes FROM azure_monitor_metric_alert_rules WHERE enabled AND metric_name = 'Http5xx'"
        description: Every enabled rule watching a given metric.
    fixtures:
      - file: metric_alert_rules.json
        note: "Verbatim 200 response of the official example 'List metric alert rules' (Metric Alerts - List By Subscription, stable 2018-03-01, listMetricAlert.json)."
        expect_rows: 2
        expect_columns: {name: highcpu, severity: 3, enabled: true, metric_name: "CustomMetric_\\Processor(_Total)\\% Processor Time", operator: GreaterThan, threshold: 80.5, time_aggregation: Average, window_size: PT15M, query: "Average(CustomMetric_\\Processor(_Total)\\% Processor Time) GreaterThan 80.5"}
    docs_url: https://learn.microsoft.com/en-us/rest/api/monitor/metric-alerts/list-by-subscription

  # ------------------------------------------------------------------------------------------
  - name: azure_monitor_log_alert_rules
    title: Log search alert rules (Microsoft.Insights/scheduledQueryRules)
    description: >-
      Log search alert rule definitions (GET /subscriptions/{id}/providers/Microsoft.Insights/scheduledQueryRules,
      api-version 2023-12-01 GA - a superset of the 2021-08-01 shape the REST reference documents, adding dynamic
      thresholds and simple log alerts): one row per rule x condition with the KQL query, time aggregation, measure
      column, operator, threshold (or dynamic sensitivity), failing periods, window, frequency, scopes, severity and
      enabled flag. Rerun query with azure_log_analytics_query (or azure_log_analytics_resource_query for resource
      scopes) over the rule's window to see what the rule saw.
    kind: entities
    request:
      method: GET
      path: "/subscriptions/{{ filters.subscription_id or env.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.Insights/scheduledQueryRules"
      query:
        api-version: "2023-12-01"
    filters:
      - {column: id, ops: ["=", "in"], fan_out: false, description: "Rule ARM id (case-insensitive, filtered after fetch)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourceGroups/rg-shop-prod/providers/microsoft.insights/scheduledqueryrules/checkout-errors"]}
      - {column: name, ops: ["=", "in"], fan_out: false, description: "Rule name (case-insensitive, filtered after fetch)", examples: ["checkout-errors"]}
      - {column: subscription_id, ops: ["=", "in"], description: "Subscription GUID (default AZURE_SUBSCRIPTION_ID)", examples: ["11111111-2222-3333-4444-555555555555"]}
    pagination: {type: next_url, next_url_path: "$.nextLink", max_pages: 10}
    response:
      rows_path: "$.value[*]"
      expand:
        - {explode: "properties.criteria.allOf", as: c, keep_empty: true}
    columns:
      - name: id
        expr: "filters.id if (filters.id is string and filters.id | lower == (_.id or '') | lower) else _.id"
      - name: name
        expr: "filters.name if (filters.name is string and filters.name | lower == (_.name or '') | lower) else _.name"
      - {name: display_name, path: "properties.displayName"}
      - {name: description, path: "properties.description"}
      - {name: kind, path: kind, description: "LogAlert (default) | LogToMetric | SimpleLogAlert"}
      - {name: severity, type: BIGINT, path: "properties.severity"}
      - {name: enabled, type: BOOLEAN, path: "properties.enabled"}
      - {name: scopes, type: JSON, path: "properties.scopes", description: "Workspaces / App Insights / resources the query runs against"}
      - {name: target_resource_types, type: JSON, path: "properties.targetResourceTypes"}
      - {name: evaluation_frequency, path: "properties.evaluationFrequency"}
      - {name: window_size, path: "properties.windowSize"}
      - {name: override_query_time_range, path: "properties.overrideQueryTimeRange", description: "Query look-back when set (default windowSize x numberOfEvaluationPeriods)"}
      - {name: query, path: "@c.query", description: "The KQL the rule evaluates"}
      - {name: time_aggregation, path: "@c.timeAggregation"}
      - {name: metric_measure_column, path: "@c.metricMeasureColumn"}
      - {name: resource_id_column, path: "@c.resourceIdColumn"}
      - {name: operator, path: "@c.operator"}
      - {name: threshold, type: DOUBLE, path: "@c.threshold", description: "Static threshold (null for dynamic thresholds)"}
      - {name: criterion_type, path: "@c.criterionType", description: "StaticThresholdCriterion | DynamicThresholdCriterion (null on rules created with older versions = static)"}
      - {name: alert_sensitivity, path: "@c.alertSensitivity", description: "Dynamic thresholds: Low | Medium | High"}
      - {name: min_recurrence_count, type: BIGINT, path: "@c.minRecurrenceCount", description: "SimpleLogAlert: minimum result count that fires"}
      - {name: dimensions, type: JSON, path: "@c.dimensions"}
      - {name: failing_periods, type: JSON, path: "@c.failingPeriods"}
      - {name: auto_mitigate, type: BOOLEAN, path: "properties.autoMitigate"}
      - {name: resolve_configuration, type: JSON, path: "properties.resolveConfiguration", description: "{autoResolved, timeToResolve}"}
      - {name: mute_actions_duration, path: "properties.muteActionsDuration"}
      - {name: actions, type: JSON, path: "properties.actions"}
      - {name: url, expr: "'https://portal.azure.com/#resource' ~ (_.id or '') ~ '/overview'"}
      - {name: subscription_id, filter_only: true}
    max_rows: 5000
    pitfalls:
      - "The rule's query runs over windowSize (or overrideQueryTimeRange) ending at each evaluation; rerun it over the same window, not the whole incident, to compare with the threshold."
      - "Rules scoped to a subscription or resource group run resource-centric queries; rerun them with azure_log_analytics_resource_query on a resource in scope."
      - "Dynamic-threshold log alerts have no threshold (criterion_type = DynamicThresholdCriterion, see alert_sensitivity); SimpleLogAlert rules fire per matching row (min_recurrence_count) and have no aggregation."
    examples:
      - sql: "SELECT name, query, time_aggregation, operator, threshold, window_size, evaluation_frequency, scopes FROM azure_monitor_log_alert_rules WHERE name = 'checkout-errors'"
        description: The KQL and threshold of the log search alert that fired.
    fixtures:
      - file: log_alert_rules.json
        note: "Verbatim 200 response of the official example 'List scheduled query rules by subscription' (Scheduled Query Rules - List By Subscription, 2021-08-01, listScheduledQueryRulesBySubscription.json); the 2023-12-01 resource format (ARM template reference) only adds optional fields, so this shape is what the table must parse."
        expect_rows: 2
        expect_columns: {name: perf, severity: 4, enabled: true, query: "Perf | where ObjectName == \"Processor\"", time_aggregation: Average, operator: GreaterThan, threshold: 70.0, window_size: PT10M}
    docs_url: https://learn.microsoft.com/en-us/rest/api/monitor/scheduled-query-rules/list-by-subscription

