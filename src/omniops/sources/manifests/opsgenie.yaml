# Opsgenie (Atlassian) REST API as SQL tables. Direct REST, no MCP.
#
# Every path, parameter name, time format and response path below was checked against the official
# REST API reference on docs.opsgenie.com (Alert API, Alert API Continued, Incident API, Incident
# Timeline API, Schedule API, Who is On Call API, Heartbeat API, Service API, Team API, Deployment
# API, Pagination, Rate Limiting) and the Atlassian support pages for the alert / incident search
# query syntax. The offline fixtures in src/omniops/sources/fixtures/opsgenie/ are the documented
# "Sample Response" bodies; where a documented sample is not valid JSON (a missing comma, a stray
# quote) the fixture fixes only that syntax and says so in its note. Research notes:
# docs/sources/opsgenie.md.
#
# Conventions:
#   - Auth header `Authorization: GenieKey <apiKey>` (an API integration's key, or an account API key).
#   - US instance https://api.opsgenie.com, EU instance https://api.eu.opsgenie.com (OPSGENIE_API_URL).
#   - Alerts and incidents have no since/until parameters: the time window is pushed into the
#     search `query` as `createdAt >= <epoch ms> AND createdAt < <epoch ms>` (documented field
#     reference: createdAt is Unix epoch MILLISECONDS; < <= > >= are supported).
#   - Opsgenie is end-of-sale (2025-06-04) and reaches end of support on 2027-04-05, when
#     Atlassian shuts access off; accounts are migrating to Jira Service Management / Compass.
source: opsgenie
display_name: Opsgenie
vendor: Atlassian
description: >-
  Opsgenie REST API: alerts (search, detail, count, activity logs, notes, notification
  recipients), incidents (search, detail, logs, notes, associated alerts, incident timeline),
  on-call (who is on call per schedule, schedule timelines), schedules, escalations, maintenance
  windows, heartbeats, services, teams and deployments.
docs_url: https://docs.opsgenie.com/docs/api-overview
categories: [alerts, incidents, oncall, changes, services]
base_url: "{{ (env.OPSGENIE_API_URL or 'https://api.opsgenie.com') | trim('/') }}"
ui_base_url: "{{ (env.OPSGENIE_UI_URL or 'https://app.opsgenie.com') | trim('/') }}"
env:
  - {name: OPSGENIE_API_KEY, description: "API key: an API integration's key (Settings > Integrations > API; must not be restricted to access configurations for schedules/teams/services) or an account API key (Settings > API key management) with Read access. Sent as 'Authorization: GenieKey <key>'.", secret: true}
  - {name: OPSGENIE_API_URL, description: "API base URL: https://api.opsgenie.com (US, default) or https://api.eu.opsgenie.com (EU instance)", default: "https://api.opsgenie.com"}
  - {name: OPSGENIE_UI_URL, description: "Web UI base for deep links, e.g. https://acme.app.opsgenie.com or https://acme.app.eu.opsgenie.com (default https://app.opsgenie.com)", default: "https://app.opsgenie.com"}
required_env: [OPSGENIE_API_KEY]
auth:
  type: headers
  headers:
    Authorization: "GenieKey {{ env.OPSGENIE_API_KEY }}"
rate_limit:
  concurrency: 4
  requests_per_minute: 300
  max_retries: 3
  notes: >-
    Token-bucket limits per request DOMAIN (Alert, Incident, Configuration, Search, Heartbeat,
    Schedule-oncalls, ...), checked both per minute and per second, account-wide (optionally with
    per-integration fairness). Base limits depend on the subscription plan and seat count and are
    shown on the Reports > API usage page; the Configuration domain (teams, schedules, services,
    users) has the lowest limits, and alert/user listing is the Search domain. Over the limit:
    BURST (accepted, delayed 5 s) or THROTTLED (HTTP 429). Headers X-RateLimit-State
    (OK|BURST|THROTTLED), X-RateLimit-Reason, X-RateLimit-Period-In-Sec. Retry 429 and 503 with
    exponential backoff.
retention: {}
pitfalls:
  - "Opsgenie is end-of-life: end of sale 2025-06-04, end of support (access and API shut off, unmigrated data deleted) 2027-04-05. Accounts migrated to Jira Service Management stop updating here - an empty result from a migrated account is NOT evidence that nothing happened."
  - "Time windows are pushed into the search query on createdAt (epoch ms): an alert created BEFORE the window that is still open is not in opsgenie_alerts for that window. Use opsgenie_open_alerts for everything currently open, whatever its age."
  - "List Alerts can return at most 20,000 alerts (offset + limit < 20,000) and pages of at most 100; this source reads up to 1,000 newest alerts per query. Narrow the query (status, tag, team, message) rather than paging deeper."
  - "Team / user / service names in queries must be exact (wildcards are not supported for teams and users). Unknown field names in a query match nothing rather than raising an error."
  - "An API integration key that is 'restricted to access configurations' cannot read schedules, teams or services (HTTP 403); use an unrestricted integration or an account API key."
  - "EU accounts must use https://api.eu.opsgenie.com (OPSGENIE_API_URL); the US host rejects EU keys."
  - "Responders and impactedServices are returned as IDs: join opsgenie_teams / opsgenie_services to name them."
query_languages:
  opsgenie_alert_search: >-
    Opsgenie alert search query (the `query` column). field: value pairs: message: 'payment*',
    status: open | closed, acknowledged: true, tag: critical, teams: "Team Name", owner: user@x.com,
    source / entity / alias / integration.name / integration.type / details.key / details.value,
    count > 5, createdAt / lastOccurredAt as epoch MILLISECONDS with < <= > >=. Combine with AND /
    OR (parenthesise groups) and NOT; '*' only as a prefix wildcard (lorem*). Null checks:
    'owner : null', 'teams is null', 'details.key is not null'. Free text without a field searches
    the message. This source adds the createdAt window and the pushed-down filters with AND.
  opsgenie_incident_search: >-
    Opsgenie incident search query. Fields: message, description, status (open | resolved |
    closed), priority (P1..P5), teams (owner team name), services (service name), tag, actions,
    details.key / details.value, postmortemRequired, postmortemStatus, createdAt (epoch ms) with
    < <= > >=, AND / OR / NOT, prefix wildcard (lorem*).

tables:
  # ----------------------------------------------------------------------------------------------
  # Alerts
  # ----------------------------------------------------------------------------------------------
  - name: opsgenie_alerts
    title: Alerts created in a time window (search)
    description: >-
      One row per alert CREATED in the ts window, newest first (GET /v2/alerts, sort=createdAt
      desc). The window becomes `createdAt >= start AND createdAt < end` (epoch ms) inside the
      Opsgenie search query, ANDed with the optional free-form query (alert search syntax) and the
      pushed-down filters status (open | closed), tag, team (owner/responder team name), entity,
      source, alias. Use it for alert history around an incident and for "has this fired before".
    kind: alerts
    request:
      method: GET
      path: /v2/alerts
      query:
        query: >-
          {{ [('(' ~ filters.query ~ ')') if filters.query else None,
              ('status: ' ~ filters.status) if filters.status else None,
              ('tag: ' ~ (filters.tag | quote)) if filters.tag else None,
              ('teams: ' ~ (filters.team | quote)) if filters.team else None,
              ('entity: ' ~ (filters.entity | quote)) if filters.entity else None,
              ('source: ' ~ (filters.source | quote)) if filters.source else None,
              ('alias: ' ~ (filters.alias | quote)) if filters.alias else None,
              'createdAt >= ' ~ (time.start | epoch_ms),
              'createdAt < ' ~ (time.end | epoch_ms)] | select | join(' AND ') }}
        sort: createdAt
        order: desc
    filters:
      - {column: query, description: "Opsgenie alert search query (see query_languages.opsgenie_alert_search), ANDed with the window", examples: ["message: payment* AND acknowledged: false"]}
      - {column: status, description: "open | closed", examples: [open]}
      - {column: tag, description: "Alert tag (exact)", examples: [Critical]}
      - {column: team, description: "Team name (exact; responder/owner team)", examples: [ops_team]}
      - {column: entity, description: "Alert entity (exact)", examples: [EC2]}
      - {column: source, description: "Alert source (exact)", examples: [Isengard]}
      - {column: alias, description: "Alert alias (de-duplication key)", examples: [event_573]}
    time: {column: ts, default_lookback: 24h, max_window: 90d}
    pagination: {type: offset, offset_param: query.offset, limit_param: query.limit, page_size: 100, max_pages: 10}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: createdAt, description: "Alert creation time"}
      - {name: id, path: id}
      - {name: tiny_id, path: tinyId, description: "Short, rolling id shown in the UI"}
      - {name: alias, path: alias, description: "De-duplication key"}
      - {name: title, path: message, description: "Alert message"}
      - {name: status, path: status, description: "open | closed"}
      - {name: severity, path: priority, description: "Opsgenie priority P1 (highest) .. P5"}
      - {name: acknowledged, type: BOOLEAN, path: acknowledged}
      - {name: is_seen, type: BOOLEAN, path: isSeen}
      - {name: snoozed, type: BOOLEAN, path: snoozed}
      - {name: snoozed_until, type: TIMESTAMP, path: snoozedUntil}
      - {name: count, type: BIGINT, path: count, description: "Occurrences de-duplicated into this alert"}
      - {name: last_occurred_at, type: TIMESTAMP, path: lastOccurredAt}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt}
      - {name: source, path: source}
      - {name: owner, path: owner, description: "Owner username (empty when unowned)"}
      - {name: tags, type: JSON, path: tags}
      - {name: responders, type: JSON, path: responders, description: "[{id, type: team|user|escalation|schedule}] (IDs only)"}
      - {name: integration, path: integration.name}
      - {name: integration_type, path: integration.type}
      - {name: ack_time_ms, type: DOUBLE, path: report.ackTime, description: "Time to acknowledge (report.ackTime; milliseconds)"}
      - {name: close_time_ms, type: DOUBLE, path: report.closeTime, description: "Time to close (report.closeTime; milliseconds)"}
      - {name: acknowledged_by, path: report.acknowledgedBy}
      - {name: closed_by, path: report.closedBy}
      - {name: query, filter_only: true}
      - {name: tag, filter_only: true}
      - {name: team, filter_only: true}
      - {name: entity, filter_only: true}
    sort_hint: "newest first (sort=createdAt, order=desc)"
    pitfalls:
      - "Only alerts CREATED in the window (createdAt); an alert de-duplicated into an older open alert raises count and lastOccurredAt but keeps the old createdAt."
      - "List rows omit description, details (custom properties), entity and actions: read opsgenie_alert_detail for one alert."
      - "priority is not a documented search field: filter severity in SQL (it is re-applied by DuckDB)."
    examples:
      - sql: >-
          SELECT ts, tiny_id, title, status, severity, count, source, acknowledged_by
          FROM opsgenie_alerts
          WHERE ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC
        description: Every alert opened in the two hours around an incident.
      - sql: >-
          SELECT title, count(*) AS alerts, sum(count) AS occurrences, min(ts) AS first_seen
          FROM opsgenie_alerts WHERE query = 'message: checkout*' AND ts >= now() - INTERVAL 7 DAY
          GROUP BY title ORDER BY alerts DESC
        description: Has this alert fired before (7-day recurrence by message)?
    fixtures:
      - file: alerts.json
        expect_rows: 2
        expect_columns: {ts: "2017-03-21T20:32:52.353Z", id: 70413a06-38d6-4c85-92b8-5ebc900d42e2, tiny_id: "1791", alias: event_573, title: "Our servers are in danger", status: closed, severity: P4, acknowledged: false, count: 79, source: Isengard, tags: '["OverwriteQuietHours","Critical"]', integration: Nebuchadnezzar, ack_time_ms: 15702, acknowledged_by: "agent_smith@opsgenie.com"}
        note: "Official Sample Response of GET /v2/alerts (List Alerts) on https://docs.opsgenie.com/docs/alert-api, verbatim."
    ui_link: "{{ ui_base_url }}/alert/list"
    docs_url: https://docs.opsgenie.com/docs/alert-api#list-alerts

  - name: opsgenie_open_alerts
    title: Currently open alerts (any age)
    description: >-
      One row per alert that is open right now, newest first, regardless of when it was created
      (query `status: open`, plus the optional query / tag / team / acknowledged filters). No
      time window. Use it to see what is firing at the moment of an investigation.
    kind: alerts
    request:
      method: GET
      path: /v2/alerts
      query:
        query: >-
          {{ ['status: open',
              ('(' ~ filters.query ~ ')') if filters.query else None,
              ('tag: ' ~ (filters.tag | quote)) if filters.tag else None,
              ('teams: ' ~ (filters.team | quote)) if filters.team else None,
              ('acknowledged: ' ~ (filters.acknowledged | string | lower)) if filters.acknowledged is not none and filters.acknowledged is defined else None] | select | join(' AND ') }}
        sort: createdAt
        order: desc
    filters:
      - {column: query, description: "Additional alert search query", examples: ["message: payment*"]}
      - {column: tag, description: "Alert tag", examples: [Critical]}
      - {column: team, description: "Team name (exact)", examples: [ops_team]}
      - {column: acknowledged, type: BOOLEAN, description: "true = acknowledged, false = not yet acknowledged", examples: ["false"]}
    pagination: {type: offset, offset_param: query.offset, limit_param: query.limit, page_size: 100, max_pages: 10}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: createdAt}
      - {name: id, path: id}
      - {name: tiny_id, path: tinyId}
      - {name: alias, path: alias}
      - {name: title, path: message}
      - {name: status, path: status}
      - {name: severity, path: priority}
      - {name: acknowledged, type: BOOLEAN, path: acknowledged}
      - {name: snoozed, type: BOOLEAN, path: snoozed}
      - {name: count, type: BIGINT, path: count}
      - {name: last_occurred_at, type: TIMESTAMP, path: lastOccurredAt}
      - {name: source, path: source}
      - {name: owner, path: owner}
      - {name: tags, type: JSON, path: tags}
      - {name: responders, type: JSON, path: responders}
      - {name: integration, path: integration.name}
      - {name: query, filter_only: true}
      - {name: tag, filter_only: true}
      - {name: team, filter_only: true}
    examples:
      - sql: "SELECT ts, title, severity, acknowledged, count, last_occurred_at FROM opsgenie_open_alerts ORDER BY severity, ts DESC LIMIT 50"
        description: What is open right now, most severe first.
      - sql: "SELECT ts, title, source FROM opsgenie_open_alerts WHERE acknowledged = false AND team = 'ops_team'"
        description: Unacknowledged alerts of one team.
    fixtures:
      - file: alerts.json
        expect_rows: 2
        expect_columns: {id: 70413a06-38d6-4c85-92b8-5ebc900d42e2, title: "Our servers are in danger", severity: P4}
        note: "Official Sample Response of GET /v2/alerts (List Alerts) on https://docs.opsgenie.com/docs/alert-api (the docs sample mixes statuses; the live query is status: open)."
    ui_link: "{{ ui_base_url }}/alert/list?query=status%3Aopen"
    docs_url: https://docs.opsgenie.com/docs/alert-api#list-alerts

  - name: opsgenie_alert_detail
    title: One alert (full detail)
    description: >-
      Full detail of one alert (GET /v2/alerts/{identifier}): adds description, details (custom
      properties from the monitoring tool), entity and actions. Filter alert = the alert id; set
      identifier_type = 'tiny' for a tinyId or 'alias' for an alias (alias works for OPEN alerts
      only). The id column always holds the alert id.
    kind: alerts
    request:
      method: GET
      path: "/v2/alerts/{{ filters.alert | urlencode }}"
      query:
        identifierType: "{{ filters.identifier_type or 'id' }}"
    filters:
      - {column: alert, required: true, ops: ["=", "in"], max_fan_out: 20, description: "Alert id (or tinyId / alias with identifier_type)", examples: [70413a06-38d6-4c85-92b8-5ebc900d42e2]}
      - {column: identifier_type, description: "id (default) | tiny | alias", examples: [id]}
    response:
      rows_path: "$.data"
    columns:
      - {name: alert, filter_only: true, description: "The identifier you asked for"}
      - {name: id, path: id}
      - {name: ts, type: TIMESTAMP, path: createdAt}
      - {name: tiny_id, path: tinyId}
      - {name: alias, path: alias}
      - {name: title, path: message}
      - {name: description, path: description}
      - {name: status, path: status}
      - {name: severity, path: priority}
      - {name: acknowledged, type: BOOLEAN, path: acknowledged}
      - {name: count, type: BIGINT, path: count}
      - {name: last_occurred_at, type: TIMESTAMP, path: lastOccurredAt}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt}
      - {name: source, path: source}
      - {name: entity, path: entity}
      - {name: owner, path: owner}
      - {name: details, type: JSON, path: details, description: "Custom properties (key/value) sent by the monitoring tool"}
      - {name: tags, type: JSON, path: tags}
      - {name: actions, type: JSON, path: actions}
      - {name: responders, type: JSON, path: responders}
      - {name: integration, path: integration.name}
      - {name: integration_type, path: integration.type}
      - {name: ack_time_ms, type: DOUBLE, path: report.ackTime}
      - {name: close_time_ms, type: DOUBLE, path: report.closeTime}
      - {name: acknowledged_by, path: report.acknowledgedBy}
      - {name: closed_by, path: report.closedBy}
      - {name: identifier_type, filter_only: true}
    pitfalls:
      - "identifier_type = 'alias' cannot retrieve CLOSED alerts (documented); use the id."
    examples:
      - sql: "SELECT title, description, details, entity, source, status FROM opsgenie_alert_detail WHERE alert = '70413a06-38d6-4c85-92b8-5ebc900d42e2'"
        description: The alert's full payload (custom details carry host, region, runbook links ...).
      - sql: "SELECT id, title, status, details FROM opsgenie_alert_detail WHERE alert = '1791' AND identifier_type = 'tiny'"
        description: Look an alert up by the short id shown in the UI / notification.
    fixtures:
      - file: alert.json
        filters: {alert: 70413a06-38d6-4c85-92b8-5ebc900d42e2}
        expect_rows: 1
        expect_columns: {id: 70413a06-38d6-4c85-92b8-5ebc900d42e2, title: "Our servers are in danger", description: "Example description", entity: EC2, severity: P5, details: '{"serverName":"Zion","region":"Oregon"}', actions: '["Restart","Ping"]', closed_by: "neo@opsgenie.com"}
        note: "Official Sample Response of GET /v2/alerts/:identifier (Get Alert) on https://docs.opsgenie.com/docs/alert-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/alert-api#get-alert

  - name: opsgenie_alert_count
    title: Count of alerts matching a query in a window
    description: >-
      Number of alerts created in the ts window matching the optional query and status filter
      (GET /v2/alerts/count). One row. Cheap: use it before listing, or to compare the incident
      window with a baseline window.
    kind: generic
    request:
      method: GET
      path: /v2/alerts/count
      query:
        query: >-
          {{ [('(' ~ filters.query ~ ')') if filters.query else None,
              ('status: ' ~ filters.status) if filters.status else None,
              'createdAt >= ' ~ (time.start | epoch_ms),
              'createdAt < ' ~ (time.end | epoch_ms)] | select | join(' AND ') }}
    filters:
      - {column: query, description: "Alert search query", examples: ["tag: Critical"]}
      - {column: status, description: "open | closed", examples: [open]}
    time: {column: ts, default_lookback: 24h, max_window: 90d, reapply: false}
    response:
      rows_path: "$.data"
    columns:
      - {name: count, type: BIGINT, path: count}
      - {name: query, filter_only: true}
      - {name: status, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: >-
          WITH now_w AS (SELECT count FROM opsgenie_alert_count WHERE query = 'tag: Critical' AND ts >= now() - INTERVAL 1 HOUR),
               base AS (SELECT count FROM opsgenie_alert_count WHERE query = 'tag: Critical' AND ts BETWEEN now() - INTERVAL 25 HOUR AND now() - INTERVAL 24 HOUR)
          SELECT now_w.count AS last_hour, base.count AS same_hour_yesterday FROM now_w, base
        description: Critical alert volume in the last hour vs the same hour yesterday.
    fixtures:
      - file: alert_count.json
        expect_rows: 1
        expect_columns: {count: 7}
        note: "Official Sample Response of GET /v2/alerts/count (Count Alerts) on https://docs.opsgenie.com/docs/alert-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/alert-api#count-alerts

  - name: opsgenie_alert_logs
    title: Activity log of an alert
    description: >-
      One row per activity log entry of an alert, oldest first: created, acknowledged, closed,
      notifications, views, escalations, actions, with the user/system that acted. alert_id
      required (IN up to 20); identifier_type tiny | alias for non-id identifiers.
    kind: events
    request:
      method: GET
      path: "/v2/alerts/{{ filters.alert_id | urlencode }}/logs"
      query:
        identifierType: "{{ filters.identifier_type or 'id' }}"
        order: asc
        limit: 100
    filters:
      - {column: alert_id, required: true, ops: ["=", "in"], max_fan_out: 20, description: "Alert id", examples: [8418d193-2dab-4490-b331-8c02cdd196b7]}
      - {column: identifier_type, description: "id (default) | tiny | alias", examples: [id]}
    pagination: {type: next_url, next_url_path: "$.paging.next", max_pages: 10}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: createdAt}
      - {name: message, path: log, description: "Log line, e.g. 'Alert acknowledged via web'"}
      - {name: type, path: type, description: "system | alertRecipient | ..."}
      - {name: author, path: owner, description: "User (or system) that acted"}
      - {name: offset, path: offset, description: "Pagination offset token"}
      - {name: alert_id, filter_only: true}
      - {name: identifier_type, filter_only: true}
    sort_hint: "oldest first (order=asc)"
    examples:
      - sql: "SELECT ts, author, type, message FROM opsgenie_alert_logs WHERE alert_id = '8418d193-2dab-4490-b331-8c02cdd196b7' ORDER BY ts"
        description: Who was notified, who acknowledged and when.
    fixtures:
      - file: alert_logs.json
        filters: {alert_id: ee624ed0-3ee0-45be-9c9d-e7667eaf21e5}
        expect_rows: 2
        expect_columns: {ts: "2017-04-12T12:27:52.838Z", message: "Alert acknowledged via web", type: system, author: "neo@opsgenie.com", alert_id: ee624ed0-3ee0-45be-9c9d-e7667eaf21e5}
        note: "Official Sample Response of GET /v2/alerts/:identifier/logs (List Alert Logs) on https://docs.opsgenie.com/docs/alert-api-continued, verbatim."
    docs_url: https://docs.opsgenie.com/docs/alert-api-continued#list-alert-logs

  - name: opsgenie_alert_notes
    title: Notes on an alert
    description: One row per note added to the alert (alert_id required, IN up to 20), newest first.
    kind: events
    request:
      method: GET
      path: "/v2/alerts/{{ filters.alert_id | urlencode }}/notes"
      query:
        identifierType: "{{ filters.identifier_type or 'id' }}"
        limit: 100
    filters:
      - {column: alert_id, required: true, ops: ["=", "in"], max_fan_out: 20, description: "Alert id", examples: [8418d193-2dab-4490-b331-8c02cdd196b7]}
      - {column: identifier_type, description: "id (default) | tiny | alias", examples: [id]}
    pagination: {type: next_url, next_url_path: "$.paging.next", max_pages: 5}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: createdAt}
      - {name: message, path: note}
      - {name: author, path: owner}
      - {name: offset, path: offset}
      - {name: alert_id, filter_only: true}
      - {name: identifier_type, filter_only: true}
    examples:
      - sql: "SELECT ts, author, message FROM opsgenie_alert_notes WHERE alert_id = '8418d193-2dab-4490-b331-8c02cdd196b7' ORDER BY ts"
        description: What responders wrote on the alert.
    fixtures:
      - file: alert_notes.json
        filters: {alert_id: ee624ed0-3ee0-45be-9c9d-e7667eaf21e5}
        expect_rows: 2
        expect_columns: {ts: "2017-04-12T13:36:21.874Z", author: "morpheus@opsgenie.com", offset: "1492004181874000155"}
        note: "Official Sample Response of GET /v2/alerts/:identifier/notes (List Alert Notes) on https://docs.opsgenie.com/docs/alert-api-continued; structure, owners, times and offsets verbatim, the two note texts (film quotes in the docs) replaced with neutral sentences."
    docs_url: https://docs.opsgenie.com/docs/alert-api-continued#list-alert-notes

  - name: opsgenie_alert_recipients
    title: Notification recipients of an alert
    description: >-
      One row per user the alert was routed to, with their state (action = acted, notactive,
      ...) and the method (e.g. Acknowledge). Shows whether the on-call person was actually
      notified and responded. alert_id required.
    kind: events
    request:
      method: GET
      path: "/v2/alerts/{{ filters.alert_id | urlencode }}/recipients"
      query:
        identifierType: "{{ filters.identifier_type or 'id' }}"
    filters:
      - {column: alert_id, required: true, ops: ["=", "in"], max_fan_out: 20, description: "Alert id", examples: [8418d193-2dab-4490-b331-8c02cdd196b7]}
      - {column: identifier_type, description: "id (default) | tiny | alias", examples: [id]}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: user, path: user.username}
      - {name: user_id, path: user.id}
      - {name: state, path: state, description: "action | notactive | ... (recipient state)"}
      - {name: method, path: method, description: "Action taken (Acknowledge, Close ...) or empty"}
      - {name: ts, type: TIMESTAMP, path: createdAt}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt}
      - {name: alert_id, filter_only: true}
      - {name: identifier_type, filter_only: true}
    examples:
      - sql: "SELECT user, state, method, ts, updated_at FROM opsgenie_alert_recipients WHERE alert_id = '8418d193-2dab-4490-b331-8c02cdd196b7'"
        description: Was the right person paged, and did they act?
    fixtures:
      - file: alert_recipients.json
        filters: {alert_id: 8418d193-2dab-4490-b331-8c02cdd196b7}
        expect_rows: 2
        expect_columns: {user: "neo@opsgenie.com", state: action, method: Acknowledge, ts: "2017-04-12T12:27:28.52Z"}
        note: "Official Sample Response of GET /v2/alerts/:identifier/recipients (List Alert Recipients) on https://docs.opsgenie.com/docs/alert-api-continued, verbatim."
    docs_url: https://docs.opsgenie.com/docs/alert-api-continued#list-alert-recipients

  # ----------------------------------------------------------------------------------------------
  # Incidents
  # ----------------------------------------------------------------------------------------------
  - name: opsgenie_incidents
    title: Incidents created in a time window (search)
    description: >-
      One row per Opsgenie incident CREATED in the ts window, newest first (GET /v1/incidents,
      sort=createdAt desc). The window is pushed into the incident search query on createdAt
      (epoch ms), ANDed with the optional query and the status (open | resolved | closed),
      priority (P1..P5), team (owner team name) and service (service name) filters.
    kind: incidents
    request:
      method: GET
      path: /v1/incidents
      query:
        query: >-
          {{ [('(' ~ filters.query ~ ')') if filters.query else None,
              ('status: ' ~ filters.status) if filters.status else None,
              ('priority: ' ~ filters.severity) if filters.severity else None,
              ('teams: ' ~ (filters.team | quote)) if filters.team else None,
              ('services: ' ~ (filters.service | quote)) if filters.service else None,
              'createdAt >= ' ~ (time.start | epoch_ms),
              'createdAt < ' ~ (time.end | epoch_ms)] | select | join(' AND ') }}
        sort: createdAt
        order: desc
    filters:
      - {column: query, description: "Incident search query (see query_languages.opsgenie_incident_search)", examples: ["message: checkout*"]}
      - {column: status, description: "open | resolved | closed", examples: [open]}
      - {column: severity, description: "Priority P1..P5", examples: [P1]}
      - {column: team, description: "Owner team name (exact)", examples: [ops_team]}
      - {column: service, description: "Impacted service name (exact)", examples: [checkout]}
    time: {column: ts, default_lookback: 7d, max_window: 180d}
    pagination: {type: offset, offset_param: query.offset, limit_param: query.limit, page_size: 100, max_pages: 10}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: createdAt}
      - {name: id, path: id}
      - {name: tiny_id, path: tinyId}
      - {name: title, path: message}
      - {name: status, path: status, description: "open | resolved | closed"}
      - {name: severity, path: priority, description: "P1..P5"}
      - {name: tags, type: JSON, path: tags}
      - {name: responders, type: JSON, path: responders, description: "[{type, id}] (IDs)"}
      - {name: impacted_services, type: JSON, path: impactedServices, description: "Service IDs (join opsgenie_services)"}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt}
      - {name: query, filter_only: true}
      - {name: team, filter_only: true}
      - {name: service, filter_only: true}
    pitfalls:
      - "The Incident API needs a plan with Incident Management (Standard / Enterprise); otherwise HTTP 402/403."
      - "service filters by service NAME in the search query, but impacted_services holds IDs."
    examples:
      - sql: >-
          SELECT ts, tiny_id, title, status, severity, impacted_services FROM opsgenie_incidents
          WHERE ts >= now() - INTERVAL 30 DAY ORDER BY ts DESC
        description: Incidents of the last 30 days (recurrence / prior incidents).
      - sql: "SELECT ts, title, severity FROM opsgenie_incidents WHERE status = 'open' AND ts >= now() - INTERVAL 7 DAY"
        description: Incidents still open that were declared this week.
    fixtures:
      - file: incidents.json
        expect_rows: 2
        expect_columns: {ts: "2017-03-21T20:32:52.353Z", id: 70413a06-38d6-4c85-92b8-5ebc900d42e2, tiny_id: "1791", title: "Our servers are in danger", status: closed, severity: P4, impacted_services: '["df635094-efd3-48e4-b73a-b8bdfbf1178f","b6868288-02c7-440b-a693-0a5cf20576f5"]'}
        note: "Official Sample Response of GET /v1/incidents (List Incidents) on https://docs.opsgenie.com/docs/incident-api, verbatim."
    ui_link: "{{ ui_base_url }}/incident/list"
    docs_url: https://docs.opsgenie.com/docs/incident-api#list-incidents

  - name: opsgenie_incident_detail
