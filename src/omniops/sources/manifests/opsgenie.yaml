        identifierType: "{{ filters.identifier_type or 'id' }}"
    filters:
      - {column: incident, required: true, ops: ["=", "in"], max_fan_out: 20, description: "Incident id (or tinyId with identifier_type)", examples: [70413a06-38d6-4c85-92b8-5ebc900d42e2]}
      - {column: identifier_type, description: "id (default) | tiny", examples: [id]}
    response:
      rows_path: "$.data"
    columns:
      - {name: incident, filter_only: true, description: "The identifier you asked for"}
      - {name: id, path: id}
      - {name: ts, type: TIMESTAMP, path: createdAt}
      - {name: tiny_id, path: tinyId}
      - {name: title, path: message}
      - {name: description, path: description}
      - {name: status, path: status}
      - {name: severity, path: priority}
      - {name: tags, type: JSON, path: tags}
      - {name: responders, type: JSON, path: responders}
      - {name: impacted_services, type: JSON, path: impactedServices}
      - {name: extra_properties, type: JSON, path: extraProperties}
