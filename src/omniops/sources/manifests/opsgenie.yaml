  # ----------------------------------------------------------------------------------------------
  # On-call and schedules
  # ----------------------------------------------------------------------------------------------
  - name: opsgenie_oncall
    title: Who is on call (per schedule)
    description: >-
      One row per (schedule, on-call user) at the start of the ts window (default: when the alert
      fired). With schedule (name or id; schedule_identifier_type = name | id, default name) it
      calls GET /v2/schedules/{schedule}/on-calls?flat=true; without it the (deprecated but still
      documented) GET /v2/schedules/on-calls?flat=true covering every schedule. The ts predicate
      sets the `date` parameter and is not re-applied to rows.
    kind: entities
    request:
      method: GET
      path: "{{ ('/v2/schedules/' ~ (filters.schedule | urlencode) ~ '/on-calls') if filters.schedule else '/v2/schedules/on-calls' }}"
      query:
        scheduleIdentifierType: "{{ (filters.schedule_identifier_type or 'name') if filters.schedule else None }}"
        flat: "true"
        date: "{{ time.start | strftime('%Y-%m-%dT%H:%M:%S+00:00') }}"
    filters:
      - {column: schedule, ops: ["=", "in"], max_fan_out: 10, description: "Schedule name (default) or id (with schedule_identifier_type = 'id')", examples: [ScheduleName]}
      - {column: schedule_identifier_type, description: "name (default) | id", examples: [name]}
    time: {column: ts, default_lookback: 5m, reapply: false}
    response:
      rows_path: "$.data"
      expand:
        - {explode: onCallRecipients, as: r}
    columns:
      - {name: schedule, path: _parent.name}
      - {name: schedule_id, path: _parent.id}
      - {name: schedule_enabled, type: BOOLEAN, path: _parent.enabled}
      - {name: user, path: "@r", description: "On-call recipient username (flat=true)"}
      - {name: schedule_identifier_type, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true, description: "Point in time (date parameter = window start)"}
    pitfalls:
      - "The all-schedules endpoint /v2/schedules/on-calls is marked DEPRECATED (since 2018-08-31) in the docs; give schedule = '<name>' when you know it."
      - "flat=true resolves teams/escalations to usernames but drops the escalation structure; use opsgenie_schedule_timeline for rotations and overrides."
    examples:
      - sql: "SELECT schedule, user FROM opsgenie_oncall WHERE schedule = 'ScheduleName'"
        description: Who was on call for the schedule when the alert fired.
      - sql: "SELECT schedule, user FROM opsgenie_oncall WHERE ts = TIMESTAMP '2026-10-01 03:00:00'"
        description: Everyone on call across all schedules at 03:00 UTC.
    fixtures:
      - file: oncall_flat.json
        filters: {schedule: ScheduleName}
        expect_rows: 1
        expect_columns: {schedule: ScheduleName, schedule_id: d875alp4-9b4e-4219-a803-0c26936d18de, schedule_enabled: true, user: "user4@opsgenie.com"}
        note: "Official Sample Response (flat = true) of GET /v2/schedules/:scheduleIdentifier/on-calls (Get On Calls) on https://docs.opsgenie.com/docs/who-is-on-call-api, verbatim."
      - file: oncalls_all_flat.json
        expect_rows: 3
        expect_columns: {schedule: ScheduleName, user: "user4@opsgenie.com"}
        note: "Sample Response (flat = true) of GET /v2/schedules/on-calls (List On Calls, deprecated) on https://docs.opsgenie.com/docs/who-is-on-call-api; a stray double quote after the second _parent.id is removed, otherwise verbatim."
    docs_url: https://docs.opsgenie.com/docs/who-is-on-call-api#get-on-calls

  - name: opsgenie_schedules
    title: Schedules
    description: One row per schedule (GET /v2/schedules?expand=rotation) with its time zone, owner team and rotations.
    kind: entities
    request:
      method: GET
      path: /v2/schedules
      query:
        expand: rotation
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: timezone, path: timezone}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: owner_team, path: ownerTeam.name}
      - {name: owner_team_id, path: ownerTeam.id}
      - {name: rotations, type: JSON, path: rotations, description: "Rotations with type, length, startDate and participants"}
      - {name: participants, type: JSON, path: "rotations[*].participants[*]", description: "All participants (users / teams) of all rotations"}
    examples:
      - sql: "SELECT name, timezone, owner_team, enabled FROM opsgenie_schedules ORDER BY name"
        description: Schedule names (the schedule filter of opsgenie_oncall / opsgenie_schedule_timeline).
    fixtures:
      - file: schedules.json
        expect_rows: 1
        expect_columns: {id: d875e654-9b4e-4219-alp3-0c26936d18de, name: ScheduleName, timezone: Europe/Kirov, enabled: true, owner_team: ops_team}
        note: "Official Response of GET /v2/schedules (List Schedules) on https://docs.opsgenie.com/docs/schedule-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/schedule-api#list-schedules

  - name: opsgenie_schedule_timeline
    title: Schedule timeline (final on-call periods)
    description: >-
      One row per final on-call period of a schedule's rotations covering the ts window (GET
      /v2/schedules/{schedule}/timeline, interval in days from the window start): rotation,
      recipient, period type (default | override | forwarding) and start/end. schedule required
      (name by default; schedule_identifier_type = 'id' for ids). The ts predicate is not
      re-applied; filter start_at / end_at in SQL.
    kind: entities
    request:
      method: GET
      path: "/v2/schedules/{{ filters.schedule | urlencode }}/timeline"
      query:
        identifierType: "{{ filters.schedule_identifier_type or 'name' }}"
        date: "{{ time.start | strftime('%Y-%m-%dT%H:%M:%S+00:00') }}"
        interval: "{{ [((time.range_s + 86399) // 86400), 1] | max }}"
        intervalUnit: days
    filters:
      - {column: schedule, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Schedule name (or id with schedule_identifier_type = 'id')", examples: [ScheduleName]}
      - {column: schedule_identifier_type, description: "name (default) | id", examples: [name]}
    time: {column: ts, default_lookback: 24h, max_window: 31d, reapply: false}
    response:
      rows_path: "$.data.finalTimeline.rotations[*]"
      expand:
        - {explode: periods, as: p}
    columns:
      - {name: schedule, path: "$.data._parent.name"}
      - {name: schedule_id, path: "$.data._parent.id"}
      - {name: rotation, path: name}
      - {name: rotation_id, path: id}
      - {name: user, path: "@p.recipient.name", description: "Recipient name (username for users, team name for teams)"}
      - {name: recipient_type, path: "@p.recipient.type", description: "user | team | escalation | none"}
      - {name: period_type, path: "@p.type", description: "default | override | forwarding"}
      - {name: start_at, type: TIMESTAMP, path: "@p.startDate"}
      - {name: end_at, type: TIMESTAMP, path: "@p.endDate"}
      - {name: schedule_identifier_type, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: >-
          SELECT rotation, user, period_type, start_at, end_at FROM opsgenie_schedule_timeline
          WHERE schedule = 'ScheduleName' AND ts BETWEEN TIMESTAMP '2026-10-01 00:00:00' AND TIMESTAMP '2026-10-02 00:00:00'
          ORDER BY start_at
        description: Who covered the schedule during an incident day, including overrides.
    fixtures:
      - file: schedule_timeline.json
        filters: {schedule: ScheduleName}
        expect_rows: 3
        expect_columns: {schedule: ScheduleName, rotation: "First Rotation", user: "user2@opsgenie.com", recipient_type: user, period_type: override, start_at: "2017-05-17T14:56:34.603Z", end_at: "2017-05-18T14:33:00Z"}
        note: "Response of GET /v2/schedules/:identifier/timeline (Get Schedule Timeline) on https://docs.opsgenie.com/docs/schedule-api; the documented sample misses one comma between two baseTimeline periods, added here - otherwise verbatim."
    docs_url: https://docs.opsgenie.com/docs/schedule-api#get-schedule-timeline

  # ----------------------------------------------------------------------------------------------
  # Heartbeats, services, teams, deployments
  # ----------------------------------------------------------------------------------------------
  - name: opsgenie_heartbeats
    title: Heartbeats
    description: >-
      One row per heartbeat monitor (GET /v2/heartbeats): interval, enabled, owner team and the
      alert it raises when expired. A heartbeat that stopped pinging means a monitored job or
      integration is dead - often the real cause behind 'no data'. The expired flag is read per
      heartbeat from opsgenie_heartbeat.
    kind: entities
    request:
      method: GET
      path: /v2/heartbeats
    response:
      rows_path: "$.data.heartbeats[*]"
    columns:
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: interval, type: BIGINT, path: interval}
      - {name: interval_unit, path: intervalUnit, description: "minutes | hours | days"}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: expired, type: BOOLEAN, path: expired, description: "Present when the API returns it (always in opsgenie_heartbeat)"}
      - {name: owner_team, path: ownerTeam.name}
      - {name: alert_message, path: alertMessage}
      - {name: alert_priority, path: alertPriority}
      - {name: alert_tags, type: JSON, path: alertTags}
    examples:
      - sql: "SELECT name, interval, interval_unit, enabled, owner_team FROM opsgenie_heartbeats WHERE enabled ORDER BY name"
        description: Enabled heartbeat monitors (then check expired ones with opsgenie_heartbeat).
    fixtures:
      - file: heartbeats.json
        expect_rows: 3
        expect_columns: {name: hb1, interval: 5, interval_unit: minutes, enabled: true, owner_team: "A team", alert_priority: P3}
        note: "Official Response of GET /v2/heartbeats (List Heartbeats) on https://docs.opsgenie.com/docs/heartbeat-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/heartbeat-api#list-heartbeats

  - name: opsgenie_heartbeat
    title: One heartbeat (with expired state)
    description: One heartbeat by name (GET /v2/heartbeats/{name}), including whether it is expired (no ping within its interval).
    kind: entities
    request:
      method: GET
      path: "/v2/heartbeats/{{ filters.name | urlencode }}"
    filters:
      - {column: name, required: true, ops: ["=", "in"], max_fan_out: 20, description: "Heartbeat name", examples: [HeartbeatName]}
    response:
      rows_path: "$.data"
    columns:
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: interval, type: BIGINT, path: interval}
      - {name: interval_unit, path: intervalUnit}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: expired, type: BOOLEAN, path: expired}
      - {name: owner_team, path: ownerTeam.name}
      - {name: alert_message, path: alertMessage}
      - {name: alert_priority, path: alertPriority}
      - {name: alert_tags, type: JSON, path: alertTags}
    examples:
      - sql: "SELECT name, expired, interval, interval_unit FROM opsgenie_heartbeat WHERE name IN ('HeartbeatName', 'nightly-backup')"
        description: Did the job's heartbeat stop?
    fixtures:
      - file: heartbeat.json
        filters: {name: HeartbeatName}
        expect_rows: 1
        expect_columns: {name: HeartbeatName, expired: true, interval: 10, owner_team: ops_team, alert_tags: '["heartbeatTag1","heartbeatTag2"]'}
        note: "Official Response of GET /v2/heartbeats/:heartbeatName (Get Heartbeat Request) on https://docs.opsgenie.com/docs/heartbeat-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/heartbeat-api#get-heartbeat-request

  - name: opsgenie_services
    title: Services
    description: One row per Opsgenie service (GET /v1/services), sorted by name; optional service search query (e.g. name:checkout). Team-scoped keys see only their team's services.
    kind: entities
    request:
      method: GET
      path: /v1/services
      query:
        query: "{{ filters.query }}"
        sort: name
        order: asc
    filters:
      - {column: query, description: "Service search query, e.g. name:checkout", examples: ["name:exampleService"]}
    pagination: {type: offset, offset_param: query.offset, limit_param: query.limit, page_size: 100, max_pages: 5}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: service, path: name}
      - {name: description, path: description}
      - {name: team_id, path: teamId}
      - {name: tags, type: JSON, path: tags}
      - {name: is_external, type: BOOLEAN, path: isExternal}
      - {name: query, filter_only: true}
    examples:
      - sql: "SELECT id, service, team_id FROM opsgenie_services WHERE query = 'name:checkout'"
        description: Map a service name to its Opsgenie id (impacted_services / deployments use ids).
    fixtures:
      - file: services.json
        expect_rows: 2
        expect_columns: {id: 6aa85159-9e2e-4e54-8088-546f9c15d513, service: "Service API Test Service - Updated", team_id: 2e3c4c13-51e7-4cf6-a353-34c6f75494c7, is_external: false}
        note: "Official Response of GET /v1/services (List Services) on https://docs.opsgenie.com/docs/service-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/service-api#list-services

  - name: opsgenie_teams
    title: Teams
    description: Every team of the account in one response (GET /v2/teams, no pagination). Maps the team ids found in responders to names.
    kind: entities
    request:
      method: GET
      path: /v2/teams
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: description, path: description}
    examples:
      - sql: "SELECT id, name FROM opsgenie_teams ORDER BY name"
    fixtures:
      - file: teams.json
        expect_rows: 3
        expect_columns: {id: 90098alp9-f0e3-41d3-a060-0ea895027630, name: ops_team}
        note: "Official Response of GET /v2/teams (List Teams) on https://docs.opsgenie.com/docs/team-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/team-api#list-teams

  - name: opsgenie_deployments
    title: Deployments of services (Bitbucket / API deployments)
    description: >-
      Deployments mapped to Opsgenie services (GET /v2/deployments/search): service_id required
      (IN list sent as repeated serviceIds), optional environment_id; the ts window is sent as
      startTime / endTime. Only deployments reported to Opsgenie (Bitbucket Pipelines or the
      Deployment API) exist here.
    kind: changes
    request:
      method: GET
      path: /v2/deployments/search
      query:
        serviceIds: "{{ filters.service_id | as_list }}"
        environmentIds: "{{ filters.environment_id | as_list }}"
        startTime: "{{ time.start | rfc3339 }}"
        endTime: "{{ time.end | rfc3339 }}"
    filters:
      - {column: service_id, required: true, ops: ["=", "in"], fan_out: false, description: "Opsgenie service id(s) (opsgenie_services.id)", examples: [96f6655c-73f1-4d4b-a1a5-4b97dd8409b5]}
      - {column: environment_id, ops: ["=", "in"], fan_out: false, description: "Environment id(s)", examples: ["{598f7ddd-21c3-4064-a569-4dac1b8b0280}"]}
    time: {column: ts, default_lookback: 48h, max_window: 90d}
    pagination: {type: offset, offset_param: query.paginationKey, limit_param: query.limit, page_size: 100, max_pages: 5}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: startedAt, description: "Deployment start"}
      - {name: completed_at, type: TIMESTAMP, path: completedAt}
      - {name: id, path: id}
      - {name: external_id, path: externalId}
      - {name: type, path: type, description: "pipelines (Bitbucket) | api"}
      - {name: state, path: state, description: "successful | failed | in_progress ..."}
      - {name: title, path: message}
      - {name: description, path: description, description: "Usually '<short sha> <commit message>'"}
      - {name: env, path: environment.displayName}
      - {name: environment_type, path: environment.type}
      - {name: environment_id, path: environment.id}
      - {name: service_id, filter_only: true}
    pitfalls:
      - "Only Bitbucket Cloud is supported as SCM by Opsgenie's deployment tracking; GitHub/GitLab deploys are absent unless pushed through the Deployment API."
      - "The docs do not state how startTime/endTime bound the search nor the maximum limit; rows are re-filtered on ts in SQL."
    examples:
      - sql: >-
          SELECT ts, state, title, description, env FROM opsgenie_deployments
          WHERE service_id = '96f6655c-73f1-4d4b-a1a5-4b97dd8409b5' AND ts >= now() - INTERVAL 2 DAY ORDER BY ts DESC
        description: Deploys of the service in the 48h before an incident.
    fixtures:
      - file: deployments.json
        filters: {service_id: 96f6655c-73f1-4d4b-a1a5-4b97dd8409b5}
        expect_rows: 3
        expect_columns: {ts: "2020-08-17T08:16:57.943Z", id: 0e1a5c8d-66a5-34a4-a315-733caa5e5636, type: pipelines, state: successful, title: "Deployment #5", env: production, environment_type: Production}
        note: "Official Sample Response of GET /v2/deployments/search (Search Deployments) on https://docs.opsgenie.com/docs/deployment-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/deployment-api#search-deployments

  # ----------------------------------------------------------------------------------------------
  # Escalations and maintenance (why someone was / was not paged)
  # ----------------------------------------------------------------------------------------------
  - name: opsgenie_escalations
    title: Escalation policies (one row per escalation rule)
    description: >-
      Every escalation of the account (GET /v2/escalations, no pagination), one row per rule in
      order: condition (if-not-acked | if-not-closed), notify type (default | next | previous |
      users | admins | all), delay and recipient (user / schedule / team). Shows who is paged
      next and after how long when an alert is not acknowledged.
    kind: entities
    request:
      method: GET
      path: /v2/escalations
    response:
      rows_path: "$.data[*]"
      expand:
        - {explode: rules, as: r}
    columns:
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: owner_team, path: ownerTeam.name}
      - {name: owner_team_id, path: ownerTeam.id}
      - {name: rule_index, type: BIGINT, expr: "(_.rules or []).index(r)", description: "Position of the rule in the escalation (0 = first)"}
      - {name: condition, path: "@r.condition", description: "if-not-acked | if-not-closed"}
      - {name: notify_type, path: "@r.notifyType", description: "default | next | previous | users | admins | all"}
      - {name: delay, type: BIGINT, path: "@r.delay.timeAmount"}
      - {name: delay_unit, path: "@r.delay.timeUnit", description: "minutes (documented unit)"}
      - {name: recipient_type, path: "@r.recipient.type", description: "user | schedule | team"}
      - {name: recipient, expr: "r.recipient.name or r.recipient.username", description: "Schedule / team name or username"}
      - {name: recipient_id, path: "@r.recipient.id"}
      - {name: repeat, type: JSON, path: repeat, description: "{waitInterval, count, resetRecipientStates, closeAlertAfterAll} or NULL"}
    pitfalls:
      - "Escalations are only used when an alert's responders include the escalation (directly or via a team's routing rule); a team routed straight to a schedule never escalates."
    examples:
      - sql: >-
          SELECT name, rule_index, condition, delay, delay_unit, recipient_type, recipient
          FROM opsgenie_escalations WHERE owner_team = 'ops_team' ORDER BY name, rule_index
        description: How an unacknowledged alert of a team escalates (who, after how many minutes).
    fixtures:
      - file: escalations.json
        expect_rows: 4
        expect_columns: {id: 4e8de428-f403-4e82-b46a-4402b8e7a5ed, name: EscalationName, rule_index: 0, condition: if-not-closed, notify_type: default, delay: 0, delay_unit: minutes, recipient_type: user, recipient: "alp@opsgenie.com", repeat: '{"waitInterval":15,"count":13,"resetRecipientStates":true,"closeAlertAfterAll":true}'}
        note: "Response of GET /v2/escalations (List Escalations) on https://docs.opsgenie.com/docs/escalation-api; the documented sample has a trailing comma after the second escalation, removed here - otherwise verbatim."
    docs_url: https://docs.opsgenie.com/docs/escalation-api#list-escalations

  - name: opsgenie_maintenance
    title: Maintenance windows
    description: >-
      One row per maintenance (GET /v1/maintenance): status (planned | active | past |
      cancelled), time type (for-5-minutes | for-30-minutes | for-1-hour | indefinitely | schedule) and start/end for
      scheduled ones. While a maintenance is active the integrations / policies in its rules are
      disabled, so alerts may never be created or notified - check it when an expected alert or
      page is missing. Filter type = all (default) | non-expired | past (pushed down). Which
      integrations / policies are covered: opsgenie_maintenance_detail.
    kind: events
    request:
      method: GET
      path: /v1/maintenance
      query:
        type: "{{ filters.type or 'all' }}"
    filters:
      - {column: type, description: "all (default) | non-expired | past", examples: [non-expired]}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: time.startDate, description: "Start (scheduled maintenances only)"}
      - {name: id, path: id}
      - {name: status, path: status, description: "planned | active | past | cancelled"}
      - {name: title, path: description}
      - {name: time_type, path: time.type, description: "for-5-minutes | for-30-minutes | for-1-hour | indefinitely | schedule"}
      - {name: start_at, type: TIMESTAMP, path: time.startDate}
      - {name: end_at, type: TIMESTAMP, path: time.endDate}
      - {name: type, filter_only: true}
    pitfalls:
      - "Only 'schedule' maintenances carry start/end dates; for-N-minutes and indefinitely ones have NULL start_at / end_at (judge them by status = 'active')."
    examples:
      - sql: "SELECT id, status, title, time_type, start_at, end_at FROM opsgenie_maintenance WHERE type = 'non-expired'"
        description: Planned and active maintenances (anything that can silence alerts right now).
      - sql: >-
          SELECT id, title, start_at, end_at FROM opsgenie_maintenance
          WHERE start_at <= TIMESTAMP '2026-10-01 11:00:00' AND end_at >= TIMESTAMP '2026-10-01 11:00:00'
        description: Was a scheduled maintenance running when the alert should have fired?
    fixtures:
      - file: maintenance_non_expired.json
        filters: {type: non-expired}
        expect_rows: 2
        expect_columns: {id: 20b78362-9d1e-43e0-8b86-3026b7071109, status: planned, title: Maintenance1, time_type: schedule, start_at: "2017-03-20T11:41:00Z", end_at: "2017-03-20T12:15:00Z", type: non-expired}
        note: "Official Response of GET /v1/maintenance?type=non-expired (List Maintenance) on https://docs.opsgenie.com/docs/maintenance-api, verbatim."
      - file: maintenance_past.json
        filters: {type: past}
        expect_rows: 1
        expect_columns: {id: 9aa71390-fe1c-425a-ad52-f1cfbdf56091, status: past, time_type: for-1-hour, start_at: null}
        note: "Official Response of GET /v1/maintenance?type=past (List Maintenance) on https://docs.opsgenie.com/docs/maintenance-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/maintenance-api#list-maintenance

  - name: opsgenie_maintenance_detail
    title: One maintenance with its rules
    description: >-
      One maintenance by id (GET /v1/maintenance/{id}), one row per rule: the entity (integration
      or policy) it covers and its state (enabled / disabled). An integration rule is always
      'disabled' (no alerts are created from it during the maintenance). maintenance_id required
      (IN up to 20; ids from opsgenie_maintenance).
    kind: entities
    request:
      method: GET
      path: "/v1/maintenance/{{ filters.maintenance_id | urlencode }}"
    filters:
      - {column: maintenance_id, required: true, ops: ["=", "in"], max_fan_out: 20, description: "Maintenance id", examples: [b0ee8414-1d29-45c3-850f-11dbf0f1402f]}
    response:
      rows_path: "$.data"
      expand:
        - {explode: rules, as: rule, keep_empty: true}
    columns:
      - {name: id, path: id}
      - {name: status, path: status}
      - {name: title, path: description}
      - {name: time_type, path: time.type}
      - {name: start_at, type: TIMESTAMP, path: time.startDate}
      - {name: end_at, type: TIMESTAMP, path: time.endDate}
      - {name: entity_type, path: "@rule.entity.type", description: "integration | policy"}
      - {name: entity_id, path: "@rule.entity.id", description: "Integration or policy id"}
      - {name: rule_state, path: "@rule.state", description: "enabled | disabled (integration rules are always disabled)"}
      - {name: maintenance_id, filter_only: true}
    examples:
      - sql: "SELECT status, start_at, end_at, entity_type, entity_id, rule_state FROM opsgenie_maintenance_detail WHERE maintenance_id = 'b0ee8414-1d29-45c3-850f-11dbf0f1402f'"
        description: Which integrations / policies a maintenance switched off.
    fixtures:
      - file: maintenance.json
        filters: {maintenance_id: b0ee8414-1d29-45c3-850f-11dbf0f1402f}
        expect_rows: 1
        expect_columns: {id: b0ee8414-1d29-45c3-850f-11dbf0f1402f, status: planned, title: "Maintenance Description", time_type: schedule, start_at: "2018-03-25T08:45:00Z", entity_type: policy, entity_id: 1d9530bb-a079-43d9-8535-bbfd2fb6f8af, rule_state: enabled}
        note: "Official Response of GET /v1/maintenance/:maintenanceId (Get Maintenance) on https://docs.opsgenie.com/docs/maintenance-api, verbatim."
    docs_url: https://docs.opsgenie.com/docs/maintenance-api#get-maintenance

roles:
  active_alerts:
    table: opsgenie_open_alerts
    columns: {ts: ts, name: title, title: title, state: status, severity: severity, labels: tags, id: id}
    notes: "Opsgenie alerts open right now (any age)."
  alert_history:
    table: opsgenie_alerts
    columns: {ts: ts, name: title, title: title, state: status, severity: severity, count: count, id: id}
    notes: "Alerts created in the window; count = de-duplicated occurrences."
  incidents:
    table: opsgenie_incidents
    columns: {ts: ts, id: id, title: title, state: status, status: status, severity: severity}
    notes: "Opsgenie incidents created in the window; the 'query' variable is pushed as an incident search query."
  oncall:
    table: opsgenie_oncall
    columns: {name: user, user: user, schedule: schedule}
    notes: "Who was on call per schedule at the window start (all schedules unless schedule is given)."
  services:
    table: opsgenie_services
    columns: {service: service, id: id}
