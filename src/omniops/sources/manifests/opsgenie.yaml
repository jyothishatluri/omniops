        note: "Sample Response of GET /v1/incidents/:identifier (Get Incident) on https://docs.opsgenie.com/docs/incident-api; the documented sample lacks the comma after extraProperties, added here - otherwise verbatim."
    docs_url: https://docs.opsgenie.com/docs/incident-api#get-incident

