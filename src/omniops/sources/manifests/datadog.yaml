    description: >-
      Monitor definitions from v1 GET /api/v1/monitor: query, thresholds, message, tags, overall
      state. Filter on name (substring), service (monitor tag service:<x>), monitor_tags
      (comma separated monitor tags) or scope_tags (tags used in the monitor query scope).
    kind: alerts
    request:
      method: GET
      path: /api/v1/monitor
      query:
        name: "{{ filters.name_search }}"
        monitor_tags: "{{ ([('service:' ~ filters.service) if filters.service else none, filters.monitor_tags or none] | compact | join(',')) or none }}"
        tags: "{{ filters.scope_tags }}"
    filters:
      - {column: name_search, description: "Server-side substring match on the monitor name (filter-only; use name LIKE for exact SQL filtering)", examples: ['latency']}
      - {column: service, description: "Monitors tagged service:<value>", examples: ['checkout']}
      - {column: monitor_tags, description: "Comma separated monitor tags, e.g. team:payments,env:prod"}
      - {column: scope_tags, description: "Comma separated scope tags used in the monitor query, e.g. host:web-1"}
    pagination: {type: page, page_param: query.page, limit_param: query.page_size, page_size: 100, start: 0, max_pages: 10}
    response:
      rows_path: "$[*]"
    columns:
      - {name: id, type: BIGINT, path: id}
      - {name: name, path: name, description: "Monitor name (title)"}
      - {name: type, path: type, description: "metric alert | query alert | log alert | trace-analytics alert | rum alert | composite | service check | synthetics alert | slo alert | event-v2 alert ..."}
      - {name: query, path: query, description: "Full monitor query incl. comparator and threshold"}
      - {name: message, path: message}
      - {name: tags, type: JSON, path: tags}
      - {name: priority, type: BIGINT, path: priority, description: "1 (high) .. 5 (low)"}
      - {name: state, path: overall_state, description: "Alert | Warn | No Data | OK | Ignored | Skipped | Unknown"}
      - {name: critical, type: DOUBLE, path: "options.thresholds.critical"}
      - {name: warning, type: DOUBLE, path: "options.thresholds.warning"}
      - {name: critical_recovery, type: DOUBLE, path: "options.thresholds.critical_recovery"}
      - {name: warning_recovery, type: DOUBLE, path: "options.thresholds.warning_recovery"}
      - {name: thresholds, type: JSON, path: "options.thresholds"}
      - {name: evaluation_delay_s, type: BIGINT, path: "options.evaluation_delay", description: "Seconds the evaluation is delayed (late data)"}
      - {name: notify_no_data, type: BOOLEAN, path: "options.notify_no_data"}
      - {name: no_data_timeframe_m, type: BIGINT, path: "options.no_data_timeframe", description: "Minutes without data before a No Data alert"}
      - {name: require_full_window, type: BOOLEAN, path: "options.require_full_window"}
      - {name: renotify_interval_m, type: BIGINT, path: "options.renotify_interval"}
      - {name: multi, type: BOOLEAN, path: multi, description: "Multi-alert (per group) monitor"}
      - {name: draft_status, path: draft_status, description: "draft (sends no notifications) | published"}
      - {name: created, type: TIMESTAMP, path: created, transform: auto_time}
      - {name: modified, type: TIMESTAMP, path: modified, transform: auto_time}
      - {name: author, path: "creator.handle"}
      - {name: name_search, filter_only: true}
      - {name: service, filter_only: true}
      - {name: monitor_tags, filter_only: true}
      - {name: scope_tags, filter_only: true}
    pitfalls:
      - "Without filters this lists every monitor in the org (paged 100 at a time, 10 pages max)."
      - "Thresholds are also embedded in query (e.g. '> 100'); options.thresholds is the structured form."
      - "Use datadog_monitor_states for per-group state and last-triggered times."
    examples:
      - sql: "SELECT id, name, query, critical, warning, state FROM datadog_monitors WHERE service = 'checkout' ORDER BY priority"
        description: Alert rules covering a service, with thresholds.
    fixtures:
      - file: monitors_list.json
        expect_rows: 1
        expect_columns: {name: "My monitor", type: "query alert", query: "avg(last_5m):sum:system.net.bytes_rcvd{host:host0} > 100", multi: false, created: "2019-09-19T10:00:00Z"}
        note: "Official API reference example (Get all monitors, 200). The page shows one Monitor object although the response is an array; it is wrapped in [] here. Placeholder values ('integer', 'number') coerce to NULL."
      - file: monitors_list_schema.json
        expect_rows: 1
        expect_columns: {id: 2699850, critical: 1.5, warning: 1.0, state: Alert, priority: 2, author: ops-bot}
        note: "Built strictly from the documented Monitor schema with realistic values (thresholds, state.groups)."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/monitors/manage{{ ('?q=' ~ (('service:' ~ filters.service) | urlencode)) if filters.service is string else '' }}"
    docs_url: https://docs.datadoghq.com/api/latest/monitors/get-all-monitors/

  - name: datadog_monitor_by_id
    title: One monitor with group states
    description: >-
      One monitor by id (v1 GET /api/v1/monitor/{monitor_id}?group_states=all&with_downtimes=true&with_assets=true):
      definition, thresholds, overall state, per-group states (groups JSON), active downtimes and
      runbook assets.
      Use it first when an alert fires: the monitor query tells you the exact metric/log query to rerun.
    kind: alerts
    request:
      method: GET
      path: "/api/v1/monitor/{{ filters.monitor_id }}"
      query:
        group_states: all
        with_downtimes: "true"
        with_assets: "true"
      accept_status: [404]
    filters:
      - {column: monitor_id, type: BIGINT, required: true, description: "Monitor id (from the alert payload)", examples: ['2699850']}
    response:
      rows_path: "$"
    columns:
      - {name: monitor_id, type: BIGINT, path: id}
      - {name: name, path: name}
      - {name: type, path: type}
      - {name: query, path: query}
      - {name: message, path: message}
      - {name: tags, type: JSON, path: tags}
      - {name: priority, type: BIGINT, path: priority}
      - {name: state, path: overall_state}
      - {name: critical, type: DOUBLE, path: "options.thresholds.critical"}
      - {name: warning, type: DOUBLE, path: "options.thresholds.warning"}
      - {name: thresholds, type: JSON, path: "options.thresholds"}
      - {name: evaluation_delay_s, type: BIGINT, path: "options.evaluation_delay"}
      - {name: notify_no_data, type: BOOLEAN, path: "options.notify_no_data"}
      - {name: require_full_window, type: BOOLEAN, path: "options.require_full_window"}
      - {name: variables, type: JSON, path: "options.variables", description: "Formula-and-function monitors: the underlying log/APM/RUM queries (data_source, search.query, compute, group_by)"}
      - {name: groups, type: JSON, path: "state.groups", description: "Per-group state: {group: {status, last_triggered_ts, last_resolved_ts, ...}} (epoch seconds)"}
      - {name: matching_downtimes, type: JSON, path: matching_downtimes, description: "Active downtimes muting this monitor"}
      - {name: multi, type: BOOLEAN, path: multi}
      - {name: created, type: TIMESTAMP, path: created, transform: auto_time}
      - {name: modified, type: TIMESTAMP, path: modified, transform: auto_time}
      - {name: author, path: "creator.handle"}
      - {name: runbooks, type: JSON, path: assets, description: "Runbook assets linked to the monitor (category, name, url)"}
      - {name: draft_status, path: draft_status, description: "draft (sends no notifications) | published"}
      - {name: new_group_delay_s, type: BIGINT, path: "options.new_group_delay", description: "Seconds new groups are skipped after appearing"}
    pitfalls:
      - "A 404 (deleted monitor) returns no rows."
      - "modified after the alert time means the rule itself changed: check before trusting the threshold (datadog_audit_events shows who changed it and how)."
      - "evaluation_delay_s shifts the evaluated window into the past: the data that fired the alert is [alert time - window - delay, alert time - delay]."
      - "draft_status = 'draft' monitors never notify: a missing page is not a missing alert condition."
    examples:
      - sql: "SELECT name, query, critical, warning, state, groups, modified FROM datadog_monitor_by_id WHERE monitor_id = 2699850"
        description: Look up the monitor that fired, with its exact query and thresholds.
    fixtures:
      - file: monitor_get.json
        filters: {monitor_id: 2699850}
        expect_rows: 1
        expect_columns: {monitor_id: 2699850, name: "My monitor", type: "query alert", modified: "2019-09-19T10:00:00Z", query: "avg(last_5m):sum:system.net.bytes_rcvd{host:host0} > 100"}
        note: "Official API reference example response (Get a monitor's details, 200); its id is a placeholder so monitor_id is filled from the filter."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/monitors/{{ filters.monitor_id }}"
    docs_url: https://docs.datadoghq.com/api/latest/monitors/get-a-monitors-details/

  - name: datadog_monitor_states
    title: Monitor per-group states
    description: >-
      Per-group state of one monitor (v1 GET /api/v1/monitor/{id}?group_states=all, state.groups
      exploded): one row per group (e.g. 'service:checkout,env:prod') with status and the last
      triggered / resolved / notified / no-data times. The alert-history view of a multi-alert monitor.
    kind: alerts
    request:
      method: GET
      path: "/api/v1/monitor/{{ filters.monitor_id }}"
      query:
        group_states: all
      accept_status: [404]
    filters:
      - {column: monitor_id, type: BIGINT, required: true, description: "Monitor id", examples: ['2699850']}
    response:
      rows_path: "$"
      expand:
        - {entries: "state.groups", as: g}
    columns:
      - {name: monitor_id, type: BIGINT, path: id}
      - {name: monitor_name, path: name}
      - {name: group_name, path: "@g.key", description: "Group (comma separated tags) or '*' for simple monitors"}
      - {name: status, path: "@g.value.status", description: "Alert | Warn | No Data | OK ..."}
      - {name: last_triggered, type: TIMESTAMP, expr: "g.value.last_triggered_ts or none", transform: epoch_s}
      - {name: last_resolved, type: TIMESTAMP, expr: "g.value.last_resolved_ts or none", transform: epoch_s}
      - {name: last_notified, type: TIMESTAMP, expr: "g.value.last_notified_ts or none", transform: epoch_s}
      - {name: last_nodata, type: TIMESTAMP, expr: "g.value.last_nodata_ts or none", transform: epoch_s}
      - {name: monitor_query, path: query}
    pitfalls:
      - "Group timestamps are epoch SECONDS (converted); 0 means never and becomes NULL."
      - "Only the current state and the LAST transition per group are available here; use datadog_events (monitor alert events) for a full transition history."
    examples:
      - sql: >-
          SELECT group_name, status, last_triggered, last_resolved FROM datadog_monitor_states
          WHERE monitor_id = 2699850 AND status <> 'OK' ORDER BY last_triggered DESC
        description: Which groups (services/hosts) of a multi-alert monitor are firing, and since when.
    fixtures:
      - file: monitor_states_schema.json
        filters: {monitor_id: 2699850}
        expect_rows: 2
        expect_columns: {group_name: "service:checkout", status: Alert, last_triggered: "2026-10-01T10:50:00Z", last_nodata: null, monitor_id: 2699850}
        note: "Built strictly from the documented Monitor.state.groups schema (MonitorStateGroup: name, status, last_*_ts epoch seconds); the reference example only has a '<any-key>' placeholder group."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/monitors/{{ filters.monitor_id }}"
    docs_url: https://docs.datadoghq.com/api/latest/monitors/get-a-monitors-details/

  - name: datadog_monitor_search
    title: Monitor search
    description: >-
      Search monitors with the Manage Monitors syntax (v1 GET /api/v1/monitor/search): e.g.
      status (Alert|Warn|"No Data"|OK), service, env, type, or a raw query like
      'tag:"team:payments" muted:false'. Returns status, last triggered time, metrics and scopes.
    kind: alerts
    request:
      method: GET
      path: /api/v1/monitor/search
      query:
        query: "{{ [filters.search or none, ('status:' ~ (filters.status | quote if ' ' in filters.status else filters.status)) if filters.status else none, ('service:' ~ filters.service) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('type:' ~ filters.monitor_type) if filters.monitor_type else none] | compact | join(' ') or none }}"
        sort: "{{ filters.sort }}"
    filters:
      - {column: search, description: "Raw monitor search expression (see query_languages.datadog_monitor_search); filter-only", examples: ['muted:false']}
      - {column: status, description: "Alert | Warn | No Data | OK", examples: ['Alert']}
      - {column: service, description: "service tag value", examples: ['checkout']}
      - {column: env, description: "env tag value"}
      - {column: monitor_type, description: "Search facet type: metric | log | apm | rum | synthetics | composite | event ... (the returned type column uses API names like 'query alert')"}
      - {column: sort, description: "field,dir with field in name|status|tags, e.g. status,asc"}
    pagination: {type: page, page_param: query.page, limit_param: query.per_page, page_size: 100, start: 0, max_pages: 5}
    response:
      rows_path: "$.monitors[*]"
    columns:
      - {name: id, type: BIGINT, path: id}
      - {name: name, path: name}
      - {name: status, path: status}
      - {name: type, path: type}
      - {name: classification, path: classification}
      - {name: query, path: query, description: "The monitor's own query (metric/log query + threshold)"}
      - {name: tags, type: JSON, path: tags}
      - {name: scopes, type: JSON, path: scopes}
      - {name: metrics, type: JSON, path: metrics}
      - {name: last_triggered, type: TIMESTAMP, expr: "_.last_triggered_ts or none", transform: epoch_s}
      - {name: priority, type: BIGINT, path: priority}
      - {name: notifications, type: JSON, path: notifications}
      - {name: quality_issues, type: JSON, path: quality_issues}
      - {name: search, filter_only: true}
      - {name: service, filter_only: true}
      - {name: env, filter_only: true}
      - {name: monitor_type, filter_only: true}
      - {name: sort, filter_only: true}
    pitfalls:
      - "Use search = '...' for a raw search expression; the query column is the monitor's own query (do not filter it with search syntax)."
      - "last_triggered is epoch seconds (converted); NULL if never triggered."
    examples:
      - sql: "SELECT id, name, status, last_triggered, metrics FROM datadog_monitor_search WHERE status = 'Alert' AND service = 'checkout'"
        description: Monitors currently alerting for a service.
    tests:
      - {sql: "SELECT id, name, status FROM datadog_monitor_search LIMIT 5", min_rows: 0}
    fixtures:
      - file: monitor_search.json
        filters: {status: 'No Data'}
        expect_rows: 1
        expect_columns: {id: 2699850, status: "No Data", type: "query alert", classification: metric, last_triggered: null}
        note: "Official API reference example response (Monitors search, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/monitors/monitors-search/

  - name: datadog_monitor_group_search
    title: Triggered monitor groups
    description: >-
      Monitor groups as on the Triggered Monitors page (v1 GET /api/v1/monitor/groups/search):
      one row per (monitor, group) with status and last triggered time. Default query
      'group_status:alert' lists everything currently alerting.
    kind: alerts
    request:
      method: GET
      path: /api/v1/monitor/groups/search
      query:
        query: "{{ [filters.query or none, ('group_status:' ~ filters.group_status) if filters.group_status else none] | compact | join(' ') or 'group_status:alert' }}"
        sort: "{{ filters.sort }}"
    filters:
      - {column: query, description: "Group search query, e.g. 'type:metric group_status:alert'", examples: ['type:metric']}
      - {column: group_status, description: "Search facet group_status: alert | warn | no data | ok (filter-only; the returned status column is capitalised: Alert, Warn, OK)", examples: ['alert']}
      - {column: sort, description: "field,dir"}
    pagination: {type: page, page_param: query.page, limit_param: query.per_page, page_size: 100, start: 0, max_pages: 5}
    response:
      rows_path: "$.groups[*]"
    columns:
      - {name: monitor_id, type: BIGINT, path: monitor_id}
      - {name: monitor_name, path: monitor_name}
      - {name: group_name, path: group}
      - {name: status, path: status}
      - {name: group_tags, type: JSON, path: group_tags}
      - {name: last_triggered, type: TIMESTAMP, expr: "_.last_triggered_ts or none", transform: epoch_s}
      - {name: last_nodata, type: TIMESTAMP, expr: "_.last_nodata_ts or none", transform: epoch_s}
      - {name: group_status, filter_only: true}
      - {name: query, filter_only: true}
      - {name: sort, filter_only: true}
    pitfalls:
      - "Without a query the table sends group_status:alert (currently alerting groups only); pass query = '*' style filters to widen."
      - "Returned status values are capitalised (Alert, Warn, No Data, OK)."
    examples:
      - sql: >-
          SELECT monitor_name, group_name, status, last_triggered FROM datadog_monitor_group_search
          WHERE group_status = 'alert' ORDER BY last_triggered DESC LIMIT 50
        description: Everything that is alerting right now, newest first (blast radius).
    fixtures:
      - file: monitor_group_search.json
        expect_rows: 2
        expect_columns: {monitor_id: 2738266, group_name: "*", status: OK, last_triggered: "2018-05-07T14:22:46Z", last_nodata: null}
        note: "Official API reference example response (Monitors group search, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/monitors/monitors-group-search/

  - name: datadog_downtimes
    title: Downtimes (muted monitors)
    description: >-
      Scheduled / active downtimes (v2 GET /api/v2/downtime). current_only = true returns only
      downtimes active now. A muted monitor explains a missing alert.
    kind: entities
    request:
      method: GET
      path: /api/v2/downtime
      query:
        current_only: "{{ 'true' if filters.current_only else none }}"
    filters:
      - {column: current_only, type: BOOLEAN, description: "Only downtimes active at request time"}
    pagination: {type: offset, offset_param: "query.page[offset]", limit_param: "query.page[limit]", page_size: 100, max_pages: 5}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: status, path: "attributes.status", description: "active | scheduled | ended | canceled"}
      - {name: scope, path: "attributes.scope", description: "Search-syntax scope, e.g. env:prod AND service:checkout"}
      - {name: monitor_id, type: BIGINT, path: "attributes.monitor_identifier.monitor_id"}
      - {name: monitor_tags, type: JSON, path: "attributes.monitor_identifier.monitor_tags"}
      - {name: message, path: "attributes.message"}
      - {name: start_time, type: TIMESTAMP, expr: "_.attributes.schedule.start or _.attributes.schedule.current_downtime.start", transform: auto_time, description: "Start (one-time) or current/next occurrence start (recurring)"}
      - {name: end_time, type: TIMESTAMP, expr: "_.attributes.schedule.end or _.attributes.schedule.current_downtime.end", transform: auto_time}
      - {name: recurrences, type: JSON, path: "attributes.schedule.recurrences"}
      - {name: created, type: TIMESTAMP, path: "attributes.created", transform: auto_time}
      - {name: modified, type: TIMESTAMP, path: "attributes.modified", transform: auto_time}
      - {name: canceled, type: TIMESTAMP, path: "attributes.canceled", transform: auto_time}
      - {name: display_timezone, path: "attributes.display_timezone"}
      - {name: current_only, type: BOOLEAN, filter_only: true}
    pitfalls:
      - "Recurring downtimes report the current/next occurrence in schedule.current_downtime (used for start/end)."
    examples:
      - sql: "SELECT id, scope, monitor_id, start_time, end_time, message FROM datadog_downtimes WHERE status = 'active'"
        description: What is muted right now (explains missing alerts).
    fixtures:
      - file: downtimes.json
        expect_rows: 1
        expect_columns: {status: active, scope: "env:(staging OR prod) AND datacenter:us-east-1", monitor_id: 123, start_time: "2020-01-02T03:04:00Z", created: "2020-01-02T03:04:05Z"}
        note: "Official API reference example response (Get all downtimes, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/downtimes/get-all-downtimes/

  # ----------------------------------------------------------------------------------------------
  # Events, incidents, changes
  # ----------------------------------------------------------------------------------------------
  - name: datadog_events
    title: Events (alerts, changes, deploys, integrations)
    description: >-
      Events from v2 POST /api/v2/events/search, newest first: monitor alerts, Change Tracking change
      events (feature flags, config changes), deploy/CI events, Kubernetes and integration events.
      Filter on query (event search syntax, e.g. '@evt.category:change', 'source:kubernetes',
      'source:github'), service, env, source, plus ts. Change events expose changed_resource,
      author, prev_value/new_value.
    kind: events
    request:
      method: POST
      path: /api/v2/events/search
      body:
        filter:
          query: "{{ [filters.query or none, (filters.service | join_or('service:{}')) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, (filters.source | join_or('source:{}')) if filters.source else none, (filters.category | join_or('@evt.category:{}')) if filters.category else none] | compact | join(' ') or '*' }}"
          from: "{{ time.start | epoch_ms | string }}"
          to: "{{ time.end | epoch_ms | string }}"
        page:
          limit: "{{ [limit or 500, 1000] | min }}"
        sort: "-timestamp"
    filters:
      - {column: query, description: "Event search query, e.g. 'source:kubernetes status:error' or '@evt.type:aws_security_group'", examples: ['source:kubernetes']}
      - {column: category, ops: ["=", "in"], fan_out: false, description: "@evt.category: change (feature flags, config, infra changes) | deployment | alert | workflow | case", examples: ['change']}
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Service", examples: ['checkout']}
      - {column: env, description: "Environment"}
      - {column: source, ops: ["=", "in"], fan_out: false, description: "Event source, e.g. kubernetes, change_tracking, github, alert"}
    time: {column: ts, default_lookback: 6h, max_window: 30d, retention: 455d}
    pagination: {type: cursor, cursor_path: "$.meta.page.after", cursor_param: "body.page.cursor", max_pages: 3}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Event search timed out (partial results): narrow the window"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "attributes.timestamp", transform: auto_time}
      - {name: title, expr: "_.attributes.attributes.title or _.attributes.attributes.event_object"}
      - {name: message, path: "attributes.message"}
      - {name: service, expr: "_.attributes.attributes.service or (((',' ~ (_.attributes.tags or []) | join(',') ~ ',').split(',service:')[1].split(',')[0]) if ',service:' in (',' ~ ((_.attributes.tags or []) | join(','))) else none)", description: "Service attribute, else the service:<x> tag"}
      - {name: host, path: "attributes.attributes.hostname"}
      - {name: status, path: "attributes.attributes.status", description: "error | warn | info | success | ok ..."}
      - {name: priority, path: "attributes.attributes.priority"}
      - {name: source_type, path: "attributes.attributes.source_type_name"}
      - {name: evt_category, path: "attributes.attributes.evt.category", description: "@evt.category of the event: change | deployment | alert | workflow | case ..."}
      - {name: evt_type, path: "attributes.attributes.evt.type", description: "@evt.type, e.g. kubernetes_apiserver, aws_security_group, error_tracking_alert"}
      - {name: state, path: "attributes.attributes.state", description: "@state of the entity, e.g. crash_loop_backoff (Kubernetes events)"}
      - {name: sub_category, path: "attributes.attributes.sub_category"}
      - {name: event_uid, path: "attributes.attributes.evt.uid"}
      - {name: integration_id, path: "attributes.attributes.evt.integration_id"}
      - {name: monitor_id, type: BIGINT, path: "attributes.attributes.monitor_id"}
      - {name: monitor_name, path: "attributes.attributes.monitor.name"}
      - {name: monitor_groups, type: JSON, path: "attributes.attributes.monitor_groups"}
      - {name: monitor_query, path: "attributes.attributes.monitor.query", description: "Monitor alert events: the query that triggered the alert"}
      - {name: source_category, path: "attributes.attributes.sourcecategory", description: "Origin of the event: monitor alert, externally submitted event, or an integration"}
      - {name: duration_ms, type: DOUBLE, path: "attributes.attributes.duration", transform: ns_to_ms, description: "Monitor alert events: time between trigger and recovery (API value is nanoseconds)"}
      - {name: changed_resource, expr: "_.attributes.attributes.changed_resource.name", description: "Change events: name of the changed feature flag / configuration"}
      - {name: changed_resource_type, path: "attributes.attributes.changed_resource.type", description: "feature_flag | configuration"}
      - {name: author, path: "attributes.attributes.author.name", description: "Change events: who made the change"}
      - {name: impacted_resources, type: JSON, path: "attributes.attributes.impacted_resources", description: "Change events: impacted services"}
      - {name: prev_value, type: JSON, path: "attributes.attributes.prev_value"}
      - {name: new_value, type: JSON, path: "attributes.attributes.new_value"}
      - {name: tags, type: JSON, path: "attributes.tags"}
      - {name: attributes, type: JSON, path: "attributes.attributes"}
      - {name: aggregation_key, path: "attributes.attributes.aggregation_key"}
      - {name: id, path: id}
      - {name: query, filter_only: true}
      - {name: env, filter_only: true}
      - {name: source, filter_only: true}
      - {name: category, filter_only: true, description: "Server-side @evt.category filter (the returned value is evt_category)"}
    sort_hint: "newest first"
    pitfalls:
      - "Change events attach to services through impacted_resources, not always the service tag: for 'what changed' search by category first, then filter in SQL."
      - "Category facet @evt.category (change | deployment | alert | workflow | case); Change Tracking events also use source:change_tracking; source:kubernetes for cluster events."
      - "Change-event fields (author, changed_resource, impacted_resources, prev_value, new_value) are read from the event attributes as documented for Post an event (v2); they are NULL for other categories."
    examples:
      - sql: >-
          SELECT ts, title, changed_resource, author, prev_value, new_value FROM datadog_events
          WHERE category = 'change'
            AND ts BETWEEN TIMESTAMP '2026-10-01 09:00:00' AND TIMESTAMP '2026-10-01 11:45:00'
          ORDER BY ts DESC
        description: What changed (feature flags, config) shortly before the alert.
      - sql: >-
          SELECT ts, title, status, monitor_name FROM datadog_events
          WHERE source = 'kubernetes' AND query = 'status:error'
            AND ts >= TIMESTAMP '2026-10-01 11:00:00' ORDER BY ts DESC LIMIT 50
        description: Kubernetes warnings/errors (OOMKilled, CrashLoopBackOff) during the incident.
    fixtures:
      - file: events_search.json
        filters: {service: datadog-api}
        expect_rows: 1
        expect_columns: {ts: "2019-01-02T09:42:36Z", title: "Oh boy!", service: datadog-api, status: info, priority: normal, evt_type: error_tracking_alert, monitor_query: "string", source_category: "string", duration_ms: null}
        note: "Official API reference example response (Search events, 200)."
      - file: events_change_schema.json
        filters: {category: change}
        expect_rows: 1
        expect_columns: {changed_resource: enable_new_tax_engine, changed_resource_type: feature_flag, author: jane.doe, service: checkout, evt_category: change, category: change}
        note: "Built strictly from the documented change-event attributes (Post an event v2: author, changed_resource, impacted_resources, prev_value, new_value; @evt.category from the dd.events dataset reference) inside the documented search response envelope."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/event/explorer?query={{ (filters.query or '*') | urlencode }}&from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false"
    docs_url: https://docs.datadoghq.com/api/latest/events/search-events/

  - name: datadog_audit_events
    title: Audit Trail (who changed what in Datadog)
    description: >-
      Audit Trail events from v2 POST /api/v2/audit/events/search, newest first: monitor, dashboard,
      SLO, downtime, log index / pipeline, synthetic test, feature-flag, API-key and user changes,
      with the actor (usr.email), the action and the asset. Filter on asset_type (e.g. monitor,
      dashboard, synthetics_test, retention_filter), action (created | modified | deleted),
      evt_name (product, e.g. Monitor, Dashboard, Log Management), author (user email) or a raw
      Audit search query, plus ts. Answers "did someone change the monitor / pipeline / index
      right before this?".
    kind: changes
    request:
      method: POST
      path: /api/v2/audit/events/search
      body:
        filter:
          query: "{{ [filters.query or none, ('@asset.type:' ~ filters.asset_type) if filters.asset_type else none, ('@action:' ~ filters.action) if filters.action else none, ('@evt.name:' ~ (filters.evt_name | quote)) if filters.evt_name else none, ('@usr.email:' ~ filters.author) if filters.author else none] | compact | join(' ') or '*' }}"
          from: "{{ time.start | epoch_ms | string }}"
          to: "{{ time.end | epoch_ms | string }}"
        page:
          limit: "{{ [limit or 500, 1000] | min }}"
        sort: "-timestamp"
    filters:
      - {column: query, description: "Audit search query, e.g. '@evt.name:Monitor @asset.type:monitor @action:modified'", examples: ['@evt.name:Monitor @action:modified']}
      - {column: asset_type, description: "@asset.type, e.g. monitor | dashboard | slo | downtime | synthetics_test | retention_filter | user | role", examples: ['monitor']}
      - {column: action, description: "@action: created | modified | deleted | accessed ...", examples: ['modified']}
      - {column: evt_name, description: "@evt.name (product): Monitor | Dashboard | 'Log Management' | APM | 'Synthetics Monitoring' | 'Access Management' ..."}
      - {column: author, description: "Actor email (@usr.email)"}
    time: {column: ts, default_lookback: 24h, max_window: 30d, retention: 90d}
    pagination: {type: cursor, cursor_path: "$.meta.page.after", cursor_param: "body.page.cursor", max_pages: 3}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Audit search timed out (partial results): narrow the window or the query"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "attributes.timestamp", transform: auto_time}
      - {name: message, path: "attributes.message"}
      - {name: service, path: "attributes.service"}
      - {name: evt_name, path: "attributes.attributes.evt.name", description: "Product area, e.g. Monitor, Dashboard"}
      - {name: asset_type, path: "attributes.attributes.asset.type"}
      - {name: asset_name, path: "attributes.attributes.asset.name", description: "Name of the changed asset (when present)"}
      - {name: asset_id, path: "attributes.attributes.asset.id", description: "Id of the changed asset (when present), e.g. a monitor id"}
      - {name: action, path: "attributes.attributes.action"}
      - {name: author, expr: "_.attributes.attributes.usr.email or _.attributes.attributes.usr.name", description: "Actor (user email or name); for AI-agent actions the delegating user is in attributes->'delegator'"}
      - {name: actor_type, path: "attributes.attributes.evt.actor.type", description: "e.g. USER | SUPPORT_USER | SERVICE_ACCOUNT"}
      - {name: tags, type: JSON, path: "attributes.tags"}
      - {name: attributes, type: JSON, path: "attributes.attributes", description: "All audit attributes, incl. previous/new values of the asset when Datadog records them"}
      - {name: id, path: id}
      - {name: query, filter_only: true}
    require_one_of: [[query, asset_type, action, evt_name, author]]
    sort_hint: "newest first"
    pitfalls:
      - "Audit Trail must be enabled for the org (default retention 90 days, 7 days when disabled); an empty result on an org without Audit Trail is not proof that nothing changed."
      - "Attributes need @ in queries (@asset.type:monitor, @action:modified, @usr.email:x); asset names with spaces need quotes."
    examples:
      - sql: >-
          SELECT ts, author, action, asset_name, asset_id FROM datadog_audit_events
          WHERE asset_type = 'monitor' AND action = 'modified'
            AND ts BETWEEN TIMESTAMP '2026-10-01 08:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC
        description: Was the alerting monitor edited shortly before it fired (threshold changed, muted)?
      - sql: >-
          SELECT ts, author, evt_name, asset_type, asset_name, action FROM datadog_audit_events
          WHERE query = '@evt.name:"Log Management" @action:(modified OR deleted)'
            AND ts >= TIMESTAMP '2026-10-01 00:00:00' ORDER BY ts DESC LIMIT 50
        description: Log pipeline / index / exclusion-filter changes (explains logs that suddenly disappeared).
    fixtures:
      - file: audit_search.json
        filters: {asset_type: monitor}
        expect_rows: 1
        expect_columns: {ts: "2019-01-02T09:42:36Z", message: "string", service: web-app, id: "AAAAAWgN8Xwgr1vKDQAAAABBV2dOOFh3ZzZobm1mWXJFYTR0OA", asset_type: monitor}
        note: "Official API reference example response (Search Audit Logs events, 200); asset_type is not in the example attributes so it is filled from the filter."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/audit-trail?query={{ (filters.query or '*') | urlencode }}&from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false"
    docs_url: https://docs.datadoghq.com/api/latest/audit/search-audit-logs-events/

  - name: datadog_incidents
    title: Incidents
    description: >-
      Datadog Incident Management incidents (v2 GET /api/v2/incidents/search), newest created first.
      Filter on state (active|stable|resolved|completed), severity (SEV-1..SEV-5|UNKNOWN) or a raw
      incident search query. Includes detection/impact timestamps and time-to-* durations.
    kind: incidents
    request:
      method: GET
      path: /api/v2/incidents/search
      query:
        query: "{{ [filters.query or none, ('state:' ~ (filters.state | join_or('{}'))) if filters.state else none, ('severity:' ~ (filters.severity | join_or('{}'))) if filters.severity else none] | compact | join(' AND ') or 'state:(active OR stable OR resolved OR completed)' }}"
        sort: "-created"
        include: users
    filters:
      - {column: query, description: "Incident search query (see query_languages.datadog_incident_search)", examples: ['customer_impacted:true']}
      - {column: state, ops: ["=", "in"], fan_out: false, description: "active | stable | resolved | completed", examples: ['active']}
      - {column: severity, ops: ["=", "in"], fan_out: false, description: "SEV-0 .. SEV-5 | UNKNOWN"}
    pagination: {type: offset, offset_param: "query.page[offset]", limit_param: "query.page[size]", page_size: 100, max_pages: 3}
    response:
      rows_path: "$.data.attributes.incidents[*].data"
    columns:
      - {name: id, path: id}
      - {name: public_id, type: BIGINT, path: "attributes.public_id", description: "Human incident number (#123)"}
      - {name: title, path: "attributes.title"}
      - {name: state, path: "attributes.state"}
      - {name: severity, path: "attributes.severity"}
      - {name: ts, type: TIMESTAMP, path: "attributes.created", transform: auto_time, description: "Created"}
      - {name: detected, type: TIMESTAMP, path: "attributes.detected", transform: auto_time}
      - {name: declared, type: TIMESTAMP, path: "attributes.declared", transform: auto_time}
      - {name: resolved, type: TIMESTAMP, path: "attributes.resolved", transform: auto_time}
      - {name: modified, type: TIMESTAMP, path: "attributes.modified", transform: auto_time}
      - {name: customer_impacted, type: BOOLEAN, path: "attributes.customer_impacted"}
      - {name: customer_impact_start, type: TIMESTAMP, path: "attributes.customer_impact_start", transform: auto_time}
      - {name: customer_impact_end, type: TIMESTAMP, path: "attributes.customer_impact_end", transform: auto_time}
      - {name: customer_impact_scope, path: "attributes.customer_impact_scope"}
      - {name: time_to_detect_s, type: BIGINT, path: "attributes.time_to_detect"}
      - {name: time_to_repair_s, type: BIGINT, path: "attributes.time_to_repair"}
      - {name: time_to_resolve_s, type: BIGINT, path: "attributes.time_to_resolve"}
      - {name: time_to_internal_response_s, type: BIGINT, path: "attributes.time_to_internal_response"}
      - {name: customer_impact_duration_s, type: BIGINT, path: "attributes.customer_impact_duration"}
      - {name: services, type: JSON, path: "attributes.fields.services.value", description: "Services field (multiselect) when set"}
      - {name: fields, type: JSON, path: "attributes.fields", description: "All user-defined incident fields"}
      - {name: commander_id, path: "relationships.commander_user.data.id"}
      - {name: commander, expr: "(root.included | selectattr('type', 'equalto', 'users') | selectattr('id', 'equalto', _.relationships.commander_user.data.id) | first).attributes.handle if _.relationships.commander_user.data else none", description: "Incident commander handle (from included users)"}
      - {name: author, expr: "(root.included | selectattr('type', 'equalto', 'users') | selectattr('id', 'equalto', _.relationships.created_by_user.data.id) | first).attributes.handle if _.relationships.created_by_user.data else none", description: "Handle of the user who created the incident"}
      - {name: is_test, type: BOOLEAN, path: "attributes.is_test"}
      - {name: query, filter_only: true}
    sort_hint: "newest created first"
    pitfalls:
      - "The search query is mandatory server-side; with no filter this table asks for every state."
      - "page[size] is at most 100; the table pages by offset (3 pages max)."
      - "Severity and state values are case-sensitive in the UI facets (SEV-1, active)."
    examples:
      - sql: >-
          SELECT public_id, title, severity, state, ts, resolved FROM datadog_incidents
          WHERE state IN ('active', 'stable') ORDER BY ts DESC
        description: Open incidents right now (is someone already on this?).
      - sql: >-
          SELECT public_id, title, severity, ts, time_to_resolve_s FROM datadog_incidents
          WHERE ts >= TIMESTAMP '2026-09-01 00:00:00' AND title ILIKE '%checkout%' ORDER BY ts DESC
        description: Similar past incidents for the same service.
    fixtures:
      - file: incidents_search.json
        filters: {state: active}
        expect_rows: 1
        expect_columns: {title: "A test incident title", severity: UNKNOWN, public_id: 1, ts: "2019-09-19T10:00:00Z", customer_impacted: false, id: "00000000-0000-0000-1234-000000000000"}
        note: "Official API reference example response (Search for incidents, 200)."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/incidents"
    docs_url: https://docs.datadoghq.com/api/latest/incidents/search-for-incidents/

  - name: datadog_teams
    title: Teams
    description: >-
      Datadog Teams (v2 GET /api/v2/team): id, handle, name, member and link counts. Filter keyword
      (team name, handle or a member's email). Use it to resolve a team handle (from a service
      definition or monitor tag team:<handle>) to the team id needed by datadog_oncall.
    kind: entities
    request:
      method: GET
      path: /api/v2/team
      query:
        "filter[keyword]": "{{ filters.keyword }}"
    filters:
      - {column: keyword, description: "Team name, handle or member email (server-side search)", examples: ['payments']}
    pagination: {type: page, page_param: "query.page[number]", limit_param: "query.page[size]", page_size: 100, start: 0, max_pages: 5}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id, description: "Team id (UUID)"}
      - {name: handle, path: "attributes.handle"}
      - {name: name, path: "attributes.name"}
      - {name: summary, path: "attributes.summary"}
      - {name: description, path: "attributes.description"}
      - {name: user_count, type: BIGINT, path: "attributes.user_count"}
      - {name: link_count, type: BIGINT, path: "attributes.link_count"}
      - {name: created_at, type: TIMESTAMP, path: "attributes.created_at", transform: auto_time}
      - {name: modified_at, type: TIMESTAMP, path: "attributes.modified_at", transform: auto_time}
      - {name: keyword, filter_only: true}
    examples:
      - sql: "SELECT id, handle, name, user_count FROM datadog_teams WHERE keyword = 'payments'"
        description: Resolve the owning team of a service to its id.
    fixtures:
      - file: teams_list.json
        expect_rows: 1
        expect_columns: {id: aeadc05e-98a8-11ec-ac2c-da7ad0900001, handle: example-team, name: Example Team, created_at: "2019-09-19T10:00:00Z"}
        note: "Official API reference example response (Get all teams, 200); 'integer' placeholders coerce to NULL."
    docs_url: https://docs.datadoghq.com/api/latest/teams/get-all-teams/

  - name: datadog_oncall
    title: Who is on call for a team (Datadog On-Call)
    description: >-
      Current on-call responders of a team in Datadog On-Call (v2 GET
      /api/v2/on-call/teams/{team_id}/on-call?include=responders,escalations.responders). Filter on
      team (handle or name; resolved to the first match of GET /api/v2/team?filter[keyword]=...) or
      team_id. One row per responder with name, email and handle.
    kind: entities
    steps:
      - name: find_team
        when: "not filters.team_id"
        method: GET
        path: /api/v2/team
        query:
          "filter[keyword]": "{{ filters.team }}"
          "page[size]": 10
        capture: {team_id: "$.data[0].id", team_handle: "$.data[0].attributes.handle"}
      - name: oncall
        method: GET
        path: "/api/v2/on-call/teams/{{ filters.team_id or captures.team_id }}/on-call"
        query:
          include: "responders,escalations.responders"
        accept_status: [404]
    filters:
      - {column: team, description: "Team handle or name (first keyword match is used)", examples: ['payments']}
      - {column: team_id, description: "Team id (UUID, from datadog_teams.id) - exact, skips the lookup"}
    require_one_of: [[team, team_id]]
    response:
      rows_path: "$.data.relationships.responders.data[*]"
    columns:
      - {name: user_id, path: id}
      - {name: name, expr: "(root.included | selectattr('type', 'equalto', 'users') | selectattr('id', 'equalto', _.id) | first).attributes.name"}
      - {name: email, expr: "(root.included | selectattr('type', 'equalto', 'users') | selectattr('id', 'equalto', _.id) | first).attributes.email"}
      - {name: handle, expr: "(root.included | selectattr('type', 'equalto', 'users') | selectattr('id', 'equalto', _.id) | first).attributes.handle"}
      - {name: status, expr: "(root.included | selectattr('type', 'equalto', 'users') | selectattr('id', 'equalto', _.id) | first).attributes.status", description: "User account status (active / pending / disabled)"}
      - {name: escalation_steps, type: JSON, path: "$.data.relationships.escalations.data", description: "Escalation policy steps of the team's current on-call configuration"}
      - {name: team, filter_only: true}
      - {name: team_id, filter_only: true}
    pitfalls:
      - "Only Datadog On-Call is covered; teams paged through PagerDuty / Opsgenie are found via datadog_service_definitions (pagerduty, integrations, contacts)."
      - "A team keyword can match several teams; the first match is used. Pass team_id (from datadog_teams) when the handle is ambiguous. An unknown team returns 0 rows (404)."
    examples:
      - sql: "SELECT name, email, handle FROM datadog_oncall WHERE team = 'payments'"
        description: Who to page for the owning team of the failing service.
    fixtures:
      - file: oncall_team.json
        filters: {team_id: 111ee23r-aaaaa-aaaa-aaww-1234wertsd23}
        expect_rows: 1
        expect_columns: {user_id: 111ee23r-aaaaa-aaaa-aaww-1234wertsd23, name: Test User, email: test@test.com, status: active, team_id: 111ee23r-aaaaa-aaaa-aaww-1234wertsd23}
        note: "Official API reference example response (Get team on-call users, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/on-call/get-team-on-call-users/

  - name: datadog_dora_deployments
    title: DORA deployments
    description: >-
      Deployment events from DORA Metrics (v2 POST /api/v2/dora/deployments): service, env, version,
      git commit and start/finish time. Filter on service, env, team or an event-platform query, plus ts.
      The best source for 'what was deployed right before the alert'.
    kind: changes
    request:
      method: POST
      path: /api/v2/dora/deployments
      body:
        data:
          type: dora_deployments_list_request
          attributes:
            from: "{{ time.start | rfc3339 }}"
            to: "{{ time.end | rfc3339 }}"
            query: "{{ [filters.query or none, (filters.service | join_or('service:{}')) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('team:' ~ filters.team) if filters.team else none] | compact | join(' ') or none }}"
            limit: "{{ [limit or 200, 1000] | min }}"
            sort: "-finished_at"
    filters:
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Service", examples: ['checkout']}
      - {column: env, description: "Environment", examples: ['production']}
      - {column: team, description: "Owning team"}
      - {column: query, description: "Event platform query, e.g. 'service:(a OR b) env:production'"}
    time: {column: ts, default_lookback: 24h, max_window: 90d}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: service, path: "attributes.service"}
      - {name: env, path: "attributes.env"}
      - {name: version, path: "attributes.version"}
      - {name: ts, type: TIMESTAMP, path: "attributes.started_at", transform: auto_time, description: "Deployment start"}
      - {name: finished_at, type: TIMESTAMP, path: "attributes.finished_at", transform: auto_time}
      - {name: team, path: "attributes.team"}
      - {name: commit_sha, path: "attributes.git.commit_sha"}
      - {name: repository, path: "attributes.git.repository_id"}
      - {name: tags, type: JSON, path: "attributes.custom_tags"}
      - {name: query, filter_only: true}
    sort_hint: "newest finished first"
    pitfalls:
      - "Only deployments sent to DORA Metrics (API, CI Visibility, or APM deployment tracking integration) appear; an empty result is not proof of no deploy - also check datadog_events and version changes in metrics."
      - "from/to are RFC3339 date-times (handled)."
    examples:
      - sql: >-
          SELECT ts, service, version, commit_sha, repository FROM datadog_dora_deployments
          WHERE env = 'production'
            AND ts BETWEEN TIMESTAMP '2026-10-01 08:00:00' AND TIMESTAMP '2026-10-01 11:45:00'
          ORDER BY ts DESC
        description: Deploys shortly before the alert (candidate culprits).
    fixtures:
      - file: dora_deployments.json
        filters: {env: production}
        expect_rows: 2
        expect_columns: {service: shopist, env: production, version: v1.12.07, ts: "2023-08-31T14:26:14Z", commit_sha: 66adc9350f2cc9b250b69abddab733dd55e1a588, repository: github.com/organization/example-repository}
        note: "Official API reference example response (Get a list of deployment events, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/delivery-performance/get-a-list-of-deployment-events/

  - name: datadog_dora_failures
    title: DORA failures (incident events)
    description: >-
      Failure / incident events recorded for DORA Metrics (v2 POST /api/v2/dora/failures): name,
      severity, impacted services, start/finish, version and commit, newest started first. Filter on
      service, env, team, query, ts.
    kind: incidents
    request:
      method: POST
      path: /api/v2/dora/failures
      body:
        data:
          type: dora_failures_list_request
          attributes:
            from: "{{ time.start | rfc3339 }}"
            to: "{{ time.end | rfc3339 }}"
            query: "{{ [filters.query or none, (filters.service | join_or('service:{}')) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('team:' ~ filters.team) if filters.team else none] | compact | join(' ') or none }}"
            limit: "{{ [limit or 200, 1000] | min }}"
            sort: "-started_at"
    filters:
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Impacted service", examples: ['shopist']}
      - {column: env, description: "Environment"}
      - {column: team, description: "Owning team"}
      - {column: query, description: "Event platform query"}
    time: {column: ts, default_lookback: 30d, max_window: 365d}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: title, path: "attributes.name"}
      - {name: severity, path: "attributes.severity"}
      - {name: services, type: JSON, path: "attributes.services"}
      - {name: env, path: "attributes.env"}
      - {name: ts, type: TIMESTAMP, path: "attributes.started_at", transform: auto_time}
      - {name: finished_at, type: TIMESTAMP, path: "attributes.finished_at", transform: auto_time}
      - {name: team, path: "attributes.team"}
      - {name: version, path: "attributes.version"}
      - {name: commit_sha, path: "attributes.git.commit_sha"}
      - {name: repository_url, path: "attributes.git.repository_url"}
      - {name: tags, type: JSON, path: "attributes.custom_tags"}
      - {name: service, filter_only: true}
      - {name: query, filter_only: true}
    examples:
      - sql: "SELECT ts, title, severity, services, finished_at FROM datadog_dora_failures WHERE service = 'shopist' ORDER BY ts DESC LIMIT 10"
        description: Past failures for a service (recurrence check).
    fixtures:
      - file: dora_failures.json
        filters: {service: shopist}
        expect_rows: 2
        expect_columns: {title: "Database outage", severity: SEV-1, env: production, ts: "2023-08-31T14:29:34Z", team: backend}
        note: "Official API reference example response (Get a list of incident events, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/delivery-performance/get-a-list-of-incident-events/

  # ----------------------------------------------------------------------------------------------
  # Services, dependencies, hosts
  # ----------------------------------------------------------------------------------------------
  - name: datadog_service_definitions
    title: Service Catalog definitions
    description: >-
      Service definitions from the Software/Service Catalog (v2 GET /api/v2/services/definitions,
      schema_version v2.2): owner team, tier, lifecycle, application, contacts (Slack/email),
      links (runbooks, repos), PagerDuty/Opsgenie integrations. One row per service.
    kind: entities
    request:
      method: GET
      path: /api/v2/services/definitions
      query:
        schema_version: v2.2
    pagination: {type: page, page_param: "query.page[number]", limit_param: "query.page[size]", page_size: 100, start: 0, max_pages: 10}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: service, expr: "_.attributes.schema['dd-service'] or _.attributes.schema.info['dd-service']"}
      - {name: team, expr: "_.attributes.schema.team or _.attributes.schema.org.team"}
      - {name: tier, expr: "_.attributes.schema.tier or _.attributes.schema.info['service-tier']"}
      - {name: lifecycle, path: "attributes.schema.lifecycle"}
      - {name: application, expr: "_.attributes.schema.application or _.attributes.schema.org.application"}
      - {name: description, expr: "_.attributes.schema.description or _.attributes.schema.info.description"}
      - {name: service_type, path: "attributes.schema.type"}
      - {name: languages, type: JSON, path: "attributes.schema.languages"}
      - {name: contacts, type: JSON, expr: "_.attributes.schema.contacts or _.attributes.schema.contact"}
      - {name: links, type: JSON, expr: "_.attributes.schema.links or _.attributes.schema['external-resources']"}
      - {name: pagerduty, expr: "_.attributes.schema.integrations.pagerduty['service-url'] if _.attributes.schema.integrations.pagerduty is mapping else _.attributes.schema.integrations.pagerduty"}
      - {name: integrations, type: JSON, path: "attributes.schema.integrations"}
      - {name: tags, type: JSON, path: "attributes.schema.tags"}
      - {name: schema_version, path: "attributes.schema['schema-version']"}
      - {name: github_url, path: "attributes.meta['github-html-url']"}
      - {name: last_modified, type: TIMESTAMP, path: "attributes.meta['last-modified-time']", transform: auto_time}
    pitfalls:
      - "Only services with a definition appear; APM-discovered services without one are in datadog_apm_services / datadog_catalog_entities (include_discovered)."
    examples:
      - sql: "SELECT service, team, tier, contacts, links, pagerduty FROM datadog_service_definitions WHERE service = 'checkout'"
        description: Owner team, on-call integration and runbooks of the affected service.
    fixtures:
      - file: service_definitions.json
        expect_rows: 1
        expect_columns: {service: myservice, team: my-team, tier: "Tier 1", application: E-Commerce, description: "A shopping cart service", pagerduty: "https://my-org.pagerduty.com/service-directory/PMyService", schema_version: v1}
        note: "Official API reference example response (Get all service definitions, 200; schema v1 shape - v2.x paths are read first, v1 as fallback)."
    docs_url: https://docs.datadoghq.com/api/latest/service-definition/get-all-service-definitions/

  - name: datadog_catalog_entities
    title: Software Catalog entities
    description: >-
      Software Catalog entities (v2 GET /api/v2/catalog/entity): services, datastores, queues,
      systems, APIs with owner and relations. Filter on kind, name, owner; include_discovered = true
      adds APM/USM-discovered services without definitions.
    kind: entities
    request:
      method: GET
      path: /api/v2/catalog/entity
      query:
        "filter[kind]": "{{ filters.kind }}"
        "filter[name]": "{{ filters.name }}"
        "filter[owner]": "{{ filters.owner }}"
        "filter[ref]": "{{ filters.ref }}"
        "filter[relation][type]": "{{ filters.relation_type }}"
        includeDiscovered: "{{ 'true' if filters.include_discovered else none }}"
    filters:
      - {column: kind, description: "service | datastore | queue | system | api | ...", examples: ['service']}
      - {column: name, description: "Entity name (exact)", examples: ['checkout']}
      - {column: owner, description: "Owner team"}
      - {column: ref, description: "Entity reference as shown in the Software Catalog (the reference does not spell out the format; prefer name + kind)"}
      - {column: relation_type, description: "Only entities having this relation: RelationTypeDependsOn | RelationTypeDependencyOf | RelationTypeOwnedBy | RelationTypeOwns | RelationTypePartsOf | RelationTypeHasPart | RelationTypeImplementedBy | RelationTypeImplements ..."}
      - {column: include_discovered, type: BOOLEAN, description: "Include discovered services without definitions"}
    pagination: {type: offset, offset_param: "query.page[offset]", limit_param: "query.page[limit]", page_size: 100, max_pages: 10}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: kind, path: "attributes.kind"}
      - {name: name, path: "attributes.name"}
      - {name: display_name, path: "attributes.displayName"}
      - {name: namespace, path: "attributes.namespace"}
      - {name: owner, path: "attributes.owner"}
      - {name: description, path: "attributes.description"}
      - {name: tags, type: JSON, path: "attributes.tags"}
      - {name: api_version, path: "attributes.apiVersion"}
      - {name: related_entities, type: JSON, path: "relationships.relatedEntities.data"}
      - {name: incidents, type: JSON, path: "relationships.incidents.data"}
      - {name: origin, path: "meta.origin"}
      - {name: modified_at, type: TIMESTAMP, path: "meta.modifiedAt", transform: auto_time}
      - {name: ref, filter_only: true}
      - {name: relation_type, filter_only: true}
      - {name: include_discovered, type: BOOLEAN, filter_only: true}
    examples:
      - sql: "SELECT name, owner, tags FROM datadog_catalog_entities WHERE kind = 'datastore'"
        description: Datastores in the catalog and who owns them.
    fixtures:
      - file: catalog_entities.json
        expect_rows: 1
        expect_columns: {id: string, kind: string, name: string, owner: string}
        note: "Official API reference example response (Get a list of entities, 200); values are documentation placeholders."
    docs_url: https://docs.datadoghq.com/api/latest/software-catalog/get-a-list-of-entities/

  - name: datadog_catalog_relations
    title: Software Catalog relations
    description: >-
      Relations between catalog entities (v2 GET /api/v2/catalog/relation): dependsOn, ownedBy,
      partOf... One row per edge with from/to kind and name. relation_type filter uses the enum
      (RelationTypeDependsOn, RelationTypeOwnedBy, ...). include_discovered adds APM/USM-discovered edges.
    kind: entities
    request:
      method: GET
      path: /api/v2/catalog/relation
      query:
        "filter[type]": "{{ filters.relation_type }}"
        "filter[from_ref]": "{{ filters.from_ref }}"
        "filter[to_ref]": "{{ filters.to_ref }}"
        includeDiscovered: "{{ 'true' if filters.include_discovered else none }}"
    filters:
      - {column: relation_type, description: "RelationTypeDependsOn | RelationTypeDependencyOf | RelationTypeOwnedBy | RelationTypeOwns | RelationTypePartsOf | RelationTypeHasPart ...", examples: ['RelationTypeDependsOn']}
      - {column: from_ref, description: "Reference of the first entity (as shown in the catalog)"}
      - {column: to_ref, description: "Reference of the second entity"}
      - {column: include_discovered, type: BOOLEAN, description: "Include APM/USM-discovered relations"}
    pagination: {type: offset, offset_param: "query.page[offset]", limit_param: "query.page[limit]", page_size: 100, max_pages: 10}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: relation_type, path: "attributes.type"}
      - {name: from_kind, path: "attributes.from.kind"}
      - {name: from_name, path: "attributes.from.name"}
      - {name: from_namespace, path: "attributes.from.namespace"}
      - {name: to_kind, path: "attributes.to.kind"}
      - {name: to_name, path: "attributes.to.name"}
      - {name: to_namespace, path: "attributes.to.namespace"}
      - {name: source, path: "meta.source"}
      - {name: defined_by, path: "meta.definedBy"}
      - {name: modified_at, type: TIMESTAMP, path: "meta.modifiedAt", transform: auto_time}
      - {name: from_ref, filter_only: true}
      - {name: to_ref, filter_only: true}
      - {name: include_discovered, type: BOOLEAN, filter_only: true}
    pitfalls:
      - "The entity reference format for from_ref/to_ref is not spelled out in the reference; prefer fetching edges and filtering from_name/to_name in SQL."
    examples:
      - sql: >-
          SELECT from_name, to_kind, to_name FROM datadog_catalog_relations
          WHERE relation_type = 'RelationTypeDependsOn' AND (from_name = 'checkout' OR to_name = 'checkout')
        description: Declared dependencies of a service (upstream and downstream).
    fixtures:
      - file: catalog_relations.json
        expect_rows: 1
        expect_columns: {id: string, relation_type: string, from_name: string, to_name: string, modified_at: "2019-09-19T10:00:00Z"}
        note: "Official API reference example response (Get a list of entity relations, 200); values are documentation placeholders."
    docs_url: https://docs.datadoghq.com/api/latest/software-catalog/get-a-list-of-entity-relations/

  - name: datadog_service_dependencies
    title: APM service dependency graph
    description: >-
      Observed APM call graph for an environment (v1 GET /api/v1/service_dependencies?env=...): one row
      per edge service -> calls_service (leaf services appear once with calls_service NULL).
      env is required; ts sets the observation window (default 1h).
    kind: entities
    request:
      method: GET
      path: /api/v1/service_dependencies
      query:
        env: "{{ filters.env }}"
        primary_tag: "{{ filters.primary_tag }}"
        start: "{{ time.start | epoch_s }}"
        end: "{{ time.end | epoch_s }}"
    filters:
      - {column: env, required: true, description: "APM environment", examples: ['prod']}
      - {column: primary_tag, description: "Second primary tag as key:value, e.g. datacenter:us1"}
    time: {column: ts, default_lookback: 1h, max_window: 7d}
    response:
      rows_path: "$"
      expand:
        - {entries: ".", as: e}
        - {explode: "@e.value.calls", as: c, keep_empty: true}
    columns:
      - {name: service, path: "@e.key", description: "Calling service"}
      - {name: calls_service, path: "@c", description: "Called (downstream) service; NULL for leaves"}
      - {name: env, filter_only: true}
      - {name: primary_tag, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Edges exist only for traced calls in the window; a dependency with no traffic during the window is absent."
      - "Upstream callers of X: WHERE calls_service = 'X'; downstream: WHERE service = 'X'."
    examples:
      - sql: >-
          SELECT service AS caller FROM datadog_service_dependencies
          WHERE env = 'prod' AND calls_service = 'payments-api'
        description: Who calls the failing service (blast radius upstream).
      - sql: "SELECT calls_service FROM datadog_service_dependencies WHERE env = 'prod' AND service = 'checkout'"
        description: Downstream dependencies of the alerting service (candidate root causes).
    fixtures:
      - file: service_dependencies.json
        filters: {env: prod}
        expect_rows: 5
        expect_columns: {service: servica_a, calls_service: service_b, env: prod}
        note: "Official API reference example response (Get all APM service dependencies, 200); 4 services, 4 edges + 1 leaf row."
    docs_url: https://docs.datadoghq.com/api/latest/service-dependencies/get-all-apm-service-dependencies/

  - name: datadog_service_neighbors
    title: Upstream/downstream of one APM service
    description: >-
      Immediate callers (called_by) and callees (calls) of one APM service (v1 GET
      /api/v1/service_dependencies/{service}?env=...). One row with JSON arrays.
    kind: entities
    request:
      method: GET
      path: "/api/v1/service_dependencies/{{ filters.service }}"
      query:
        env: "{{ filters.env }}"
        primary_tag: "{{ filters.primary_tag }}"
        start: "{{ time.start | epoch_s }}"
        end: "{{ time.end | epoch_s }}"
      accept_status: [404]
    filters:
      - {column: service, required: true, description: "APM service name", examples: ['checkout']}
      - {column: env, required: true, description: "APM environment", examples: ['prod']}
      - {column: primary_tag, description: "Second primary tag key:value"}
    time: {column: ts, default_lookback: 1h, max_window: 7d}
    response:
      rows_path: "$"
    columns:
      - {name: service, path: name}
      - {name: calls, type: JSON, path: calls, description: "Downstream services (JSON array)"}
      - {name: called_by, type: JSON, path: called_by, description: "Upstream services (JSON array)"}
      - {name: env, filter_only: true}
      - {name: primary_tag, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT calls, called_by FROM datadog_service_neighbors WHERE service = 'checkout' AND env = 'prod'"
        description: One-hop neighborhood of the alerting service.
    fixtures:
      - file: service_dependencies_one.json
        filters: {service: service-c, env: prod}
        expect_rows: 1
        expect_columns: {service: service-c, env: prod}
        note: "Official API reference example response (Get one APM service's dependencies, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/service-dependencies/get-one-apm-services-dependencies/

  - name: datadog_apm_services
    title: APM services per environment
    description: Names of services seen by APM/USM in an environment (v2 GET /api/v2/apm/services?filter[env]=...; env '*' = all).
    kind: entities
    request:
      method: GET
      path: /api/v2/apm/services
      query:
        "filter[env]": "{{ filters.env or '*' }}"
    filters:
      - {column: env, description: "Environment (default '*' = all environments)", examples: ['prod']}
    response:
      rows_path: "$.data.attributes.services[*]"
    columns:
      - {name: service, path: ".", description: "Service name"}
      - {name: env, filter_only: true}
    examples:
      - sql: "SELECT service FROM datadog_apm_services WHERE env = 'prod' AND service LIKE '%pay%'"
        description: Resolve the exact APM service name before filtering other tables.
    tests:
      - {sql: "SELECT service FROM datadog_apm_services LIMIT 5", min_rows: 0}
    fixtures:
      - file: apm_services.json
        expect_rows: 0
        note: "Official API reference example response (Get service list, 200): an empty services list."
      - file: apm_services_schema.json
        filters: {env: prod}
        expect_rows: 3
        expect_columns: {service: checkout, env: prod}
        note: "Built strictly from the documented ServiceList schema (data.attributes.services[] strings)."
    docs_url: https://docs.datadoghq.com/api/latest/apm/get-service-list/

  - name: datadog_hosts
    title: Hosts
    description: >-
      Hosts reporting to Datadog (v1 GET /api/v1/hosts; live in the last 3 hours by default):
      up/down, last report time, CPU/IO-wait/load, agent version, apps (integrations), sources and
      tags by source. Filter host (name/alias substring) or query (any host search string, e.g. 'env:prod').
    kind: entities
    request:
      method: GET
      path: /api/v1/hosts
      query:
        filter: "{{ filters.query or filters.host }}"
        include_hosts_metadata: "true"
        include_muted_hosts_data: "true"
    filters:
      - {column: host, variants: hostname, description: "Host name or alias", examples: ['web-1']}
      - {column: query, description: "Host search string: name, alias or tag such as env:prod"}
    pagination: {type: offset, offset_param: query.start, limit_param: query.count, page_size: 1000, total_path: "$.total_matching", max_pages: 5}
    response:
      rows_path: "$.host_list[*]"
    columns:
      - {name: host, path: host_name}
      - {name: name, path: name}
      - {name: id, type: BIGINT, path: id}
      - {name: aws_name, path: aws_name}
      - {name: aliases, type: JSON, path: aliases}
      - {name: up, type: BOOLEAN, path: up}
      - {name: last_reported, type: TIMESTAMP, path: last_reported_time, transform: epoch_s}
      - {name: cpu_pct, type: DOUBLE, path: "metrics.cpu", description: "% CPU used (non-idle)"}
      - {name: iowait_pct, type: DOUBLE, path: "metrics.iowait"}
      - {name: load_15m, type: DOUBLE, path: "metrics.load"}
      - {name: agent_version, path: "meta.agent_version"}
      - {name: platform, path: "meta.platform"}
      - {name: cpu_cores, type: BIGINT, path: "meta.cpuCores"}
      - {name: apps, type: JSON, path: apps, description: "Integrations reporting for the host"}
      - {name: sources, type: JSON, path: sources}
      - {name: tags_by_source, type: JSON, path: tags_by_source}
      - {name: is_muted, type: BOOLEAN, path: is_muted}
      - {name: mute_until, type: TIMESTAMP, path: mute_timeout, transform: epoch_s}
      - {name: query, filter_only: true}
    pitfalls:
      - "Host names come in short and FQDN forms (and AWS instance ids); the engine retries variants when empty."
      - "last_reported is epoch seconds (converted). A stale last_reported means the agent stopped reporting, not that the host is healthy."
    examples:
      - sql: >-
          SELECT host, up, last_reported, cpu_pct, load_15m, agent_version FROM datadog_hosts
          WHERE query = 'service:checkout' ORDER BY cpu_pct DESC
        description: Health of the hosts behind a service.
      - sql: "SELECT host, up, last_reported, apps FROM datadog_hosts WHERE host = 'ip-10-0-1-23'"
        description: Is this host up and reporting?
    tests:
      - {sql: "SELECT host, up, last_reported FROM datadog_hosts LIMIT 5", min_rows: 0}
    fixtures:
      - file: hosts.json
        expect_rows: 1
        expect_columns: {host: i-deadbeef, name: i-hostname, up: true, cpu_pct: 99, last_reported: "2019-08-05T10:13:20Z", agent_version: 7.32.3, platform: linux}
        note: "Official API reference example response (Get all hosts for your organization, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/hosts/get-all-hosts-for-your-organization/

  - name: datadog_containers
    title: Containers (live inventory)
    description: >-
      Containers currently reported by the Datadog Agent (v2 GET /api/v2/containers): name, state,
      image, host, start time and tags, with service / env / kube_namespace / kube_deployment / pod
      extracted from the tags. Filter on service, env, host, kube_namespace, kube_deployment, pod
      (all sent as filter[tags]) or raw tags ('key:value,key:value'). One row per container.
    kind: entities
    request:
      method: GET
      path: /api/v2/containers
      query:
        "filter[tags]": "{{ [filters.tags or none, ('service:' ~ filters.service) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('host:' ~ filters.host) if filters.host else none, ('kube_namespace:' ~ filters.kube_namespace) if filters.kube_namespace else none, ('kube_deployment:' ~ filters.kube_deployment) if filters.kube_deployment else none, ('pod_name:' ~ filters.pod) if filters.pod else none] | compact | join(',') or none }}"
        "page[size]": 1000
    filters:
      - {column: service, description: "service tag", examples: ['checkout']}
      - {column: env, description: "env tag"}
      - {column: host, variants: hostname, description: "Host running the container"}
      - {column: kube_namespace, description: "Kubernetes namespace tag", examples: ['payments']}
      - {column: kube_deployment, description: "Kubernetes deployment tag", examples: ['checkout']}
      - {column: pod, description: "pod_name tag"}
      - {column: tags, description: "Raw comma separated tag filter, e.g. 'kube_cluster_name:prod-eu,image_tag:1.42.0'"}
    pagination: {type: cursor, cursor_path: "$.meta.pagination.next_cursor", cursor_param: "query.page[cursor]", max_pages: 3}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: container_id, path: "attributes.container_id"}
      - {name: name, path: "attributes.name"}
      - {name: state, path: "attributes.state", description: "Runtime state, e.g. running | exited | created (depends on the runtime)"}
      - {name: host, path: "attributes.host"}
      - {name: image_name, path: "attributes.image_name"}
      - {name: image_tags, type: JSON, path: "attributes.image_tags"}
      - {name: image_digest, path: "attributes.image_digest"}
      - {name: started_at, type: TIMESTAMP, path: "attributes.started_at", transform: auto_time}
      - {name: created_at, type: TIMESTAMP, path: "attributes.created_at", transform: auto_time}
      - {name: service, expr: "((',' ~ (_.attributes.tags or []) | join(',') ~ ',').split(',service:')[1].split(',')[0]) if ',service:' in (',' ~ ((_.attributes.tags or []) | join(','))) else none"}
      - {name: env, expr: "((',' ~ (_.attributes.tags or []) | join(',') ~ ',').split(',env:')[1].split(',')[0]) if ',env:' in (',' ~ ((_.attributes.tags or []) | join(','))) else none"}
      - {name: version, expr: "((',' ~ (_.attributes.tags or []) | join(',') ~ ',').split(',version:')[1].split(',')[0]) if ',version:' in (',' ~ ((_.attributes.tags or []) | join(','))) else none"}
      - {name: kube_namespace, expr: "((',' ~ (_.attributes.tags or []) | join(',') ~ ',').split(',kube_namespace:')[1].split(',')[0]) if ',kube_namespace:' in (',' ~ ((_.attributes.tags or []) | join(','))) else none"}
      - {name: kube_deployment, expr: "((',' ~ (_.attributes.tags or []) | join(',') ~ ',').split(',kube_deployment:')[1].split(',')[0]) if ',kube_deployment:' in (',' ~ ((_.attributes.tags or []) | join(','))) else none"}
      - {name: pod, expr: "((',' ~ (_.attributes.tags or []) | join(',') ~ ',').split(',pod_name:')[1].split(',')[0]) if ',pod_name:' in (',' ~ ((_.attributes.tags or []) | join(','))) else none"}
      - {name: tags, type: JSON, path: "attributes.tags"}
    pitfalls:
      - "Live inventory only (what runs now): a container that crashed and was replaced during the incident is gone - use kubernetes.* metrics or datadog_events (source:kubernetes) for history."
      - "started_at later than the incident start = the container restarted / was rescheduled during the incident."
      - "Tag filters are exact 'key:value' pairs combined with AND; tag names depend on the Agent setup (kube_deployment, pod_name, kube_namespace on Kubernetes)."
    examples:
      - sql: >-
          SELECT pod, host, state, started_at, image_tags FROM datadog_containers
          WHERE kube_deployment = 'checkout' AND kube_namespace = 'payments' ORDER BY started_at DESC
        description: Did the pods of the deployment restart, and which image is running?
      - sql: "SELECT host, count(*) AS containers, min(started_at) AS oldest FROM datadog_containers WHERE service = 'checkout' GROUP BY host"
        description: Where does a service run right now?
    fixtures:
      - file: containers_recorded.json
        filters: {service: go-sample-app-modebeige}
        expect_rows: 2
        expect_columns: {id: 15e90400bf66f26f4e7d3098406c30e11e2bc921, name: test_name, state: running, started_at: "2023-10-12T13:46:51Z", service: go-sample-app-modebeige, env: pcf-modebeige, version: 1.0.0, pod: null}
        note: "Recorded 200 response from Datadog's official datadog-api-client-python cassette tests/v2/cassettes/test_scenarios/test_get_all_containers_returns_ok_response.yaml, trimmed to the first 2 containers and a subset of their tags (service, env, version, host, container_name, app_name)."
    docs_url: https://docs.datadoghq.com/api/latest/containers/get-all-containers/

  # ----------------------------------------------------------------------------------------------
  # SLOs
  # ----------------------------------------------------------------------------------------------
  - name: datadog_slos
    title: SLOs with current status
    description: >-
      Service level objectives with their current SLI, error budget remaining and state (v1 GET
      /api/v1/slo/search). Filter on service (service:<x>), env, or a free query (SLO name text).
    kind: entities
    request:
      method: GET
      path: /api/v1/slo/search
      query:
        query: "{{ [filters.query or none, ('service:' ~ filters.service) if filters.service else none, ('env:' ~ filters.env) if filters.env else none] | compact | join(' ') or none }}"
    filters:
      - {column: query, description: "SLO search text (name, or tag:value)", examples: ['checkout']}
      - {column: service, description: "service tag of the SLO", examples: ['checkout']}
      - {column: env, description: "env tag of the SLO"}
    pagination: {type: page, page_param: "query.page[number]", limit_param: "query.page[size]", page_size: 100, start: 0, max_pages: 5}
    response:
      rows_path: "$.data.attributes.slos[*].data"
    columns:
      - {name: id, path: id}
      - {name: name, path: "attributes.name"}
      - {name: slo_type, path: "attributes.slo_type", description: "metric | monitor | time_slice"}
      - {name: description, path: "attributes.description"}
      - {name: target, type: DOUBLE, path: "attributes.thresholds[0].target"}
      - {name: timeframe, path: "attributes.thresholds[0].timeframe", description: "7d | 30d | 90d"}
      - {name: warning, type: DOUBLE, path: "attributes.thresholds[0].warning"}
      - {name: sli, type: DOUBLE, path: "attributes.status.sli", description: "Current SLI % for the primary timeframe"}
      - {name: error_budget_remaining, type: DOUBLE, path: "attributes.status.error_budget_remaining", description: "% of error budget left"}
      - {name: state, path: "attributes.status.state", description: "breached | warning | ok | no_data"}
      - {name: thresholds, type: JSON, path: "attributes.thresholds"}
      - {name: overall_status, type: JSON, path: "attributes.overall_status", description: "Status per timeframe"}
      - {name: tags, type: JSON, path: "attributes.all_tags"}
      - {name: service_tags, type: JSON, path: "attributes.service_tags"}
      - {name: monitor_ids, type: JSON, path: "attributes.monitor_ids"}
      - {name: numerator, path: "attributes.query.numerator"}
      - {name: denominator, path: "attributes.query.denominator"}
      - {name: created_at, type: TIMESTAMP, path: "attributes.created_at", transform: epoch_s}
      - {name: modified_at, type: TIMESTAMP, path: "attributes.modified_at", transform: epoch_s}
      - {name: query, filter_only: true, description: "SLO search text"}
      - {name: service, filter_only: true}
      - {name: env, filter_only: true}
    examples:
      - sql: >-
          SELECT name, target, timeframe, sli, error_budget_remaining, state FROM datadog_slos
          WHERE service = 'checkout' ORDER BY error_budget_remaining
        description: Is the incident burning the service's SLOs?
    fixtures:
      - file: slo_search.json
        expect_rows: 1
        expect_columns: {name: "Custom Metric SLO", slo_type: metric, target: 99.9, timeframe: 30d, sli: 100, error_budget_remaining: 100, state: ok, numerator: "sum:my.custom.metric{type:good}.as_count()"}
        note: "Official API reference example response (Search for SLOs, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/service-level-objectives/search-for-slos/

  - name: datadog_slo_history
    title: SLO history over a window
    description: >-
      SLI value and error budget of one SLO over an arbitrary window (v1 GET /api/v1/slo/{slo_id}/history,
      from_ts/to_ts epoch seconds). One row (overall) with groups/monitors breakdown as JSON.
      Pass target to get error budget for a custom window.
    kind: timeseries
    request:
      method: GET
      path: "/api/v1/slo/{{ filters.slo_id }}/history"
      query:
        from_ts: "{{ time.start | epoch_s }}"
        to_ts: "{{ time.end | epoch_s }}"
        target: "{{ filters.target }}"
    filters:
      - {column: slo_id, required: true, description: "SLO id (from datadog_slos.id)", examples: ['3fb2d3a1b7d05e8b9f0a5b6c7d8e9f01']}
      - {column: target, type: DOUBLE, description: "Target % for custom-window error budget"}
    time: {column: ts, default_lookback: 7d, max_window: 90d}
    response:
      rows_path: "$.data.overall"
    columns:
      - {name: slo_id, filter_only: true, description: "SLO id (from the filter)"}
      - {name: sli_value, type: DOUBLE, path: sli_value, description: "SLI % over the window"}
      - {name: span_precision, type: DOUBLE, path: span_precision}
      - {name: error_budget_remaining, type: JSON, path: error_budget_remaining, description: "Map timeframe -> remaining %"}
      - {name: history, type: JSON, path: history, description: "Monitor SLOs: [epoch_s, state] transitions"}
      - {name: errors, type: JSON, path: errors}
      - {name: slo_type, path: "$.data.type"}
      - {name: thresholds, type: JSON, path: "$.data.thresholds"}
      - {name: groups, type: JSON, path: "$.data.groups"}
      - {name: monitors, type: JSON, path: "$.data.monitors"}
      - {name: window_start, type: TIMESTAMP, path: "$.data.from_ts", transform: epoch_s}
      - {name: window_end, type: TIMESTAMP, path: "$.data.to_ts", transform: epoch_s}
      - {name: api_errors, type: JSON, path: "$.errors", description: "Partial-failure messages returned with a 200"}
      - {name: target, type: DOUBLE, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "A 200 can carry errors (api_errors / errors): check them before trusting sli_value."
      - "Event-based and time-based SLOs have different detail shapes; the overall row is common to both."
    examples:
      - sql: >-
          SELECT sli_value, error_budget_remaining, api_errors FROM datadog_slo_history
          WHERE slo_id = '3fb2d3a1b7d05e8b9f0a5b6c7d8e9f01'
            AND ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
        description: SLI during the incident window.
    fixtures:
      - file: slo_history.json
        filters: {slo_id: abc123}
        expect_rows: 1
        expect_columns: {slo_id: abc123, sli_value: 99.99, slo_type: metric, window_end: "2021-03-16T21:06:30Z"}
        note: "Official API reference example response (Get an SLO's history, 200; metric-based variant)."
    docs_url: https://docs.datadoghq.com/api/latest/service-level-objectives/get-an-slos-history/

  - name: datadog_slo_status
    title: SLO status for a window (v2)
    description: >-
      Current SLI, error budget remaining and state of one SLO for a time window (v2 GET
      /api/v2/slo/{slo_id}/status, from_ts/to_ts epoch seconds).
    kind: timeseries
    request:
      method: GET
      path: "/api/v2/slo/{{ filters.slo_id }}/status"
      query:
        from_ts: "{{ time.start | epoch_s }}"
        to_ts: "{{ time.end | epoch_s }}"
    filters:
      - {column: slo_id, required: true, description: "SLO id", examples: ['00000000-0000-0000-0000-000000000000']}
    time: {column: ts, default_lookback: 30d, max_window: 90d}
    response:
      rows_path: "$.data"
    columns:
      - {name: slo_id, path: id}
      - {name: sli, type: DOUBLE, path: "attributes.sli"}
      - {name: error_budget_remaining, type: DOUBLE, path: "attributes.error_budget_remaining", description: "% of budget left"}
      - {name: error_budget_remaining_raw, type: DOUBLE, path: "attributes.raw_error_budget_remaining.value"}
      - {name: error_budget_unit, path: "attributes.raw_error_budget_remaining.unit", description: "seconds | requests ..."}
      - {name: state, path: "attributes.state", description: "breached | warning | ok"}
      - {name: span_precision, type: BIGINT, path: "attributes.span_precision"}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT sli, error_budget_remaining, state FROM datadog_slo_status WHERE slo_id = '00000000-0000-0000-0000-000000000000' AND ts >= TIMESTAMP '2026-09-01 00:00:00'"
        description: Error budget left this month.
    fixtures:
      - file: slo_status.json
        expect_rows: 1
        expect_columns: {slo_id: "00000000-0000-0000-0000-000000000000", sli: 99.95, error_budget_remaining: 99.5, error_budget_remaining_raw: 86400.5, error_budget_unit: seconds, state: ok}
        note: "Official API reference example response (Get SLO status, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/service-level-objectives/get-slo-status/

  # ----------------------------------------------------------------------------------------------
  # Dashboards
  # ----------------------------------------------------------------------------------------------
  - name: datadog_dashboards
    title: Dashboards
    description: Custom dashboards (v1 GET /api/v1/dashboard; preset/integration dashboards are not listed). Filter title in SQL.
    kind: entities
    request:
      method: GET
      path: /api/v1/dashboard
      query:
        "filter[shared]": "{{ 'true' if filters.shared else none }}"
    filters:
      - {column: shared, type: BOOLEAN, description: "Only shared dashboards"}
    pagination: {type: offset, offset_param: query.start, limit_param: query.count, page_size: 100, max_pages: 10}
    response:
      rows_path: "$.dashboards[*]"
    columns:
      - {name: id, path: id}
      - {name: title, path: title}
      - {name: description, path: description}
      - {name: url, path: url, description: "Relative UI path, e.g. /dashboard/abc-def-ghi/title"}
      - {name: author, path: author_handle}
      - {name: layout_type, path: layout_type}
      - {name: created_at, type: TIMESTAMP, path: created_at, transform: auto_time}
      - {name: modified_at, type: TIMESTAMP, path: modified_at, transform: auto_time}
      - {name: shared, type: BOOLEAN, filter_only: true}
    examples:
      - sql: "SELECT id, title, url FROM datadog_dashboards WHERE title ILIKE '%checkout%'"
        description: Find the team dashboard for a service.
    fixtures:
      - file: dashboards_list.json
        expect_rows: 1
        expect_columns: {id: string, layout_type: ordered, created_at: "2019-09-19T10:00:00Z"}
        note: "Official API reference example response (Get all dashboards, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/dashboards/get-all-dashboards/

  - name: datadog_dashboard_widgets
    title: Dashboard widgets (exploded)
    description: >-
      Widgets of one dashboard (v1 GET /api/v1/dashboard/{dashboard_id}), with group widgets exploded
      one level (children rows carry group_title). Columns: type, title and requests JSON (the
      queries the team watches). Reuse those queries in datadog_metrics_timeseries / datadog_logs.
    kind: entities
    request:
      method: GET
      path: "/api/v1/dashboard/{{ filters.dashboard_id }}"
      accept_status: [404]
    filters:
      - {column: dashboard_id, required: true, description: "Dashboard id (from datadog_dashboards.id)", examples: ['abc-def-ghi']}
    response:
      rows_path: "$.widgets[*]"
      expand:
        - {explode: "definition.widgets", as: child, keep_empty: true}
    columns:
      - {name: widget_id, type: BIGINT, expr: "(child or _).id"}
      - {name: type, expr: "(child or _).definition.type", description: "timeseries | query_value | toplist | hostmap | log_stream | note ..."}
      - {name: title, expr: "(child or _).definition.title"}
      - {name: group_title, expr: "_.definition.title if child else none", description: "Title of the enclosing group widget"}
      - {name: requests, type: JSON, expr: "(child or _).definition.requests", description: "Widget requests incl. queries / formulas (JSON)"}
      - {name: definition, type: JSON, expr: "(child or _).definition"}
      - {name: dashboard_title, path: "$.title"}
      - {name: dashboard_url, path: "$.url"}
      - {name: template_variables, type: JSON, path: "$.template_variables"}
      - {name: dashboard_id, path: "$.id"}
    pitfalls:
      - "Queries may reference template variables ($env, $service): substitute them before reuse."
      - "Search requests JSON as text: CAST(requests AS VARCHAR) LIKE '%trace.http.request%'."
    examples:
      - sql: >-
          SELECT title, type, requests FROM datadog_dashboard_widgets
          WHERE dashboard_id = 'abc-def-ghi' AND type IN ('timeseries', 'query_value')
        description: The queries a team watches for a service (reuse them in the investigation).
    fixtures:
      - file: dashboard_get.json
        filters: {dashboard_id: 123-abc-456}
        expect_rows: 1
        expect_columns: {type: hostmap, dashboard_title: "", dashboard_url: /dashboard/123-abc-456/example-dashboard-title, group_title: null}
        note: "Official API reference example response (Get a dashboard, 200)."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/dashboard/{{ filters.dashboard_id }}?from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false"
    docs_url: https://docs.datadoghq.com/api/latest/dashboards/get-a-dashboard/

  # ----------------------------------------------------------------------------------------------
  # Synthetics
  # ----------------------------------------------------------------------------------------------
  - name: datadog_synthetics_tests
    title: Synthetic tests
    description: Synthetic API/browser/mobile tests (v1 GET /api/v1/synthetics/tests) with status, type, locations, tags and the tested URL.
    kind: entities
    request:
      method: GET
      path: /api/v1/synthetics/tests
    pagination: {type: page, page_param: query.page_number, limit_param: query.page_size, page_size: 100, start: 0, max_pages: 10}
    response:
      rows_path: "$.tests[*]"
    columns:
      - {name: public_id, path: public_id}
      - {name: name, path: name}
      - {name: type, path: type, description: "api | browser | mobile | network"}
      - {name: subtype, path: subtype, description: "http | ssl | tcp | dns | multi | grpc | ..."}
      - {name: status, path: status, description: "live | paused"}
      - {name: monitor_id, type: BIGINT, path: monitor_id}
      - {name: target_url, path: "config.request.url", description: "URL under test (API tests)"}
      - {name: locations, type: JSON, path: locations}
      - {name: tags, type: JSON, path: tags}
      - {name: assertions, type: JSON, path: "config.assertions"}
      - {name: message, path: message}
    examples:
      - sql: "SELECT public_id, name, target_url, locations FROM datadog_synthetics_tests WHERE status = 'live' AND target_url LIKE '%checkout%'"
        description: Which synthetic tests probe the affected endpoint.
    fixtures:
      - file: synthetics_tests.json
        expect_rows: 1
        expect_columns: {public_id: string, status: live, subtype: http, target_url: "https://example.com"}
        note: "Official API reference example response (Get the list of all Synthetic tests, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/synthetics/get-the-list-of-all-synthetic-tests/

  - name: datadog_synthetics_results
    title: Synthetic test results
    description: >-
      Latest result summaries of one synthetic test (v2 GET /api/v2/synthetics/tests/{public_id}/results,
      from_ts/to_ts epoch ms): pass/fail per location and run, duration, error message, timings.
      Filter status (passed|failed|no_data), run_type, location.
    kind: events
    request:
      method: GET
      path: "/api/v2/synthetics/tests/{{ filters.public_id }}/results"
      query:
        from_ts: "{{ time.start | epoch_ms }}"
        to_ts: "{{ time.end | epoch_ms }}"
        status: "{{ filters.status }}"
        runType: "{{ filters.run_type }}"
        probe_dc: "{{ filters.location }}"
    filters:
      - {column: public_id, required: true, description: "Synthetic test public id (abc-def-ghi)", examples: ['abc-def-123']}
      - {column: status, description: "passed | failed | no_data", examples: ['failed']}
      - {column: run_type, description: "scheduled | fast | ci | triggered"}
      - {column: location, description: "Location id, e.g. aws:us-east-1"}
    time: {column: ts, default_lookback: 1h, max_window: 7d}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: result_id, path: id}
      - {name: public_id, path: "relationships.test.data.id"}
      - {name: ts, type: TIMESTAMP, path: "attributes.started_at", transform: epoch_ms}
      - {name: finished_at, type: TIMESTAMP, path: "attributes.finished_at", transform: epoch_ms}
      - {name: status, path: "attributes.status"}
      - {name: run_type, path: "attributes.run_type"}
      - {name: location, path: "attributes.location.id"}
      - {name: location_name, path: "attributes.location.name"}
      - {name: duration_ms, type: DOUBLE, path: "attributes.execution_info.duration.value"}
      - {name: error_message, path: "attributes.execution_info.error_message"}
      - {name: unhealthy_location, type: BOOLEAN, path: "attributes.execution_info.unhealthy", description: "Location itself was unhealthy (not a product failure)"}
      - {name: is_fast_retry, type: BOOLEAN, path: "attributes.execution_info.is_fast_retry", description: "Result of an automatic fast retry"}
      - {name: timings, type: JSON, path: "attributes.execution_info.timings", description: "dns/tcp/ssl/firstByte/download/total in ms"}
      - {name: test_type, path: "attributes.test_type"}
      - {name: test_sub_type, path: "attributes.test_sub_type"}
      - {name: steps_errors, type: BIGINT, path: "attributes.steps_info.errors"}
    pitfalls:
      - "Failures from one location with unhealthy_location = true are probe problems, not outages."
      - "from_ts/to_ts are epoch milliseconds (handled)."
    examples:
      - sql: >-
          SELECT location, count(*) AS failures, min(ts) AS first_failure, any_value(error_message) AS sample_error
          FROM datadog_synthetics_results
          WHERE public_id = 'abc-def-123' AND status = 'failed'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY location ORDER BY failures DESC
        description: Is the outage global or regional, and when did the probe first fail?
    fixtures:
      - file: synthetics_results_v2.json
        filters: {public_id: abc-def-123}
        expect_rows: 1
        expect_columns: {result_id: "5158904793181869365", public_id: abc-def-123, status: passed, location: "aws:us-east-1", duration_ms: 380, error_message: "Connection timed out", run_type: scheduled}
        note: "Official API reference example response (Get a test's latest results, 200); started_at/finished_at are placeholders there."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/synthetics/details/{{ filters.public_id }}?from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false"
    docs_url: https://docs.datadoghq.com/api/latest/synthetics/get-a-tests-latest-results/

  # ----------------------------------------------------------------------------------------------
  # Error Tracking
  # ----------------------------------------------------------------------------------------------
  - name: datadog_error_tracking_issues
    title: Error Tracking issues
    description: >-
      Error Tracking issues matching a query over a window (v2 POST /api/v2/error-tracking/issues/search
      ?include=issue), with occurrence counts, impacted users/sessions, error type/message, file and
      function, first/last seen version and state. Filter service, env, track (trace|logs|rum),
      state, order_by (TOTAL_COUNT default | FIRST_SEEN | IMPACTED_SESSIONS | PRIORITY). Max 100 issues.
    kind: incidents
    request:
      method: POST
      path: /api/v2/error-tracking/issues/search
      query:
        include: issue
      body:
        data:
          type: search_request
          attributes:
            query: "{{ [filters.query or none, (filters.service | join_or('service:{}')) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('version:' ~ filters.version) if filters.version else none] | compact | join(' ') or '*' }}"
            from: "{{ time.start | epoch_ms }}"
            to: "{{ time.end | epoch_ms }}"
            track: "{{ filters.track or none }}"
            persona: "{{ none if filters.track else (filters.persona or 'ALL') }}"
            order_by: "{{ filters.order_by or 'TOTAL_COUNT' }}"
            states: "{{ filters.state | as_list if filters.state else none }}"
    filters:
      - {column: query, description: "Event search query over the error events", examples: ['@error.type:TimeoutError']}
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Service", examples: ['email-api-py']}
      - {column: env, description: "Environment"}
      - {column: version, description: "Service version (e.g. the version just deployed)"}
      - {column: track, description: "trace | logs | rum (default: all personas)"}
      - {column: persona, description: "ALL (default) | BACKEND | BROWSER | MOBILE (ignored when track is set)"}
      - {column: state, ops: ["=", "in"], fan_out: false, description: "OPEN | ACKNOWLEDGED | RESOLVED | IGNORED | EXCLUDED"}
      - {column: order_by, description: "TOTAL_COUNT (default) | FIRST_SEEN | IMPACTED_SESSIONS | PRIORITY"}
    time: {column: ts, default_lookback: 1h, max_window: 30d, retention: 30d}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: issue_id, path: id}
      - {name: total_count, type: BIGINT, path: "attributes.total_count", description: "Errors matching the issue in the window"}
      - {name: impacted_users, type: BIGINT, path: "attributes.impacted_users"}
      - {name: impacted_sessions, type: BIGINT, path: "attributes.impacted_sessions"}
      - {name: service, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.service"}
      - {name: error_type, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.error_type"}
      - {name: message, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.error_message"}
      - {name: file_path, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.file_path"}
      - {name: function_name, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.function_name"}
      - {name: state, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.state"}
      - {name: platform, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.platform"}
      - {name: is_crash, type: BOOLEAN, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.is_crash"}
      - {name: first_seen, type: TIMESTAMP, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.first_seen", transform: epoch_ms}
      - {name: last_seen, type: TIMESTAMP, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.last_seen", transform: epoch_ms}
      - {name: first_seen_version, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.first_seen_version"}
      - {name: last_seen_version, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.last_seen_version"}
      - {name: regressed_at, type: TIMESTAMP, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.regression.regressed_at", transform: auto_time}
      - {name: languages, type: JSON, expr: "(root.included | selectattr('id', 'equalto', _.relationships.issue.data.id) | first).attributes.languages"}
      - {name: query, filter_only: true}
      - {name: env, filter_only: true}
      - {name: version, filter_only: true}
      - {name: track, filter_only: true}
      - {name: persona, filter_only: true}
      - {name: order_by, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true, description: "Search window (use first_seen / last_seen for issue times)"}
    sort_hint: "ordered by order_by (TOTAL_COUNT descending by default)"
    pitfalls:
      - "Issue details live in the response's included[] array and are joined to results by id (done here)."
      - "first_seen within the incident window + first_seen_version = the new release is the classic 'new error introduced by deploy' signal."
      - "Max 100 issues per request; narrow with service/env."
    examples:
      - sql: >-
          SELECT error_type, message, total_count, first_seen, first_seen_version FROM datadog_error_tracking_issues
          WHERE service = 'checkout' AND env = 'prod'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY total_count DESC LIMIT 10
        description: Top error issues during the incident and whether they are new.
      - sql: >-
          SELECT error_type, message, first_seen, first_seen_version, total_count FROM datadog_error_tracking_issues
          WHERE service = 'checkout' AND order_by = 'FIRST_SEEN' AND first_seen >= TIMESTAMP '2026-10-01 11:00:00'
        description: Errors that first appeared after the deploy.
    fixtures:
      - file: error_tracking_search.json
        filters: {service: email-api-py}
        expect_rows: 1
        expect_columns: {issue_id: c1726a66-1f64-11ee-b338-da7ad0900002, total_count: 82, impacted_users: 4, service: email-api-py, error_type: builtins.TypeError, state: RESOLVED, first_seen: "2022-12-21T08:53:24Z", first_seen_version: aaf65cd0, regressed_at: "2024-01-03T08:00:00Z", is_crash: false}
        note: "Official API reference example response (Search error tracking issues, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/error-tracking/search-error-tracking-issues/

roles:
  metrics:
    - table: datadog_metrics_timeseries
      columns: {ts: ts, value: value, labels: labels, group: group_tags}
      query_language: datadog_metrics
      notes: "Any metric query. APM: sum:trace.<op>.hits/errors{service:X,env:Y}.as_count(), p99:trace.<op>{service:X}"
    - table: datadog_apm_metrics
      filters:
        service: "{{ service }}"
        env: "{{ env if env is string else none }}"
        stat: "{{ 'error_rate' if error_only else 'hits' }}"
      columns: {ts: ts, value: value, group: group_tags}
      notes: "APM golden signals of a service without knowing operation names (stat: hits | errors | error_rate | latency_p99 ...)"
    - table: datadog_metrics_scalar
      columns: {value: value, group: group_tags}
      query_language: datadog_metrics
      notes: "Top-N groups over the window (server-side sort)"
  logs:
    table: datadog_logs
    filters:
      service: "{{ service }}"
      env: "{{ env if env is string else none }}"
      host: "{{ host }}"
      query: "{{ query }}"
      level: "{{ 'error' if error_only else none }}"
    columns: {ts: ts, service: service, message: message, level: level, host: host, trace_id: trace_id, tags: tags}
    query_language: datadog_search
  log_counts:
    - table: datadog_log_timeseries
      filters:
        service: "{{ service }}"
        env: "{{ env if env is string else none }}"
        query: "{{ query }}"
        level: "{{ 'error' if error_only else none }}"
      columns: {ts: ts, value: value, group: group_value}
      query_language: datadog_search
    - table: datadog_log_counts
      filters:
        service: "{{ service }}"
        env: "{{ env if env is string else none }}"
        query: "{{ query }}"
        level: "{{ 'error' if error_only else none }}"
      columns: {group: group_value, value: value}
      query_language: datadog_search
      notes: "Top-N breakdown by facet (count-descending)"
  traces:
    table: datadog_spans
    filters:
      service: "{{ service }}"
      env: "{{ env if env is string else none }}"
      query: "{{ query }}"
      status: "{{ 'error' if error_only else none }}"
    columns: {ts: ts, service: service, resource: resource, trace_id: trace_id, span_id: span_id, duration_ms: duration_ms, status_code: status_code, message: error_message}
    query_language: datadog_search
    notes: "300 requests/hour: one call per investigation step"
  trace_detail:
    table: datadog_spans
    columns: {ts: ts, service: service, resource: resource, trace_id: trace_id, span_id: span_id, parent_id: parent_id, duration_ms: duration_ms}
    notes: "Filter trace_id = '<id>' to get every indexed span of one trace"
  service_map:
    - table: datadog_service_dependencies
      filters: {env: "{{ env if env is string else none }}"}
      columns: {service: service, calls: calls_service}
      notes: "Observed APM call graph (edges)"
    - table: datadog_catalog_relations
      filters: {relation_type: "RelationTypeDependsOn"}
      columns: {service: from_name, calls: to_name}
      notes: "Declared Software Catalog dependencies"
  services:
    - table: datadog_service_definitions
      columns: {service: service, team: team, tier: tier, contacts: contacts, links: links}
    - table: datadog_apm_services
      filters: {env: "{{ env if env is string else none }}"}
      columns: {service: service}
  hosts:
    table: datadog_hosts
    filters: {host: "{{ host }}"}
    columns: {host: host, up: up, ts: last_reported, cpu: cpu_pct}
  change_events:
    - table: datadog_dora_deployments
      filters:
        service: "{{ service }}"
        env: "{{ env if env is string else none }}"
      columns: {ts: ts, service: service, version: version, title: commit_sha, author: team}
      notes: "Deployments (DORA): version + commit"
    - table: datadog_events
      filters: {query: "@evt.category:(change OR deployment)"}
      columns: {ts: ts, service: service, title: title, author: author, resource: changed_resource}
      query_language: datadog_search
      notes: "Change Tracking events (feature flags, config changes, deployments)"
    - table: datadog_audit_events
      filters: {action: "modified"}
      columns: {ts: ts, title: message, author: author, resource: asset_name, kind: asset_type}
      notes: "Changes made inside Datadog (monitors, dashboards, log pipelines/indexes, synthetics)"
  active_alerts:
    table: datadog_monitor_group_search
    filters: {group_status: alert}
    columns: {ts: last_triggered, name: monitor_name, state: status, group: group_name, id: monitor_id}
  alert_rules:
    - table: datadog_monitor_by_id
      filters: {monitor_id: "{{ alert_id }}"}
      columns: {id: monitor_id, name: name, query: query, threshold: critical, state: state}
    - table: datadog_monitors
      filters: {service: "{{ service }}"}
      columns: {id: id, name: name, query: query, threshold: critical, state: state}
  alert_history:
    table: datadog_monitor_states
    filters: {monitor_id: "{{ alert_id }}"}
    columns: {group: group_name, state: status, ts: last_triggered, resolved: last_resolved}
  incidents:
    - table: datadog_incidents
      columns: {id: public_id, title: title, state: state, severity: severity, ts: ts}
    - table: datadog_dora_failures
      filters: {service: "{{ service }}"}
      columns: {id: id, title: title, severity: severity, ts: ts}
  errors:
    table: datadog_error_tracking_issues
    filters:
      service: "{{ service }}"
      env: "{{ env if env is string else none }}"
    columns: {id: issue_id, title: error_type, message: message, count: total_count, ts: first_seen, version: first_seen_version}
  rum:
    table: datadog_rum_events
    filters:
      service: "{{ service }}"
      env: "{{ env if env is string else none }}"
      event_type: "{{ 'error' if error_only else none }}"
    columns: {ts: ts, service: service, message: error_message, url: view_url}
    query_language: datadog_search
  oncall:
    - table: datadog_oncall
      columns: {name: name, email: email, handle: handle}
      notes: "Datadog On-Call responders of a team (filter team = '<handle>')"
    - table: datadog_service_definitions
      filters: {}
      columns: {service: service, team: team, contacts: contacts, pagerduty: pagerduty}
      notes: "Owner team, contacts and PagerDuty/Opsgenie links from the Software Catalog"
  k8s_state:
    table: datadog_containers
    filters:
      service: "{{ service }}"
      env: "{{ env if env is string else none }}"
      host: "{{ host }}"
    columns: {pod: pod, namespace: kube_namespace, state: state, host: host, ts: started_at, service: service}
    notes: "Live containers only; history comes from kubernetes.* metrics and k8s events"
  k8s_events:
    table: datadog_events
    filters: {source: kubernetes}
    columns: {ts: ts, title: title, message: message, state: status, host: host}
  dashboards:
    - table: datadog_dashboards
      columns: {id: id, title: title, url: url}
    - table: datadog_dashboard_widgets
      columns: {title: title, query: requests}
  slo:
    - table: datadog_slos
      filters: {service: "{{ service }}"}
      columns: {id: id, name: name, target: target, value: sli, budget: error_budget_remaining, state: state}
    - table: datadog_slo_status
      columns: {id: slo_id, value: sli, budget: error_budget_remaining, state: state}
