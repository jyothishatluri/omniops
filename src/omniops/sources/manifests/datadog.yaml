# Datadog public REST API (v1 + v2) as SQL tables. No MCP: direct REST only.
#
# Every path, parameter name, time unit and response path below was checked against the official
# API reference (docs.datadoghq.com/api/latest/...). The per-table docs_url is the reference page
# of that endpoint. Research notes, rate limits and retention: docs/sources/datadog.md.
#
# Time units differ per endpoint (the #1 source of silently empty results):
#   v2 logs/spans/RUM/events/audit search+agg  filter.from/to = epoch MILLISECONDS (string) or date math
#   v2 /query/timeseries, /query/scalar        from/to/interval = epoch MILLISECONDS (int64)
#   v1 /query, /metrics, /service_dependencies epoch SECONDS
#   v1 /slo/{id}/history, v2 /slo/{id}/status  from_ts/to_ts = epoch SECONDS
#   v2 synthetics results                      from_ts/to_ts = epoch MILLISECONDS
#   v2 error-tracking search                   from/to = epoch MILLISECONDS (int64)
#   v2 DORA deployments/failures               from/to = RFC3339 date-time
source: datadog
display_name: Datadog
vendor: Datadog, Inc.
description: >-
  Datadog REST API v1/v2: metrics, logs (indexes, online archives and Flex), APM spans, RUM,
  monitors and per-group monitor states, events (incl. Change Tracking change events), incidents,
  Software Catalog, APM service dependencies and APM golden-signal metrics, hosts, containers,
  SLOs and SLO history, dashboards (widgets exploded), downtimes, Synthetics results, Error Tracking
  issues, DORA deployments/failures, Audit Trail, Teams, Datadog On-Call responders and log index
  configuration (quotas, exclusion filters).
docs_url: https://docs.datadoghq.com/api/latest/
categories: [metrics, logs, traces, apm, rum, alerts, events, changes, incidents, slo, synthetics, errors, services, hosts, containers, dashboards, deployments, audit, oncall]
base_url: "{{ env.DD_API_BASE_URL or ('https://api.' ~ (env.DD_SITE | replace('https://', '') | replace('app.', '') | replace('api.', '') | trim('/'))) }}"
env:
  - {name: DD_API_KEY, description: "Datadog API key (Organization Settings > API Keys)", secret: true}
  - {name: DD_APP_KEY, description: "Datadog application key; scope it read-only (logs_read_data, logs_read_config, metrics_read, timeseries_query, monitors_read, apm_read, rum_apps_read, events_read, incident_read, slos_read, dashboards_read, synthetics_read, hosts_read, apm_service_catalog_read, dora_metrics_read, error_tracking_read, audit_logs_read, teams_read, on_call_read)", secret: true}
  - {name: DD_SITE, description: "Datadog site of the org: datadoghq.com (US1), us3.datadoghq.com, us5.datadoghq.com, datadoghq.eu (EU1), ap1.datadoghq.com, ap2.datadoghq.com, uk1.datadoghq.com, ddog-gov.com, us2.ddog-gov.com", default: datadoghq.com}
  - {name: DD_BEARER_TOKEN, description: "Optional Personal/Service Access Token. When set it is sent as 'Authorization: Bearer' INSTEAD of the API/application key headers (current API reference code samples use this form)", secret: true}
  - {name: DD_API_BASE_URL, description: "Optional full API base URL override (e.g. a proxy); default https://api.<DD_SITE>"}
  - {name: DD_UI_BASE_URL, description: "Optional web UI base URL for deep links; default https://app.<DD_SITE> (or https://<DD_SITE> for us3/us5/ap1/ap2/uk1/us2 sites)"}
required_env: [DD_API_KEY, DD_APP_KEY]
auth:
  type: headers
  headers:
    DD-API-KEY: "{{ None if env.DD_BEARER_TOKEN else env.DD_API_KEY }}"
    DD-APPLICATION-KEY: "{{ None if env.DD_BEARER_TOKEN else env.DD_APP_KEY }}"
    Authorization: "{{ ('Bearer ' ~ env.DD_BEARER_TOKEN) if env.DD_BEARER_TOKEN else None }}"
rate_limit:
  concurrency: 4
  notes: >-
    Limits are per endpoint and returned in X-RateLimit-Limit / -Period / -Remaining / -Reset /
    -Name headers; 429 means wait X-RateLimit-Reset seconds. Spans search and spans aggregate are
    limited to 300 requests per HOUR per org: never loop over services with them.
# Keys are table KINDS (the engine clamps a table's start to retention[kind] when the table sets no
# time.retention) and values must be durations. Logs are deliberately absent: index retention is
# plan-dependent (3-90d) and Flex / online archives keep 15 months, so clamping would hide data.
# Human-readable retention per product is in docs/sources/datadog.md.
retention:
  timeseries: 455d   # metrics: 15 months
  spans: 30d         # indexed spans: 15d default, 30d on some plans
  events: 455d       # Event Management / Synthetics results: 15 months
  changes: 730d      # DORA deployments: 2 years
ui_base_url: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}"
pitfalls:
  - "DD_SITE must be the org's site (US1 datadoghq.com, US3, US5, EU1 datadoghq.eu, AP1, AP2, UK1, Gov). The wrong site gives 403 Forbidden even with valid keys."
  - "Search syntax (logs, spans, RUM, events, error tracking): reserved attributes have no @ (service, env, host, status, source, trace_id, version); every other attribute needs @ (@http.status_code, @error.kind, @duration). An unknown facet or a missing @ silently returns 0 rows, not an error."
  - "Time units differ per endpoint (ms vs s vs RFC3339); every table already sends the right unit: always filter on ts, never on raw epoch columns."
  - "Aggregate group-bys default to ALPHABETICAL facet ordering; the *_counts tables force sort {type: measure, aggregation, order: desc} so the top buckets really are the biggest."
  - "Logs in the Flex tier or online archives are invisible unless storage_tier = 'flex' / 'online-archives' is set; an empty answer from the default 'indexes' tier is not proof of absence."
  - "Tags are 'key:value' strings inside JSON arrays: test them with list_contains(CAST(tags AS VARCHAR[]), 'env:prod') or CAST(tags AS VARCHAR) LIKE '%\"env:prod\"%'."
  - "Spans search/aggregate: 300 requests/hour per org. Prefer datadog_metrics_timeseries on trace.* metrics (trace.<operation>.hits/errors/duration) for rates and latency; use spans only for exemplars."
  - "Indexed spans are sampled by retention filters: span counts are NOT request counts. Use trace.* metrics (computed from 100% of traffic) for volumes and error rates."
  - "Datadog search results are capped per page (logs 1000) and paginated by cursor; tables stop after max_pages and say so - narrow the query or the time window instead of paging deeper."
  - "The API reference shows at most 10 'Allowed enum values' per field; the full enums are in Datadog's API clients. Event-platform aggregations (logs/spans/RUM) also accept avg and median; apm_metrics stats also include latency_p90/p95/p99/p999 and total_time."
  - "meta.status = 'timeout' on logs/spans/RUM/events/audit search or aggregate means PARTIAL results: the tables raise it as an error so a partial answer is never presented as complete; narrow the window and retry."
  - "Per-endpoint rate limits (X-RateLimit-* headers) are shared by everyone using the same API/application key: a 429 is not a query problem - wait X-RateLimit-Reset seconds."
  - "Missing logs are often dropped, not absent: check datadog_log_indexes (is_rate_limited = daily quota hit) and datadog_log_exclusion_filters (enabled filter, sample_rate 1.0) before concluding a service stopped logging."
  - "Backend deployments are tracked through the APM version tag: 'by {version}' on trace.* metrics shows a rollout even when no deploy event or DORA deployment was sent."
query_languages:
  datadog_metrics: >-
    Datadog metric query: <space_agg>:<metric>{<tag filters>} by {<tag keys>}[.function()].
    space_agg is avg|sum|min|max (required; percentiles p50|p75|p90|p95|p99 for distributions).
    Tag filter: {service:checkout,env:prod} (comma = AND), {*} for all, !tag:value to exclude,
    IN/NOT IN: {service IN (a,b)}. Counts need .as_count() (else per-second rate); .rollup(sum,60)
    sets time aggregation. APM: trace.<operation>.hits / .errors / .duration (seconds) e.g.
    sum:trace.http.request.errors{service:checkout,env:prod} by {resource_name}.as_count();
    p99:trace.http.request{service:checkout} (distribution latency, seconds). Infra:
    avg:system.cpu.user{host:web-1}, avg:kubernetes.cpu.usage.total{kube_deployment:x} by {pod_name}.
    v2 formulas reference queries by name: query a, query_b b, formula '100 * a / b'.
  datadog_search: >-
    Event search syntax shared by logs, spans, RUM, events, error tracking and DORA: space = AND,
    OR/AND/NOT or -term, parentheses, wildcards (web-*), quoted phrases ("connection reset"),
    numeric ranges @http.status_code:[500 TO 599], comparisons @duration:>1000000000 (spans
    @duration is in NANOSECONDS). Reserved attributes without @: service, env, host, status,
    source, trace_id, version, resource_name (spans). Custom attributes need @: @http.url_details.path,
    @error.kind, @usr.id. Multi-value: service:(checkout OR cart).
  datadog_monitor_search: >-
    Monitor search (Manage Monitors syntax): status:Alert|Warn|"No Data"|OK, type:metric|log|apm|...,
    service:<v>, env:<v>, tag:"team:payments", metric:system.cpu.user, muted:true, title:text,
    plain text matches title/message. Group search (triggered monitors page): group_status:alert.
  datadog_incident_search: >-
    Incident facets joined by AND, values by OR: state:(active OR stable) AND severity:(SEV-1 OR SEV-2);
    other facets: services, teams, commander, created_by, customer_impacted.

tables:
  # ----------------------------------------------------------------------------------------------
  # Metrics
  # ----------------------------------------------------------------------------------------------
  - name: datadog_metrics_timeseries
    title: Metric timeseries (v2 formulas and functions)
    description: >-
      Evaluate a Datadog metrics query over a time range with the recommended v2
      /api/v2/query/timeseries endpoint. One row per (series, timestamp). Filter on query
      (required, Datadog metric syntax incl. 'by {tag}') and ts. Optional query_b + formula
      (e.g. formula = '100 * a / b' for an error ratio), interval_s (bucket size) and
      data_source ('metrics' default, or 'cloud_cost').
    kind: timeseries
    request:
      method: POST
      path: /api/v2/query/timeseries
      body:
        data:
          type: timeseries_request
          attributes:
            from: "{{ time.start | epoch_ms }}"
            to: "{{ time.end | epoch_ms }}"
            interval: "{{ (filters.interval_s or time.step_s) * 1000 }}"
            queries: "{{ [ {'data_source': filters.data_source or 'metrics', 'name': 'a', 'query': filters.query} ] + ([ {'data_source': filters.data_source or 'metrics', 'name': 'b', 'query': filters.query_b} ] if filters.query_b else []) }}"
            formulas: "{{ [ {'formula': filters.formula} ] if filters.formula else none }}"
    filters:
      - {column: query, required: true, description: "Datadog metric query (named 'a')", examples: ['sum:trace.http.request.errors{service:checkout,env:prod} by {resource_name}.as_count()']}
      - {column: query_b, description: "Optional second metric query (named 'b') for formulas", examples: ['sum:trace.http.request.hits{service:checkout,env:prod} by {resource_name}.as_count()']}
      - {column: formula, description: "Optional formula over a/b, e.g. '100 * a / b'. When set, rows are the formula result.", examples: ['100 * a / b']}
      - {column: interval_s, type: BIGINT, description: "Bucket size in seconds (Datadog may widen it). Default: auto (~300 points)"}
      - {column: data_source, description: "metrics (default) | cloud_cost"}
    time: {column: ts, default_lookback: 1h, max_window: 90d, retention: 455d}
    response:
      rows_path: "$.data.attributes.series[*]"
      expand:
        - {zip: {t: "$.data.attributes.times", v: "$.data.attributes.values[#i]"}, as: pt}
      errors:
        - {path: "$.errors", non_empty: true, message: "$.errors", hint: "The metric query failed (syntax or unknown function); fix the query, do not retry unchanged"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@pt.t", transform: epoch_ms, description: "Bucket start (UTC); API times are epoch ms"}
      - {name: value, type: DOUBLE, path: "@pt.v", description: "Value; NULL for empty buckets"}
      - {name: group_tags, path: group_tags, transform: join, transform_arg: ",", description: "Group-by tags joined with ',', e.g. 'resource_name:post_/checkout,service:checkout' ('' when not grouped)"}
      - {name: labels, type: JSON, path: group_tags, description: "Group-by tags as a JSON array of 'key:value' strings"}
      - {name: query_index, type: BIGINT, path: query_index, description: "Index of the formula (or query) that produced the series"}
      - {name: unit, path: "unit[0].short_name", description: "Primary unit short name, e.g. ms, %, B"}
      - {name: query, filter_only: true}
      - {name: query_b, filter_only: true}
      - {name: formula, filter_only: true}
      - {name: interval_s, type: BIGINT, filter_only: true}
      - {name: data_source, filter_only: true}
    sort_hint: "rows are per series in time order"
    pitfalls:
      - "A space aggregator is mandatory (avg:/sum:/max:/min:); counters need .as_count() or values are per-second rates."
      - "An unknown metric or tag returns no series (0 rows), not an error: confirm names with datadog_metrics_active / datadog_metric_tags."
      - "Datadog may override interval_s with a larger interval when the window has too many points; compare buckets by ts, not by row number."
      - "group_tags of each series identify the group; with 'by {a,b}' it contains both tags joined by ','. Use split_part / LIKE on group_tags, or labels (JSON array)."
      - "APM trace.*.duration metrics are in SECONDS; distribution percentiles use p99: as the space aggregator."
    examples:
      - sql: >-
          SELECT group_tags AS resource, max(value) AS peak_errors, arg_max(ts, value) AS peak_at
          FROM datadog_metrics_timeseries
          WHERE query = 'sum:trace.http.request.errors{service:checkout,env:prod} by {resource_name}.as_count()'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY 1 ORDER BY peak_errors DESC LIMIT 10
        description: Which endpoints of a service produced the error spike, and when each peaked.
      - sql: >-
          SELECT ts, value AS error_pct FROM datadog_metrics_timeseries
          WHERE query = 'sum:trace.http.request.errors{service:checkout,env:prod}.as_count()'
            AND query_b = 'sum:trace.http.request.hits{service:checkout,env:prod}.as_count()'
            AND formula = '100 * a / b'
            AND ts >= TIMESTAMP '2026-10-01 10:00:00' AND ts < TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts
        description: Error rate (%) over time with a v2 formula.
      - sql: >-
          SELECT group_tags AS version, min(ts) FILTER (WHERE value > 0) AS first_traffic, max(value) AS peak_hits
          FROM datadog_metrics_timeseries
          WHERE query = 'sum:trace.http.request.hits{service:checkout,env:prod} by {version}.as_count()'
            AND ts BETWEEN TIMESTAMP '2026-10-01 09:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY 1 ORDER BY first_traffic
        description: >-
          Deployment tracking without a deploy feed - when did each version of the service start taking
          traffic (APM backend deployments are tracked through the version tag)?
    tests:
      - {sql: "SELECT ts, value FROM datadog_metrics_timeseries WHERE query = 'sum:datadog.estimated_usage.hosts{*}'", min_rows: 0}
    fixtures:
      - file: query_timeseries_recorded.json
        filters: {query: 'avg:datadog.estimated_usage.metrics.custom{*}'}
        expect_rows: 3
        expect_columns: {ts: "2024-04-01T13:20:45Z", value: 1.0, group_tags: "", query_index: 0}
        note: "Recorded 200 response from Datadog's official datadog-api-client-python test cassette (tests/v2/cassettes/test_scenarios/test_timeseries_cross_product_query_returns_ok_response). The API reference example on the docs page is a placeholder (flat values, empty times), see query_timeseries_docs.json."
      - file: query_timeseries_grouped_schema.json
        filters: {query: 'p99:trace.http.request{env:prod} by {service}'}
        expect_rows: 4
        expect_columns: {ts: "2026-10-01T11:00:00Z", value: 412.5, group_tags: "service:checkout,env:prod", unit: ms}
        note: "Built strictly from the documented TimeseriesFormulaQueryResponse schema (series[].group_tags/query_index/unit, times[] epoch ms, values[][] index-aligned with series) to test grouped series and nulls."
      - file: query_timeseries_docs.json
        filters: {query: 'avg:datadog.estimated_usage.metrics.custom{*}'}
        expect_error: "API reported an error in a 2xx body"
        note: "Official API reference example response (Query timeseries data across multiple products, 200). It carries the top-level 'errors' field (placeholder 'string'), which must trip the 2xx error rule."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/metric/explorer?from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false&exp_metric={{ filters.query | urlencode }}"
    docs_url: https://docs.datadoghq.com/api/latest/metrics/query-timeseries-data-across-multiple-products/

  - name: datadog_metrics_query
    title: Metric timeseries (v1 query)
    description: >-
      Legacy v1 /api/v1/query: evaluate a metric query over a time range. One row per (series,
      point). Same query syntax as datadog_metrics_timeseries but returns per-series scope,
      expression and tag_set; prefer datadog_metrics_timeseries (v2) for formulas.
    kind: timeseries
    request:
      method: GET
      path: /api/v1/query
      query:
        from: "{{ time.start | epoch_s }}"
        to: "{{ time.end | epoch_s }}"
        query: "{{ filters.query }}"
    filters:
      - {column: query, required: true, description: "Datadog metric query", examples: ['avg:system.cpu.user{env:prod} by {host}']}
    time: {column: ts, default_lookback: 1h, max_window: 90d, retention: 455d}
    response:
      rows_path: "$.series[*]"
      expand:
        - {explode: pointlist, as: p}
      errors:
        - {path: "$.status", equals: "error", message: "$.error", hint: "Metric query error; fix the query syntax, do not retry unchanged"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms, description: "Point time (pointlist timestamps are epoch ms; request from/to are epoch SECONDS)"}
      - {name: value, type: DOUBLE, path: "@p[1]"}
      - {name: metric, path: metric}
      - {name: scope, path: scope, description: "Comma separated tags identifying the series, e.g. 'host:web-1,env:prod'"}
      - {name: expression, path: expression}
      - {name: labels, type: JSON, path: tag_set, description: "Unique tags of the series (JSON array)"}
      - {name: display_name, path: display_name}
      - {name: aggr, path: aggr, description: "Space aggregation (avg/sum/min/max)"}
      - {name: interval, type: BIGINT, path: interval, description: "Spacing between points as reported by the API"}
      - {name: unit, path: "unit[0].short_name"}
      - {name: query, filter_only: true}
    pitfalls:
      - "Request from/to are epoch SECONDS while pointlist timestamps are epoch MILLISECONDS (handled)."
      - "A 200 with status='error' is a query error (raised loudly)."
    examples:
      - sql: >-
          SELECT scope, avg(value) AS avg_cpu, max(value) AS max_cpu FROM datadog_metrics_query
          WHERE query = 'avg:system.cpu.user{env:prod} by {host}'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          GROUP BY scope ORDER BY max_cpu DESC LIMIT 10
        description: Hottest hosts by CPU during the incident window.
    fixtures:
      - file: metrics_query_v1.json
        filters: {query: 'system.cpu.idle{host:foo,env:test}'}
        expect_rows: 1
        expect_columns: {ts: "2023-04-16T22:15:00Z", value: 77.62145685254418, metric: system.cpu.idle, scope: "host:foo,env:test", aggr: avg, unit: "%"}
        note: "Official API reference example response (Query timeseries points, 200)."
      - file: metrics_query_v1_error_schema.json
        filters: {query: 'avg:system.cpu.user{env:prod by {host}'}
        expect_error: "Error parsing query"
        note: "Built strictly from the documented MetricsQueryResponse schema (status is not 'ok', error = 'Message indicating the errors if status is not ok') to prove the 200-with-status-error rule fires."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/query-timeseries-points/

  - name: datadog_metrics_scalar
    title: Metric top-N over a window (v2 scalar)
    description: >-
      Reduce a Datadog metrics query to ONE value per group over the whole window with the v2
      /api/v2/query/scalar endpoint, sorted server-side (descending by default) and cut to the top N
      groups. One row per group: group_tags (e.g. 'host:web-1'), group_value ('web-1'), value. Use it
      for "which hosts / pods / endpoints are worst over the incident window" instead of pulling every
      point with datadog_metrics_timeseries. Filter on query (required; add 'by {tag}' to group),
      aggregator (avg default; sum for counts; max | min | last | percentile | mean | l2norm | area),
      optional query_b + formula (e.g. '100 * a / b'), top (default 50) and order (desc | asc).
    kind: timeseries
    request:
      method: POST
      path: /api/v2/query/scalar
      body:
        data:
          type: scalar_request
          attributes:
            from: "{{ time.start | epoch_ms }}"
            to: "{{ time.end | epoch_ms }}"
            queries: "{{ [ {'data_source': 'metrics', 'name': 'a', 'query': filters.query, 'aggregator': filters.aggregator or 'avg'} ] + ([ {'data_source': 'metrics', 'name': 'b', 'query': filters.query_b, 'aggregator': filters.aggregator or 'avg'} ] if filters.query_b else []) }}"
            formulas: "{{ [ {'formula': filters.formula or 'a', 'limit': {'count': [filters.top or limit or 50, 1000] | min, 'order': filters.order or 'desc'} } ] }}"
    filters:
      - {column: query, required: true, description: "Datadog metric query (named 'a'), grouped with 'by {tag}'", examples: ['avg:system.cpu.user{env:prod} by {host}']}
      - {column: aggregator, description: "Time aggregation over the window: avg (default) | sum | max | min | last | percentile | mean | l2norm | area", examples: ['max']}
      - {column: query_b, description: "Optional second metric query (named 'b') for a formula"}
      - {column: formula, description: "Optional formula over a/b, e.g. '100 * a / b' (default 'a')"}
      - {column: top, type: BIGINT, description: "Number of groups to keep (default 50, or the SQL LIMIT)"}
      - {column: order, description: "desc (default, largest first) | asc"}
    time: {column: ts, default_lookback: 1h, max_window: 90d, retention: 455d}
    response:
      rows_path: "$.data.attributes.columns[-1].values[*]"
      errors:
        - {path: "$.errors", non_empty: true, message: "$.errors", hint: "The metric query failed (syntax, unknown function or aggregator); fix the query, do not retry unchanged"}
    columns:
      - {name: group_tags, expr: "[ (root.data.attributes.columns[0].name ~ ':' ~ (root.data.attributes.columns[0]['values'][_i] | join('|'))) if root.data.attributes.columns[0].type == 'group' else none, (root.data.attributes.columns[1].name ~ ':' ~ (root.data.attributes.columns[1]['values'][_i] | join('|'))) if root.data.attributes.columns[1].type == 'group' else none, (root.data.attributes.columns[2].name ~ ':' ~ (root.data.attributes.columns[2]['values'][_i] | join('|'))) if root.data.attributes.columns[2].type == 'group' else none ] | compact | join(',')", description: "Group tags of the row joined with ',', e.g. 'host:web-1' ('' when not grouped)"}
      - {name: group_value, expr: "(root.data.attributes.columns[0]['values'][_i] | join('|')) if root.data.attributes.columns[0].type == 'group' else none", description: "Value of the first group-by tag, e.g. 'web-1'"}
      - {name: labels, type: JSON, expr: "[ (root.data.attributes.columns[0].name ~ ':' ~ (root.data.attributes.columns[0]['values'][_i] | join('|'))) if root.data.attributes.columns[0].type == 'group' else none, (root.data.attributes.columns[1].name ~ ':' ~ (root.data.attributes.columns[1]['values'][_i] | join('|'))) if root.data.attributes.columns[1].type == 'group' else none, (root.data.attributes.columns[2].name ~ ':' ~ (root.data.attributes.columns[2]['values'][_i] | join('|'))) if root.data.attributes.columns[2].type == 'group' else none ] | compact", description: "Group tags as a JSON array of 'key:value' strings"}
      - {name: value, type: DOUBLE, path: ".", description: "Aggregated value of the formula over the window"}
      - {name: unit, path: "$.data.attributes.columns[-1].meta.unit[0].short_name", description: "Primary unit short name, e.g. %, ms, B"}
      - {name: query, filter_only: true}
      - {name: aggregator, filter_only: true}
      - {name: query_b, filter_only: true}
      - {name: formula, filter_only: true}
      - {name: top, type: BIGINT, filter_only: true}
      - {name: order, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true, description: "Window (the value is aggregated over the whole ts range)"}
    sort_hint: "rows come back sorted by value (desc by default) and limited to top"
    pitfalls:
      - "aggregator is the TIME aggregation over the window (avg/sum/max/last...); the space aggregation is still the query's own prefix (avg:/sum:). For counts use sum:...as_count() with aggregator sum."
      - "One formula is always sent, so the response is the group columns followed by one number column; up to 3 group-by tags are decoded into group_tags."
      - "An unknown metric or tag returns no groups (0 rows), not an error."
    examples:
      - sql: >-
          SELECT group_value AS host, value AS max_cpu FROM datadog_metrics_scalar
          WHERE query = 'avg:system.cpu.user{env:prod,service:checkout} by {host}' AND aggregator = 'max'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY max_cpu DESC LIMIT 10
        description: Hottest hosts of a service over the incident window (top-N computed server-side).
      - sql: >-
          SELECT group_tags, value AS error_pct FROM datadog_metrics_scalar
          WHERE query = 'sum:trace.http.request.errors{env:prod} by {service}.as_count()'
            AND query_b = 'sum:trace.http.request.hits{env:prod} by {service}.as_count()'
            AND formula = '100 * a / b' AND aggregator = 'sum'
          ORDER BY error_pct DESC LIMIT 10
        description: Services with the highest error rate over the window.
    fixtures:
      - file: query_scalar_recorded.json
        filters: {query: 'avg:system.cpu.user{*}'}
        expect_rows: 1
        expect_columns: {value: 6.368151928283307, unit: "%", group_tags: "", group_value: null}
        note: "Recorded 200 response from Datadog's official datadog-api-client-python cassette tests/v2/cassettes/test_scenarios/test_scalar_cross_product_query_returns_ok_response.yaml (ungrouped avg:system.cpu.user{*})."
      - file: query_scalar_grouped_schema.json
        filters: {query: 'avg:system.cpu.user{env:prod} by {host}'}
        expect_rows: 2
        expect_columns: {group_tags: "host:web-1", group_value: web-1, value: 91.5, unit: "%"}
        note: "Built strictly from the documented ScalarFormulaQueryResponse schema (a <type=group> column with values [[tag values]] followed by a <type=number> column with parallel values)."
      - file: query_scalar_docs.json
        filters: {query: 'avg:system.cpu.user{*} by {env}'}
        expect_error: "API reported an error in a 2xx body"
        note: "Official API reference example response (Query scalar data across multiple products, 200): its placeholder top-level 'errors' must trip the 2xx error rule."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/query-scalar-data-across-multiple-products/

  - name: datadog_apm_metrics
    title: APM service golden signals over time (v2 apm_metrics)
    description: >-
      Hits, errors, error rate, latency (avg/max/p50..p999) or apdex of one APM service over time,
      from v2 POST /api/v2/query/timeseries with data_source apm_metrics. No trace.<operation>
      metric name is needed: the service's primary operation is used unless operation_name is set.
      Filter on service (required), stat (required), env, resource (exact resource_name), span_kind
      (server | client | consumer | producer | internal), operation_name, group_by (comma separated,
      e.g. 'resource_name'), plus ts. One row per (series, timestamp).
    kind: timeseries
    request:
      method: POST
      path: /api/v2/query/timeseries
      body:
        data:
          type: timeseries_request
          attributes:
            from: "{{ time.start | epoch_ms }}"
            to: "{{ time.end | epoch_ms }}"
            interval: "{{ time.step_s * 1000 }}"
            queries: "{{ [ ({'data_source': 'apm_metrics', 'name': 'a', 'stat': filters.stat, 'service': filters.service, 'query_filter': filters.query_filter or (('env:' ~ filters.env) if filters.env else none), 'resource_name': filters.resource or none, 'operation_name': filters.operation_name or none, 'span_kind': filters.span_kind or none, 'group_by': (filters.group_by.split(',') | map('trim') | list) if filters.group_by else none} | compact) ] }}"
            formulas: [{formula: a}]
    filters:
      - {column: service, required: true, ops: ["=", "in"], max_fan_out: 10, description: "APM service name (one request per value)", examples: ['web-store']}
      - {column: stat, required: true, description: "hits | hits_per_second | errors | errors_per_second | error_rate | latency_avg | latency_max | latency_p50 | latency_p75 | latency_p90 | latency_p95 | latency_p99 | latency_p999 | apdex | total_time", examples: ['error_rate']}
      - {column: env, description: "Environment; sent as query_filter 'env:<env>'", examples: ['prod']}
      - {column: query_filter, description: "Raw metrics-syntax filter, e.g. 'env:prod' (replaces env when set)"}
      - {column: resource, description: "Exact resource name, e.g. 'GET /cart'"}
      - {column: operation_name, description: "Operation name (default: the service's primary operation)"}
      - {column: span_kind, description: "server | client | consumer | producer | internal"}
      - {column: group_by, description: "Comma separated fields to split by, e.g. resource_name", examples: ['resource_name']}
    time: {column: ts, default_lookback: 1h, max_window: 30d, retention: 455d}
    response:
      rows_path: "$.data.attributes.series[*]"
      expand:
        - {zip: {t: "$.data.attributes.times", v: "$.data.attributes.values[#i]"}, as: pt}
      errors:
        - {path: "$.errors", non_empty: true, message: "$.errors", hint: "The apm_metrics query failed (unknown stat/service?); fix it, or fall back to trace.* metrics in datadog_metrics_timeseries"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@pt.t", transform: epoch_ms, description: "Bucket start (UTC)"}
      - {name: value, type: DOUBLE, path: "@pt.v", description: "Stat value; see unit (latency stats are reported with their unit, check it before comparing to ms)"}
      - {name: group_tags, path: group_tags, transform: join, transform_arg: ",", description: "Group tags, e.g. 'resource_name:get_/cart' ('' when not grouped)"}
      - {name: labels, type: JSON, path: group_tags}
      - {name: unit, path: "unit[0].short_name"}
      - {name: service, filter_only: true}
      - {name: stat, filter_only: true}
      - {name: env, filter_only: true}
      - {name: query_filter, filter_only: true}
      - {name: resource, filter_only: true}
      - {name: operation_name, filter_only: true}
      - {name: span_kind, filter_only: true}
      - {name: group_by, filter_only: true}
    pitfalls:
      - "Computed from APM trace metrics (100% of traffic), unlike indexed spans: use this for rates and latency, spans only for exemplars."
      - "If the service has several entry operations (e.g. web + grpc), pass operation_name or span_kind = 'server' to avoid mixing them."
      - "resource_name group tags are normalised (lower case, spaces -> '_'); compare with LIKE."
      - "An empty series list (0 rows) means the service/env/stat combination has no data: confirm the name with datadog_apm_services."
    examples:
      - sql: >-
          SELECT ts, value AS error_rate FROM datadog_apm_metrics
          WHERE service = 'checkout' AND env = 'prod' AND stat = 'error_rate' AND span_kind = 'server'
            AND ts BETWEEN TIMESTAMP '2026-10-01 10:30:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts
        description: Error-rate timeline of the alerting service (no operation name needed).
        verified: false
      - sql: >-
          SELECT group_tags AS resource, max(value) AS p99, arg_max(ts, value) AS peak_at FROM datadog_apm_metrics
          WHERE service = 'checkout' AND env = 'prod' AND stat = 'latency_p99' AND group_by = 'resource_name'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          GROUP BY 1 ORDER BY p99 DESC LIMIT 10
        description: Which endpoints got slow, and when.
        verified: false
    fixtures:
      - file: apm_metrics_timeseries_recorded.json
        filters: {service: web-store, stat: hits, env: prod, group_by: resource_name}
        expect_rows: 0
        note: "Recorded 200 response from Datadog's official datadog-api-client-python cassette test_timeseries_cross_product_query_with_apm_metrics_data_source_returns_ok_response.yaml (stat hits, service web-store, query_filter env:prod, group_by resource_name): an empty series list, which must parse to 0 rows without tripping an error rule."
      - file: apm_metrics_timeseries_schema.json
        filters: {service: checkout, stat: hits, group_by: resource_name}
        expect_rows: 6
        expect_columns: {ts: "2026-10-01T11:00:00Z", value: 2.0, group_tags: "resource_name:post_/api/checkout", service: checkout, stat: hits}
        note: "Built strictly from the documented TimeseriesFormulaQueryResponse schema (same response model for every data source), grouped by resource_name."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/query-timeseries-data-across-multiple-products/

  - name: datadog_apm_metrics_top
    title: APM golden signals top-N over a window (v2 scalar apm_metrics)
    description: >-
      One value per group (default group_by 'resource_name') of an APM service stat over the whole
      window, sorted descending server-side (v2 POST /api/v2/query/scalar, data_source apm_metrics).
      Answers "which endpoints of the service have the most errors / highest p99 during the
      incident". Filter on service (required), stat (required), env, span_kind, operation_name,
      group_by, top, order.
    kind: timeseries
    request:
      method: POST
      path: /api/v2/query/scalar
      body:
        data:
          type: scalar_request
          attributes:
            from: "{{ time.start | epoch_ms }}"
            to: "{{ time.end | epoch_ms }}"
            queries: "{{ [ ({'data_source': 'apm_metrics', 'name': 'a', 'stat': filters.stat, 'service': filters.service, 'query_filter': filters.query_filter or (('env:' ~ filters.env) if filters.env else none), 'resource_name': filters.resource or none, 'operation_name': filters.operation_name or none, 'span_kind': filters.span_kind or none, 'group_by': (filters.group_by or 'resource_name').split(',') | map('trim') | list} | compact) ] }}"
            formulas: "{{ [ {'formula': 'a', 'limit': {'count': [filters.top or limit or 25, 1000] | min, 'order': filters.order or 'desc'} } ] }}"
    filters:
      - {column: service, required: true, ops: ["=", "in"], max_fan_out: 10, description: "APM service name", examples: ['web-store']}
      - {column: stat, required: true, description: "errors | hits | error_rate | latency_p99 | latency_p95 | latency_avg | latency_max | total_time | apdex ...", examples: ['errors']}
      - {column: env, description: "Environment; sent as query_filter 'env:<env>'", examples: ['prod']}
      - {column: query_filter, description: "Raw metrics-syntax filter (replaces env when set)"}
      - {column: resource, description: "Exact resource name"}
      - {column: operation_name, description: "Operation name (default primary operation)"}
      - {column: span_kind, description: "server | client | consumer | producer | internal"}
      - {column: group_by, description: "Comma separated fields to split by (default resource_name); e.g. peer.service for downstream calls of a client span_kind"}
      - {column: top, type: BIGINT, description: "Groups to keep (default 25)"}
      - {column: order, description: "desc (default) | asc"}
    time: {column: ts, default_lookback: 1h, max_window: 30d, retention: 455d}
    response:
      rows_path: "$.data.attributes.columns[-1].values[*]"
      errors:
        - {path: "$.errors", non_empty: true, message: "$.errors", hint: "The apm_metrics query failed; fix it, or fall back to datadog_metrics_scalar on trace.* metrics"}
    columns:
      - {name: group_value, expr: "(root.data.attributes.columns[0]['values'][_i] | join('|')) if root.data.attributes.columns[0].type == 'group' else none", description: "Value of the first group-by field (e.g. the resource name)"}
      - {name: group_tags, expr: "[ (root.data.attributes.columns[0].name ~ ':' ~ (root.data.attributes.columns[0]['values'][_i] | join('|'))) if root.data.attributes.columns[0].type == 'group' else none, (root.data.attributes.columns[1].name ~ ':' ~ (root.data.attributes.columns[1]['values'][_i] | join('|'))) if root.data.attributes.columns[1].type == 'group' else none ] | compact | join(',')"}
      - {name: value, type: DOUBLE, path: ".", description: "Stat over the window"}
      - {name: unit, path: "$.data.attributes.columns[-1].meta.unit[0].short_name"}
      - {name: service, filter_only: true}
      - {name: stat, filter_only: true}
      - {name: env, filter_only: true}
      - {name: query_filter, filter_only: true}
      - {name: resource, filter_only: true}
      - {name: operation_name, filter_only: true}
      - {name: span_kind, filter_only: true}
      - {name: group_by, filter_only: true}
      - {name: top, type: BIGINT, filter_only: true}
      - {name: order, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    sort_hint: "sorted by value (desc by default), limited to top"
    pitfalls:
      - "Unsampled APM trace metrics: absolute counts are real traffic (unlike datadog_span_counts)."
    examples:
      - sql: >-
          SELECT group_value AS resource, value AS errors FROM datadog_apm_metrics_top
          WHERE service = 'checkout' AND env = 'prod' AND stat = 'errors'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY errors DESC LIMIT 10
        description: Endpoints producing the errors during the incident.
        verified: false
    fixtures:
      - file: apm_metrics_scalar_recorded.json
        filters: {service: web-store, stat: hits, env: prod}
        expect_rows: 0
        note: "Recorded 200 response from Datadog's official datadog-api-client-python cassette test_scalar_cross_product_query_with_apm_metrics_data_source_returns_ok_response.yaml: one number column with no values -> 0 rows."
      - file: apm_metrics_scalar_schema.json
        filters: {service: checkout, stat: errors}
        expect_rows: 2
        expect_columns: {group_value: post_/api/checkout, group_tags: "resource_name:post_/api/checkout", value: 101.0, service: checkout}
        note: "Built strictly from the documented ScalarFormulaQueryResponse schema (group column resource_name + number column)."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/query-scalar-data-across-multiple-products/

  - name: datadog_metrics_active
    title: Actively reporting metrics
    description: >-
      Names of metrics actively reporting since ts (v1 /api/v1/metrics). Optional host
      (metrics reported by one host) or tag_filter (e.g. 'service:checkout'; boolean and
      wildcards supported; cannot be combined with host). Use it to discover metric names before querying.
    kind: entities
    request:
      method: GET
      path: /api/v1/metrics
      query:
        from: "{{ time.start | epoch_s }}"
        host: "{{ filters.host }}"
        tag_filter: "{{ filters.tag_filter }}"
    filters:
      - {column: host, description: "Only metrics reported with this hostname tag", variants: hostname, examples: ['web-1']}
      - {column: tag_filter, description: "Tag expression, e.g. service:checkout AND env:prod (not combinable with host)"}
    time: {column: ts, default_lookback: 1h, max_window: 30d}
    response:
      rows_path: "$.metrics[*]"
    columns:
      - {name: metric, path: ".", description: "Metric name"}
      - {name: host, filter_only: true}
      - {name: tag_filter, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true, description: "Active since (lower bound)"}
    pitfalls:
      - "Returns every active metric name (can be tens of thousands); always add host or tag_filter, then LIKE in SQL."
    examples:
      - sql: >-
          SELECT metric FROM datadog_metrics_active
          WHERE tag_filter = 'service:checkout' AND metric LIKE 'trace.%' ORDER BY metric
        description: Which APM trace metrics exist for a service.
    fixtures:
      - file: metrics_active.json
        expect_rows: 3
        expect_columns: {metric: system.cpu.idle}
        note: "Official API reference example response (Get active metrics list, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/get-active-metrics-list/

  - name: datadog_metrics
    title: Metrics catalog (v2 list)
    description: >-
      Actively reporting metrics with their Metrics-without-Limits configuration (v2 /api/v2/metrics).
      Filter tag_filter (e.g. 'service:web* AND env:prod'), window_s (active in the last N seconds,
      default 3600) and metric_type (non_distribution|distribution). One row per metric.
    kind: entities
    request:
      method: GET
      path: /api/v2/metrics
      query:
        "filter[tags]": "{{ filters.tag_filter }}"
        "filter[metric_type]": "{{ filters.metric_type }}"
        "window[seconds]": "{{ filters.window_s }}"
        "page[size]": 10000
    filters:
      - {column: tag_filter, description: "Tag expression with AND/OR/IN and wildcards", examples: ['service:checkout AND env:prod']}
      - {column: metric_type, description: "non_distribution | distribution | exponential_histogram | explicit_histogram"}
      - {column: window_s, type: BIGINT, description: "Only metrics reporting within this many seconds (default 3600, max 5184000)"}
    pagination: {type: cursor, cursor_path: "$.meta.pagination.next_cursor", cursor_param: "query.page[cursor]", max_pages: 3}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: metric, path: id, description: "Metric name"}
      - {name: resource_type, path: type, description: "metrics | manage_tags (configured with Metrics without Limits)"}
      - {name: metric_type, path: "attributes.metric_type", description: "gauge|count|rate|distribution (only for manage_tags rows)"}
      - {name: configured_tags, type: JSON, path: "attributes.tags", description: "Tag keys kept by the MwL configuration"}
      - {name: tag_filter, filter_only: true}
      - {name: window_s, type: BIGINT, filter_only: true}
    pitfalls:
      - "No name filter server-side: always pass tag_filter, then filter metric with LIKE in SQL."
    examples:
      - sql: "SELECT metric FROM datadog_metrics WHERE tag_filter = 'service:checkout' AND metric LIKE '%latency%'"
        description: Find latency metrics emitted by a service.
    fixtures:
      - file: metrics_list_v2.json
        expect_rows: 1
        expect_columns: {metric: test.metric.latency, resource_type: metrics}
        note: "Official API reference example response (Get a list of metrics, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/get-a-list-of-metrics/

  - name: datadog_metric_metadata
    title: Metric metadata
    description: Type (gauge/count/rate/distribution), unit, per-unit and description of one metric (v1 /api/v1/metrics/{metric_name}).
    kind: entities
    request:
      method: GET
      path: "/api/v1/metrics/{{ filters.metric }}"
      accept_status: [404]
    filters:
      - {column: metric, required: true, description: "Exact metric name", examples: ['trace.http.request.duration']}
    response:
      rows_path: "$"
    columns:
      - {name: metric, filter_only: true, description: "Metric name (from the filter)"}
      - {name: type, path: type, description: "gauge | count | rate | distribution"}
      - {name: unit, path: unit}
      - {name: per_unit, path: per_unit}
      - {name: description, path: description}
      - {name: short_name, path: short_name}
      - {name: integration, path: integration}
      - {name: statsd_interval, type: BIGINT, path: statsd_interval, description: "StatsD flush interval in seconds"}
    pitfalls:
      - "A 'rate' or 'count' type changes how values must be summed: counts need .as_count() in queries."
    examples:
      - sql: "SELECT metric, type, unit, per_unit FROM datadog_metric_metadata WHERE metric = 'trace.http.request.duration'"
        description: Check the unit before interpreting a latency spike.
    fixtures:
      - file: metric_metadata.json
        filters: {metric: system.net.bytes_rcvd}
        expect_rows: 1
        expect_columns: {metric: system.net.bytes_rcvd, type: count, unit: byte, per_unit: second}
        note: "Official API reference example response (Get metric metadata, 200); metric name is filled from the filter."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/get-metric-metadata/

  - name: datadog_metric_tags
    title: Tags of a metric
    description: >-
      Indexed (queryable) tags of one metric over the last window_s seconds (min/default 14400 = 4h)
      via v2 /api/v2/metrics/{metric_name}/all-tags. One row per 'key:value' tag. Use it to confirm a
      tag value exists before filtering a metric query on it.
    kind: entities
    request:
      method: GET
      path: "/api/v2/metrics/{{ filters.metric }}/all-tags"
      query:
        "window[seconds]": "{{ filters.window_s }}"
        "filter[match]": "{{ filters.match }}"
        "filter[tags]": "{{ filters.scope_tags }}"
    filters:
      - {column: metric, required: true, description: "Exact metric name", examples: ['trace.http.request.hits']}
      - {column: match, description: "Substring the tags must contain, e.g. 'service' or 'env:'", examples: ['service']}
      - {column: scope_tags, description: "Only tags seen on data points that carry ALL these tags, comma separated, e.g. 'service:checkout,env:prod' (filter[tags])"}
      - {column: window_s, type: BIGINT, description: "Look-back in seconds from now (min 14400)"}
    response:
      rows_path: "$.data.attributes.tags[*]"
    columns:
      - {name: tag, path: ".", description: "'key:value' tag"}
      - {name: tag_key, expr: "_.split(':')[0]"}
      - {name: tag_value, expr: "_.split(':', 1)[1] if ':' in _ else none"}
      - {name: metric, path: "$.data.id"}
      - {name: match, filter_only: true}
      - {name: scope_tags, filter_only: true}
      - {name: window_s, type: BIGINT, filter_only: true}
    pitfalls:
      - "Only indexed tags are queryable; tags listed by the API as ingested_tags (not exposed here) cannot be used in queries."
      - "The window is relative to NOW, not to the incident time."
    examples:
      - sql: "SELECT DISTINCT tag_value AS service FROM datadog_metric_tags WHERE metric = 'trace.http.request.hits' AND tag_key = 'service'"
        description: Which services emit a given APM metric.
      - sql: "SELECT tag_value AS pod FROM datadog_metric_tags WHERE metric = 'kubernetes.cpu.usage.total' AND match = 'pod_name' AND scope_tags = 'kube_deployment:checkout,env:prod' AND tag_key = 'pod_name'"
        description: Pods of one deployment that report a metric (confirm tag values before filtering a query).
    fixtures:
      - file: metric_all_tags.json
        filters: {metric: test.metric.latency}
        expect_rows: 3
        expect_columns: {tag: "sport:golf", tag_key: sport, tag_value: golf, metric: test.metric.latency}
        note: "Official API reference example response (List tags by metric name, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/metrics/list-tags-by-metric-name/

  # ----------------------------------------------------------------------------------------------
  # Logs
  # ----------------------------------------------------------------------------------------------
  - name: datadog_logs
    title: Log search
    description: >-
      Raw log events from v2 /api/v2/logs/events/search, newest first. Filter on any of service,
      env, host, level (status), trace_id, or a free search query (Datadog log search syntax), plus
      ts. storage_tier selects indexes (default), online-archives or flex; index restricts indexes.
      One row per log event.
    kind: logs
    request:
      method: POST
      path: /api/v2/logs/events/search
      body:
        filter:
          query: "{{ [filters.query or none, (filters.service | join_or('service:{}')) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, (filters.host | join_or('host:{}')) if filters.host else none, (filters.level | join_or('status:{}')) if filters.level else none, ('trace_id:' ~ filters.trace_id) if filters.trace_id else none] | compact | join(' ') or '*' }}"
          from: "{{ time.start | epoch_ms | string }}"
          to: "{{ time.end | epoch_ms | string }}"
          indexes: "{{ filters.log_index | as_list if filters.log_index else none }}"
          storage_tier: "{{ filters.storage_tier or 'indexes' }}"
        page:
          limit: "{{ [limit or 1000, 1000] | min }}"
        sort: "{{ filters.sort or '-timestamp' }}"
    filters:
      - {column: query, description: "Datadog log search query (see query_languages.datadog_search)", examples: ['@http.status_code:[500 TO 599] "timeout"']}
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Service name (exact)", examples: ['checkout']}
      - {column: env, description: "env tag value", examples: ['prod']}
      - {column: host, ops: ["=", "in"], fan_out: false, variants: hostname, description: "Host name", examples: ['ip-10-0-1-23']}
      - {column: level, ops: ["=", "in"], fan_out: false, description: "Log status: emergency|alert|critical|error|warn|notice|info|debug|ok", examples: ['error']}
      - {column: trace_id, description: "APM trace id (decimal, as in datadog_spans.trace_id)"}
      - {column: log_index, ops: ["=", "in"], fan_out: false, description: "Log index name(s); default all"}
      - {column: storage_tier, description: "indexes (default) | online-archives | flex", examples: ['indexes']}
      - {column: sort, description: "-timestamp (default, newest first) | timestamp"}
    time: {column: ts, default_lookback: 15m, max_window: 7d}
    pagination: {type: cursor, cursor_path: "$.meta.page.after", cursor_param: "body.page.cursor", max_pages: 5}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Log search timed out and results are partial: narrow the time window or the query"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "attributes.timestamp", transform: auto_time}
      - {name: service, path: "attributes.service"}
      - {name: host, path: "attributes.host"}
      - {name: level, path: "attributes.status", transform: lower, description: "Log status (lower-cased): error, warn, info..."}
      - {name: message, path: "attributes.message"}
      - {name: env, path: "attributes.attributes.env", description: "env attribute when present (else the filter value); env is usually a tag, see tags"}
      - {name: trace_id, expr: "_.attributes.attributes.dd.trace_id or _.attributes.attributes.trace_id", description: "Correlated APM trace id when the log carries dd.trace_id"}
      - {name: status_code, type: BIGINT, expr: "_.attributes.attributes.http.status_code", description: "@http.status_code when present"}
      - {name: tags, type: JSON, path: "attributes.tags", description: "JSON array of 'key:value' tags"}
      - {name: attributes, type: JSON, path: "attributes.attributes", description: "All custom log attributes (JSON); query with attributes->>'$.http.url'"}
      - {name: id, path: id}
      - {name: query, filter_only: true}
      - {name: log_index, filter_only: true}
      - {name: storage_tier, filter_only: true}
      - {name: sort, filter_only: true}
    require_one_of: [[query, service, host, trace_id, env, level]]
    max_rows: 5000
    sort_hint: "newest first (sort -timestamp)"
    pitfalls:
      - "Flex-tier and archived logs are only searched with storage_tier = 'flex' / 'online-archives'."
      - "Attribute facets need @ (@http.status_code); reserved ones (service, host, status, env, source, trace_id) do not. Unknown facets return 0 rows silently."
      - "Pages hold at most 1000 logs; the table stops after 5 pages. For volumes use datadog_log_counts / datadog_log_timeseries, never COUNT(*) here."
      - "Status values are lower-cased in level; the API may return INFO/ERROR in upper case."
    examples:
      - sql: >-
          SELECT ts, host, message FROM datadog_logs
          WHERE service = 'checkout' AND level = 'error'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY ts DESC LIMIT 50
        description: Recent error logs of a service in the alert window.
      - sql: >-
          SELECT ts, service, message, status_code FROM datadog_logs
          WHERE query = '@http.status_code:[500 TO 599] "upstream connect error"' AND storage_tier = 'flex'
            AND ts >= TIMESTAMP '2026-09-30 00:00:00' AND ts < TIMESTAMP '2026-10-01 00:00:00'
          LIMIT 100
        description: Search Flex-tier logs for a specific failure signature.
      - sql: "SELECT ts, service, level, message FROM datadog_logs WHERE trace_id = '3740652481065462946' ORDER BY ts"
        description: Logs correlated with one APM trace.
    tests:
      - {sql: "SELECT ts, service, level, message FROM datadog_logs WHERE query = '*' LIMIT 5", min_rows: 0}
    fixtures:
      - file: logs_search.json
        filters: {service: agent}
        expect_rows: 1
        expect_columns: {ts: "2019-01-02T09:42:36Z", service: agent, host: i-0123, level: info, message: "Host connected to remote", id: "AAAAAWgN8Xwgr1vKDQAAAABBV2dOOFh3ZzZobm1mWXJFYTR0OA"}
        note: "Official API reference example response (Search logs POST, 200)."
      - file: logs_search_timeout_schema.json
        filters: {service: checkout}
        expect_error: "timeout"
        note: "Built strictly from the documented LogsListResponse schema (meta.status enum done|timeout) to prove a partial (timed-out) search is raised, never returned as complete."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/logs?query={{ (filters.query or (('service:' ~ filters.service) if filters.service is string else '*')) | urlencode }}&from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false"
    docs_url: https://docs.datadoghq.com/api/latest/logs/search-logs-post/

  - name: datadog_log_counts
    title: Log counts by facet (top-N)
    description: >-
      Aggregate logs (v2 /api/v2/logs/analytics/aggregate, compute type=total) grouped by a facet
      (default 'service'; e.g. 'status', 'host', '@http.status_code', '@error.kind') with an optional
      second facet (facet2). Buckets are sorted by the computed value DESCENDING (never alphabetical).
      aggregation defaults to count; for pc99/sum/avg/max of a measure also set metric (e.g. '@duration').
      One row per bucket: group_value, group_value2, value.
    kind: logs
    request:
      method: POST
      path: /api/v2/logs/analytics/aggregate
      body:
        compute: "{{ [ ({'aggregation': filters.aggregation or 'count', 'type': 'total', 'metric': filters.metric or none} | compact) ] }}"
        filter:
          query: "{{ [filters.query or none, ('service:' ~ filters.service) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('host:' ~ filters.host) if filters.host else none, ('status:' ~ filters.level) if filters.level else none] | compact | join(' ') or '*' }}"
          from: "{{ time.start | epoch_ms | string }}"
          to: "{{ time.end | epoch_ms | string }}"
          indexes: "{{ filters.log_index | as_list if filters.log_index else none }}"
          storage_tier: "{{ filters.storage_tier or 'indexes' }}"
        group_by: "{{ [ {'facet': filters.facet or 'service', 'limit': [limit or 50, 1000] | min, 'sort': ({'aggregation': filters.aggregation or 'count', 'order': 'desc', 'type': 'measure', 'metric': filters.metric or none} | compact) } ] + ([ {'facet': filters.facet2, 'limit': 10, 'sort': ({'aggregation': filters.aggregation or 'count', 'order': 'desc', 'type': 'measure', 'metric': filters.metric or none} | compact) } ] if filters.facet2 else []) }}"
    filters:
      - {column: facet, description: "Group-by facet (default service). Attributes need @, e.g. @http.status_code", examples: ['status']}
      - {column: facet2, description: "Optional second group-by facet (top 10 per first-level bucket)"}
      - {column: aggregation, description: "count (default) | cardinality | sum | min | max | avg | median | pc75 | pc90 | pc95 | pc98 | pc99"}
      - {column: metric, description: "Measure for non-count aggregations, e.g. @duration or @http.response_time"}
      - {column: query, description: "Datadog log search query", examples: ['status:error']}
      - {column: service, ops: ["=", "in"], max_fan_out: 10, description: "Service (one request per value)"}
      - {column: env, description: "env tag value"}
      - {column: host, variants: hostname, description: "Host name"}
      - {column: level, description: "Log status, e.g. error"}
      - {column: log_index, ops: ["=", "in"], fan_out: false, description: "Log index name(s)"}
      - {column: storage_tier, description: "indexes (default) | online-archives | flex"}
    time: {column: ts, default_lookback: 1h, max_window: 30d}
    response:
      rows_path: "$.data.buckets[*]"
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Aggregation timed out (partial buckets): narrow the window or query"}
    columns:
      - {name: group_value, expr: "_.by[filters.facet or 'service']", description: "Value of the group-by facet for this bucket"}
      - {name: group_value2, expr: "_.by[filters.facet2] if filters.facet2 else none", description: "Value of facet2 (if set)"}
      - {name: value, type: DOUBLE, expr: "_.computes.c0", description: "Computed value (count by default)"}
      - {name: by, type: JSON, path: by, description: "All group-by key/values of the bucket"}
      - {name: facet, filter_only: true}
      - {name: facet2, filter_only: true}
      - {name: aggregation, filter_only: true}
      - {name: metric, filter_only: true}
      - {name: query, filter_only: true}
      - {name: service, filter_only: true}
      - {name: env, filter_only: true}
      - {name: host, filter_only: true}
      - {name: level, filter_only: true}
      - {name: log_index, filter_only: true}
      - {name: storage_tier, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    sort_hint: "buckets come back sorted by value descending"
    pitfalls:
      - "The API default group-by ordering is alphabetical; this table always sends sort {type: measure, order: desc}."
      - "Facets that are log attributes need @ (facet = '@http.status_code'); a non-existent facet yields one bucket of NULL/missing values or none."
      - "SQL LIMIT is pushed into the group-by limit (this table caps it at 1000 buckets; the API allows 10000 and the product of facet limits must stay <= 10000)."
    examples:
      - sql: >-
          SELECT group_value AS service, value AS errors FROM datadog_log_counts
          WHERE facet = 'service' AND level = 'error'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY errors DESC LIMIT 10
        description: Which services log the most errors during the incident (count-descending).
      - sql: >-
          SELECT group_value AS status_code, value AS n FROM datadog_log_counts
          WHERE service = 'checkout' AND facet = '@http.status_code' AND query = '@http.status_code:>=500'
          ORDER BY n DESC
        description: Breakdown of 5xx codes for one service.
      - sql: >-
          SELECT group_value AS service, group_value2 AS level, value FROM datadog_log_counts
          WHERE facet = 'service' AND facet2 = 'status' ORDER BY value DESC LIMIT 20
        description: Two-level breakdown (service x status).
    fixtures:
      - file: logs_aggregate_counts_guide.json
        filters: {facet: status}
        expect_rows: 3
        expect_columns: {group_value: warn, value: 644291}
        note: "Response example from Datadog's official guide 'Build custom reports using Log Analytics API' (Getting counts / Table); the API reference page only shows a '<any-key>' placeholder."
      - file: logs_aggregate_two_facets_guide.json
        filters: {facet: service, facet2: status}
        expect_rows: 3
        expect_columns: {group_value: activator, group_value2: info, value: 312}
        note: "Response example from the same official guide (Pagination section, group by service then status)."
    docs_url: https://docs.datadoghq.com/api/latest/logs/aggregate-events/

  - name: datadog_log_timeseries
    title: Log volume over time
    description: >-
      Log counts (or another aggregation) per time bucket from v2 /api/v2/logs/analytics/aggregate
      (compute type=timeseries). Optional group-by facet (top 10 series by value). One row per
      (group, bucket). Bucket size is the automatic step (~300 buckets per window); empty buckets are zero-filled.
    kind: logs
    request:
      method: POST
      path: /api/v2/logs/analytics/aggregate
      body:
        compute: "{{ [ ({'aggregation': filters.aggregation or 'count', 'type': 'timeseries', 'interval': time.step_s | prom_duration, 'metric': filters.metric or none} | compact) ] }}"
        filter:
          query: "{{ [filters.query or none, ('service:' ~ filters.service) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('host:' ~ filters.host) if filters.host else none, ('status:' ~ filters.level) if filters.level else none] | compact | join(' ') or '*' }}"
          from: "{{ time.start | epoch_ms | string }}"
          to: "{{ time.end | epoch_ms | string }}"
          indexes: "{{ filters.log_index | as_list if filters.log_index else none }}"
          storage_tier: "{{ filters.storage_tier or 'indexes' }}"
        group_by: "{{ [ {'facet': filters.facet, 'limit': filters.top or 10, 'sort': ({'aggregation': filters.aggregation or 'count', 'order': 'desc', 'type': 'measure', 'metric': filters.metric or none} | compact) } ] if filters.facet else none }}"
    filters:
      - {column: query, description: "Datadog log search query", examples: ['status:error']}
      - {column: service, ops: ["=", "in"], max_fan_out: 10, description: "Service (one request per value)", examples: ['checkout']}
      - {column: env, description: "env tag value"}
      - {column: host, variants: hostname, description: "Host name"}
      - {column: level, description: "Log status, e.g. error"}
      - {column: facet, description: "Optional group-by facet (e.g. status, host, @http.status_code)"}
      - {column: top, type: BIGINT, description: "Series to keep when grouping (default 10)"}
      - {column: aggregation, description: "count (default) | cardinality | sum | min | max | avg | median | pc75..pc99"}
      - {column: metric, description: "Measure for non-count aggregations, e.g. @duration"}
      - {column: log_index, ops: ["=", "in"], fan_out: false, description: "Log index name(s)"}
      - {column: storage_tier, description: "indexes (default) | online-archives | flex"}
    time: {column: ts, default_lookback: 1h, max_window: 30d}
    response:
      rows_path: "$.data.buckets[*]"
      expand:
        - {explode: "computes.c0", as: p}
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Aggregation timed out (partial buckets): narrow the window or query"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p.time", transform: auto_time, description: "Bucket start (UTC)"}
      - {name: value, type: DOUBLE, path: "@p.value", description: "Count (or aggregation) in the bucket"}
      - {name: group_value, expr: "_.by[filters.facet] if filters.facet else none", description: "Value of the group-by facet"}
      - {name: by, type: JSON, path: by}
      - {name: query, filter_only: true}
      - {name: service, filter_only: true}
      - {name: env, filter_only: true}
      - {name: host, filter_only: true}
      - {name: level, filter_only: true}
      - {name: facet, filter_only: true}
      - {name: top, type: BIGINT, filter_only: true}
      - {name: aggregation, filter_only: true}
      - {name: metric, filter_only: true}
      - {name: log_index, filter_only: true}
      - {name: storage_tier, filter_only: true}
    zero_fill: true
    pitfalls:
      - "Empty buckets are omitted by the API; the engine zero-fills them so a burst does not look like it ended at its peak."
      - "The bucket size is automatic (~300 buckets per window, rounded to 10s/15s/30s/1m/2m/5m...). To compare two windows bucket-for-bucket, give them the same length. (No interval filter: the engine's zero-fill assumes the auto step.)"
    examples:
      - sql: >-
          SELECT ts, value AS errors FROM datadog_log_timeseries
          WHERE service = 'checkout' AND level = 'error'
            AND ts BETWEEN TIMESTAMP '2026-10-01 10:30:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts
        description: When did the error-log burst start and stop?
      - sql: >-
          SELECT group_value AS host, max(value) AS peak FROM datadog_log_timeseries
          WHERE query = 'service:checkout status:error' AND facet = 'host'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY 1 ORDER BY peak DESC
        description: Is the error burst concentrated on a few hosts?
    fixtures:
      - file: logs_aggregate_timeseries_guide.json
        filters: {facet: status}
        expect_rows: 4
        expect_columns: {ts: "2020-08-10T19:00:00Z", value: 1856, group_value: info}
        note: "Response example from Datadog's official guide 'Build custom reports using Log Analytics API' (Getting counts / Timeseries)."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/logs/analytics?query={{ (filters.query or (('service:' ~ filters.service) if filters.service is string else '*')) | urlencode }}&from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false"
    docs_url: https://docs.datadoghq.com/api/latest/logs/aggregate-events/

  - name: datadog_log_indexes
    title: Log indexes (retention, daily quota, exclusion filters)
    description: >-
      Log index configuration (v1 GET /api/v1/logs/config/indexes): one row per index with its routing
      filter query, Standard-tier retention (retention_days), Standard + Flex retention
      (flex_retention_days), daily quota (daily_limit) and whether the quota was exceeded today
      (is_rate_limited), plus its exclusion filters as JSON. Answers "why are the logs missing?": an
      index over its daily quota, or an enabled exclusion filter with sample_rate 1.0, drops logs
      before they become searchable (they still count in metrics generated from logs).
    kind: entities
    request:
      method: GET
      path: /api/v1/logs/config/indexes
    response:
      rows_path: "$.indexes[*]"
    columns:
      - {name: name, path: name, description: "Index name (use it as log_index in datadog_logs / datadog_log_counts)"}
      - {name: filter_query, path: "filter.query", description: "Logs routed to this index; indexes are evaluated in order and the first match wins"}
      - {name: retention_days, type: BIGINT, path: num_retention_days, description: "Days logs stay in the Standard tier (searchable with storage_tier = 'indexes')"}
      - {name: flex_retention_days, type: BIGINT, path: num_flex_logs_retention_days, description: "Total days in Standard + Flex tiers (older logs only with storage_tier = 'flex')"}
      - {name: daily_limit, type: BIGINT, path: daily_limit, description: "Log events per day before the index stops indexing (NULL = no quota)"}
      - {name: is_rate_limited, type: BOOLEAN, path: is_rate_limited, description: "true = more logs than the daily limit were sent today: new logs are NOT indexed until the reset"}
      - {name: daily_limit_reset_time, path: "daily_limit_reset.reset_time", description: "HH:00 reset time (default 14:00 UTC)"}
      - {name: daily_limit_reset_utc_offset, path: "daily_limit_reset.reset_utc_offset"}
      - {name: daily_limit_warning_pct, type: DOUBLE, path: daily_limit_warning_threshold_percentage}
      - {name: active_exclusion_filters, type: BIGINT, expr: "(_.exclusion_filters or []) | selectattr('is_enabled') | list | length", description: "Number of enabled exclusion filters"}
      - {name: exclusion_filters, type: JSON, path: exclusion_filters, description: "All exclusion filters (name, is_enabled, filter.query, filter.sample_rate); see datadog_log_exclusion_filters"}
      - {name: tags, type: JSON, path: tags}
    pitfalls:
      - "Needs the logs_read_config permission on the application key (403 otherwise)."
      - "An index that hit its daily quota (is_rate_limited = true) silently stops indexing: an empty datadog_logs result after the quota time is not proof that nothing was logged."
    examples:
      - sql: "SELECT name, filter_query, retention_days, flex_retention_days, daily_limit, is_rate_limited, active_exclusion_filters FROM datadog_log_indexes ORDER BY name"
        description: Are logs being dropped by a daily quota or exclusion filter, and how far back is each tier searchable?
    fixtures:
      - file: log_indexes.json
        expect_rows: 1
        expect_columns: {name: main, filter_query: "source:python", retention_days: 15, flex_retention_days: 360, daily_limit: 300000000, is_rate_limited: false, daily_limit_reset_time: "14:00", active_exclusion_filters: 0}
        note: "Official API reference example response (Get all indexes, 200)."
    docs_url: https://docs.datadoghq.com/api/latest/logs-indexes/get-all-indexes/

  - name: datadog_log_exclusion_filters
    title: Log index exclusion filters
    description: >-
      Exclusion filters of every log index (v1 GET /api/v1/logs/config/indexes, exclusion_filters
      exploded): one row per (index, filter) with is_enabled, the exclusion query and sample_rate
      (1.0 = drop every matching log). An enabled filter matching the service under investigation
      explains logs that "disappeared"; check datadog_audit_events (evt_name 'Log Management') for
      who enabled it and when.
    kind: entities
    request:
      method: GET
      path: /api/v1/logs/config/indexes
    response:
      rows_path: "$.indexes[*]"
      expand:
        - {explode: exclusion_filters, as: x}
    columns:
      - {name: index_name, path: name}
      - {name: index_filter_query, path: "filter.query"}
      - {name: name, path: "@x.name", description: "Exclusion filter name"}
      - {name: is_enabled, type: BOOLEAN, path: "@x.is_enabled"}
      - {name: exclusion_query, path: "@x.filter.query", description: "Logs matching this query are excluded ('*' = all logs of the index)"}
      - {name: sample_rate, type: DOUBLE, path: "@x.filter.sample_rate", description: "Fraction of matching logs excluded: 1.0 drops all of them"}
      - {name: sample_attribute, path: "@x.filter.sample_attribute", description: "When set, sampling is done per value of this attribute (e.g. @ci.job_id)"}
    pitfalls:
      - "Only the FIRST matching enabled exclusion filter of an index applies; order is the array order."
      - "Excluded logs are not searchable in any storage tier, but log-based metrics and Live Tail still see them."
    examples:
      - sql: >-
          SELECT index_name, name, exclusion_query, sample_rate FROM datadog_log_exclusion_filters
          WHERE is_enabled AND (exclusion_query LIKE '%checkout%' OR exclusion_query = '*')
        description: Is an enabled exclusion filter dropping the service's logs?
    fixtures:
      - file: log_indexes.json
        expect_rows: 1
        expect_columns: {index_name: main, name: payment, is_enabled: false, exclusion_query: "*", sample_rate: 1.0, sample_attribute: "@ci.job_id"}
        note: "Official API reference example response (Get all indexes, 200): one index with one exclusion filter."
    docs_url: https://docs.datadoghq.com/api/latest/logs-indexes/get-all-indexes/

  # ----------------------------------------------------------------------------------------------
  # APM spans
  # ----------------------------------------------------------------------------------------------
  - name: datadog_spans
    title: APM span search
    description: >-
      Indexed APM spans from v2 /api/v2/spans/events/search, newest first. Filter on service, env,
      resource (resource_name), status ('error'|'ok'), trace_id, or a span search query, plus ts.
      One row per span with duration_ms, status_code and error fields. Use trace_id = '...' to
      reconstruct one trace (parent_id/span_id).
    kind: spans
    request:
      method: POST
      path: /api/v2/spans/events/search
      body:
        data:
          type: search_request
          attributes:
            filter:
              query: "{{ [filters.query or none, (filters.service | join_or('service:{}')) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('resource_name:' ~ (filters.resource | quote)) if filters.resource else none, ('status:' ~ filters.status) if filters.status else none, ('trace_id:' ~ filters.trace_id) if filters.trace_id else none] | compact | join(' ') or '*' }}"
              from: "{{ time.start | epoch_ms | string }}"
              to: "{{ time.end | epoch_ms | string }}"
            page:
              limit: "{{ [limit or 500, 1000] | min }}"
            sort: "-timestamp"
    filters:
      - {column: query, description: "Span search query, e.g. '@http.status_code:500 @duration:>2000000000'", examples: ['@http.status_code:>=500']}
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Service name", examples: ['checkout']}
      - {column: env, description: "Environment", examples: ['prod']}
      - {column: resource, description: "Exact resource_name, e.g. 'POST /api/checkout'"}
      - {column: status, description: "error | ok (span status)"}
      - {column: trace_id, description: "Trace id (decimal string as returned in trace_id)"}
    time: {column: ts, default_lookback: 15m, max_window: 1d, control_lookback: 2h}
    pagination: {type: cursor, cursor_path: "$.meta.page.after", cursor_param: "body.data.attributes.page.cursor", max_pages: 3}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Span search timed out (partial results): narrow the window"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "attributes.start_timestamp", transform: auto_time, description: "Span start"}
      - {name: end_ts, type: TIMESTAMP, path: "attributes.end_timestamp", transform: auto_time}
      - {name: duration_ms, type: DOUBLE, path: "attributes.custom.duration", transform: ns_to_ms, description: "Span duration in ms (API @duration is nanoseconds). If NULL use date_diff('millisecond', ts, end_ts)."}
      - {name: service, path: "attributes.service"}
      - {name: env, path: "attributes.env"}
      - {name: host, path: "attributes.host"}
      - {name: resource, path: "attributes.resource_name", description: "Endpoint / operation resource, e.g. 'GET /cart'"}
      - {name: span_type, path: "attributes.type", description: "web | db | cache | http | custom..."}
      - {name: trace_id, path: "attributes.trace_id"}
      - {name: span_id, path: "attributes.span_id"}
      - {name: parent_id, path: "attributes.parent_id", description: "'0' for root spans"}
      - {name: is_root, type: BOOLEAN, expr: "_.attributes.parent_id == '0'"}
      - {name: status_code, type: BIGINT, path: "attributes.custom.http.status_code", description: "@http.status_code when present"}
      - {name: http_method, path: "attributes.custom.http.method"}
      - {name: error_type, path: "attributes.custom.error.type", description: "@error.type when the span errored"}
      - {name: error_message, path: "attributes.custom.error.message"}
      - {name: version, path: "attributes.custom.version", description: "Deployed version tag of the service"}
      - {name: tags, type: JSON, path: "attributes.tags"}
      - {name: custom, type: JSON, path: "attributes.custom", description: "All span attributes (JSON)"}
      - {name: retained_by, path: "attributes.retained_by", description: "Retention filter that indexed the span (sampling!)"}
      - {name: id, path: id}
      - {name: query, filter_only: true}
      - {name: status, filter_only: true}
    require_one_of: [[query, service, trace_id, resource]]
    max_rows: 3000
    sort_hint: "newest first"
    pitfalls:
      - "Rate limited to 300 requests per HOUR per org: query once with a tight window, never per service in a loop."
      - "Indexed spans are a retention-filter SAMPLE (see retained_by); never count them as traffic. Use trace.* metrics for rates."
      - "@duration filters and values are in nanoseconds (duration_ms is converted)."
    examples:
      - sql: >-
          SELECT ts, resource, duration_ms, status_code, error_message, trace_id FROM datadog_spans
          WHERE service = 'checkout' AND status = 'error'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:15:00'
          ORDER BY ts DESC LIMIT 20
        description: Exemplar error spans of a service during the alert.
      - sql: >-
          SELECT service, resource, span_id, parent_id, duration_ms, error_type FROM datadog_spans
          WHERE trace_id = '3740652481065462946' ORDER BY ts
        description: Reconstruct one trace span by span.
    fixtures:
      - file: spans_search.json
        filters: {service: agent}
        expect_rows: 1
        expect_columns: {ts: "2023-01-02T09:42:36Z", service: agent, env: prod, resource: agent, trace_id: "1234567890987654321", parent_id: "0", is_root: true, span_type: web}
        note: "Official API reference example response (Search spans, 200)."
      - file: spans_search_recorded.json
        filters: {query: '*'}
        expect_rows: 2
        expect_columns: {service: python-sample-app-spartancrimson, resource: "GET /", duration_ms: 3.402932, status_code: 200, trace_id: "3740652481065462946", http_method: GET}
        note: "Recorded 200 response from Datadog's official datadog-api-client-python test cassette (tests/v2/cassettes/test_scenarios/test_search_spans_returns_ok_response), trimmed to 2 spans (a root and a child span), a subset of custom keys and the env/version tags; shows custom.duration in ns and custom.http.*."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/apm/traces?query={{ (filters.query or (('service:' ~ filters.service) if filters.service is string else '*')) | urlencode }}&start={{ time.start | epoch_ms }}&end={{ time.end | epoch_ms }}&paused=true"
    docs_url: https://docs.datadoghq.com/api/latest/spans/search-spans/

  - name: datadog_span_counts
    title: Span counts / latency by facet (top-N)
    description: >-
      Aggregate indexed spans (v2 /api/v2/spans/analytics/aggregate, type=total) grouped by a facet
      (default 'resource_name'; also service, @http.status_code, @error.type, host, version) sorted
      DESCENDING by the computed value. aggregation count (default) or pc75..pc99/sum/min/max with
      metric '@duration' (nanoseconds). One row per bucket.
    kind: spans
    request:
      method: POST
      path: /api/v2/spans/analytics/aggregate
      body:
        data:
          type: aggregate_request
          attributes:
            compute: "{{ [ ({'aggregation': filters.aggregation or 'count', 'type': 'total', 'metric': filters.metric or none} | compact) ] }}"
            filter:
              query: "{{ [filters.query or none, ('service:' ~ filters.service) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('status:' ~ filters.status) if filters.status else none] | compact | join(' ') or '*' }}"
              from: "{{ time.start | epoch_ms | string }}"
              to: "{{ time.end | epoch_ms | string }}"
            group_by: "{{ [ {'facet': filters.facet or 'resource_name', 'limit': [limit or 50, 1000] | min, 'sort': ({'aggregation': filters.aggregation or 'count', 'order': 'desc', 'type': 'measure', 'metric': filters.metric or none} | compact) } ] }}"
    filters:
      - {column: facet, description: "Group-by facet (default resource_name)", examples: ['resource_name']}
      - {column: aggregation, description: "count (default) | pc75 | pc90 | pc95 | pc98 | pc99 | avg | median | sum | min | max | cardinality"}
      - {column: metric, description: "Measure for non-count aggregations, typically @duration (ns)"}
      - {column: query, description: "Span search query"}
      - {column: service, ops: ["=", "in"], max_fan_out: 5, description: "Service", examples: ['checkout']}
      - {column: env, description: "Environment"}
      - {column: status, description: "error | ok"}
    time: {column: ts, default_lookback: 1h, max_window: 7d, control_lookback: 2h}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Aggregation timed out: narrow the window"}
    columns:
      - {name: group_value, expr: "_.attributes.by[filters.facet or 'resource_name']"}
      - {name: value, type: DOUBLE, expr: "(_.attributes.compute or _.attributes.computes).c0", description: "Computed value; @duration aggregations are in NANOSECONDS"}
      - {name: by, type: JSON, path: "attributes.by"}
      - {name: facet, filter_only: true}
      - {name: aggregation, filter_only: true}
      - {name: metric, filter_only: true}
      - {name: query, filter_only: true}
      - {name: service, filter_only: true}
      - {name: env, filter_only: true}
      - {name: status, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "300 requests/hour per org. Counts are over SAMPLED indexed spans: compare proportions, not absolute traffic."
      - "Recorded responses carry the values under attributes.compute while the reference lists attributes.computes; both are read."
      - "@duration aggregations are nanoseconds: value / 1e6 = ms."
    examples:
      - sql: >-
          SELECT group_value AS resource, value AS error_spans FROM datadog_span_counts
          WHERE service = 'checkout' AND status = 'error' AND facet = 'resource_name'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY error_spans DESC LIMIT 10
        description: Which endpoints produce the error spans.
      - sql: >-
          SELECT group_value AS resource, value / 1e6 AS p99_ms FROM datadog_span_counts
          WHERE service = 'checkout' AND aggregation = 'pc99' AND metric = '@duration'
          ORDER BY p99_ms DESC LIMIT 10
        description: Slowest endpoints by p99.
    fixtures:
      - file: spans_aggregate_counts_schema.json
        filters: {facet: resource_name}
        expect_rows: 2
        expect_columns: {group_value: "POST /api/checkout", value: 1840}
        note: "Built strictly from the documented SpansAggregateResponse schema (data[].attributes.by / computes); the reference example is a '<any-key>' placeholder (spans_aggregate_docs.json)."
      - file: spans_aggregate_docs.json
        expect_rows: 1
        expect_columns: {group_value: null, value: null}
        note: "Official API reference example response (Aggregate spans, 200): '<any-key>' placeholders, so the bucket parses but carries no values."
    docs_url: https://docs.datadoghq.com/api/latest/spans/aggregate-spans/

  - name: datadog_span_timeseries
    title: Span counts / latency over time
    description: >-
      Indexed-span aggregation per time bucket (v2 /api/v2/spans/analytics/aggregate, type=timeseries),
      optionally grouped by a facet (top 10). One row per (group, bucket). Prefer
      datadog_metrics_timeseries on trace.* metrics for unsampled rates.
    kind: spans
    request:
      method: POST
      path: /api/v2/spans/analytics/aggregate
      body:
        data:
          type: aggregate_request
          attributes:
            compute: "{{ [ ({'aggregation': filters.aggregation or 'count', 'type': 'timeseries', 'interval': time.step_s | prom_duration, 'metric': filters.metric or none} | compact) ] }}"
            filter:
              query: "{{ [filters.query or none, ('service:' ~ filters.service) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('status:' ~ filters.status) if filters.status else none] | compact | join(' ') or '*' }}"
              from: "{{ time.start | epoch_ms | string }}"
              to: "{{ time.end | epoch_ms | string }}"
            group_by: "{{ [ {'facet': filters.facet, 'limit': 10, 'sort': ({'aggregation': filters.aggregation or 'count', 'order': 'desc', 'type': 'measure', 'metric': filters.metric or none} | compact) } ] if filters.facet else none }}"
    filters:
      - {column: query, description: "Span search query", examples: ['service:checkout status:error']}
      - {column: service, ops: ["=", "in"], max_fan_out: 5, description: "Service"}
      - {column: env, description: "Environment"}
      - {column: status, description: "error | ok"}
      - {column: facet, description: "Optional group-by facet"}
      - {column: aggregation, description: "count (default) | pc75..pc99 | avg | median | sum | min | max | cardinality"}
      - {column: metric, description: "Measure, e.g. @duration (ns)"}
    time: {column: ts, default_lookback: 1h, max_window: 7d, control_lookback: 2h}
    response:
      rows_path: "$.data[*]"
      expand:
        - {explode: "attributes.compute.c0", as: p1, keep_empty: true}
        - {explode: "attributes.computes.c0", as: p2, keep_empty: true}
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "Aggregation timed out: narrow the window"}
    columns:
      - {name: ts, type: TIMESTAMP, expr: "(p1 or p2).time", transform: auto_time}
      - {name: value, type: DOUBLE, expr: "(p1 or p2).value"}
      - {name: group_value, expr: "_.attributes.by[filters.facet] if filters.facet else none"}
      - {name: by, type: JSON, path: "attributes.by"}
      - {name: query, filter_only: true}
      - {name: service, filter_only: true}
      - {name: env, filter_only: true}
      - {name: status, filter_only: true}
      - {name: facet, filter_only: true}
      - {name: aggregation, filter_only: true}
      - {name: metric, filter_only: true}
    zero_fill: true
    pitfalls:
      - "300 requests/hour per org; values are over sampled indexed spans."
      - "Bucket size is automatic (~300 buckets per window); empty buckets are zero-filled by the engine."
      - "Values may sit under attributes.compute (recorded responses) or attributes.computes (reference); both are read."
    examples:
      - sql: >-
          SELECT ts, value AS error_spans FROM datadog_span_timeseries
          WHERE service = 'checkout' AND status = 'error'
            AND ts BETWEEN TIMESTAMP '2026-10-01 10:45:00' AND TIMESTAMP '2026-10-01 11:45:00'
          ORDER BY ts
        description: Error-span timeline for one service.
    fixtures:
      - file: spans_aggregate_timeseries_recorded.json
        filters: {query: '*'}
        expect_rows: 4
        expect_columns: {ts: "2023-06-29T09:40:00Z", value: 154}
        note: "Recorded 200 response from Datadog's official datadog-api-client-python test cassette (tests/v2/cassettes/test_scenarios/test_aggregate_spans_returns_ok_response): values under attributes.compute.c0."
    docs_url: https://docs.datadoghq.com/api/latest/spans/aggregate-spans/

