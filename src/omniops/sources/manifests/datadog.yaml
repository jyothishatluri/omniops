  # RUM
  # ----------------------------------------------------------------------------------------------
  - name: datadog_rum_events
    title: RUM event search
    description: >-
      Real User Monitoring events (sessions, views, actions, errors, resources, long tasks) from
      v2 /api/v2/rum/events/search, newest first. Filter on application_id, service, env,
      event_type (view|error|action|resource|long_task|session), or a RUM search query, plus ts.
    kind: events
    request:
      method: POST
      path: /api/v2/rum/events/search
      body:
        filter:
          query: "{{ [filters.query or none, ('@application.id:' ~ filters.application_id) if filters.application_id else none, (filters.service | join_or('service:{}')) if filters.service else none, ('env:' ~ filters.env) if filters.env else none, ('@type:' ~ filters.event_type) if filters.event_type else none] | compact | join(' ') or '*' }}"
          from: "{{ time.start | epoch_ms | string }}"
          to: "{{ time.end | epoch_ms | string }}"
        page:
          limit: "{{ [limit or 500, 1000] | min }}"
        sort: "-timestamp"
    filters:
      - {column: query, description: "RUM search query, e.g. '@type:error @view.url_path:/checkout'", examples: ['@error.source:network']}
      - {column: application_id, description: "RUM application id"}
      - {column: service, ops: ["=", "in"], fan_out: false, description: "RUM service", examples: ['web-store']}
      - {column: env, description: "Environment"}
      - {column: event_type, description: "session | view | action | error | resource | long_task | vital", examples: ['error']}
    time: {column: ts, default_lookback: 15m, max_window: 7d, retention: 30d}
    pagination: {type: cursor, cursor_path: "$.meta.page.after", cursor_param: "body.page.cursor", max_pages: 3}
    response:
      rows_path: "$.data[*]"
      errors:
        - {path: "$.meta.status", equals: "timeout", message: "$.meta.status", hint: "RUM search timed out (partial results): narrow the window"}
    columns:
      - {name: ts, type: TIMESTAMP, path: "attributes.timestamp", transform: auto_time}
      - {name: service, path: "attributes.service"}
      - {name: event_type, path: "attributes.attributes.type", description: "RUM event type (@type)"}
      - {name: application_id, path: "attributes.attributes.application.id"}
      - {name: session_id, path: "attributes.attributes.session.id"}
      - {name: view_url, path: "attributes.attributes.view.url"}
      - {name: error_message, path: "attributes.attributes.error.message"}
      - {name: error_type, path: "attributes.attributes.error.type"}
      - {name: error_source, path: "attributes.attributes.error.source", description: "network | source | console | logger | agent | webview | custom | report"}
      - {name: version, path: "attributes.attributes.version"}
      - {name: tags, type: JSON, path: "attributes.tags"}
      - {name: attributes, type: JSON, path: "attributes.attributes", description: "All RUM attributes (view.*, error.*, resource.*, usr.*, geo.*, device.*)"}
      - {name: id, path: id}
      - {name: query, filter_only: true}
      - {name: env, filter_only: true}
    require_one_of: [[query, application_id, service, event_type]]
    max_rows: 3000
    pitfalls:
      - "RUM attributes need @ in queries (@type:error, @view.url_path:/cart); service/env/version do not."
      - "Session/view/action/error events are kept 30 days, resource/long-task events 15 days."
    examples:
      - sql: >-
          SELECT ts, view_url, error_type, error_message FROM datadog_rum_events
          WHERE service = 'web-store' AND event_type = 'error'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY ts DESC LIMIT 50
        description: Front-end errors users hit during the incident.
    fixtures:
      - file: rum_search.json
        filters: {service: web-app}
        expect_rows: 1
        expect_columns: {ts: "2019-01-02T09:42:36Z", service: web-app, id: "AAAAAWgN8Xwgr1vKDQAAAABBV2dOOFh3ZzZobm1mWXJFYTR0OA"}
        note: "Official API reference example response (Search RUM events, 200)."
    ui_link: "{{ env.DD_UI_BASE_URL or ('https://' ~ (env.DD_SITE if env.DD_SITE.count('.') > 1 else 'app.' ~ env.DD_SITE)) }}/rum/sessions?query={{ (filters.query or (('service:' ~ filters.service) if filters.service is string else '*')) | urlencode }}&from_ts={{ time.start | epoch_ms }}&to_ts={{ time.end | epoch_ms }}&live=false"
    docs_url: https://docs.datadoghq.com/api/latest/rum/search-rum-events/

  - name: datadog_rum_counts
