    columns: *chart_columns
    pitfalls:
      - "name is a server-side substring match and is not re-checked in SQL; compare title for an exact name."
      - "The documented list example omits programText; if program_text is null here, fetch the chart by id with splunk_o11y_chart."
    examples:
      - sql: "SELECT id, title, type, program_text FROM splunk_o11y_charts WHERE name LIKE '%latency%'"
        description: Latency charts and their SignalFlow.
    fixtures:
      - file: charts.json
        filters: {name: string}
        expect_rows: 1
        expect_columns: {id: string, type: Heatmap, program_text: null, last_updated: "2019-05-13T00:30:30Z"}
        note: "Verbatim example response of GET /v2/chart from the dev.splunk.com 'Charts' API reference (the list example has no programText)."
    docs_url: https://dev.splunk.com/observability/reference/api/charts/latest

roles:
  active_alerts:
    table: splunk_o11y_incidents
    columns: {ts: ts, name: detector_name, title: title, state: state, severity: severity, id: id, labels: dimensions}
  alert_rules:
    - table: splunk_o11y_detector
      filters: {id: "{{ alert_id }}"}
      columns: {name: name, title: title, query: program_text, severity: severities}
    - table: splunk_o11y_detectors
      columns: {name: name, title: title, query: program_text, severity: severities}
  alert_history:
    - table: splunk_o11y_detector_events
      filters: {detector_id: "{{ alert_id }}"}
      columns: {ts: ts, state: state, severity: severity, id: incident_id}
    - table: splunk_o11y_events
      filters: {query: "sf_eventCategory:ALERT"}
      columns: {ts: ts, title: title, labels: dimensions}
  incidents:
    table: splunk_o11y_incidents
    filters: {include_resolved: "true"}
    columns: {ts: ts, title: title, state: state, severity: severity, id: id}
  metrics:
    - table: splunk_o11y_signalflow
      query_language: signalflow
      columns: {ts: ts, value: value, metric: metric, labels: dimensions}
    - table: splunk_o11y_timeseries_window
      query_language: o11y_search
      columns: {ts: ts, value: value}
  change_events:
    - table: splunk_o11y_events
      filters: {query: "sf_eventCategory:USER_DEFINED"}
      columns: {ts: ts, title: title, service: service, version: version, labels: properties}
      notes: "Deploy / config-change events sent by CI/CD as custom events"
    - table: splunk_o11y_audit_events
      filters: {category: CUSTOMER_AUDIT}
      columns: {ts: ts, title: title, author: author, id: resource_id, labels: properties}
      notes: "Changes to detectors, dashboards, SLOs, integrations and members inside Splunk Observability Cloud"
  services:
    table: splunk_o11y_services
    filters: {env: "{{ env or '' }}"}
    columns: {service: service}
  service_map:
    table: splunk_o11y_service_map
    filters: {env: "{{ env or '' }}"}
    columns: {from: from_service, to: to_service}
  trace_detail:
    table: splunk_o11y_trace
    columns: {trace_id: trace_id, span_id: span_id, service: service, resource: operation, ts: ts, duration_ms: duration_ms, status_code: status_code}
  hosts:
    table: splunk_o11y_dimensions
    filters: {query: "key:host"}
    columns: {host: value}
  slo:
    table: splunk_o11y_slos
    filters: {service: "{{ service or '' }}"}
    columns: {title: title, id: id}
  dashboards:
    - table: splunk_o11y_dashboards
      columns: {title: title, id: id}
    - table: splunk_o11y_chart
      columns: {title: title, id: id, query: program_text}
      notes: "Chart definitions (SignalFlow) by id, from dashboard chart_ids"
