    response:
      rows_path: "$"
    columns: &chart_columns
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: title, path: name}
      - {name: description, path: description}
      - {name: program_text, path: programText, description: "SignalFlow program of the chart (run it with splunk_o11y_signalflow)"}
      - {name: type, path: options.type, description: "TimeSeriesChart | SingleValue | List | Heatmap | Text | TableChart | Event ..."}
      - {name: time_range, type: JSON, path: options.time, description: "Chart time setting (relative range in ms or absolute start/end)"}
      - {name: publish_labels, type: JSON, path: options.publishLabelOptions, description: "Display name, unit, prefix/suffix per publish() label"}
      - {name: related_detector_ids, type: JSON, path: relatedDetectorIds}
