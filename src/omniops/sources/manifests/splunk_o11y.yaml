        note: "Verbatim example response of GET /v2/synthetics/tests from the dev.splunk.com 'Synthetics tests' API reference."
    docs_url: https://dev.splunk.com/observability/reference/api/synthetics_tests/latest

  - name: splunk_o11y_synthetic_runs
