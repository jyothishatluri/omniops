      - {name: created_at, type: TIMESTAMP, path: createdAt, transform: auto_time}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt, transform: auto_time}
      - {name: search, filter_only: true}
    examples:
      - sql: "SELECT id, name, type, last_run_at FROM splunk_o11y_synthetic_tests WHERE last_run_status = 'failed' AND active = true"
