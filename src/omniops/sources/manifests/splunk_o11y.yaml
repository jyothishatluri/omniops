      - {name: last_run_status, path: lastRunStatus}
      - {name: state, path: lastRunStatus}
      - {name: last_run_at, type: TIMESTAMP, path: lastRunAt, transform: auto_time}
      - {name: frequency_min, type: BIGINT, path: frequency, description: "Run frequency in minutes"}
      - {name: location_ids, type: JSON, path: locationIds}
      - {name: scheduling_strategy, path: schedulingStrategy}
      - {name: automatic_retries, type: BIGINT, path: automaticRetries}
