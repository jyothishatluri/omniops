        active: "{{ filters.active }}"
    filters:
      - {column: search, description: "Text matched against test name or type", examples: ['checkout']}
      - {column: type, description: "browser | api | http | port | ssl | uptime", examples: ['browser']}
      - {column: last_run_status, ops: ["=", "in"], fan_out: false, description: "success | failed | pending", examples: ['failed']}
      - {column: active, type: BOOLEAN, description: "true = running tests, false = paused"}
    pagination: {type: page, page_param: query.page, limit_param: query.perPage, page_size: 100, start: 1, max_pages: 5}
    response:
      rows_path: "$.tests[*]"
    columns:
      - {name: id, type: BIGINT, path: id}
      - {name: name, path: name}
      - {name: title, path: name}
      - {name: type, path: type}
