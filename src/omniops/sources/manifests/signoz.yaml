    response:
      rows_path: "$.data.attributes[*]"
    columns:
      - {name: key, path: key}
      - {name: value_count, type: BIGINT, path: valueCount}
      - {name: values, type: JSON, path: values}
      - {name: metric, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
