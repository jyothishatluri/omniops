    docs_url: https://signoz.io/api-reference/#/operations/GetMetricAttributes

  # ------------------------------------------------------------------------------------------
  - name: signoz_field_keys
    title: Field keys (logs, traces, metrics)
    description: >-
      Attribute / field names available for a signal with their context (resource, attribute,
      log, span) and data type: one row per (key, context, type). Filter on signal (logs default,
      traces, metrics), search (substring), metric (for metrics) and ts. Use when a filter on a
      key returns nothing.
    kind: entities
    request:
      method: GET
      path: /api/v1/fields/keys
      query:
        signal: "{{ filters.signal or 'logs' }}"
        searchText: "{{ filters.search }}"
        metricName: "{{ filters.metric }}"
        startUnixMilli: "{{ time.start | epoch_ms }}"
        endUnixMilli: "{{ time.end | epoch_ms }}"
        limit: "{{ [limit or 200, 1000] | min }}"
    filters:
      - {column: signal, description: "logs (default) | traces | metrics", examples: [logs]}
      - {column: search, description: "Substring of the key", examples: [status]}
      - {column: metric, description: "Metric name (signal = metrics)"}
    time: {column: ts, default_lookback: 6h, max_window: 31d}
    response:
      rows_path: "$.data.keys"
      expand:
        - {entries: ".", as: e}
        - {explode: "@e.value", as: k}
    columns:
      - {name: key, path: "@k.name"}
      - {name: field_context, path: "@k.fieldContext", description: "resource | attribute | log | span | scope | body"}
      - {name: field_data_type, path: "@k.fieldDataType", description: "string | number | float64 | int64 | bool"}
      - {name: signal, path: "@k.signal"}
      - {name: unit, path: "@k.unit"}
      - {name: description, path: "@k.description"}
      - {name: complete, type: BOOLEAN, path: "$.data.complete", description: "false = the list was truncated (narrow with search)"}
      - {name: search, filter_only: true}
      - {name: metric, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT key, field_context, field_data_type FROM signoz_field_keys WHERE signal = 'traces' AND search = 'status' ORDER BY key"
        description: Find the exact span attribute name for status codes (and whether it is string or number).
    fixtures:
      - file: field_keys.json
        note: "Built strictly from the GetFieldsKeys 200 schema (data{complete, keys{<name>: [TelemetryFieldKey]}}); key names from the integration test querierlogs/01_list.py."
        filters: {signal: logs}
        expect_rows: 3
        expect_columns: {key: service.name, field_context: resource, field_data_type: string, signal: logs, complete: true}
    docs_url: https://signoz.io/api-reference/#/operations/GetFieldsKeys

  # ------------------------------------------------------------------------------------------
  - name: signoz_field_values
    title: Values of a field
    description: >-
      Distinct values of one field (attribute / resource / top-level) for a signal in the window:
      one row per value. Filter on name (required, e.g. service.name, severity_text,
      k8s.namespace.name), signal (logs default, traces, metrics), search (substring),
      existing_query (only values co-occurring with this filter expression) and ts.
    kind: entities
    request:
      method: GET
      path: /api/v1/fields/values
      query:
        signal: "{{ filters.signal or 'logs' }}"
        name: "{{ filters.name }}"
        searchText: "{{ filters.search }}"
        existingQuery: "{{ filters.existing_query }}"
        metricName: "{{ filters.metric }}"
        startUnixMilli: "{{ time.start | epoch_ms }}"
        endUnixMilli: "{{ time.end | epoch_ms }}"
        limit: "{{ [limit or 200, 1000] | min }}"
    filters:
      - {column: name, required: true, description: "Field name", examples: [severity_text]}
      - {column: signal, description: "logs (default) | traces | metrics"}
      - {column: search, description: "Substring of the value"}
      - {column: existing_query, description: "Filter expression the values must co-occur with, e.g. service.name = 'checkout'"}
      - {column: metric, description: "Metric name (signal = metrics)"}
    time: {column: ts, default_lookback: 6h, max_window: 31d}
    response:
      rows_path: "$.data.values"
      expand:
        - {entries: ".", as: e}
        - {explode: "@e.value", as: v}
    columns:
      - {name: value, path: "@v", transform: str}
      - {name: value_type, path: "@e.key", description: "stringValues | numberValues | boolValues | relatedValues"}
      - {name: complete, type: BOOLEAN, path: "$.data.complete"}
      - {name: name, filter_only: true}
      - {name: signal, filter_only: true}
      - {name: search, filter_only: true}
      - {name: existing_query, filter_only: true}
      - {name: metric, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT value FROM signoz_field_values WHERE name = 'service.name' AND signal = 'traces' ORDER BY value"
        description: Exact service names seen in traces (before filtering by service).
      - sql: "SELECT value FROM signoz_field_values WHERE name = 'severity_text' AND existing_query = 'service.name = ''checkout'''"
        description: Which severity spellings a service actually emits.
    fixtures:
      - file: field_values.json
        note: "Built strictly from the GetFieldsValues 200 schema (data{complete, values{stringValues, numberValues, boolValues, relatedValues}}); severity_text values as asserted in querierlogs/01_list.py."
        filters: {name: severity_text, signal: logs}
        expect_rows: 2
        expect_columns: {value: DEBUG, value_type: stringValues, complete: true, name: severity_text}
    docs_url: https://signoz.io/api-reference/#/operations/GetFieldsValues

  # ------------------------------------------------------------------------------------------
  - name: signoz_hosts
    title: Hosts (infrastructure monitoring)
    description: >-
      Hosts reporting host metrics in the window with CPU %, memory %, I/O wait %, disk usage %,
      15-min load and active/inactive status (no metrics in the last 10 minutes = inactive). One
      row per host. Filter on host, env, status (active | inactive), query (filter expression on
      host attributes) and ts.
    kind: entities
    request:
      method: POST
      path: /api/v2/infra_monitoring/hosts
      body:
        start: "{{ time.start | epoch_ms }}"
        end: "{{ time.end | epoch_ms }}"
        filter:
          expression: >-
            {{ [
              ('(' ~ filters.query ~ ')') if filters.query else None,
              ('host.name IN (' ~ (filters.host | as_list | map('squote') | join(', ')) ~ ')') if filters.host else None,
              (env.SIGNOZ_ENV_ATTRIBUTE ~ ' IN (' ~ (filters.env | as_list | map('squote') | join(', ')) ~ ')') if filters.env else None
            ] | compact | join(' AND ') }}
          filterByStatus: "{{ filters.status or '' }}"
        limit: 200
        offset: 0
    filters:
      - {column: host, ops: ["=", "in"], fan_out: false, description: "Exact host.name", examples: [checkout-1.ec2.internal]}
      - {column: env, ops: ["=", "in"], fan_out: false, description: "Environment (SIGNOZ_ENV_ATTRIBUTE)"}
      - {column: status, description: "active | inactive", examples: [active]}
      - {column: query, description: "Filter expression on host attributes, e.g. os.type = 'linux'"}
    time: {column: ts, default_lookback: 30m, max_window: 7d}
    pagination: {type: offset, offset_param: body.offset, limit_param: body.limit, page_size: 200, total_path: "$.data.total", max_pages: 5}
    response:
      rows_path: "$.data.records[*]"
    columns:
      - {name: host, path: hostName}
      - {name: status, path: status, description: "active | inactive"}
      - {name: cpu_pct, type: DOUBLE, expr: "None if _.cpu == -1 else _.cpu", description: "CPU usage % (NULL = no data; the API sends -1)"}
      - {name: memory_pct, type: DOUBLE, expr: "None if _.memory == -1 else _.memory"}
      - {name: iowait_pct, type: DOUBLE, expr: "None if _.wait == -1 else _.wait"}
      - {name: disk_usage_pct, type: DOUBLE, expr: "None if _.diskUsage == -1 else _.diskUsage"}
      - {name: load15, type: DOUBLE, expr: "None if _.load15 == -1 else _.load15"}
      - {name: os_type, path: "meta['os.type']"}
      - {name: env, expr: "_.meta['deployment.environment'] or _.meta['deployment.environment.name']"}
      - {name: meta, type: JSON, path: meta}
      - {name: end_before_retention, type: BOOLEAN, path: "$.data.endTimeBeforeRetention", description: "true = the window is older than metric retention"}
      - {name: query, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Needs hostmetrics from the OTel collector; hosts without it are absent (not healthy)."
      - "Metric fields are -1 when no data: converted to NULL here."
    examples:
      - sql: "SELECT host, status, cpu_pct, memory_pct, disk_usage_pct, load15 FROM signoz_hosts ORDER BY cpu_pct DESC NULLS LAST LIMIT 20"
        description: Hottest hosts in the window, and which stopped reporting.
    fixtures:
      - file: hosts.json
        note: "Built strictly from the ListHosts 200 schema (data{type, records[], total, endTimeBeforeRetention}), -1 sentinel per its description; meta keys from the frontend story mock infraMonitoring.ts."
        expect_rows: 2
        expect_columns: {host: checkout-1.ec2.internal, status: active, cpu_pct: 91.4, os_type: linux, env: production, end_before_retention: false}
    ui_link: "{{ source.base_url }}/infrastructure-monitoring/hosts"
    docs_url: https://signoz.io/api-reference/#/operations/ListHosts

  # ------------------------------------------------------------------------------------------
  - name: signoz_pods
    title: Kubernetes pods (infrastructure monitoring)
    description: >-
      Kubernetes pods in the window with kubectl-style status (running, pending,
      crashloopbackoff, oomkilled, imagepullbackoff, ...), restarts, CPU and memory usage and
      request/limit utilisation, namespace, node, cluster and owning workload. One row per pod.
      Filter on namespace, pod, cluster, status (IN allowed), query and ts.
    kind: entities
    request:
      method: POST
      path: /api/v2/infra_monitoring/pods
      body:
        start: "{{ time.start | epoch_ms }}"
        end: "{{ time.end | epoch_ms }}"
        filter:
          expression: >-
            {{ [
              ('(' ~ filters.query ~ ')') if filters.query else None,
              ('k8s.namespace.name IN (' ~ (filters.namespace | as_list | map('squote') | join(', ')) ~ ')') if filters.namespace else None,
              ('k8s.pod.name IN (' ~ (filters.pod | as_list | map('squote') | join(', ')) ~ ')') if filters.pod else None,
              ('k8s.cluster.name IN (' ~ (filters.cluster | as_list | map('squote') | join(', ')) ~ ')') if filters.cluster else None
            ] | compact | join(' AND ') }}
          filterByPodStatus: "{{ filters.status | as_list if filters.status else None }}"
        limit: 200
        offset: 0
    filters:
      - {column: namespace, ops: ["=", "in"], fan_out: false, description: "Exact k8s.namespace.name", examples: [payments]}
      - {column: pod, ops: ["=", "in"], fan_out: false, description: "Exact k8s.pod.name"}
      - {column: cluster, ops: ["=", "in"], fan_out: false, description: "Exact k8s.cluster.name"}
      - {column: status, ops: ["=", "in"], fan_out: false, description: "Pod status: running, pending, failed, crashloopbackoff, oomkilled, imagepullbackoff, errimagepull, evicted, containercreating, completed, error, no_data, ...", examples: [crashloopbackoff]}
      - {column: query, description: "Filter expression on pod attributes, e.g. k8s.deployment.name = 'checkout'"}
    time: {column: ts, default_lookback: 30m, max_window: 7d}
    pagination: {type: offset, offset_param: body.offset, limit_param: body.limit, page_size: 200, total_path: "$.data.total", max_pages: 5}
    response:
      rows_path: "$.data.records[*]"
    columns:
      - {name: pod, path: "meta['k8s.pod.name']"}
      - {name: namespace, path: "meta['k8s.namespace.name']"}
      - {name: status, path: podStatus, description: "Latest kubectl-style status in the window"}
      - {name: restarts, type: BIGINT, expr: "None if _.podRestarts == -1 else _.podRestarts"}
      - {name: node, path: "meta['k8s.node.name']"}
      - {name: cluster, path: "meta['k8s.cluster.name']"}
      - {name: workload, expr: "_.meta['k8s.deployment.name'] or _.meta['k8s.statefulset.name'] or _.meta['k8s.daemonset.name'] or _.meta['k8s.job.name'] or _.meta['k8s.cronjob.name']"}
      - {name: kind, expr: "'Pod'"}
      - {name: cpu_cores, type: DOUBLE, expr: "None if _.podCPU == -1 else _.podCPU", description: "CPU usage (cores)"}
      - {name: cpu_request_util, type: DOUBLE, expr: "None if _.podCPURequest == -1 else _.podCPURequest", description: "CPU usage / request (1.0 = 100%)"}
      - {name: cpu_limit_util, type: DOUBLE, expr: "None if _.podCPULimit == -1 else _.podCPULimit", description: "CPU usage / limit"}
      - {name: memory_bytes, type: DOUBLE, expr: "None if _.podMemory == -1 else _.podMemory", description: "Memory working set (bytes)"}
      - {name: memory_request_util, type: DOUBLE, expr: "None if _.podMemoryRequest == -1 else _.podMemoryRequest"}
      - {name: memory_limit_util, type: DOUBLE, expr: "None if _.podMemoryLimit == -1 else _.podMemoryLimit", description: "Memory / limit (near 1.0 = OOMKill risk)"}
      - {name: age_ms, type: BIGINT, expr: "None if _.podAge == -1 else _.podAge"}
      - {name: uid, path: podUID}
      - {name: env, expr: "_.meta['deployment.environment'] or _.meta['deployment.environment.name']"}
      - {name: meta, type: JSON, path: meta}
      - {name: query, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Needs the k8s cluster / kubelet receivers (k8s-infra chart); pods are listed from metrics, so a pod that never reported is absent."
      - "Utilisation fields are ratios (1.0 = 100% of request/limit); -1 (no data) is converted to NULL."
    examples:
      - sql: "SELECT namespace, pod, status, restarts, memory_limit_util, node FROM signoz_pods WHERE namespace = 'payments' AND (status <> 'running' OR restarts > 0) ORDER BY restarts DESC"
        description: Unhealthy or restarting pods in a namespace.
      - sql: "SELECT pod, workload, memory_limit_util, cpu_limit_util FROM signoz_pods WHERE status IN ('oomkilled', 'crashloopbackoff') ORDER BY memory_limit_util DESC"
        description: Crash-looping / OOM-killed pods with their resource pressure.
    fixtures:
      - file: pods.json
        note: "Built strictly from the ListPods 200 schema (records[{podUID, podStatus, podAge, podCPU*, podMemory*, podRestarts, podCountsByStatus, meta}]); meta keys and values from the frontend story mock pages/InfrastructureMonitoring/stories/__story_mockdata__/infraMonitoring.ts."
        expect_rows: 2
        expect_columns: {pod: checkout-7d9f14-x4k2p, namespace: payments, status: crashloopbackoff, restarts: 8, node: ip-10-0-3-17, workload: checkout, kind: Pod, memory_limit_util: 0.94}
    ui_link: "{{ source.base_url }}/infrastructure-monitoring/kubernetes"
    docs_url: https://signoz.io/api-reference/#/operations/ListPods

  # ------------------------------------------------------------------------------------------
  - name: signoz_dashboards
    title: Dashboards
    description: Dashboards (name, description, tags, source, lock state, last editor). One row per dashboard. Filter on query (dashboard filter DSL, e.g. name contains checkout OR env = prod).
    kind: entities
    request:
      method: GET
      path: /api/v2/dashboards
      query:
        query: "{{ filters.query }}"
        sort: updated_at
        order: desc
    filters:
      - {column: query, description: "Dashboard list filter DSL: name contains prod, env = prod (tag), combined with AND / OR", examples: ["name contains checkout"]}
    pagination: {type: offset, offset_param: query.offset, limit_param: query.limit, page_size: 100, total_path: "$.data.total", max_pages: 5}
    response:
      rows_path: "$.data.dashboards[*]"
    columns:
      - {name: id, path: id}
      - {name: title, expr: "(_.spec.display.name if _.spec and _.spec.display else None) or _.name"}
      - {name: description, path: "spec.display.description"}
      - {name: tags, type: JSON, path: tags}
      - {name: source, path: source, description: "user | system | integration"}
      - {name: locked, type: BOOLEAN, path: locked}
      - {name: updated_at, type: TIMESTAMP, path: updatedAt}
      - {name: updated_by, path: updatedBy}
      - {name: url, expr: "'/dashboard/' ~ _.id", description: "Path of the dashboard (prefix SIGNOZ_URL)"}
      - {name: query, filter_only: true}
    examples:
      - sql: "SELECT title, url, updated_at FROM signoz_dashboards WHERE title ILIKE '%checkout%'"
        description: Dashboards about a service, to link in the investigation.
    fixtures:
      - file: dashboards.json
        note: "Built strictly from the ListDashboardsV2 200 schema (data{dashboards[], tags[], reservedKeywords[], total}). Values illustrative."
        expect_rows: 1
        expect_columns: {title: Checkout overview, source: user, locked: false, url: "/dashboard/019a1f6e-2c4b-7d1e-9a43-5f0b8c1d2e3f"}
    ui_link: "{{ source.base_url }}/dashboard"
    docs_url: https://signoz.io/api-reference/#/operations/ListDashboardsV2

  # ------------------------------------------------------------------------------------------
  - name: signoz_downtime_schedules
    title: Planned downtime (alert silencing) schedules
    description: >-
      Planned maintenance / downtime schedules that silence alert rules: one row per schedule with
      status (active, upcoming, expired), window, recurrence and the rule ids it covers. Filter on
      active = true. A silenced rule explains a missing page.
    kind: changes
    request:
      method: GET
      path: /api/v1/downtime_schedules
      query:
        active: "{{ 'true' if filters.active else None }}"
    filters:
      - {column: active, type: BOOLEAN, description: "true = only schedules active now"}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: id, path: id}
      - {name: title, path: name}
      - {name: description, path: description}
      - {name: status, path: status, description: "active | upcoming | expired"}
      - {name: kind, path: kind, description: "fixed | recurring"}
      - {name: ts, type: TIMESTAMP, path: "schedule.startTime"}
      - {name: end_ts, type: TIMESTAMP, path: "schedule.endTime"}
      - {name: timezone, path: "schedule.timezone"}
      - {name: recurrence, type: JSON, path: "schedule.recurrence"}
      - {name: alert_ids, type: JSON, path: alertIds, description: "Rule ids silenced (empty = all rules)"}
      - {name: author, path: createdBy}
      - {name: active, type: BOOLEAN, filter_only: true}
    examples:
      - sql: "SELECT title, status, ts, end_ts, alert_ids FROM signoz_downtime_schedules WHERE status IN ('active', 'upcoming')"
        description: Maintenance windows currently silencing (or about to silence) alerts.
    fixtures:
      - file: downtime_schedules.json
        note: "Built strictly from the ListDowntimeSchedules 200 schema (data[{id, name, kind, status, schedule{startTime, endTime, timezone, recurrence}, alertIds}]). Values illustrative."
        expect_rows: 1
        expect_columns: {title: payments DB maintenance, status: active, kind: fixed, ts: "2026-10-01T11:00:00Z", author: alice@signoz.io}
    docs_url: https://signoz.io/api-reference/#/operations/ListDowntimeSchedules

  # ------------------------------------------------------------------------------------------
  - name: signoz_exceptions
    title: Exceptions grouped by type (ClickHouse error index)
    description: >-
      Exceptions recorded on spans in the window, grouped by service, exception type and group
      id, with counts, first/last seen, a sample message and a sample trace id: one row per
      exception group (the SigNoz Exceptions page). Filter on service and ts. Runs a ClickHouse SQL
      query over signoz_traces.distributed_signoz_error_index_v2 through query_range v5.
    kind: events
    request:
      method: POST
      path: /api/v5/query_range
      body:
        schemaVersion: v1
        start: "{{ time.start | epoch_ms }}"
        end: "{{ time.end | epoch_ms }}"
        requestType: raw
        variables: {}
        compositeQuery:
          queries:
            - type: clickhouse_sql
              spec:
                name: exceptions
                query: >-
                  SELECT serviceName, exceptionType, groupID, any(exceptionMessage) AS exceptionMessage,
                  count() AS count, min(timestamp) AS first_seen, max(timestamp) AS last_seen,
                  any(traceID) AS sample_trace_id
                  FROM signoz_traces.distributed_signoz_error_index_v2
                  WHERE timestamp >= $start_datetime AND timestamp <= $end_datetime
                  {{ ('AND serviceName IN (' ~ (filters.service | as_list | map('squote') | join(', ')) ~ ')') if filters.service else '' }}
                  GROUP BY serviceName, exceptionType, groupID
                  ORDER BY count DESC LIMIT {{ [limit or 200, 1000] | min }}
    filters:
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Exact service name (serviceName)", examples: [checkout]}
    time: {column: ts, default_lookback: 1h, max_window: 7d}
    response:
      rows_path: "$.data.data.results[0].rows[*]"
    columns:
      - {name: service, path: "data.serviceName"}
      - {name: title, path: "data.exceptionType", description: "Exception type (class)"}
      - {name: message, path: "data.exceptionMessage", description: "A sample message of the group"}
      - {name: count, type: BIGINT, path: "data.count"}
      - {name: first_seen, type: TIMESTAMP, path: "data.first_seen"}
      - {name: last_seen, type: TIMESTAMP, path: "data.last_seen"}
      - {name: trace_id, path: "data.sample_trace_id", description: "A trace that raised it (signoz_trace)"}
      - {name: id, path: "data.groupID", description: "Exception group id"}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Only exceptions recorded as span events (exception.type / exception.message) are indexed; logged-only exceptions are in signoz_logs."
      - "The ClickHouse table layout is a SigNoz internal; if it changes the query fails loudly (status=error)."
    examples:
      - sql: "SELECT service, title, count, first_seen, message, trace_id FROM signoz_exceptions WHERE ts >= TIMESTAMP '2026-10-01 10:00:00' ORDER BY count DESC LIMIT 20"
        description: Most frequent exceptions around the incident and when each first appeared.
    fixtures:
      - file: exceptions_raw.json
        note: "Built strictly from the OpenAPI RawData schema for a clickhouse_sql raw query (rows[{data}]); columns are the aliases of this table's SQL over the documented distributed_signoz_error_index_v2 schema (Writing ClickHouse queries for traces docs). Values illustrative."
        expect_rows: 2
        expect_columns: {service: checkout, title: java.net.SocketTimeoutException, count: 412, first_seen: "2026-10-01T11:02:13.004Z", trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    docs_url: https://signoz.io/docs/userguide/writing-clickhouse-traces-query/

  # ------------------------------------------------------------------------------------------
  - name: signoz_ingestion_stats
    title: Ingestion health (row counts, last observed)
    description: >-
      Telemetry statistics: total stored rows and the last-observed timestamp of traces, logs and
      metrics, plus whether k8s/system metrics exist and other operational counters. One row per
      stat key. Use to tell a data gap (ingestion stopped) from a healthy quiet system.
    kind: generic
    request:
      method: GET
      path: /api/v1/stats
      timeout_s: 20
    response:
      rows_path: "$.data"
      expand:
        - {entries: ".", as: e}
    columns:
      - {name: key, path: "@e.key", description: "e.g. telemetry.logs.last_observed.time, telemetry.traces.count"}
      - {name: value, path: "@e.value", transform: str}
      - {name: ts, type: TIMESTAMP, expr: "e.value if e.key.endswith('last_observed.time') else None", transform: auto_time, description: "Parsed last-observed time for *.last_observed.time keys"}
    pitfalls:
      - "Runs full row counts on every call (10 s server timeout on big installs): call it once per investigation, not in loops."
      - "last_observed keys are absent when a signal has never been received; counts are totals over retained data, not windowed."
    examples:
      - sql: "SELECT key, ts FROM signoz_ingestion_stats WHERE key LIKE 'telemetry.%.last_observed.time' ORDER BY ts"
        description: When each signal was last received (is ingestion still flowing?).
    fixtures:
      - file: stats.json
        note: "Verbatim example response from the Stats API docs page (https://signoz.io/docs/telemetry-stats-api/)."
        expect_rows: 11
        expect_columns: {key: telemetry.traces.count, value: "4821934", ts: null}
    docs_url: https://signoz.io/docs/telemetry-stats-api/

roles:
  metrics:
    - table: signoz_metrics
      filters: {service: "{{ service or '' }}"}
      columns: {ts: ts, value: value, metric: metric, labels: labels, service: service}
      query_language: signoz_filter
      notes: "metric is required (signoz_metric_names lists them); counters need time_aggregation = 'rate'."
    - table: signoz_promql
      query_language: promql
      columns: {ts: ts, value: value, metric: metric, labels: labels}
  logs:
    table: signoz_logs
    filters:
      service: "{{ service or '' }}"
      env: "{{ env or '' }}"
      host: "{{ host or '' }}"
      namespace: "{{ namespace or '' }}"
      pod: "{{ pod or '' }}"
      error_only: "{{ true if error_only else '' }}"
      query: "{{ query or '' }}"
    columns: {ts: ts, service: service, message: message, level: level, host: host, trace_id: trace_id}
    query_language: signoz_filter
  log_counts:
    table: signoz_log_counts
    filters: {service: "{{ service or '' }}", error_only: "{{ true if error_only else '' }}", group_by: "{{ 'severity_text' if service else 'service.name' }}"}
    columns: {ts: ts, value: value, service: service, level: level}
  traces:
    table: signoz_spans
    filters: {service: "{{ service or '' }}", error_only: "{{ true if error_only else '' }}", env: "{{ env or '' }}"}
    columns: {ts: ts, service: service, trace_id: trace_id, span_id: span_id, duration_ms: duration_ms, resource: resource, status_code: status_code, message: status_message}
    query_language: signoz_filter
  trace_detail:
    table: signoz_trace
    columns: {ts: ts, trace_id: trace_id, span_id: span_id, service: service, duration_ms: duration_ms, resource: resource}
  services:
    table: signoz_services
    columns: {service: service, error_rate: error_rate, p99_ms: p99_ms}
  service_map:
    table: signoz_service_map
    columns: {source: source, target: target, calls: calls, error_rate: error_rate}
  hosts:
    table: signoz_hosts
    filters: {host: "{{ host or '' }}"}
    columns: {host: host, state: status}
  k8s_state:
    table: signoz_pods
    filters: {namespace: "{{ namespace or '' }}", pod: "{{ pod or '' }}"}
    columns: {pod: pod, namespace: namespace, kind: kind, phase: status, restarts: restarts, node: node, service: workload}
    notes: "status is the kubectl-style display status (running, crashloopbackoff, oomkilled, ...)."
  active_alerts:
    table: signoz_alerts
    filters: {state: active}
    columns: {id: rule_id, name: title, ts: ts, state: state, severity: severity, service: service, labels: labels, url: url}
  alert_rules:
    - table: signoz_rule
      filters: {rule_id: "{{ rule_id or '' }}"}
      columns: {id: rule_id, name: name, query: query, threshold: threshold, state: state}
      notes: "Needs the rule UUID (the ruleId label of the alert)."
    - table: signoz_rules
      columns: {id: rule_id, name: name, state: state}
  alert_history:
    table: signoz_rule_history
    filters: {rule_id: "{{ rule_id or '' }}"}
    columns: {ts: ts, name: title, state: state, value: value, service: service, labels: labels}
  errors:
    table: signoz_exceptions
    filters: {service: "{{ service or '' }}"}
    columns: {ts: last_seen, service: service, title: title, message: message, id: id}
  dashboards:
    table: signoz_dashboards
    columns: {title: title, url: url, id: id}
