    examples:
      - sql: "SELECT ts, ended_at, value, normal_upper FROM honeycomb_signal_anomalies WHERE signal_id = 'hcasp_01j9x1yq0k2t8m9n3v4b5r6c7d' ORDER BY ts DESC"
        description: Has this service had similar anomalies recently?
    fixtures:
      - file: historical_anomalies.json
        expect_rows: 1
        expect_columns: {ts: "2025-03-04T12:00:00Z", duration_s: 3600, value: 0.42, normal_upper: 0.08}
        note: "Built strictly from the PaginatedHistoricalAnomaliesResponse / HistoricalAnomaly schema of the official OpenAPI spec and its property examples (docs.honeycomb.io/api/anomaly-detection/list-historical-anomalies)."
    docs_url: https://docs.honeycomb.io/api/anomaly-detection/list-historical-anomalies

  - name: honeycomb_service_map
    title: Service dependencies (service map)
    description: >-
      Service-to-service call edges observed in traces over the ts window: parent (caller), child
      (callee), call_count. Filter service (only edges touching that service; an IN list is sent
      as several service nodes in ONE map request) and ts. Implemented as POST
      /1/maps/dependencies/requests (start_time/end_time epoch seconds, filters [{name, type:
      service}]) then polling GET /1/maps/dependencies/requests/{id} until status != pending and
      following links.next (page[size] 100).
    kind: entities
    steps:
      - name: create
        method: POST
        path: /1/maps/dependencies/requests
        query: {limit: "{{ [limit or 10000, 64000] | min }}"}
        headers: {Content-Type: application/json}
        body_format: text
        body: >-
          {"start_time": {{ time.start | epoch_s }}, "end_time": {{ time.end | epoch_s }}{% if filters.service %}, "filters": [{% for s in (filters.service | as_list) %}{"name": {{ s | string | tojson }}, "type": "service"}{{ ', ' if not loop.last }}{% endfor %}]{% endif %}}
        capture: {request_id: "$.request_id"}
      - name: results
        method: GET
        path: "/1/maps/dependencies/requests/{{ captures.request_id }}"
        query: {"page[size]": 100}
        poll: {until: "response.status != 'pending'", interval_s: 1, timeout_s: 40}
    filters:
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Only dependencies involving these service node names (one request, all nodes)", examples: ["user-service"]}
    time: {column: ts, default_lookback: 2h, max_window: 7d, reapply: false}
    pagination: {type: next_url, next_url_path: "$.links.next", max_pages: 10}
    response:
      rows_path: "$.dependencies[*]"
      errors:
        - {path: "$.status", equals: error, message: "$.status", hint: "the service map request failed (status error); retry with a shorter window"}
    columns:
      - {name: parent_service, path: "parent_node.name", description: "Caller"}
      - {name: child_service, path: "child_node.name", description: "Callee"}
      - {name: call_count, type: BIGINT, path: call_count}
      - {name: parent_type, path: "parent_node.type"}
      - {name: child_type, path: "child_node.type"}
      - {name: service, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Needs a key with the Read Service Maps permission. Edges come from trace parent/child spans across services: a service that is not instrumented (or whose spans are dropped by sampling) has no edges."
      - "call_count is the number of calls in the window (not a rate); compare windows of equal length."
      - "status error is HTTP 200 with dependencies null (declared as an error rule)."
    examples:
      - sql: "SELECT parent_service, child_service, call_count FROM honeycomb_service_map WHERE service = 'checkout-api' ORDER BY call_count DESC"
        description: Upstream callers and downstream dependencies of a service.
      - sql: >-
          SELECT parent_service AS caller, call_count FROM honeycomb_service_map
          WHERE service IN ('payments-api', 'checkout-api')
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
            AND child_service = 'payments-api'
          ORDER BY call_count DESC
        description: Who called the failing payments service during the incident hour.
    fixtures:
      - file: map_dependencies.json
        expect_rows: 1
        expect_columns: {parent_service: frontend, child_service: user-service, call_count: 142}
        note: "Built strictly from the GetMapDependenciesResponse / MapDependency / MapNode schema of the official OpenAPI spec and its property examples (docs.honeycomb.io/api/service-maps/get-map-dependencies)."
      - file: map_dependencies_error.json
        expect_error: "service map request failed"
        note: "Built strictly from the GetMapDependenciesResponse schema: status 'error' with dependencies null is returned with HTTP 200 (create-a-map-dependency-request: '200: results are ready, or the request failed. Check status')."
    docs_url: https://docs.honeycomb.io/api/service-maps/get-map-dependencies

  - name: honeycomb_boards
    title: Boards
    description: >-
      Boards (dashboards) of the environment with their panels (query ids, SLO ids, text). One row
      per board; panels as JSON. Use it to find the team's curated view of a service.
    kind: entities
    request: {method: GET, path: /1/boards}
    response: {rows_path: "$"}
    columns:
      - {name: id, path: id}
      - {name: title, path: name}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: type, path: type}
      - {name: panels, type: JSON, path: panels, description: "query_panel.query_id / slo_panel.slo_id / text_panel.content"}
      - {name: panel_count, type: BIGINT, path: panels, transform: length}
      - {name: tags, type: JSON, path: tags}
      - {name: url, path: "links.board_url"}
      - {name: layout_generation, path: layout_generation}
    examples:
      - sql: "SELECT id, title, description, panel_count, url FROM honeycomb_boards WHERE title ILIKE '%checkout%' OR description ILIKE '%checkout%'"
        description: Find boards about a service.
    fixtures:
      - file: boards.json
        expect_rows: 2
        expect_columns: {id: abc123, title: "Production Monitoring", panel_count: 2, type: flexible}
        note: "Official docs example 'Mixed Board Types' of GET /1/boards (docs.honeycomb.io/api/boards/list-all-boards)."
    docs_url: https://docs.honeycomb.io/api/boards/list-all-boards

roles:
  traces:
    table: honeycomb_query
    filters:
      dataset: "__all__"
      service: "{{ service }}"
      calculations: "MAX(duration_ms), COUNT"
      breakdowns: "trace.trace_id, name, service.name"
      filter_expr: "{{ 'error = true' if error_only else 'trace.parent_id does-not-exist' }}"
    columns: {trace_id: trace_id, service: service, duration_ms: value, url: url}
    query_language: honeycomb_query
    notes: "Aggregated per trace (no raw span listing API): top traces by MAX(duration_ms); one query-result creation (10/min)."
  trace_detail:
    table: honeycomb_query
    filters:
      dataset: "__all__"
      calculations: "MAX(duration_ms)"
      breakdowns: "trace.span_id, trace.parent_id, service.name, name"
      orders: "MAX(duration_ms) desc"
    columns: {trace_id: trace_id, service: service, duration_ms: value, url: url}
    query_language: honeycomb_query
    notes: "Filter trace_id = '<id>': one row per span (span id, parent, service, name, duration)."
  metrics:
    table: honeycomb_query_series
    filters:
      dataset: "__all__"
      service: "{{ service }}"
      filter_expr: "{{ 'error = true' if error_only else '' }}"
    columns: {ts: ts, value: value, labels: data}
    query_language: honeycomb_query
    notes: "COUNT (default) or any calculation over spans/events as a time series."
  change_events:
    table: honeycomb_markers
    filters:
      dataset: "{{ [service, '__all__'] if service else '__all__' }}"
    columns: {ts: ts, service: service, title: title, url: url, type: type}
  alert_rules:
    table: honeycomb_triggers
    filters:
      dataset: "{{ [service, '__all__'] if service else '__all__' }}"
    columns: {id: id, name: name, query: query, threshold: threshold, state: state}
  active_alerts:
    table: honeycomb_signals
    filters:
      service: "{{ service }}"
      currently_anomalous: "{{ true }}"
    columns: {name: measured_signal, service: service, state: status, ts: last_anomaly_started_at}
    notes: "Anomalous Anomaly Detection signals (server-side filter). Firing triggers: honeycomb_triggers WHERE triggered (no server-side filter, so not bound here)."
  slo:
    table: honeycomb_slos
    filters: {dataset: "__all__"}
    columns: {id: slo_id, name: name, target: target_pct}
    notes: "Live compliance / budget / burn rate: honeycomb_slo_status WHERE slo_id = ...; history: honeycomb_slo_history; hourly / per-minute good-vs-bad event counts: honeycomb_slo_hourly_counts / honeycomb_slo_counts (Enterprise); burn alerts: honeycomb_burn_alerts"
  service_map:
    table: honeycomb_service_map
    filters: {service: "{{ service }}"}
    columns: {service: parent_service, calls: child_service, value: call_count}
  services:
    table: honeycomb_datasets
    columns: {service: service, ts: last_written_at}
  dashboards:
    table: honeycomb_boards
    columns: {id: id, title: title, url: url}
