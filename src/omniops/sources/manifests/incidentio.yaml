      query:
        incident_id: "{{ filters.incident_id }}"
        alert_id: "{{ filters.alert_id }}"
        page_size: 50
    filters:
      - {column: incident_id, ops: ["=", "in"], max_fan_out: 20, description: "Incident ID", examples: [01FDAG4SAP5TYPT98WGR2N7W91]}
      - {column: alert_id, ops: ["=", "in"], max_fan_out: 20, description: "Alert ID", examples: [01GW2G3V0S59R238FAHPDS1R66]}
    require_one_of: [[incident_id, alert_id]]
    pagination: {type: cursor, cursor_path: "$.pagination_meta.after", cursor_param: query.after, max_pages: 5}
    response:
      rows_path: "$.incident_alerts[*]"
    columns:
      - {name: id, path: id}
      - {name: incident_id, path: incident.id}
      - {name: incident_reference, path: incident.reference}
      - {name: incident_title, path: incident.name}
      - {name: incident_status_category, path: incident.status_category}
      - {name: alert_id, path: alert.id}
      - {name: ts, type: TIMESTAMP, path: alert.created_at, description: "Alert creation time"}
      - {name: title, path: alert.title, description: "Alert title"}
      - {name: alert_status, path: alert.status}
      - {name: deduplication_key, path: alert.deduplication_key}
      - {name: alert_route_id, path: alert_route_id}
      - {name: url, path: alert.source_url}
    examples:
      - sql: "SELECT ts, title, alert_status, url FROM incidentio_incident_alerts WHERE incident_id = '01FDAG4SAP5TYPT98WGR2N7W91' ORDER BY ts"
        description: Alerts attached to the incident.
    fixtures:
      - file: incident_alerts.json
        filters: {incident_id: 01FDAG4SAP5TYPT98WGR2N7W91}
        expect_rows: 1
        expect_columns: {incident_reference: INC-123, incident_title: "Our database is sad", alert_id: 01GW2G3V0S59R238FAHPDS1R66, title: "*errors.withMessage: PG::Error failed to connect", alert_status: firing}
        note: "Official 200 response example of GET /v2/incident_alerts (Alerts V2 ListIncidentAlerts; incident-alerts-v2.json), verbatim."
    docs_url: https://docs.incident.io/api-reference/incident-alerts-v2/list

  - name: incidentio_escalations
    title: Escalations (pages to on-call)
    description: >-
      One row per escalation (a page sent through an escalation path). Without incident / alert
      filters: escalations created in the ts window (created_at[gte] / [lte]). Optional status
      (pending | triggered | acked | resolved | expired | cancelled; IN), incident_id, alert_id,
      escalation_path_id. events holds the notification / ack history.
    kind: events
    request:
      method: GET
      path: /v2/escalations
      query:
        "created_at[gte]": "{{ None if (filters.incident_id or filters.alert_id) else (time.start | rfc3339) }}"
        "created_at[lte]": "{{ None if (filters.incident_id or filters.alert_id) else (time.end | rfc3339) }}"
        "status[one_of]": "{{ filters.status | as_list }}"
        "incident[one_of]": "{{ filters.incident_id | as_list }}"
        "alert[one_of]": "{{ filters.alert_id | as_list }}"
        "escalation_path[one_of]": "{{ filters.escalation_path_id | as_list }}"
        page_size: 50
    filters:
      - {column: status, ops: ["=", "in"], fan_out: false, description: "pending | triggered | acked | resolved | expired | cancelled", examples: [triggered]}
      - {column: incident_id, ops: ["=", "in"], fan_out: false, description: "Incident ID(s) the escalation relates to", examples: [01FDAG4SAP5TYPT98WGR2N7W91]}
      - {column: alert_id, ops: ["=", "in"], fan_out: false, description: "Alert ID(s) that created the escalation", examples: [01GW2G3V0S59R238FAHPDS1R66]}
      - {column: escalation_path_id, ops: ["=", "in"], fan_out: false, description: "Escalation path ID(s)", examples: [01G0J1EXE7AXZ2C93K61WBPYEH]}
    time: {column: ts, default_lookback: 24h, max_window: 90d}
    pagination: {type: cursor, cursor_path: "$.pagination_meta.after", cursor_param: query.after, max_pages: 10}
    response:
      rows_path: "$.escalations[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: created_at}
      - {name: id, path: id}
      - {name: title, path: title}
      - {name: description, path: description}
      - {name: status, path: status}
      - {name: priority, path: priority.name}
      - {name: escalation_path_id, path: escalation_path_id}
      - {name: incident_refs, type: JSON, path: "related_incidents[*].reference"}
      - {name: incident_id, expr: "((_.related_incidents or []) | map(attribute='id') | first)", description: "First related incident ID"}
      - {name: alert_id, expr: "((_.related_alerts or []) | map(attribute='id') | first)", description: "First related alert ID"}
      - {name: notified_users, type: JSON, path: "events[*].users[*].name", description: "Users named in escalation events"}
      - {name: events, type: JSON, path: events, description: "[{event, occurred_at, urgency, users, channels}]"}
      - {name: updated_at, type: TIMESTAMP, path: updated_at}
    pitfalls:
      - "An escalation relates to an incident if linked directly, attached to one of its alerts, or if it triggered one of them."
      - "Needs an API key with 'View data' or 'Create and manage on-call resources'."
    examples:
      - sql: >-
          SELECT ts, title, status, priority, notified_users FROM incidentio_escalations
          WHERE ts BETWEEN TIMESTAMP '2026-10-01 02:00:00' AND TIMESTAMP '2026-10-01 04:00:00' ORDER BY ts
        description: Who was paged during the night, and whether they acknowledged.
      - sql: "SELECT ts, status, events FROM incidentio_escalations WHERE incident_id = '01FDAG4SAP5TYPT98WGR2N7W91'"
        description: Paging history of one incident.
    fixtures:
      - file: escalations.json
        expect_rows: 1
        expect_columns: {ts: "2021-08-17T13:28:57.801578Z", id: 01G0J1EXE7AXZ2C93K61WBPYEH, title: "Database CPU is high", status: pending, priority: P1, incident_refs: '["INC-123"]', incident_id: 01FDAG4SAP5TYPT98WGR2N7W91, alert_id: 01GW2G3V0S59R238FAHPDS1R66, notified_users: '["Lisa Karlin Curtis"]'}
        note: "Official 200 response example of GET /v2/escalations (Escalations V2 List; escalations-v2.json), verbatim."
    docs_url: https://docs.incident.io/api-reference/escalations-v2/list

  - name: incidentio_maintenance_windows
    title: Maintenance windows (alerts that will not page)
    description: >-
      One row per maintenance window (GET /v1/maintenance_windows): name, start/end, the alert
      conditions it matches, lead, linked incident and owning teams. While a window is active it
      overrides alert routing for matching alerts: they are held (no escalation, no incident),
      attached to incident_id, or escalated only to the window's escalation targets - so check it
      when an expected page or incident is missing. Optional state = active | upcoming | past
      (pushed down as status). No time pushdown: compare start_at / end_at with the alert time in
      SQL.
    kind: events
    request:
      method: GET
      path: /v1/maintenance_windows
      query:
        status: "{{ filters.state }}"
        page_size: 50
    filters:
      - {column: state, description: "active | upcoming | past (omit for all)", examples: [active]}
    pagination: {type: cursor, cursor_path: "$.pagination_meta.after", cursor_param: query.after, max_pages: 10}
    response:
      rows_path: "$.maintenance_windows[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: start_at, description: "Window start (same as start_at)"}
      - {name: id, path: id}
      - {name: title, path: name}
      - {name: start_at, type: TIMESTAMP, path: start_at}
      - {name: end_at, type: TIMESTAMP, path: end_at}
      - {name: incident_id, path: incident_id, description: "If set, matching alerts are attached to this incident"}
      - {name: escalation_targets, type: JSON, path: escalation_targets, description: "If set, matching alerts are escalated only to these paths / users"}
      - {name: lead, expr: "(_.lead.user.name if _.lead and _.lead.user else (_.lead.workflow.name if _.lead and _.lead.workflow else (_.lead.api_key.name if _.lead and _.lead.api_key else None)))"}
      - {name: message, path: notification_message}
      - {name: alert_conditions, type: JSON, path: alert_condition_groups, description: "Which alerts the window applies to"}
      - {name: owning_team_ids, type: JSON, path: owning_team_ids}
      - {name: resolve_on_end, type: BOOLEAN, path: resolve_on_end, description: "Held alerts are resolved when the window ends"}
      - {name: reroute_on_end, type: BOOLEAN, path: reroute_on_end, description: "Still-firing alerts are re-routed (and may page) when the window ends"}
      - {name: archived_at, type: TIMESTAMP, path: archived_at}
      - {name: created_at, type: TIMESTAMP, path: created_at}
      - {name: state, filter_only: true}
    examples:
      - sql: >-
          SELECT title, start_at, end_at, lead, alert_conditions FROM incidentio_maintenance_windows
          WHERE start_at <= TIMESTAMP '2026-10-01 11:00:00' AND end_at >= TIMESTAMP '2026-10-01 11:00:00'
        description: Was a maintenance window covering the alert time (explains a missing page)?
      - sql: "SELECT title, start_at, end_at, message FROM incidentio_maintenance_windows WHERE state = 'active'"
        description: Maintenance in progress right now.
    fixtures:
      - file: maintenance_windows.json
        expect_rows: 1
        expect_columns: {id: 01FCNDV6P870EA6S7TK1DSYDG0, title: "Planned database migration", start_at: "2021-08-17T13:28:57.801578Z", end_at: "2021-08-17T14:28:57.801578Z", incident_id: 01FCNDV6P870EA6S7TK1DSYDG0, lead: "Lisa Karlin Curtis", message: "Scheduled downtime for database migration", owning_team_ids: '["01G0J1EXE7AXZ2C93K61WBPYEH"]', resolve_on_end: false}
        note: "Official 200 response example of GET /v1/maintenance_windows (MaintenanceWindows V1 List; incident.io OpenAPI spec), verbatim."
    docs_url: https://docs.incident.io/api-reference/maintenancewindows-v1/list

  # ----------------------------------------------------------------------------------------------
  # On-call
  # ----------------------------------------------------------------------------------------------
  - name: incidentio_oncall_now
    title: Who is on call now (current shifts of every schedule)
    description: >-
      One row per current shift of every on-call schedule (GET /v2/schedules, current_shifts):
      schedule, user, shift start/end, rotation. Current state at query time (no time window);
      for a past moment use incidentio_schedule_entries.
    kind: entities
    request:
      method: GET
      path: /v2/schedules
      query:
        page_size: 25
    pagination: {type: cursor, cursor_path: "$.pagination_meta.after", cursor_param: query.after, max_pages: 10}
    response:
      rows_path: "$.schedules[*]"
      expand:
        - {explode: current_shifts, as: s}
    columns:
      - {name: schedule, path: name}
      - {name: schedule_id, path: id}
      - {name: user, path: "@s.user.name"}
      - {name: email, path: "@s.user.email"}
      - {name: user_id, path: "@s.user.id"}
      - {name: start_at, type: TIMESTAMP, path: "@s.start_at"}
      - {name: end_at, type: TIMESTAMP, path: "@s.end_at"}
      - {name: rotation_id, path: "@s.rotation_id"}
      - {name: timezone, path: timezone}
      - {name: team_ids, type: JSON, path: team_ids}
      - {name: url, path: permalink}
    examples:
      - sql: "SELECT schedule, user, email, end_at FROM incidentio_oncall_now ORDER BY schedule"
        description: Who to page right now, per schedule.
    fixtures:
      - file: schedules.json
        expect_rows: 1
        expect_columns: {schedule: "Primary On-Call Schedule", schedule_id: 01G0J1EXE7AXZ2C93K61WBPYEH, user: "Lisa Karlin Curtis", email: "lisa@incident.io", start_at: "2021-08-17T13:28:57.801578Z", timezone: Europe/London}
        note: "Official 200 response example of GET /v2/schedules (Schedules V2 List; schedules-v2.json), verbatim."
    docs_url: https://docs.incident.io/api-reference/schedules-v2/list

  - name: incidentio_schedules
    title: On-call schedules
    description: One row per schedule with its rotations config, current and next on-call users (next_shifts are only returned with page_size <= 25, which is used here).
    kind: entities
    request:
      method: GET
      path: /v2/schedules
      query:
        page_size: 25
    pagination: {type: cursor, cursor_path: "$.pagination_meta.after", cursor_param: query.after, max_pages: 10}
    response:
      rows_path: "$.schedules[*]"
    columns:
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: timezone, path: timezone}
      - {name: current_on_call, type: JSON, path: "current_shifts[*].user.name"}
      - {name: next_on_call, type: JSON, path: "next_shifts[*].user.name"}
      - {name: rotations, type: JSON, path: config.rotations}
      - {name: team_ids, type: JSON, path: team_ids}
      - {name: created_at, type: TIMESTAMP, path: created_at}
      - {name: updated_at, type: TIMESTAMP, path: updated_at}
