        expect_rows: 1
        expect_columns: {id: 01G0J1EXE7AXZ2C93K61WBPYEH, name: "Primary On-Call Schedule", current_on_call: '["Lisa Karlin Curtis"]', url: "https://app.incident.io/acme/on-call/schedules/01G0J1EXE7AXZ2C93K61WBPYEH"}
        note: "Official 200 response example of GET /v2/schedules (Schedules V2 List; schedules-v2.json), verbatim."
    docs_url: https://docs.incident.io/api-reference/schedules-v2/list

  - name: incidentio_schedule_entries
    title: Rendered on-call entries of a schedule (who was on call when)
    description: >-
      The schedule's FINAL entries (after overrides) overlapping the ts window (GET
      /v2/schedule_entries, entry_window_start / entry_window_end RFC3339): one row per (user,
      start, end, rotation). schedule_id required (IN up to 10). Use it to find who was on call
      when an incident fired. The ts predicate selects the window and is not re-applied.
    kind: entities
    request:
      method: GET
      path: /v2/schedule_entries
      query:
        schedule_id: "{{ filters.schedule_id }}"
        entry_window_start: "{{ time.start | rfc3339 }}"
        entry_window_end: "{{ time.end | rfc3339 }}"
    filters:
      - {column: schedule_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Schedule ID (incidentio_schedules.id)", examples: [01FDAG4SAP5TYPT98WGR2N7W91]}
    time: {column: ts, default_lookback: 24h, max_window: 90d, reapply: false}
    pagination: {type: next_url, next_url_path: "$.pagination_meta.after_url", max_pages: 10}
    response:
      rows_path: "$.schedule_entries.final[*]"
    columns:
      - {name: user, path: user.name}
      - {name: email, path: user.email}
      - {name: user_id, path: user.id}
      - {name: start_at, type: TIMESTAMP, path: start_at}
      - {name: end_at, type: TIMESTAMP, path: end_at}
      - {name: rotation_id, path: rotation_id}
      - {name: entry_id, path: entry_id}
      - {name: schedule_id, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Only the `final` list is returned (rotation entries with overrides applied); entries of every rotation and layer appear, so several users can be on call at once (primary / secondary)."
    examples:
      - sql: >-
          SELECT user, rotation_id, start_at, end_at FROM incidentio_schedule_entries
          WHERE schedule_id = '01FDAG4SAP5TYPT98WGR2N7W91' AND ts BETWEEN TIMESTAMP '2026-10-01 03:00:00' AND TIMESTAMP '2026-10-01 03:05:00'
        description: Who was on call at 03:00 UTC.
    fixtures:
      - file: schedule_entries.json
        filters: {schedule_id: 01FDAG4SAP5TYPT98WGR2N7W91}
        expect_rows: 1
        expect_columns: {user: "Lisa Karlin Curtis", email: "lisa@incident.io", start_at: "2021-08-17T13:28:57.801578Z", rotation_id: 01G0J1EXE7AXZ2C93K61WBPYEH, schedule_id: 01FDAG4SAP5TYPT98WGR2N7W91}
        note: "Official 200 response example of GET /v2/schedule_entries (Schedules V2 ListScheduleEntries; schedule-entries-v2.json), verbatim."
    docs_url: https://docs.incident.io/api-reference/schedule-entries-v2/list

  - name: incidentio_schedule_overrides
    title: Schedule overrides (shift swaps / cover)
    description: >-
      One row per override on a schedule (GET /v2/schedule_overrides): who covered which
      rotation layer, from when to when. schedule_id required (IN up to 10); optional
      rotation_id / layer_id. Archived overrides are not returned. No time pushdown: filter
      start_at / end_at in SQL. Explains why the usual person was not the one paged; the merged
      result is incidentio_schedule_entries.
    kind: entities
    request:
      method: GET
      path: /v2/schedule_overrides
      query:
        schedule_id: "{{ filters.schedule_id }}"
        rotation_id: "{{ filters.rotation_id }}"
        layer_id: "{{ filters.layer_id }}"
        page_size: 250
    filters:
      - {column: schedule_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Schedule ID (incidentio_schedules.id)", examples: [01G0J1EXE7AXZ2C93K61WBPYEH]}
      - {column: rotation_id, description: "Only overrides on this rotation", examples: [01G0J1EXE7AXZ2C93K61WBPYEH]}
      - {column: layer_id, description: "Only overrides on this layer", examples: [01G0J1EXE7AXZ2C93K61WBPYEH]}
    pagination: {type: cursor, cursor_path: "$.pagination_meta.after", cursor_param: query.after, max_pages: 5}
    response:
      rows_path: "$.overrides[*]"
    columns:
      - {name: id, path: id}
      - {name: schedule_id, path: schedule_id}
      - {name: rotation_id, path: rotation_id}
      - {name: layer_id, path: layer_id}
      - {name: user, path: user.name, description: "Who covers the shift"}
      - {name: email, path: user.email}
      - {name: user_id, path: user.id}
      - {name: start_at, type: TIMESTAMP, path: start_at}
      - {name: end_at, type: TIMESTAMP, path: end_at}
      - {name: created_at, type: TIMESTAMP, path: created_at}
    examples:
      - sql: >-
          SELECT user, start_at, end_at, rotation_id FROM incidentio_schedule_overrides
          WHERE schedule_id = '01G0J1EXE7AXZ2C93K61WBPYEH' AND end_at >= TIMESTAMP '2026-10-01 00:00:00' ORDER BY start_at
        description: Overrides in force on or after the incident day.
    fixtures:
      - file: schedule_overrides.json
        filters: {schedule_id: 01G0J1EXE7AXZ2C93K61WBPYEH}
        expect_rows: 1
        expect_columns: {id: 01G0J1EXE7AXZ2C93K61WBPYEH, schedule_id: 01G0J1EXE7AXZ2C93K61WBPYEH, user: "Lisa Karlin Curtis", email: "lisa@incident.io", start_at: "2021-08-17T13:28:57.801578Z", end_at: "2021-08-17T13:28:57.801578Z"}
        note: "Official 200 response example of GET /v2/schedule_overrides (Schedules V2 ListOverrides; incident.io OpenAPI spec), verbatim."
    docs_url: https://docs.incident.io/api-reference/schedule-overrides-v2/list

