        note: "Official example response of GET /service_dependencies/technical_services/{id} (operation getTechnicalServiceServiceDependencies, PagerDuty OpenAPI api-schema)."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/service-dependencies/get-technical-service-service-dependencies

  - name: pagerduty_business_services
