    response:
      rows_path: "$.priorities[*]"
    columns:
      - {name: id, path: id}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: rank, type: BIGINT, expr: "_i + 1", description: "Position in PagerDuty's order (1 = most severe), within the first page"}
    examples:
      - sql: "SELECT rank, name, description FROM pagerduty_priorities ORDER BY rank"
        description: What P1..P5 mean in this account.
    fixtures:
      - file: priorities.json
        expect_rows: 5
        expect_columns: {id: PSLWBL8, name: P1, rank: 1}
        note: "Official example response of GET /priorities (operation listPriorities, PagerDuty OpenAPI api-schema)."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/priorities/list-priorities

  # ----------------------------------------------------------------------------------------------
  # Insights analytics
  # ----------------------------------------------------------------------------------------------
  - name: pagerduty_analytics_incidents
    title: Incident metrics (Insights raw data)
    description: >-
      Enriched per-incident metrics for incidents created in the ts window (filters.created_at_start
      / created_at_end): seconds to first ack / engage / mobilize / resolve, escalation and
      reassignment counts, interruptions, engaged users, major flag. Optional service_id /
      team_id / priority (name) IN lists, urgency (high | low), major (true/false). POST
      /analytics/raw/incidents, newest first, cursor-paginated (starting_after). Data lags up to
      ~24h.
    kind: incidents
    request:
      method: POST
      path: /analytics/raw/incidents
      body:
        filters:
          created_at_start: "{{ time.start | rfc3339 }}"
          created_at_end: "{{ time.end | rfc3339 }}"
          service_ids: "{{ (filters.service_id | as_list) or None }}"
          team_ids: "{{ (filters.team_id | as_list) or None }}"
          priority_names: "{{ (filters.priority | as_list) or None }}"
          urgency: "{{ filters.urgency }}"
          major: "{{ ((filters.major | string | lower) in ['true', '1']) if (filters.major is defined and filters.major is not none) else None }}"
        limit: 1000
        order: desc
        order_by: created_at
        time_zone: Etc/UTC
    filters:
      - {column: service_id, ops: ["=", "in"], fan_out: false, description: "Service ID(s) (required for user-level API keys, or team_id)", examples: [PPSCXAN]}
      - {column: team_id, ops: ["=", "in"], fan_out: false, description: "Team ID(s)", examples: [P3XUQ75]}
      - {column: priority, ops: ["=", "in"], fan_out: false, description: "Priority name(s), e.g. P1", examples: [P1]}
      - {column: urgency, description: "high | low", examples: [high]}
      - {column: major, type: BOOLEAN, description: "Only major incidents (true) or exclude them (false)", examples: ["true"]}
    time: {column: ts, default_lookback: 30d, max_window: 365d}
    pagination: {type: cursor, cursor_path: "$.last", cursor_param: body.starting_after, has_more_path: "$.more", max_pages: 5}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: created_at, description: "Creation time (UTC; the API renders it without offset in time_zone Etc/UTC)"}
      - {name: id, path: id}
      - {name: incident_number, type: BIGINT, path: incident_number}
      - {name: title, path: description}
      - {name: status, path: status}
      - {name: urgency, path: urgency}
      - {name: priority, path: priority_name}
      - {name: major, type: BOOLEAN, path: major}
      - {name: service, path: service_name}
      - {name: service_id, path: service_id}
      - {name: team, path: team_name}
      - {name: team_id, path: team_id}
      - {name: escalation_policy, path: escalation_policy_name}
      - {name: resolved_at, type: TIMESTAMP, path: resolved_at}
      - {name: resolved_by, path: resolved_by_user_name}
      - {name: seconds_to_first_ack, type: DOUBLE, path: seconds_to_first_ack, description: "MTTA input"}
      - {name: seconds_to_engage, type: DOUBLE, path: seconds_to_engage}
      - {name: seconds_to_mobilize, type: DOUBLE, path: seconds_to_mobilize}
      - {name: seconds_to_resolve, type: DOUBLE, path: seconds_to_resolve, description: "MTTR input"}
      - {name: duration_ms, type: DOUBLE, path: seconds_to_resolve, transform: s_to_ms, description: "Time to resolve in ms"}
      - {name: engaged_seconds, type: DOUBLE, path: engaged_seconds}
      - {name: snoozed_seconds, type: DOUBLE, path: snoozed_seconds}
      - {name: escalation_count, type: BIGINT, path: escalation_count}
      - {name: timeout_escalation_count, type: BIGINT, path: timeout_escalation_count}
      - {name: manual_escalation_count, type: BIGINT, path: manual_escalation_count}
      - {name: reassignment_count, type: BIGINT, path: reassignment_count}
      - {name: assignment_count, type: BIGINT, path: assignment_count}
      - {name: acknowledgement_count, type: BIGINT, path: acknowledgement_count}
      - {name: auto_resolved, type: BOOLEAN, path: auto_resolved}
      - {name: total_notifications, type: BIGINT, path: total_notifications}
      - {name: sleep_hour_interruptions, type: BIGINT, path: sleep_hour_interruptions}
      - {name: off_hour_interruptions, type: BIGINT, path: off_hour_interruptions}
      - {name: business_hour_interruptions, type: BIGINT, path: business_hour_interruptions}
      - {name: engaged_user_count, type: BIGINT, path: engaged_user_count}
      - {name: acknowledged_by, type: JSON, path: acknowledged_user_names}
      - {name: assigned_to, type: JSON, path: assigned_user_names}
      - {name: incident_type, path: incident_type_name}
    pitfalls:
      - "Insights data lags up to ~24h (pipeline cycles): recent incidents may be missing. Use pagerduty_incidents for the last day."
      - "User-level API keys and OAuth tokens MUST filter on service_id or team_id (HTTP 400 otherwise); account-level keys need not."
    examples:
      - sql: >-
          SELECT service, count(*) AS incidents, median(seconds_to_first_ack) AS p50_ack_s,
                 median(seconds_to_resolve) / 60 AS p50_resolve_min, sum(escalation_count) AS escalations
          FROM pagerduty_analytics_incidents WHERE ts >= now() - INTERVAL 30 DAY
          GROUP BY service ORDER BY incidents DESC
        description: 30-day MTTA / MTTR and escalations per service.
      - sql: >-
          SELECT ts, title, seconds_to_resolve, escalation_count, resolved_by FROM pagerduty_analytics_incidents
          WHERE service_id = 'PPSCXAN' AND ts >= now() - INTERVAL 90 DAY ORDER BY seconds_to_resolve DESC LIMIT 10
        description: Longest incidents on a service in the last quarter.
    fixtures:
      - file: analytics_raw_incidents.json
        expect_rows: 2
        expect_columns: {ts: "2023-05-31T10:05:00Z", id: PYC0H08, incident_number: 928, title: "The server is on fire!", service: Engineering, seconds_to_first_ack: 5, seconds_to_resolve: 3305, duration_ms: 3305000, escalation_count: 1, acknowledged_by: '["John Smith"]', resolved_at: "2023-05-31T10:15:00Z"}
        note: "Official 'Example Response' of POST /analytics/raw/incidents (operation getAnalyticsIncidents, PagerDuty OpenAPI api-schema)."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/analytics/get-analytics-incidents

  - name: pagerduty_analytics_services
    title: Per-service incident aggregates (Insights)
    description: >-
      Aggregated incident metrics per service for incidents created in the ts window: incident
      counts, mean seconds to ack / resolve, escalations, interruptions, uptime %. Set
      aggregate_unit = day | week | month for one row per (service, period) with ts =
      range_start; without it one row per service for the whole window (ts NULL). Optional
      service_id / team_id IN, urgency, major. Data lags up to ~24h.
    kind: timeseries
    request:
      method: POST
      path: /analytics/metrics/incidents/services
      body:
        filters:
          created_at_start: "{{ time.start | rfc3339 }}"
          created_at_end: "{{ time.end | rfc3339 }}"
          service_ids: "{{ (filters.service_id | as_list) or None }}"
          team_ids: "{{ (filters.team_id | as_list) or None }}"
          urgency: "{{ filters.urgency }}"
          major: "{{ ((filters.major | string | lower) in ['true', '1']) if (filters.major is defined and filters.major is not none) else None }}"
        aggregate_unit: "{{ filters.aggregate_unit }}"
        time_zone: Etc/UTC
    filters:
      - {column: aggregate_unit, description: "day | week | month (omit for one row per service)", examples: [day]}
      - {column: service_id, ops: ["=", "in"], fan_out: false, description: "Service ID(s)", examples: [PPSCXAN]}
      - {column: team_id, ops: ["=", "in"], fan_out: false, description: "Team ID(s)", examples: [P3XUQ75]}
      - {column: urgency, description: "high | low", examples: [high]}
      - {column: major, type: BOOLEAN, description: "Only major incidents", examples: ["true"]}
    time: {column: ts, default_lookback: 30d, max_window: 365d, reapply: false}
    response:
      rows_path: "$.data[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: range_start, description: "Start of the aggregation period (NULL without aggregate_unit)"}
      - {name: service, path: service_name}
      - {name: service_id, path: service_id}
      - {name: team, path: team_name}
      - {name: team_id, path: team_id}
      - {name: total_incident_count, type: BIGINT, path: total_incident_count}
      - {name: mean_seconds_to_first_ack, type: DOUBLE, path: mean_seconds_to_first_ack}
      - {name: mean_seconds_to_engage, type: DOUBLE, path: mean_seconds_to_engage}
      - {name: mean_seconds_to_mobilize, type: DOUBLE, path: mean_seconds_to_mobilize}
      - {name: mean_seconds_to_resolve, type: DOUBLE, path: mean_seconds_to_resolve}
      - {name: total_escalation_count, type: BIGINT, path: total_escalation_count}
      - {name: total_incidents_acknowledged, type: BIGINT, path: total_incidents_acknowledged}
      - {name: total_incidents_auto_resolved, type: BIGINT, path: total_incidents_auto_resolved}
      - {name: total_incidents_manual_escalated, type: BIGINT, path: total_incidents_manual_escalated}
      - {name: total_incidents_timeout_escalated, type: BIGINT, path: total_incidents_timeout_escalated}
      - {name: total_interruptions, type: BIGINT, path: total_interruptions}
      - {name: total_notifications, type: BIGINT, path: total_notifications}
      - {name: total_sleep_hour_interruptions, type: BIGINT, path: total_sleep_hour_interruptions}
      - {name: total_engaged_seconds, type: DOUBLE, path: total_engaged_seconds}
      - {name: up_time_pct, type: DOUBLE, path: up_time_pct}
      - {name: aggregate_unit, filter_only: true}
      - {name: urgency, filter_only: true}
      - {name: major, type: BOOLEAN, filter_only: true}
    pitfalls:
      - "The created_at_start..end range may span at most one year."
      - "The ts predicate selects incidents by creation time and is not re-applied to range_start."
    examples:
      - sql: >-
          SELECT ts, service, total_incident_count, mean_seconds_to_resolve / 60 AS mttr_min
          FROM pagerduty_analytics_services
          WHERE aggregate_unit = 'week' AND ts >= now() - INTERVAL 90 DAY ORDER BY ts, service
        description: Weekly incident volume and MTTR per service over a quarter (trend before/after a change).
    fixtures:
      - file: analytics_services.json
        filters: {aggregate_unit: day}
        expect_rows: 2
        expect_columns: {ts: "2023-06-11T00:00:00Z", service: "Critical Prod Service 1", service_id: PPSCXAN, team: Engineering, total_incident_count: 124, mean_seconds_to_resolve: 380, up_time_pct: 99.92677595628416, aggregate_unit: day}
        note: "Official 'Example Response' of POST /analytics/metrics/incidents/services (operation getAnalyticsMetricsIncidentsService, PagerDuty OpenAPI api-schema)."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/analytics/get-analytics-metrics-incidents-service

roles:
  incidents:
    table: pagerduty_incidents
    columns: {ts: ts, id: id, title: title, state: status, status: status, severity: severity, urgency: urgency, service: service, url: url, assignee: assignees}
    notes: "PagerDuty incidents created in the window (pages). service is the PagerDuty service NAME, which may differ from the alert's service: match with ILIKE, or resolve the ID via pagerduty_services."
  active_alerts:
    table: pagerduty_incidents
    filters: {status: "{{ ['triggered', 'acknowledged'] }}", date_range: "all"}
    columns: {ts: ts, title: title, state: status, severity: severity, service: service, url: url, name: title}
    notes: "Open PagerDuty incidents (triggered or acknowledged), whatever their age."
  oncall:
    table: pagerduty_oncalls
    columns: {name: user, user: user, schedule: schedule, escalation_policy: escalation_policy, level: escalation_level, start: start_at, end: end_at}
    notes: "Who was on call during the window, per escalation policy and level (filter escalation_policy_id from pagerduty_services)."
  change_events:
    table: pagerduty_change_events
    columns: {ts: ts, title: title, service: service_id, source: source, url: url}
    notes: "Only changes sent to PagerDuty as change events; service is a PagerDuty service ID."
  services:
    table: pagerduty_services
    columns: {service: service, id: id, status: status, owner: escalation_policy, url: url}
  alert_history:
    table: pagerduty_log_entries
    columns: {ts: ts, state: type, message: message, title: incident, url: url}
    notes: "Account-wide incident state transitions (trigger / acknowledge / escalate / resolve) in the window."
