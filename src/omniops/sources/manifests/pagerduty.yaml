        note: "Official example response 'Basic Example' of GET /schedules (operation listSchedules, PagerDuty OpenAPI api-schema)."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/schedules/list-schedules

  - name: pagerduty_schedule_entries
    title: Rendered final schedule (who is on call when)
    description: >-
      The schedule's final (after overrides) rendered entries overlapping the ts window: one row
      per (user, start, end) shift. schedule_id required (IN up to 10). Entries are truncated at
      the window bounds unless overflow = true (whole shifts). The ts predicate selects the
      window and is not re-applied to rows.
    kind: entities
    request:
      method: GET
      path: "/schedules/{{ filters.schedule_id }}"
      query:
        since: "{{ time.start | rfc3339 }}"
        until: "{{ time.end | rfc3339 }}"
        overflow: "{{ filters.overflow }}"
        time_zone: UTC
    filters:
      - {column: schedule_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Schedule ID", examples: [PI7DH85]}
      - {column: overflow, type: BOOLEAN, description: "true = return whole shifts instead of truncating them at the window bounds", examples: ["true"]}
    time: {column: ts, default_lookback: 24h, max_window: 90d, reapply: false}
    response:
      rows_path: "$.schedule.final_schedule.rendered_schedule_entries[*]"
    columns:
      - {name: schedule_id, path: "$.schedule.id"}
      - {name: schedule, path: "$.schedule.name"}
      - {name: user, path: user.summary}
      - {name: user_id, path: user.id}
      - {name: start_at, type: TIMESTAMP, path: start}
      - {name: end_at, type: TIMESTAMP, path: end}
      - {name: overflow, type: BOOLEAN, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Without overflow = true, start_at / end_at are clipped to the window bounds (not the real handoff times)."
    examples:
      - sql: >-
          SELECT user, start_at, end_at FROM pagerduty_schedule_entries
          WHERE schedule_id = 'PI7DH85' AND ts BETWEEN TIMESTAMP '2026-10-01 00:00:00' AND TIMESTAMP '2026-10-02 00:00:00'
          ORDER BY start_at
        description: Who covered the schedule on a given day (handoffs during an incident).
    fixtures:
      - file: schedule.json
        filters: {schedule_id: PI7DH85}
        expect_rows: 1
        expect_columns: {schedule_id: PI7DH85, schedule: "Daily Engineering Rotation", user: "Regina Phalange", user_id: PXPGF42, start_at: "2015-11-10T13:00:00Z", end_at: "2015-11-10T22:00:00Z"}
        note: "Official example response of GET /schedules/{id} (operation getSchedule, PagerDuty OpenAPI api-schema); final_schedule entries, -05:00 normalised to UTC."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/schedules/get-schedule

  - name: pagerduty_schedule_overrides
    title: Schedule overrides
    description: One row per override on the schedule overlapping the ts window (schedule_id required). Explains why the usual person was not paged.
    kind: entities
    request:
      method: GET
      path: "/schedules/{{ filters.schedule_id }}/overrides"
      query:
        since: "{{ time.start | rfc3339 }}"
        until: "{{ time.end | rfc3339 }}"
    filters:
      - {column: schedule_id, required: true, ops: ["=", "in"], max_fan_out: 10, description: "Schedule ID", examples: [PI7DH85]}
    time: {column: ts, default_lookback: 7d, max_window: 90d, reapply: false}
    response:
      rows_path: "$.overrides[*]"
    columns:
      - {name: id, path: id}
      - {name: user, path: user.summary}
      - {name: user_id, path: user.id}
      - {name: start_at, type: TIMESTAMP, path: start}
      - {name: end_at, type: TIMESTAMP, path: end}
      - {name: schedule_id, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT user, start_at, end_at FROM pagerduty_schedule_overrides WHERE schedule_id = 'PI7DH85' AND ts >= now() - INTERVAL 7 DAY"
        description: Overrides in the last week.
    fixtures:
      - file: schedule_overrides.json
        filters: {schedule_id: PI7DH85}
        expect_rows: 1
        expect_columns: {id: PQ47DCP, user: "Aurelio Rice", start_at: "2012-07-01T04:00:00Z", end_at: "2012-07-02T04:00:00Z", schedule_id: PI7DH85}
        note: "Official example response of GET /schedules/{id}/overrides (operation listScheduleOverrides, PagerDuty OpenAPI api-schema; documented under status 201)."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/schedules/list-schedule-overrides

  - name: pagerduty_escalation_policies
    title: Escalation policies
    description: >-
      One row per escalation policy (query = name match; user_id / team_id IN): its escalation
      rules (levels with delays and targets), the services that use it, loops and teams.
