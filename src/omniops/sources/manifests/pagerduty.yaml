      - {name: name, path: name}
      - {name: description, path: description}
      - {name: num_loops, type: BIGINT, path: num_loops}
      - {name: escalation_rules, type: JSON, path: escalation_rules, description: "[{escalation_delay_in_minutes, targets:[user/schedule refs]}] in level order"}
      - {name: targets, type: JSON, path: "escalation_rules[*].targets[*].summary", description: "All user / schedule targets (all levels)"}
      - {name: services, type: JSON, path: "services[*].summary"}
      - {name: teams, type: JSON, path: "teams[*].summary"}
      - {name: on_call_handoff_notifications, path: on_call_handoff_notifications}
      - {name: url, path: html_url}
      - {name: query, filter_only: true}
      - {name: user_id, filter_only: true}
      - {name: team_id, filter_only: true}
    examples:
      - sql: "SELECT name, escalation_rules, services FROM pagerduty_escalation_policies WHERE query = 'Engineering'"
        description: How a page escalates (levels, delays, targets) and which services use the policy.
    fixtures:
