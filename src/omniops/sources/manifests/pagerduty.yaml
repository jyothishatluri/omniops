    response:
      rows_path: "$.relationships[*]"
    columns:
      - {name: id, path: id}
      - {name: supporting_service_id, path: supporting_service.id, description: "The service being depended on (downstream / callee)"}
      - {name: supporting_service_type, path: supporting_service.type}
      - {name: dependent_service_id, path: dependent_service.id, description: "The service that depends on it (upstream / caller)"}
      - {name: dependent_service_type, path: dependent_service.type}
      - {name: service_id, filter_only: true}
    pitfalls:
      - "Only IDs are returned; join pagerduty_services (technical) or pagerduty_business_services to name them."
    examples:
      - sql: >-
          SELECT dependent_service_id AS caller, supporting_service_id AS callee, dependent_service_type
          FROM pagerduty_service_dependencies WHERE service_id = 'P7AD56'
        description: Which services depend on this one, and what it depends on.
    fixtures:
      - file: service_dependencies.json
        filters: {service_id: P7AD56}
        expect_rows: 2
