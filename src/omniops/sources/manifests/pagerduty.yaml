    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/business-services/list-business-services

  - name: pagerduty_maintenance_windows
    title: Maintenance windows (services that will not page)
    description: >-
      One row per maintenance window (GET /maintenance_windows). While a window is ongoing its
      services create NO incidents, so an expected page that never came is often explained here.
      Filters: state = ongoing | open | future | past | all (pushed down as `filter`, default
      all), service_id and team_id (IDs, IN lists), query (name match). No time pushdown: compare
      start_at / end_at with the alert time in SQL.
    kind: events
    request:
      method: GET
      path: /maintenance_windows
      query:
        filter: "{{ filters.state or 'all' }}"
        "service_ids[]": "{{ filters.service_id | as_list }}"
        "team_ids[]": "{{ filters.team_id | as_list }}"
        query: "{{ filters.query }}"
    filters:
      - {column: state, description: "ongoing | open | future | past | all (default all)", examples: [ongoing]}
      - {column: service_id, ops: ["=", "in"], fan_out: false, description: "Service ID(s) (service_ids[])", examples: [PIJ90N7]}
      - {column: team_id, ops: ["=", "in"], fan_out: false, description: "Team ID(s) (team_ids[]; needs the teams ability)", examples: [PQ9K7I8]}
      - {column: query, description: "Name / description match", examples: [eschaton]}
    pagination: {type: offset, offset_param: query.offset, limit_param: query.limit, page_size: 100, has_more_path: "$.more", max_pages: 5}
    response:
      rows_path: "$.maintenance_windows[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: start_time, description: "Window start (same as start_at)"}
      - {name: id, path: id}
      - {name: title, path: summary}
      - {name: description, path: description}
      - {name: start_at, type: TIMESTAMP, path: start_time}
      - {name: end_at, type: TIMESTAMP, path: end_time}
      - {name: services, type: JSON, path: "services[*].summary", description: "Service names in maintenance"}
      - {name: service_ids, type: JSON, path: "services[*].id"}
      - {name: teams, type: JSON, path: "teams[*].summary"}
      - {name: author, path: created_by.summary, description: "Who created the window"}
      - {name: sequence_number, type: BIGINT, path: sequence_number}
      - {name: url, path: html_url}
      - {name: state, filter_only: true}
      - {name: service_id, filter_only: true}
      - {name: team_id, filter_only: true}
      - {name: query, filter_only: true}
    pitfalls:
      - "Alerts sent to a service during maintenance are dropped without an incident; pagerduty_incidents will be empty for that window even though monitoring fired."
    examples:
      - sql: >-
          SELECT title, start_at, end_at, services, author FROM pagerduty_maintenance_windows
          WHERE service_id = 'PIJ90N7' AND start_at <= TIMESTAMP '2026-10-01 11:00:00' AND end_at >= TIMESTAMP '2026-10-01 11:00:00'
        description: Was the service in maintenance when the alert fired (explains a missing page)?
      - sql: "SELECT title, start_at, end_at, services FROM pagerduty_maintenance_windows WHERE state = 'ongoing'"
        description: Services in maintenance right now.
    fixtures:
      - file: maintenance_windows.json
        filters: {state: all}
        expect_rows: 1
        expect_columns: {id: PW98YIO, title: "Immanentizing the eschaton", start_at: "2015-11-10T01:00:00Z", end_at: "2015-11-10T03:00:00Z", services: '["My Mail Service"]', service_ids: '["PIJ90N7"]', teams: '["Engineering"]', author: "Earline Greenholt", url: "https://subdomain.pagerduty.com/service-directory/maintenance-windows/PW98YIO", state: all}
        note: "Official example response of GET /maintenance_windows (operation listMaintenanceWindows, PagerDuty OpenAPI api-schema); -05:00 times normalised to UTC by the engine."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/maintenance-windows/list-maintenance-windows

  # ----------------------------------------------------------------------------------------------
  # On-call
  # ----------------------------------------------------------------------------------------------
  - name: pagerduty_oncalls
    title: Who is (was) on call
    description: >-
      One row per on-call period overlapping the ts window (since/until; default: the analysis
      window, i.e. who was on call when the alert fired): user, escalation policy, escalation
      level, schedule, and the period's start/end. Filters: escalation_policy_id, schedule_id,
      user_id (IN lists), earliest = true for only the next/earliest period per (policy, level,
      user). The ts predicate selects the overlap window and is not re-applied to rows.
    kind: entities
    request:
      method: GET
      path: /oncalls
      query:
        since: "{{ time.start | rfc3339 }}"
        until: "{{ time.end | rfc3339 }}"
        "escalation_policy_ids[]": "{{ filters.escalation_policy_id | as_list }}"
        "schedule_ids[]": "{{ filters.schedule_id | as_list }}"
        "user_ids[]": "{{ filters.user_id | as_list }}"
        earliest: "{{ filters.earliest }}"
        time_zone: UTC
    filters:
      - {column: escalation_policy_id, ops: ["=", "in"], fan_out: false, description: "Escalation policy ID(s) (a service's policy: pagerduty_services.escalation_policy_id)", examples: [PT20YPA]}
      - {column: schedule_id, ops: ["=", "in"], fan_out: false, description: "Schedule ID(s)", examples: [PI7DH85]}
      - {column: user_id, ops: ["=", "in"], fan_out: false, description: "User ID(s)", examples: [PT23IWX]}
      - {column: earliest, type: BOOLEAN, description: "Only the earliest on-call per (escalation policy, level, user)", examples: ["true"]}
    time: {column: ts, default_lookback: 5m, max_window: 90d, reapply: false}
    pagination: {type: offset, offset_param: query.offset, limit_param: query.limit, page_size: 100, has_more_path: "$.more", max_pages: 5}
    response:
      rows_path: "$.oncalls[*]"
    columns:
      - {name: user, path: user.summary, description: "On-call user's name"}
      - {name: user_id, path: user.id}
      - {name: escalation_policy, path: escalation_policy.summary}
      - {name: escalation_policy_id, path: escalation_policy.id}
      - {name: escalation_level, type: BIGINT, path: escalation_level, description: "1 = first responder"}
      - {name: schedule, path: schedule.summary, description: "Schedule name (NULL when the user is a direct target of the policy)"}
      - {name: schedule_id, path: schedule.id}
      - {name: start_at, type: TIMESTAMP, path: start, description: "Start of the on-call period (NULL for permanent on-call)"}
      - {name: end_at, type: TIMESTAMP, path: end, description: "End of the on-call period (NULL for permanent on-call)"}
      - {name: earliest, type: BOOLEAN, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true, description: "Overlap window (pushed down as since/until)"}
    pitfalls:
      - "ts selects periods OVERLAPPING the window; filter start_at / end_at in SQL for containment. Without a ts predicate you get who was on call during the alert window."
      - "This endpoint has operation-specific rate limits; avoid repeated wide queries."
      - "Directly targeted users (no schedule) appear with schedule NULL and start/end NULL; future periods are limited to 90 days ahead."
    examples:
      - sql: >-
          SELECT escalation_policy, escalation_level, user, schedule, start_at, end_at
          FROM pagerduty_oncalls WHERE escalation_policy_id = 'PT20YPA' ORDER BY escalation_level
        description: Who was on call for the service's escalation policy when the alert fired.
      - sql: >-
          SELECT user, escalation_policy, escalation_level FROM pagerduty_oncalls
          WHERE ts BETWEEN TIMESTAMP '2026-10-01 03:00:00' AND TIMESTAMP '2026-10-01 03:05:00' AND escalation_level = 1
        description: First responders on call at 03:00 UTC.
    fixtures:
      - file: oncalls.json
        expect_rows: 1
        expect_columns: {user: "Tim Wright", user_id: PT23IWX, escalation_policy: "Engineering Escalation Policy", escalation_level: 2, schedule: "Daily Engineering Rotation", start_at: "2015-03-06T20:28:51Z", end_at: "2015-03-07T20:28:51Z"}
        note: "Official example response of GET /oncalls (operation listOnCalls, PagerDuty OpenAPI api-schema); -05:00 offsets normalised to UTC."
    docs_url: https://docs.pagerduty.com/developer/api/reference/rest/on-calls/list-on-calls

  - name: pagerduty_schedules
    title: On-call schedules
    description: "One row per schedule (query = name match) with its time zone, the escalation policies that use it and its users."
    kind: entities
