  # ------------------------------------------------------------------------------------------
  - name: instana_call_groups
    title: Grouped call metrics (unbounded analytics)
    description: >-
      Calls grouped by a tag (default service.name of the DESTINATION) with one metric per
      request: one row per (group, metric, timestamp). Filter on metric (required, e.g.
      calls.sum, errors.mean, latency.p95; IN fans out), group_by (tag, default service.name),
      group_entity (DESTINATION | SOURCE), service / endpoint / application (exact tag filters),
      call_type (HTTP, DATABASE, MESSAGING, ...), tag + tag_value, granularity (default: one value
      for the whole window) and ts. The workhorse for 'which service/endpoint/status code is
      responsible'.
    kind: timeseries
    request:
      method: POST
      path: /api/application-monitoring/analyze/call-groups
      body:
        group:
          groupbyTag: "{{ filters.group_by or 'service.name' }}"
          groupbyTagEntity: "{{ filters.group_entity or 'DESTINATION' }}"
          groupbyTagSecondLevelKey: "{{ filters.group_key }}"
        metrics:
          - metric: "{{ filters.metric.rsplit('.', 1)[0] }}"
            aggregation: "{{ filters.metric.rsplit('.', 1)[1] | upper }}"
            granularity: "{{ filters.granularity }}"
        includeInternal: false
        includeSynthetic: false
        pagination: {retrievalSize: 200}
        tagFilterExpression:
          type: EXPRESSION
          logicalOperator: AND
          elements:
            - "{{ {'type': 'TAG_FILTER', 'name': 'service.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.service} if filters.service else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'endpoint.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.endpoint} if filters.endpoint else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'application.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.application} if filters.application else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'call.type', 'operator': 'EQUALS', 'entity': 'NOT_APPLICABLE', 'value': filters.call_type} if filters.call_type else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': filters.tag, 'operator': (filters.tag_operator or 'EQUALS'), 'entity': (filters.tag_entity or 'DESTINATION'), 'value': filters.tag_value} if filters.tag else None }}"
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: metric, required: true, ops: ["=", "in"], max_fan_out: 6, description: "'<metricId>.<aggregation>' in lower case: calls.sum, errors.mean, latency.mean, latency.p95", examples: [calls.sum]}
      - {column: group_by, description: "Group tag: service.name (default), endpoint.name, call.http.status, kubernetes.namespace.name, host.name, ...", examples: [service.name]}
      - {column: group_entity, description: "DESTINATION (default, the callee) | SOURCE (the caller) | NOT_APPLICABLE"}
      - {column: group_key, description: "Second-level key for KEY_VALUE_PAIR tags (e.g. a docker/k8s label name)"}
      - {column: service, description: "Exact destination service.name filter", examples: [ratings]}
      - {column: endpoint, description: "Exact destination endpoint.name filter"}
      - {column: application, description: "Exact application.name filter"}
      - {column: call_type, description: "HTTP, DATABASE, MESSAGING, RPC, SDK, ... (tag call.type)", examples: [DATABASE]}
      - {column: tag, description: "Any tag from the application tag catalog"}
      - {column: tag_value, description: "Value for tag"}
      - {column: tag_operator, description: "EQUALS (default), CONTAINS, NOT_EQUAL, GREATER_THAN, ..."}
      - {column: tag_entity, description: "DESTINATION (default), SOURCE, NOT_APPLICABLE"}
      - {column: granularity, type: BIGINT, description: "Bucket size in SECONDS; default none = one aggregated value per group for the whole window"}
    time: {column: ts, default_lookback: 1h, max_window: 31d, retention: 7d}
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: metrics, as: m}
        - {explode: "@m.value", as: p}
    columns:
      - {name: group_value, path: name, description: "Value of the group tag (e.g. the service name)"}
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms, description: "Bucket timestamp (start of the window when no granularity)"}
      - {name: value, type: DOUBLE, path: "@p[1]"}
      - {name: metric, expr: "filters.metric or m.key"}
      - {name: metric_key, path: "@m.key", description: "Returned key '<metric>.<aggregation>[.<granularity>]'"}
      - {name: first_call_ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms, description: "Earliest call of the group"}
      - {name: total_hits, type: BIGINT, path: "$.totalHits"}
      - {name: can_load_more, type: BOOLEAN, path: "$.canLoadMore", description: "true = more than 200 groups exist (only the first page is fetched)"}
      - {name: group_by, filter_only: true}
      - {name: group_entity, filter_only: true}
      - {name: group_key, filter_only: true}
      - {name: service, filter_only: true}
      - {name: endpoint, filter_only: true}
      - {name: application, filter_only: true}
      - {name: call_type, filter_only: true}
      - {name: tag, filter_only: true}
      - {name: tag_value, filter_only: true}
      - {name: tag_operator, filter_only: true}
      - {name: tag_entity, filter_only: true}
      - {name: granularity, type: BIGINT, filter_only: true}
    pitfalls:
      - "Only the first 200 groups are fetched (cursor pagination needs ingestionTime+offset together, which the engine cannot send): check can_load_more and narrow the filters."
      - "Call data is retained 7 days; older windows return nothing."
      - "group_entity matters: DESTINATION groups by the callee, SOURCE by the caller (use SOURCE + a destination service filter to find who calls a failing service)."
    examples:
      - sql: >-
          SELECT group_value AS service, value AS error_rate FROM instana_call_groups
          WHERE metric = 'errors.mean' AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY error_rate DESC LIMIT 10
        description: Services ranked by error rate over the incident window (one value per service).
      - sql: >-
          SELECT group_value AS caller, value AS calls FROM instana_call_groups
          WHERE metric = 'calls.sum' AND service = 'ratings' AND group_entity = 'SOURCE'
          ORDER BY calls DESC
        description: Which services call the failing service, and how much.
      - sql: >-
          SELECT group_value AS http_status, value AS calls FROM instana_call_groups
          WHERE metric = 'calls.sum' AND service = 'checkout' AND group_by = 'call.http.status'
          ORDER BY calls DESC
        description: HTTP status code breakdown of one service.
    fixtures:
      - file: call_groups.json
        note: "Verbatim 200 example of getCallGroup (POST /api/application-monitoring/analyze/call-groups) from the Instana OpenAPI spec."
        filters: {metric: latency.p75, service: ratings}
        expect_rows: 1
        expect_columns: {group_value: ratings, ts: "2023-07-03T06:42:00Z", value: 1.0, metric: latency.p75, metric_key: latency.p75.360, can_load_more: false}
      - file: call_groups_services.json
        note: "Verbatim sample response of 'Tutorial: Retrieving the services that have trace data' (Applications developer guide, IBM API Hub); '// More services...' comment removed."
        filters: {metric: errors.mean}
        expect_rows: 6
        expect_columns: {group_value: Service A, value: 0.0, metric_key: errors.mean, total_hits: 2}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getCallGroup

  # ------------------------------------------------------------------------------------------
  - name: instana_traces
    title: Trace search (analyze traces)
    description: >-
      Traces matching tag filters in the window: one row per trace with entry service and
      endpoint, start time, duration and erroneous flag. Filter on service / endpoint (exact
      destination tags), error_only (call.erroneous = true), tag + tag_value, and ts. One page of
      up to 200 traces; use instana_trace_calls for the calls of one trace.
    kind: traces
    request:
      method: POST
      path: /api/application-monitoring/analyze/traces
      body:
        includeInternal: false
        includeSynthetic: false
        pagination:
          retrievalSize: "{{ [limit or 200, 200] | min }}"
        tagFilterExpression:
          type: EXPRESSION
          logicalOperator: AND
          elements:
            - "{{ {'type': 'TAG_FILTER', 'name': 'service.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.service} if filters.service else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'endpoint.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.endpoint} if filters.endpoint else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'application.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.application} if filters.application else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'call.erroneous', 'operator': 'EQUALS', 'entity': 'NOT_APPLICABLE', 'value': true} if filters.error_only else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': filters.tag, 'operator': (filters.tag_operator or 'EQUALS'), 'entity': (filters.tag_entity or 'DESTINATION'), 'value': filters.tag_value} if filters.tag else None }}"
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: service, description: "Exact service.name of calls in the trace (DESTINATION)", examples: [groundskeeper]}
      - {column: endpoint, description: "Exact endpoint.name (DESTINATION)", examples: ['GET /']}
      - {column: application, description: "Exact application.name"}
      - {column: error_only, type: BOOLEAN, description: "true = only traces with erroneous calls (tag call.erroneous)"}
      - {column: tag, description: "Any tag from the application tag catalog, e.g. call.http.status, call.duration"}
      - {column: tag_value, description: "Value for tag"}
      - {column: tag_operator, description: "EQUALS (default), GREATER_THAN, CONTAINS, ..."}
      - {column: tag_entity, description: "DESTINATION (default), SOURCE, NOT_APPLICABLE"}
    time: {column: ts, default_lookback: 1h, max_window: 7d, retention: 7d}
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: trace_id, path: "trace.id"}
      - {name: title, path: "trace.label", description: "Trace name (usually the entry endpoint)"}
      - {name: ts, type: TIMESTAMP, path: "trace.startTime", transform: epoch_ms}
      - {name: duration_ms, type: DOUBLE, path: "trace.duration"}
      - {name: error, type: BOOLEAN, path: "trace.erroneous"}
      - {name: entry_service, path: "trace.service.label", description: "Entry (root) service of the trace"}
      - {name: entry_service_id, path: "trace.service.id"}
      - {name: entry_endpoint, path: "trace.endpoint.label", description: "Entry endpoint of the trace"}
      - {name: resource, path: "trace.endpoint.label"}
      - {name: endpoint_type, path: "trace.endpoint.type"}
      - {name: total_hits, type: BIGINT, path: "$.totalHits"}
      - {name: can_load_more, type: BOOLEAN, path: "$.canLoadMore"}
      - {name: service, filter_only: true, description: "Service filter: traces containing a call to this service"}
      - {name: endpoint, filter_only: true, description: "Endpoint filter: traces containing a call to this endpoint"}
      - {name: application, filter_only: true}
      - {name: error_only, type: BOOLEAN, filter_only: true}
      - {name: tag, filter_only: true}
      - {name: tag_value, filter_only: true}
      - {name: tag_operator, filter_only: true}
      - {name: tag_entity, filter_only: true}
    pitfalls:
      - "service/endpoint filters select traces CONTAINING a call to that service/endpoint; entry_service/entry_endpoint are the trace's root, which can differ."
      - "One page of at most 200 traces (total_hits says how many matched): narrow with error_only, endpoint or a shorter window."
      - "Trace data is retained 7 days."
    examples:
      - sql: >-
          SELECT ts, trace_id, title, duration_ms, error FROM instana_traces
          WHERE service = 'groundskeeper' AND error_only = true
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY ts DESC LIMIT 50
        description: Erroneous traces through a service in the incident window.
      - sql: "SELECT entry_service, title, count(*) AS traces, max(duration_ms) AS slowest_ms FROM instana_traces WHERE endpoint = 'GET /' GROUP BY 1, 2 ORDER BY slowest_ms DESC"
        description: Slowest traces through one endpoint.
    fixtures:
      - file: traces.json
        note: "Verbatim 200 example of getTraces (POST /api/application-monitoring/analyze/traces) from the Instana OpenAPI spec."
        expect_rows: 1
        expect_columns: {trace_id: 506aef767d8ec147, title: sdk.reloading-config-cache, ts: "2024-09-06T05:49:23.937Z", duration_ms: 0.0, error: false, entry_service: appdata-processor, entry_endpoint: null, total_hits: 154, can_load_more: true}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getTraces

  # ------------------------------------------------------------------------------------------
  - name: instana_trace_groups
    title: Grouped trace metrics
    description: >-
      Traces grouped by their entry endpoint (trace.endpoint.name, default) or entry service
      (trace.service.name) with one metric per request (traces.sum, latency.mean, errors.mean...):
      one row per (group, metric, timestamp). Filter on metric, group_by, service / endpoint
      (exact destination tags) and ts.
    kind: timeseries
    request:
      method: POST
      path: /api/application-monitoring/analyze/trace-groups
      body:
        group:
          groupbyTag: "{{ filters.group_by or 'trace.endpoint.name' }}"
          groupbyTagEntity: NOT_APPLICABLE
        metrics:
          - metric: "{{ filters.metric.rsplit('.', 1)[0] }}"
            aggregation: "{{ filters.metric.rsplit('.', 1)[1] | upper }}"
            granularity: "{{ filters.granularity }}"
        pagination: {retrievalSize: 200}
        tagFilterExpression:
          type: EXPRESSION
          logicalOperator: AND
          elements:
            - "{{ {'type': 'TAG_FILTER', 'name': 'service.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.service} if filters.service else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'endpoint.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.endpoint} if filters.endpoint else None }}"
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: metric, required: true, ops: ["=", "in"], max_fan_out: 4, description: "traces.sum, latency.mean, latency.p95, errors.mean", examples: [latency.sum]}
      - {column: group_by, description: "trace.endpoint.name (default) | trace.service.name (only these two work)"}
      - {column: service, description: "Exact service.name of calls in the traces", examples: [ratings]}
      - {column: endpoint, description: "Exact endpoint.name"}
      - {column: granularity, type: BIGINT, description: "Bucket size in SECONDS (default: one value per group)"}
    time: {column: ts, default_lookback: 1h, max_window: 7d, retention: 7d}
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: metrics, as: m}
        - {explode: "@m.value", as: p}
    columns:
      - {name: group_value, path: name}
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms}
      - {name: value, type: DOUBLE, path: "@p[1]"}
      - {name: metric, expr: "filters.metric or m.key"}
      - {name: metric_key, path: "@m.key"}
      - {name: total_hits, type: BIGINT, path: "$.totalHits"}
      - {name: can_load_more, type: BOOLEAN, path: "$.canLoadMore"}
      - {name: group_by, filter_only: true}
      - {name: service, filter_only: true}
      - {name: endpoint, filter_only: true}
      - {name: granularity, type: BIGINT, filter_only: true}
    examples:
      - sql: "SELECT group_value AS entry_endpoint, value AS mean_ms FROM instana_trace_groups WHERE metric = 'latency.mean' AND service = 'ratings' ORDER BY mean_ms DESC LIMIT 10"
        description: Entry endpoints whose traces touching a service are slowest.
    fixtures:
      - file: trace_groups.json
        note: "Verbatim 200 example of getTraceGroups (POST /api/application-monitoring/analyze/trace-groups) from the Instana OpenAPI spec."
        filters: {metric: latency.sum}
        expect_rows: 1
        expect_columns: {group_value: GET /api/cart-total, value: 31.0, metric_key: latency.sum, total_hits: 2595}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getTraceGroups

