# IBM Instana Observability REST API, direct REST, no MCP.
#
# Reference: IBM API Hub "Instana REST API" (OpenAPI 1.328.1128, checked 2026-10-27)
#   https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation
#   (operation anchors: ...-documentation#<operationId>); developer guides
#   https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Applications and /Infrastructure;
#   auth / rate limits: https://www.ibm.com/docs/en/SSO4JPD/src/pages/api/instana_rest_api/getting_started/
# The old https://instana.github.io/openapi/ site is gone (404). Fixtures are the OpenAPI
# examples verbatim unless the fixture note says otherwise.
# Research notes and doc links: docs/sources/instana.md
source: instana
display_name: IBM Instana Observability
vendor: IBM
description: >-
  IBM Instana REST API: application perspectives, services and endpoints with their metrics
  (calls, errors, latency percentiles, HTTP status classes), grouped call/trace analytics,
  trace search and trace detail, service topology, events (incidents, issues, changes),
  infrastructure snapshots and metrics, releases (deployment markers), logs and Smart Alert
  configurations.
docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation
categories: [metrics, traces, logs, alerts, events, incidents, changes, topology, infrastructure, apm]
base_url: "{{ env.INSTANA_BASE_URL }}"
ui_base_url: "{{ env.INSTANA_BASE_URL }}"
env:
  - name: INSTANA_BASE_URL
    description: >-
      Tenant-unit base URL without /api, the same host as the Instana UI:
      https://<unit>-<tenant>.instana.io (SaaS, e.g. https://prod-acme.instana.io) or the
      self-hosted backend URL.
  - name: INSTANA_API_TOKEN
    description: >-
      API token (Settings > Security & access > API tokens), sent as 'Authorization: apiToken <token>'.
      Needs the application, infrastructure, events and logs read permissions used here.
    secret: true
required_env: [INSTANA_BASE_URL, INSTANA_API_TOKEN]
auth:
  type: headers
  headers:
    Authorization: "apiToken {{ env.INSTANA_API_TOKEN }}"
headers:
  Accept: application/json
  Content-Type: application/json
rate_limit:
  concurrency: 4
  requests_per_minute: 150
  notes: >-
    REST API: 10,000 calls per hour per API token (X-RateLimit-Limit / -Remaining / -Reset
    headers; HTTP 429 when exceeded). Infrastructure search and snapshot/metric queries are
    limited to 1,000 calls per hour. The engine enforces 150 requests/min for the source.
retention:
  traces: "7 days for all calls and traces (a subset of calls/traces is kept for 1 year)"
  metrics: "accurate application/service/endpoint metrics 31 days, approximate metrics 1 year; infrastructure 1-second rollups ~24 h, 1-minute ~1 month, 1-hour ~13 months"
  events: "events and incidents are kept with the tenant's event retention"
pitfalls:
  - "All times are epoch MILLISECONDS; POST bodies use timeFrame {to, windowSize (ms)}; windowSize is capped at 31 days (2678400000 ms)."
  - "Metric granularity is in SECONDS and must give at most 600 points per series (granularity >= windowSize/600); without granularity the API returns ONE aggregated value for the whole window. The tables send ~300-point granularity by default."
  - "The API adjusts the window to whole granularity buckets (e.g. 08:02-09:02 at 5 min becomes 08:05-09:00); the adjusted window is in adjusted_* columns."
  - "Names are matched with 'contains' semantics server-side (nameFilter) and exactly in SQL: service = 'shop' still needs the exact label."
  - "Tag names in tag filters must exist in the application tag catalog (service.name, endpoint.name, application.name, call.type, ...); an unknown tag or value silently matches nothing."
  - "Service and endpoint ids are stable hashes; application perspective ids are short strings: resolve names with instana_services / instana_applications."
query_languages:
  instana_metric: >-
    Application metrics are '<metricId>.<aggregation>' (lower case), e.g. calls.sum,
    calls.per_second, erroneousCalls.sum, errors.mean (error rate 0..1), latency.mean,
    latency.p50/p90/p95/p99, http.5xx.sum, http.4xx.sum, services.distinct_count. Allowed
    aggregations: calls/erroneousCalls/http.Nxx: PER_SECOND, SUM; latency: P25..P99, SUM, MEAN,
    MAX, MIN (ms); errors: MEAN. See instana_metric_catalog.
  instana_dfq: >-
    Dynamic Focus Query for infrastructure: entity.type:host, entity.zone:"eu-west-1",
    entity.kubernetes.namespace:shop, entity.application.name:"Java Applications",
    entity.host.name:ip-10-0-1-17, entity.selfType:java; combine with AND/OR/NOT and quotes.
tables:
  # ------------------------------------------------------------------------------------------
  - name: instana_applications
    title: Application perspectives
    description: >-
      Application perspectives (Instana's user-defined groupings of services/endpoints) with
      their ids. One row per perspective. Filter on application (contains match server-side).
    kind: entities
    request:
      method: GET
      path: /api/application-monitoring/applications
      query:
        nameFilter: "{{ filters.application }}"
        windowSize: "{{ time.range_s * 1000 }}"
        to: "{{ time.end | epoch_ms }}"
        applicationBoundaryScope: "{{ filters.boundary_scope }}"
    filters:
      - {column: application, description: "Perspective name (server-side contains match)", examples: [Robot Shop]}
      - {column: boundary_scope, description: "ALL | INBOUND"}
    time: {column: ts, default_lookback: 1h, max_window: 31d}
    pagination: {type: page, page_param: query.page, limit_param: query.pageSize, page_size: 200, start: 1, max_pages: 5}
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: id, path: id, description: "Application perspective id (application_id filter elsewhere)"}
      - {name: application, path: label}
      - {name: boundary_scope, path: boundaryScope, description: "ALL | INBOUND"}
      - {name: entity_type, path: entityType}
      - {name: business_criticality, type: BIGINT, path: businessCriticality}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT id, application, boundary_scope FROM instana_applications ORDER BY application"
        description: List application perspectives and their ids.
    fixtures:
      - file: applications.json
        note: "Verbatim 200 example of getApplications (GET /api/application-monitoring/applications) from the Instana OpenAPI spec 1.328.1128."
        expect_rows: 1
        expect_columns: {id: e8krH1wNRV6daAo-NEmG8g, application: Robot Shop, boundary_scope: INBOUND}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getApplications

  # ------------------------------------------------------------------------------------------
  - name: instana_services
    title: Services
    description: >-
      Services seen in the window with technologies and endpoint types. One row per service.
      Filter on service (contains match server-side, exact in SQL). Use to resolve a service name
      to its id and snapshot ids.
    kind: entities
    request:
      method: GET
      path: /api/application-monitoring/services
      query:
        nameFilter: "{{ filters.service }}"
        windowSize: "{{ time.range_s * 1000 }}"
        to: "{{ time.end | epoch_ms }}"
        includeSnapshotIds: "true"
    filters:
      - {column: service, description: "Service name (server-side contains match)", examples: [payment]}
    time: {column: ts, default_lookback: 1h, max_window: 31d}
    pagination: {type: page, page_param: query.page, limit_param: query.pageSize, page_size: 200, start: 1, max_pages: 5}
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: id, path: id, description: "Service id (service_id filter elsewhere)"}
      - {name: service, path: label}
      - {name: types, type: JSON, path: types, description: "Endpoint types, e.g. HTTP, DATABASE, MESSAGING"}
      - {name: technologies, type: JSON, path: technologies}
      - {name: snapshot_ids, type: JSON, path: snapshotIds, description: "Infrastructure snapshots (processes/containers) backing the service"}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT id, service, types, technologies FROM instana_services WHERE service = 'payment'"
        description: Resolve a service name to its id.
      - sql: "SELECT service, technologies FROM instana_services ORDER BY service"
        description: Service inventory in the window.
    fixtures:
      - file: services.json
        note: "Verbatim 200 example of getServices (GET /api/application-monitoring/services) from the Instana OpenAPI spec."
        expect_rows: 1
        expect_columns: {id: 79f1430f4a42a707a97621ca00617e40bd51c31d, service: Robot Shop}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getServices

  # ------------------------------------------------------------------------------------------
  - name: instana_service_metrics
    title: Service metrics (calls, errors, latency)
    description: >-
      Time series of one application metric per service: one row per (service, metric,
      timestamp). Filter on metric (required, '<metricId>.<aggregation>' e.g. errors.mean,
      calls.sum, latency.p95, http.5xx.sum; IN fans out one request per metric), service
      (contains match server-side, exact in SQL) or service_id, application_id, and ts.
    kind: timeseries
    request:
      method: POST
      path: /api/application-monitoring/metrics/services
      query: {fillTimeSeries: "true", includeSnapshotIds: "false"}
      body:
        metrics:
          - metric: "{{ filters.metric.rsplit('.', 1)[0] }}"
            aggregation: "{{ filters.metric.rsplit('.', 1)[1] | upper }}"
            granularity: "{{ filters.granularity or time.step_s }}"
        nameFilter: "{{ filters.service }}"
        serviceId: "{{ filters.service_id }}"
        applicationId: "{{ filters.application_id }}"
        applicationBoundaryScope: "{{ filters.boundary_scope or 'ALL' }}"
        pagination: {page: 1, pageSize: 200}
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: metric, required: true, ops: ["=", "in"], max_fan_out: 6, description: "'<metricId>.<aggregation>' in lower case (see query language instana_metric)", examples: [errors.mean]}
      - {column: service, description: "Service name (server-side contains match)", examples: [payment]}
      - {column: service_id, description: "Service id (exact)"}
      - {column: application_id, description: "Restrict to calls of one application perspective"}
      - {column: boundary_scope, description: "ALL (default) | INBOUND"}
      - {column: granularity, type: BIGINT, description: "Bucket size in SECONDS (default ~300 points over the window; max 600 points)"}
    time: {column: ts, default_lookback: 1h, max_window: 31d, retention: 365d}
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: metrics, as: m}
        - {explode: "@m.value", as: p}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms, description: "Bucket timestamp (UTC)"}
      - {name: value, type: DOUBLE, path: "@p[1]", description: "latency in ms; errors as a 0..1 rate; calls as count (SUM) or per second"}
      - {name: metric, expr: "filters.metric or m.key", description: "Requested '<metricId>.<aggregation>'"}
      - {name: metric_key, path: "@m.key", description: "Metric key as returned, e.g. errors.mean"}
      - {name: service, path: "service.label"}
      - {name: service_id, path: "service.id"}
      - {name: types, type: JSON, path: "service.types"}
      - {name: technologies, type: JSON, path: "service.technologies"}
      - {name: adjusted_to, type: TIMESTAMP, path: "$.adjustedTimeframe.to", transform: epoch_ms, description: "End of the window as adjusted to whole buckets"}
      - {name: total_hits, type: BIGINT, path: "$.totalHits", description: "Services matching; only the first 200 are returned (narrow service/application when larger)"}
      - {name: application_id, filter_only: true}
      - {name: boundary_scope, filter_only: true}
      - {name: granularity, type: BIGINT, filter_only: true}
    pitfalls:
      - "The metric must use an aggregation allowed for it (calls: SUM/PER_SECOND; errors: MEAN; latency: MEAN/P50..P99/MAX/MIN): a wrong pair is an HTTP 400."
      - "service filters with 'contains': 'shop' also returns 'shop-db'; the SQL predicate keeps only the exact label."
      - "Rows are only produced for services that had calls in the window; fillTimeSeries=true fills missing buckets with 0."
    examples:
      - sql: >-
          SELECT service, max(value) AS peak_error_rate, arg_max(ts, value) AS peak_at
          FROM instana_service_metrics
          WHERE metric = 'errors.mean' AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY service ORDER BY peak_error_rate DESC LIMIT 10
        description: Services with the highest error rate in the incident hour and when they peaked.
      - sql: >-
          SELECT ts, metric, value FROM instana_service_metrics
          WHERE service = 'payment' AND metric IN ('latency.p95', 'calls.sum', 'errors.mean')
          ORDER BY metric, ts
        description: Latency, throughput and error-rate curves of one service.
    fixtures:
      - file: service_metrics.json
        note: "Verbatim 200 example of getServicesMetrics (POST /api/application-monitoring/metrics/services) from the Instana OpenAPI spec."
        filters: {metric: endpoints.distinct_count}
        expect_rows: 1
        expect_columns: {ts: "2022-11-23T08:03:00Z", value: 4.0, metric: endpoints.distinct_count, service: discount, service_id: c467ca0fa21477fee3cde75a140b2963307388a7}
      - file: service_metrics_error_rate.json
        note: "Verbatim sample response of 'Tutorial: Retrieving the error rate for a service' (Applications developer guide on the IBM API Hub)."
        filters: {metric: errors.mean}
        expect_rows: 1
        expect_columns: {ts: "2024-07-10T16:40:50Z", value: 0.0, metric_key: errors.mean, service: service_label_1}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getServicesMetrics

  # ------------------------------------------------------------------------------------------
  - name: instana_application_metrics
    title: Application perspective metrics
    description: >-
      Time series of one metric per application perspective: one row per (application,
      metric, timestamp). Filter on metric (required, e.g. calls.sum, errors.mean, latency.p95),
      application (contains) or application_id, and ts.
    kind: timeseries
    request:
      method: POST
      path: /api/application-monitoring/metrics/applications
      query: {fillTimeSeries: "true"}
      body:
        metrics:
          - metric: "{{ filters.metric.rsplit('.', 1)[0] }}"
            aggregation: "{{ filters.metric.rsplit('.', 1)[1] | upper }}"
            granularity: "{{ filters.granularity or time.step_s }}"
        nameFilter: "{{ filters.application }}"
        applicationId: "{{ filters.application_id }}"
        applicationBoundaryScope: "{{ filters.boundary_scope or 'INBOUND' }}"
        pagination: {page: 1, pageSize: 200}
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: metric, required: true, ops: ["=", "in"], max_fan_out: 6, description: "'<metricId>.<aggregation>' in lower case", examples: [calls.sum]}
      - {column: application, description: "Application perspective name (contains)", examples: [demoApp]}
      - {column: application_id, description: "Application perspective id (exact)"}
      - {column: boundary_scope, description: "INBOUND (default: calls into the application) | ALL (inbound + internal)"}
      - {column: granularity, type: BIGINT, description: "Bucket size in SECONDS (default ~300 points)"}
    time: {column: ts, default_lookback: 1h, max_window: 31d, retention: 365d}
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: metrics, as: m}
        - {explode: "@m.value", as: p}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms}
      - {name: value, type: DOUBLE, path: "@p[1]"}
      - {name: metric, expr: "filters.metric or m.key"}
      - {name: metric_key, path: "@m.key"}
      - {name: application, path: "application.label"}
      - {name: application_id, path: "application.id"}
      - {name: boundary_scope, path: "application.boundaryScope"}
      - {name: adjusted_to, type: TIMESTAMP, path: "$.adjustedTimeframe.to", transform: epoch_ms}
      - {name: total_hits, type: BIGINT, path: "$.totalHits", description: "Perspectives matching; only the first 200 are returned"}
      - {name: granularity, type: BIGINT, filter_only: true}
    examples:
      - sql: >-
          SELECT ts, value AS calls FROM instana_application_metrics
          WHERE application = 'Robot Shop' AND metric = 'calls.sum'
          ORDER BY ts
        description: Throughput of one application perspective over the window.
    fixtures:
      - file: application_metrics.json
        note: "Verbatim 200 example of getApplicationMetrics (POST /api/application-monitoring/metrics/applications) from the Instana OpenAPI spec."
        filters: {metric: latency.mean}
        expect_rows: 1
        expect_columns: {ts: "2022-11-23T08:03:00Z", value: 4.0, metric: latency.mean, application: demoApp, application_id: Jv83WpUmSKiiCWIpi-reSQ, boundary_scope: ALL}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getApplicationMetrics

  # ------------------------------------------------------------------------------------------
  - name: instana_endpoint_metrics
    title: Endpoint metrics
    description: >-
      Time series of one metric per endpoint (HTTP route, RPC, DB statement group, topic): one
      row per (endpoint, metric, timestamp). Filter on metric (required), endpoint (contains),
      endpoint_id, service_id, application_id and ts. Use to find which endpoint of a service
      broke.
    kind: timeseries
    request:
      method: POST
      path: /api/application-monitoring/metrics/endpoints
      query: {fillTimeSeries: "true"}
      body:
        metrics:
          - metric: "{{ filters.metric.rsplit('.', 1)[0] }}"
            aggregation: "{{ filters.metric.rsplit('.', 1)[1] | upper }}"
            granularity: "{{ filters.granularity or time.step_s }}"
        nameFilter: "{{ filters.endpoint }}"
        endpointId: "{{ filters.endpoint_id }}"
        serviceId: "{{ filters.service_id }}"
        applicationId: "{{ filters.application_id }}"
        endpointTypes: "{{ filters.endpoint_type | as_list if filters.endpoint_type else None }}"
        excludeSynthetic: true
        applicationBoundaryScope: ALL
        pagination: {page: 1, pageSize: 200}
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: metric, required: true, ops: ["=", "in"], max_fan_out: 6, description: "'<metricId>.<aggregation>' in lower case", examples: [errors.mean]}
      - {column: endpoint, description: "Endpoint name (contains), e.g. 'GET /api/'", examples: ['GET /api/']}
      - {column: endpoint_id, description: "Endpoint id (exact)"}
      - {column: service_id, description: "Only endpoints of this service id (from instana_services)", examples: ['05b145cfb6fbc24d08a8e01155c0aa2bf8460c87']}
      - {column: application_id, description: "Only endpoints of this application perspective"}
      - {column: endpoint_type, ops: ["=", "in"], fan_out: false, description: "HTTP, RPC, DATABASE, MESSAGING, BATCH, GRAPHQL, ..."}
      - {column: granularity, type: BIGINT, description: "Bucket size in SECONDS (default ~300 points)"}
    time: {column: ts, default_lookback: 1h, max_window: 31d, retention: 365d}
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: metrics, as: m}
        - {explode: "@m.value", as: p}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms}
      - {name: value, type: DOUBLE, path: "@p[1]"}
      - {name: metric, expr: "filters.metric or m.key"}
      - {name: metric_key, path: "@m.key"}
      - {name: endpoint, path: "endpoint.label"}
      - {name: resource, path: "endpoint.label", description: "Canonical alias of endpoint"}
      - {name: endpoint_id, path: "endpoint.id"}
      - {name: endpoint_type, path: "endpoint.type"}
      - {name: service_id, path: "endpoint.serviceId"}
      - {name: technologies, type: JSON, path: "endpoint.technologies"}
      - {name: synthetic_type, path: "endpoint.syntheticType"}
      - {name: total_hits, type: BIGINT, path: "$.totalHits", description: "Endpoints matching; only the first 200 are returned"}
      - {name: application_id, filter_only: true}
      - {name: granularity, type: BIGINT, filter_only: true}
    examples:
      - sql: >-
          SELECT endpoint, max(value) AS peak_error_rate FROM instana_endpoint_metrics
          WHERE service_id = '05b145cfb6fbc24d08a8e01155c0aa2bf8460c87' AND metric = 'errors.mean'
          GROUP BY endpoint ORDER BY peak_error_rate DESC LIMIT 10
        description: Endpoints of one service ranked by error rate.
    fixtures:
      - file: endpoint_metrics.json
        note: "Verbatim 200 example of getEndpointsMetrics (POST /api/application-monitoring/metrics/endpoints) from the Instana OpenAPI spec."
        filters: {metric: latency.mean}
        expect_rows: 1
        expect_columns: {value: 2434.5625, endpoint: robot-shop, endpoint_type: MESSAGING, service_id: 05b145cfb6fbc24d08a8e01155c0aa2bf8460c87, synthetic_type: NON_SYNTHETIC}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getEndpointsMetrics

  # ------------------------------------------------------------------------------------------
  - name: instana_metrics
    title: Application data metrics (tag-filtered, v2)
    description: >-
      One series per metric over calls matching exact tag filters (the upgraded 'Get
      Application Data Metrics' endpoint): filter on metric (required), service (exact
      service.name), endpoint (exact endpoint.name), application (exact application.name), or any
      tag via tag + tag_value (+ tag_operator, tag_entity). One row per (metric, timestamp).
      Best for 'the error rate of service X' with exact names.
    kind: timeseries
    request:
      method: POST
      path: /api/application-monitoring/v2/metrics
      body:
        metrics:
          - metric: "{{ filters.metric.rsplit('.', 1)[0] }}"
            aggregation: "{{ filters.metric.rsplit('.', 1)[1] | upper }}"
            granularity: "{{ filters.granularity or time.step_s }}"
        includeInternal: false
        includeSynthetic: false
        tagFilterExpression:
          type: EXPRESSION
          logicalOperator: AND
          elements:
            - "{{ {'type': 'TAG_FILTER', 'name': 'service.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.service} if filters.service else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'endpoint.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.endpoint} if filters.endpoint else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'application.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.application} if filters.application else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': filters.tag, 'operator': (filters.tag_operator or 'EQUALS'), 'entity': (filters.tag_entity or 'DESTINATION'), 'value': filters.tag_value} if filters.tag else None }}"
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: metric, required: true, ops: ["=", "in"], max_fan_out: 6, description: "'<metricId>.<aggregation>' in lower case", examples: [latency.mean]}
      - {column: service, description: "Exact service name (tag service.name, DESTINATION)", examples: [warehouse]}
      - {column: endpoint, description: "Exact endpoint name (tag endpoint.name)"}
      - {column: application, description: "Exact application perspective name (tag application.name)"}
      - {column: tag, description: "Any tag from the application tag catalog, e.g. call.http.status, kubernetes.namespace.name, call.type"}
      - {column: tag_value, description: "Value for tag"}
      - {column: tag_operator, description: "EQUALS (default), CONTAINS, NOT_EQUAL, GREATER_THAN, STARTS_WITH, REGEX_MATCH, ..."}
      - {column: tag_entity, description: "DESTINATION (default), SOURCE, NOT_APPLICABLE"}
      - {column: granularity, type: BIGINT, description: "Bucket size in SECONDS (default ~300 points)"}
    time: {column: ts, default_lookback: 1h, max_window: 31d, retention: 365d}
    response:
      rows_path: "$.metrics"
      expand:
        - {entries: ".", as: m}
        - {explode: "@m.value", as: p}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms}
      - {name: value, type: DOUBLE, path: "@p[1]"}
      - {name: metric, expr: "filters.metric or m.key"}
      - {name: metric_key, path: "@m.key"}
      - {name: adjusted_to, type: TIMESTAMP, path: "$.adjustedTimeframe.to", transform: epoch_ms}
      - {name: service, filter_only: true}
      - {name: endpoint, filter_only: true}
      - {name: application, filter_only: true}
      - {name: tag, filter_only: true}
      - {name: tag_value, filter_only: true}
      - {name: tag_operator, filter_only: true}
      - {name: tag_entity, filter_only: true}
      - {name: granularity, type: BIGINT, filter_only: true}
    pitfalls:
      - "Returns one series for all matching calls (no group-by): use instana_service_metrics / instana_call_groups to compare services."
      - "An exact name that does not exist returns an empty/zero series, not an error."
