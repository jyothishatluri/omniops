        retrievalSize: 200
    filters:
      - {column: trace_id, required: true, description: "Trace id (instana_traces.trace_id)", examples: [daa9141549aea210]}
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: span_id, path: id, description: "Call id"}
      - {name: parent_id, path: parentId}
      - {name: foreign_parent_id, path: foreignParentId}
      - {name: name, path: name, description: "Call name, e.g. GET /api/shipping/cities/dk"}
      - {name: ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms}
      - {name: duration_ms, type: DOUBLE, path: duration}
      - {name: self_time_ms, type: DOUBLE, path: minSelfTime}
      - {name: network_time_ms, type: DOUBLE, path: networkTime}
      - {name: error_count, type: BIGINT, path: errorCount}
      - {name: call_count, type: BIGINT, path: callCount, description: "Calls batched into this row"}
      - {name: service, path: "destination.service.label"}
      - {name: service_id, path: "destination.service.id"}
      - {name: endpoint, path: "destination.endpoint.label"}
      - {name: resource, path: "destination.endpoint.label"}
      - {name: endpoint_type, path: "destination.endpoint.type"}
      - {name: technologies, type: JSON, path: "destination.technologies"}
      - {name: can_load_more, type: BOOLEAN, path: "$.canLoadMore"}
      - {name: trace_id, filter_only: true, description: "Trace id requested (the call rows do not repeat it)"}
    pitfalls:
      - "Only the first 200 calls are fetched; can_load_more = true means the trace is larger."
    examples:
      - sql: "SELECT ts, service, name, duration_ms, self_time_ms, error_count, span_id, parent_id FROM instana_trace_calls WHERE trace_id = 'daa9141549aea210' ORDER BY ts"
        description: Walk one trace call by call to find the failing or slow hop.
