    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getTraceDownload

  # ------------------------------------------------------------------------------------------
  - name: instana_service_map
    title: Service topology (call paths)
    description: >-
      Service-to-service connections in the window with calls, mean latency and error rate:
      one row per (caller, callee). Filter on application_id (+ boundary_scope) and ts. Names are
      resolved from the response's service list.
    kind: entities
    request:
      method: GET
      path: /api/application-monitoring/topology/services
      query:
        windowSize: "{{ time.range_s * 1000 }}"
        to: "{{ time.end | epoch_ms }}"
        applicationId: "{{ filters.application_id }}"
        applicationBoundaryScope: "{{ filters.boundary_scope }}"
    filters:
      - {column: application_id, description: "Only connections in this application perspective"}
      - {column: boundary_scope, description: "INBOUND (default with application_id) | ALL"}
    time: {column: ts, default_lookback: 1h, max_window: 31d, retention: 7d}
    response:
      rows_path: "$.connections[*]"
    columns:
      - {name: source_id, path: from, description: "Calling service id"}
      - {name: source, expr: "(root.services | selectattr('id', 'equalto', _['from']) | map(attribute='label') | first) or _['from']", description: "Calling service name"}
      - {name: target_id, path: to}
      - {name: target, expr: "(root.services | selectattr('id', 'equalto', _['to']) | map(attribute='label') | first) or _['to']", description: "Called service name"}
      - {name: calls, type: BIGINT, path: calls}
      - {name: latency_ms, type: DOUBLE, path: latency, description: "Mean latency of the calls (ms)"}
      - {name: error_rate, type: DOUBLE, path: errorRate, description: "0..1"}
      - {name: application_id, filter_only: true}
      - {name: boundary_scope, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    examples:
      - sql: "SELECT source, target, calls, error_rate, latency_ms FROM instana_service_map WHERE target = 'payment' OR source = 'payment' ORDER BY error_rate DESC"
        description: Upstream callers and downstream dependencies of one service with their health.
    fixtures:
      - file: services_map.json
        note: "Verbatim 200 example of getServicesMap (GET /api/application-monitoring/topology/services) from the Instana OpenAPI spec (the caller id is not in its services list, so source falls back to the id)."
        expect_rows: 1
