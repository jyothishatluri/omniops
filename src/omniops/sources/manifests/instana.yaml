    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getServicesMap

  # ------------------------------------------------------------------------------------------
  - name: instana_events
    title: Events (incidents, issues, changes)
    description: >-
      Events in the window: incidents (correlated, with probable cause), issues (alerts on one
      entity) and changes (deployments, config changes, restarts, k8s events). One row per event.
      Filter on type (incident | issue | change; IN allowed), ts, and only_new = true to exclude
      events triggered before the window.
    kind: events
    request:
      method: GET
      path: /api/events
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        eventTypeFilters: "{{ filters.type | as_list | map('upper') | list if filters.type else None }}"
        excludeTriggeredBefore: "{{ 'true' if filters.only_new else None }}"
        includeAgentMonitoringIssues: "{{ 'true' if filters.include_agent_issues else None }}"
        includeKubernetesInfoEvents: "{{ 'true' if filters.include_k8s_info else None }}"
    filters:
      - {column: type, ops: ["=", "in"], fan_out: false, description: "incident | issue | change (lower case in results)", examples: [incident]}
      - {column: only_new, type: BOOLEAN, description: "true = exclude events that started before the window"}
      - {column: include_agent_issues, type: BOOLEAN, description: "true = include agent monitoring issues"}
      - {column: include_k8s_info, type: BOOLEAN, description: "true = include Kubernetes info events"}
    time: {column: ts, default_lookback: 6h, max_window: 31d}
    response:
      rows_path: "$"
    columns:
      - {name: id, path: eventId}
      - {name: type, path: type, description: "incident | issue | change"}
      - {name: state, path: state, description: "open | closed"}
      - {name: title, path: problem}
      - {name: message, path: detail}
      - {name: ts, type: TIMESTAMP, path: start, transform: epoch_ms, description: "Event start"}
      - {name: end_ts, type: TIMESTAMP, path: end, transform: epoch_ms}
      - {name: severity_code, type: BIGINT, path: severity, description: "10 critical, 5 warning, negative for changes/info"}
      - {name: severity, expr: "('critical' if _.severity >= 10 else ('warning' if _.severity >= 5 else 'info')) if _.severity is number else None", description: "critical | warning | info (derived from severity_code)"}
      - {name: entity_name, path: entityName, description: "Entity type name, e.g. Kubernetes Pod, Service, Host, .NET App"}
      - {name: entity_label, path: entityLabel, description: "Affected entity label, e.g. the service or pod name"}
      - {name: service, expr: "_.entityLabel if (_.entityName or '') | lower == 'service' else None", description: "entity_label when the affected entity is a service"}
      - {name: entity_type, path: entityType, description: "APPLICATION, SERVICE, ENDPOINT, INFRASTRUCTURE, ..."}
      - {name: short_code, path: shortCode}
      - {name: event_specification_id, path: eventSpecificationId, description: "Built-in/custom event or Smart Alert config that created it"}
      - {name: triggering_event_id, path: triggeringEventId}
      - {name: probable_cause, type: JSON, path: probableCause, description: "Incidents only: probable root cause"}
      - {name: recent_events, type: JSON, path: recentEvents, description: "Incidents only: related event ids"}
      - {name: metrics, type: JSON, path: metrics, description: "Metrics behind the event [{metricName, snapshotId, entityId}]"}
      - {name: snapshot_id, path: snapshotId}
      - {name: only_new, type: BOOLEAN, filter_only: true}
      - {name: include_agent_issues, type: BOOLEAN, filter_only: true}
      - {name: include_k8s_info, type: BOOLEAN, filter_only: true}
    pitfalls:
      - "Events active in the window are returned even if they started earlier: filter state = 'open' for what is still firing, or only_new = true."
      - "Change events include very chatty Kubernetes events (pulled, scheduled); filter title/entity_name in SQL."
    examples:
      - sql: >-
          SELECT ts, type, severity, state, title, entity_name, entity_label FROM instana_events
          WHERE type IN ('incident', 'issue') AND ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC
        description: Incidents and issues around the incident window.
      - sql: "SELECT ts, title, message, entity_label FROM instana_events WHERE type = 'change' AND ts >= TIMESTAMP '2026-10-01 08:00:00' ORDER BY ts DESC LIMIT 100"
        description: Changes (deploys, restarts, config changes) before the incident.
    fixtures:
      - file: events.json
        note: "Verbatim 200 example of getEvents (GET /api/events) from the Instana OpenAPI spec."
        expect_rows: 1
        expect_columns: {id: gM73SycATrOFMcL5qspByQ, type: incident, state: open, title: New Event-test-01, ts: "2024-02-01T08:00:19Z", severity_code: 5, severity: warning, entity_label: powershell.exe, entity_type: INFRASTRUCTURE}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getEvents

  # ------------------------------------------------------------------------------------------
  - name: instana_event_detail
    title: One event (incident detail)
    description: >-
      One event by id with its metadata, probable cause and related events. Filter on event_id
      (required). Use after instana_events to read an incident's probable cause.
    kind: incidents
    request:
      method: GET
      path: "/api/events/{{ filters.event_id | urlencode }}"
      query: {includeMetadata: "true"}
      accept_status: [404]
    filters:
      - {column: event_id, required: true, description: "Event id (instana_events.id)", examples: [LZOGo1lXR4WeCB2ftgtGGQ]}
    response:
      rows_path: "$"
    columns:
      - {name: event_id, path: eventId}
      - {name: type, path: type}
      - {name: state, path: state}
      - {name: title, path: problem}
      - {name: message, path: detail}
      - {name: ts, type: TIMESTAMP, path: start, transform: epoch_ms}
      - {name: end_ts, type: TIMESTAMP, path: end, transform: epoch_ms}
      - {name: severity_code, type: BIGINT, path: severity}
      - {name: entity_name, path: entityName}
      - {name: entity_label, path: entityLabel}
      - {name: entity_type, path: entityType}
      - {name: probable_cause, type: JSON, path: probableCause}
      - {name: recent_events, type: JSON, path: recentEvents}
      - {name: metadata, type: JSON, path: metadata}
      - {name: metrics, type: JSON, path: metrics}
      - {name: snapshot_id, path: snapshotId}
    examples:
      - sql: "SELECT title, message, entity_label, probable_cause, recent_events FROM instana_event_detail WHERE event_id = 'LZOGo1lXR4WeCB2ftgtGGQ'"
        description: Read one incident's probable cause and related events.
    fixtures:
      - file: event.json
        note: "Verbatim 200 example of getEvent (GET /api/events/{eventId}) from the Instana OpenAPI spec."
        filters: {event_id: LZOGo1lXR4WeCB2ftgtGGQ}
        expect_rows: 1
        expect_columns: {event_id: LZOGo1lXR4WeCB2ftgtGGQ, type: change, state: closed, title: Pulled, severity_code: -2, entity_name: Kubernetes Pod}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getEvent

  # ------------------------------------------------------------------------------------------
  - name: instana_snapshots
    title: Infrastructure snapshots (hosts, containers, processes, pods...)
    description: >-
      Infrastructure entities (snapshots) of one plugin type matching a Dynamic Focus query:
      one row per snapshot with label, host and tags. Filter on plugin (host, docker,
      kubernetesPod, jvmRuntimePlatform, ...), query (DFQ, e.g. entity.kubernetes.namespace:shop),
      offline = true (also entities that went away during the window) and ts.
    kind: entities
    request:
      method: GET
      path: /api/infrastructure-monitoring/snapshots
      query:
        plugin: "{{ filters.plugin }}"
        query: "{{ filters.query }}"
        to: "{{ time.end | epoch_ms }}"
        windowSize: "{{ time.range_s * 1000 }}"
        size: "{{ [limit or 1000, 1000] | min }}"
        offline: "{{ 'true' if filters.offline else None }}"
    filters:
      - {column: plugin, description: "Entity type plugin: host, docker, kubernetesPod, kubernetesNode, process, jvmRuntimePlatform, ...", examples: [host]}
      - {column: query, description: "Dynamic Focus Query (query language instana_dfq)", examples: ['entity.zone:"eu-west-1"']}
      - {column: offline, type: BOOLEAN, description: "true = include snapshots that were online at any time in the window (default: online at the end)"}
    time: {column: ts, default_lookback: 1h, max_window: 31d}
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: snapshot_id, path: snapshotId}
      - {name: plugin, path: plugin}
      - {name: label, path: label, description: "Friendly entity label"}
      - {name: host, path: host, description: "Host id the entity runs on"}
      - {name: tags, type: JSON, path: tags}
      - {name: from_ts, type: TIMESTAMP, path: from, transform: epoch_ms, description: "First seen in the window"}
      - {name: to_ts, type: TIMESTAMP, path: to, transform: epoch_ms, description: "Gone at (NULL = still online)"}
      - {name: data, type: JSON, path: data}
      - {name: query, filter_only: true}
      - {name: offline, type: BOOLEAN, filter_only: true}
      - {name: ts, type: TIMESTAMP, filter_only: true}
    pitfalls:
      - "Snapshot queries count against the 1,000 calls/hour infrastructure limit."
      - "host is the agent's host id (e.g. EC2-i-...), label the friendly name; filter in SQL on either."
    examples:
      - sql: "SELECT label, host, snapshot_id, to_ts FROM instana_snapshots WHERE plugin = 'host' ORDER BY label"
        description: Host inventory (hosts role).
      - sql: "SELECT label, to_ts FROM instana_snapshots WHERE plugin = 'kubernetesPod' AND query = 'entity.kubernetes.namespace:shop' AND offline = true AND to_ts IS NOT NULL"
        description: Pods of a namespace that went away during the window.
    fixtures:
      - file: snapshots.json
        note: "Verbatim 200 example of getSnapshots (GET /api/infrastructure-monitoring/snapshots) from the Instana OpenAPI spec."
        filters: {plugin: host}
        expect_rows: 3
        expect_columns: {snapshot_id: ZoKkksp277FMLSXIghPKdjZcvfE, plugin: host, label: ip-10-255-200-30.instana.io, host: EC2-i-03afb0ac5188f57f3, to_ts: null}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getSnapshots

  # ------------------------------------------------------------------------------------------
  - name: instana_infrastructure_metrics
    title: Infrastructure metrics
    description: >-
      Time series of infrastructure metrics (cpu.user, memory.used, load.1min, ...) for entities of
      one plugin selected by a Dynamic Focus query or snapshot ids: one row per (entity, metric,
      timestamp). Filter on plugin (required), metric (required; IN sends up to 5 metrics in one
      call), query (DFQ) or snapshot_id, rollup (seconds) and ts.
    kind: timeseries
    request:
      method: POST
      path: /api/infrastructure-monitoring/metrics
      body:
        plugin: "{{ filters.plugin }}"
        metrics: "{{ filters.metric | as_list }}"
        query: "{{ filters.query }}"
        snapshotIds: "{{ filters.snapshot_id | as_list if filters.snapshot_id else None }}"
        rollup: "{{ filters.rollup or (([1, 5, 60, 300, 3600] | select('ge', [time.range_s / 600, 60 if ((now_utc() - time.end).total_seconds() > 86400) else 1] | max) | first) or 3600) }}"
        timeFrame:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
    filters:
      - {column: plugin, required: true, description: "Entity type plugin: host, docker, kubernetesPod, jvmRuntimePlatform, ...", examples: [host]}
      - {column: metric, required: true, ops: ["=", "in"], fan_out: false, description: "Metric id(s) of the plugin (max 5 per call), e.g. cpu.user, cpu.used, memory.used, load.1min", examples: [cpu.user]}
      - {column: query, description: "Dynamic Focus Query; required unless snapshot_id is given", examples: ['entity.host.name:ip-10-255-200-30.instana.io']}
      - {column: snapshot_id, ops: ["=", "in"], fan_out: false, description: "Snapshot id(s) from instana_snapshots (max 30 entities per call)"}
      - {column: rollup, type: BIGINT, description: "1, 5, 60, 300 or 3600 seconds (default: smallest giving <= 600 points; >= 60 for windows older than a day)"}
    time: {column: ts, default_lookback: 1h, max_window: 31d, retention: 396d}
    response:
      rows_path: "$.items[*]"
      expand:
        - {entries: metrics, as: m}
        - {explode: "@m.value", as: p}
    columns:
      - {name: ts, type: TIMESTAMP, path: "@p[0]", transform: epoch_ms}
      - {name: value, type: DOUBLE, path: "@p[1]", description: "Metric value (cpu.* as 0..1 fractions on host)"}
      - {name: metric, path: "@m.key"}
      - {name: snapshot_id, path: snapshotId}
      - {name: label, path: label}
      - {name: host, path: host}
      - {name: plugin, path: plugin}
      - {name: tags, type: JSON, path: tags}
      - {name: query, filter_only: true}
      - {name: rollup, type: BIGINT, filter_only: true}
    pitfalls:
      - "At most 600 points per metric, 30 entities per call and 1,000 calls/hour: query a few entities, not 'all hosts'."
      - "The DFQ must select entities AT or ABOVE the plugin's level (query entity.selfType:java with plugin host returns nothing)."
      - "An empty or '*' query without snapshot ids is rejected (HTTP 400)."
    examples:
      - sql: >-
          SELECT label, metric, max(value) AS peak FROM instana_infrastructure_metrics
          WHERE plugin = 'host' AND metric IN ('cpu.user', 'memory.used') AND query = 'entity.zone:"eu-west-1"'
          GROUP BY label, metric ORDER BY peak DESC
        description: Peak CPU and memory of hosts in a zone.
    fixtures:
      - file: infrastructure_metrics_schema.json
        note: "Built strictly from the InfrastructureMetricResult schema (items[] of MetricItem: snapshotId, plugin, from, to, tags, label, host, metrics) - the spec has no 200 example; metric values use the [[epoch_ms, value]] pairs of the documented application-metric examples, entity values reused from the getSnapshots example."
        filters: {plugin: host, metric: [cpu.user, memory.used]}
        expect_rows: 3
        expect_columns: {ts: "2024-02-01T11:00:00Z", value: 0.12, metric: cpu.user, label: ip-10-255-200-30.instana.io, snapshot_id: ZoKkksp277FMLSXIghPKdjZcvfE}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getInfrastructureMetrics

  # ------------------------------------------------------------------------------------------
  - name: instana_releases
    title: Releases (deployment markers)
    description: >-
      Release markers (deployments sent to Instana by pipelines) in the window with the
      applications and services they are scoped to. One row per release. Filter on ts.
    kind: changes
    request:
      method: GET
      path: /api/releases
      query:
        from: "{{ time.start | epoch_ms }}"
        to: "{{ time.end | epoch_ms }}"
        maxResults: "{{ [limit or 1000, 1000] | min }}"
    time: {column: ts, default_lookback: 24h, max_window: 90d}
    response:
      rows_path: "$"
    columns:
      - {name: id, path: id}
      - {name: title, path: name, description: "Release name, e.g. frontend/release-2000"}
      - {name: version, path: name}
      - {name: ts, type: TIMESTAMP, path: start, transform: epoch_ms, description: "Release time"}
      - {name: last_updated, type: TIMESTAMP, path: lastUpdated, transform: epoch_ms}
      - {name: service, expr: "((_.services or []) | map(attribute='name') | select | join(', ')) or ((_.scopes or []) | map(attribute='serviceName') | select | join(', ')) or None", description: "Scoped service names (comma-separated)"}
      - {name: application, expr: "((_.applications or []) | map(attribute='name') | select | join(', ')) or ((_.scopes or []) | map(attribute='applicationName') | select | join(', ')) or None"}
      - {name: services, type: JSON, path: services}
      - {name: applications, type: JSON, path: applications}
      - {name: scopes, type: JSON, path: scopes}
    pitfalls:
      - "Releases exist only when a pipeline posts them (POST /api/releases); none in the window is not proof nothing was deployed: also check instana_events type = 'change'."
    examples:
      - sql: "SELECT ts, title, service, application FROM instana_releases WHERE ts >= TIMESTAMP '2026-10-01 00:00:00' ORDER BY ts DESC"
        description: Deployments before the incident.
    fixtures:
      - file: releases.json
        note: "Verbatim 200 example of getAllReleases (GET /api/releases) from the Instana OpenAPI spec."
        expect_rows: 1
        expect_columns: {id: Tiu16hLCTniHDtHb_uDV1w, title: "demo-app/main-**", ts: "2024-02-28T03:43:02Z", service: null}
      - file: releases_scoped.json
        note: "Built strictly from the ReleaseWithMetadata schema (applications[], services[] with scopedTo) using the field examples given in the schema descriptions."
        expect_rows: 1
        expect_columns: {title: frontend/release-2000, service: payment, application: app1, ts: "2025-03-19T02:06:16Z"}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getAllReleases

  # ------------------------------------------------------------------------------------------
  - name: instana_logs
    title: Logs
    description: >-
      Log records in the window (newest first): one row per log line with level, message,
      trace id, host, container and pod. Filter on service (exact service.name), level
      (log.level, e.g. ERROR), message (contains, log.message), host (host.name), pod
      (kubernetes.pod.name), namespace (kubernetes.namespace.name), stream (log.streamName) and ts.
      Up to 1,000 lines (5 pages of 200; the API allows offsets up to 2,000).
    kind: logs
    request:
      method: POST
      path: /api/logging/logs/getLogs/v1
      body:
        timeConfig:
          to: "{{ time.end | epoch_ms }}"
          windowSize: "{{ time.range_s * 1000 }}"
          autoRefresh: false
        requestedTags: [log.traceId, log.applications, process.id, host.name, docker.containerName, kubernetes.pod.name, kubernetes.namespace.name, kubernetes.container.name, log.level, log.exception.message]
        tagFilterExpression:
          type: EXPRESSION
          logicalOperator: AND
          elements:
            - "{{ {'type': 'TAG_FILTER', 'name': 'service.name', 'operator': 'EQUALS', 'entity': 'DESTINATION', 'value': filters.service} if filters.service else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'log.level', 'operator': 'EQUALS', 'entity': 'NOT_APPLICABLE', 'value': filters.level} if filters.level else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'log.message', 'operator': 'CONTAINS', 'entity': 'NOT_APPLICABLE', 'value': filters.query} if filters.query else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'host.name', 'operator': 'EQUALS', 'entity': 'NOT_APPLICABLE', 'value': filters.host} if filters.host else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'kubernetes.pod.name', 'operator': 'EQUALS', 'entity': 'NOT_APPLICABLE', 'value': filters.pod} if filters.pod else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'kubernetes.namespace.name', 'operator': 'EQUALS', 'entity': 'NOT_APPLICABLE', 'value': filters.namespace} if filters.namespace else None }}"
            - "{{ {'type': 'TAG_FILTER', 'name': 'log.streamName', 'operator': 'EQUALS', 'entity': 'NOT_APPLICABLE', 'value': filters.stream} if filters.stream else None }}"
        retrievalSize: 200
        offset: 0
        orderDirection: DESC
    filters:
      - {column: service, description: "Exact service.name (DESTINATION)", examples: [dispatch]}
      - {column: level, description: "log.level value, e.g. ERROR, WARN, INFO", examples: [ERROR]}
      - {column: query, description: "Substring of the log message (log.message CONTAINS)", examples: [timeout]}
      - {column: host, description: "Exact host.name", variants: hostname}
      - {column: pod, description: "Exact kubernetes.pod.name"}
      - {column: namespace, description: "Exact kubernetes.namespace.name"}
      - {column: stream, description: "log.streamName, e.g. log.go, stdout"}
    time: {column: ts, default_lookback: 1h, max_window: 7d}
    pagination: {type: offset, offset_param: body.offset, limit_param: body.retrievalSize, page_size: 200, max_pages: 5, has_more_path: "$.canLoadMore"}
    response:
      rows_path: "$.items[*]"
    columns:
      - {name: ts, type: TIMESTAMP, path: timestamp, transform: epoch_ms, description: "Log timestamp (the API sends epoch ms as a string)"}
      - {name: level, path: logLevel}
      - {name: message, path: message}
      - {name: trace_id, path: traceId}
      - {name: host, path: hostName}
      - {name: pod, path: kubernetesPodName}
      - {name: container, path: dockerContainerName}
      - {name: process_id, path: processId}
      - {name: application_ids, type: JSON, path: applicationIds}
      - {name: tags, type: JSON, path: tags, description: "Other requested tags [{name, key, value}] (namespace, container, exception message, custom fields)"}
      - {name: total_hits, type: BIGINT, path: "$.totalHits"}
      - {name: service, filter_only: true}
      - {name: query, filter_only: true}
      - {name: namespace, filter_only: true}
      - {name: stream, filter_only: true}
    pitfalls:
      - "Only logs ingested by Instana Log Management (or collected by the agent) are searchable; an empty result can mean logs live elsewhere."
      - "Offsets stop at 2,000: narrow by level/service/time instead of paging; total_hits shows the full match count."
      - "A tag unknown to log management (e.g. a service.name never attached to logs) matches nothing; try host or pod."
    examples:
      - sql: >-
          SELECT ts, level, host, pod, message FROM instana_logs
          WHERE service = 'dispatch' AND level = 'ERROR'
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 11:30:00'
          ORDER BY ts DESC LIMIT 100
        description: Error logs of a service in the incident window.
      - sql: "SELECT ts, message, trace_id FROM instana_logs WHERE query = 'connection refused' ORDER BY ts DESC LIMIT 50"
        description: Logs containing an error string, with trace ids to pivot to instana_trace_calls.
    fixtures:
      - file: logs.json
        note: "Verbatim '200 Logs' example of getLogs (POST /api/logging/logs/getLogs/v1) from the Instana OpenAPI spec."
        expect_rows: 1
        expect_columns: {ts: "2009-02-13T23:31:30Z", level: INFO, message: Test Message, trace_id: 000000000000000043500e1469c2f17a, host: test_host_name, pod: test_kubernetes_pod_name, total_hits: 225}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#getLogs

  # ------------------------------------------------------------------------------------------
  - name: instana_smart_alert_configs
    title: Application Smart Alert configurations
    description: >-
      Smart Alert configurations (alert rules) of one application perspective: one row per
      config with rule (metric, aggregation), threshold, time threshold, severity and scope.
      Filter on application_id (required) and optionally alert_id.
    kind: entities
    request:
      method: GET
      path: /api/events/settings/application-alert-configs
      query:
        applicationId: "{{ filters.application_id }}"
        alertIds: "{{ filters.alert_id | as_list if filters.alert_id else None }}"
    filters:
      - {column: application_id, required: true, description: "Application perspective id (instana_applications.id)", examples: [IYS1XOEcTNiT1eOD8pxgXg]}
      - {column: alert_id, ops: ["=", "in"], fan_out: false, description: "Smart Alert config id(s)"}
    response:
      rows_path: "$"
    columns:
      - {name: alert_id, path: id}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: severity_code, type: BIGINT, path: severity, description: "5 warning, 10 critical (deprecated field; see rules for per-threshold severities)"}
      - {name: alert_type, path: "rule.alertType"}
      - {name: metric, path: "rule.metricName"}
      - {name: aggregation, path: "rule.aggregation"}
      - {name: threshold_operator, path: "threshold.operator"}
      - {name: threshold_value, type: DOUBLE, path: "threshold.value"}
      - {name: threshold, type: JSON, path: threshold}
      - {name: time_threshold, type: JSON, path: timeThreshold}
      - {name: rules, type: JSON, path: rules, description: "Rules with multiple thresholds/severities (newer configs)"}
      - {name: granularity_ms, type: BIGINT, path: granularity}
      - {name: evaluation_type, path: evaluationType, description: "PER_AP, PER_AP_SERVICE, PER_AP_ENDPOINT, CUSTOM"}
      - {name: boundary_scope, path: boundaryScope}
      - {name: triggering, type: BOOLEAN, path: triggering, description: "Also opens an incident"}
      - {name: tag_filter_expression, type: JSON, path: tagFilterExpression}
      - {name: url, path: displayUrl}
      - {name: created, type: TIMESTAMP, path: created, transform: epoch_ms}
      - {name: application_id, path: applicationId}
    examples:
      - sql: "SELECT name, metric, aggregation, threshold_operator, threshold_value, time_threshold, enabled FROM instana_smart_alert_configs WHERE application_id = 'IYS1XOEcTNiT1eOD8pxgXg'"
        description: Alert rules (with thresholds) defined on an application perspective.
    fixtures:
      - file: smart_alert_configs.json
        note: "Verbatim 200 example of findAllActiveApplicationAlertConfigs (GET /api/events/settings/application-alert-configs) from the Instana OpenAPI spec."
        filters: {application_id: IYS1XOEcTNiT1eOD8pxgXg}
        expect_rows: 1
        expect_columns: {alert_id: A5VvSXR_SVG6z7YbnIHiHQ, name: Erroneous call rate is higher than normal, metric: errors, aggregation: MEAN, threshold_operator: ">=", threshold_value: 0.04, granularity_ms: 600000, evaluation_type: PER_AP, enabled: true}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#findAllActiveApplicationAlertConfigs

  # ------------------------------------------------------------------------------------------
  - name: instana_smart_alert_config
    title: One application Smart Alert configuration (by id)
    description: >-
      One application Smart Alert configuration by its id (no application id needed): rule
      (metric, aggregation), threshold, time threshold, severity, scope and tag filter. Filter on
      alert_id (required; the alert/event specification id carried by an Instana alert). Use to
      read the rule behind an incident.
    kind: entities
    request:
      method: GET
      path: "/api/events/settings/application-alert-configs/{{ filters.alert_id | urlencode }}"
      accept_status: [404]
    filters:
      - {column: alert_id, required: true, description: "Smart Alert config id (instana_smart_alert_configs.alert_id / event_specification_id of an event)", examples: [A5VvSXR_SVG6z7YbnIHiHQ]}
    response:
      rows_path: "$"
    columns:
      - {name: alert_id, path: id}
      - {name: name, path: name}
      - {name: description, path: description}
      - {name: enabled, type: BOOLEAN, path: enabled}
      - {name: severity_code, type: BIGINT, path: severity, description: "5 warning, 10 critical (deprecated field; see rules for per-threshold severities)"}
      - {name: alert_type, path: "rule.alertType"}
      - {name: metric, path: "rule.metricName"}
      - {name: aggregation, path: "rule.aggregation"}
      - {name: threshold_operator, path: "threshold.operator"}
      - {name: threshold_value, type: DOUBLE, path: "threshold.value"}
      - {name: threshold, type: JSON, path: threshold}
      - {name: time_threshold, type: JSON, path: timeThreshold}
      - {name: rules, type: JSON, path: rules}
      - {name: granularity_ms, type: BIGINT, path: granularity}
      - {name: evaluation_type, path: evaluationType}
      - {name: boundary_scope, path: boundaryScope}
      - {name: application_id, path: applicationId}
      - {name: tag_filter_expression, type: JSON, path: tagFilterExpression}
      - {name: url, path: displayUrl}
    pitfalls:
      - "Only application Smart Alerts live here; infrastructure, website, mobile and synthetic Smart Alerts and built-in events have their own settings endpoints (a 404 then means 'not an application alert', not 'deleted')."
    examples:
      - sql: "SELECT name, metric, aggregation, threshold_operator, threshold_value, time_threshold, evaluation_type FROM instana_smart_alert_config WHERE alert_id = 'A5VvSXR_SVG6z7YbnIHiHQ'"
        description: The threshold and evaluation window of the Smart Alert that fired.
    fixtures:
      - file: smart_alert_config.json
        note: "The by-id response is the same ApplicationAlertConfigWithMetadata object as the list items: fixture = the object of the verbatim 200 example of findAllActiveApplicationAlertConfigs (Instana OpenAPI spec)."
        filters: {alert_id: A5VvSXR_SVG6z7YbnIHiHQ}
        expect_rows: 1
        expect_columns: {alert_id: A5VvSXR_SVG6z7YbnIHiHQ, metric: errors, aggregation: MEAN, threshold_operator: ">=", threshold_value: 0.04, application_id: IYS1XOEcTNiT1eOD8pxgXg}
    docs_url: https://developer.ibm.com/apis/catalog/instana--instana-rest-api/api/API--instana--instana-rest-api-documentation#findApplicationAlertConfig

roles:
  metrics:
    - table: instana_service_metrics
      filters: {service: "{{ service or '' }}", metric: "{{ ['errors.mean', 'latency.p95', 'calls.sum'] }}"}
      columns: {ts: ts, value: value, metric: metric, service: service}
      query_language: instana_metric
    - table: instana_infrastructure_metrics
      columns: {ts: ts, value: value, metric: metric, host: label}
      query_language: instana_dfq
  services:
    table: instana_services
    columns: {id: id, service: service}
  hosts:
    table: instana_snapshots
    filters: {plugin: host}
    columns: {id: snapshot_id, host: label}
  service_map:
    table: instana_service_map
    columns: {source: source, target: target, calls: calls, error_rate: error_rate}
  traces:
    table: instana_traces
    filters: {service: "{{ service or '' }}", error_only: "{{ true if error_only else '' }}"}
    columns: {ts: ts, trace_id: trace_id, service: entry_service, duration_ms: duration_ms, title: title}
  trace_detail:
    table: instana_trace_calls
    columns: {ts: ts, span_id: span_id, service: service, duration_ms: duration_ms, resource: name}
  logs:
    table: instana_logs
    filters: {service: "{{ service or '' }}", level: "{{ 'ERROR' if error_only else '' }}", host: "{{ host or '' }}", query: "{{ query or '' }}"}
    columns: {ts: ts, message: message, level: level, host: host, trace_id: trace_id}
  active_alerts:
    table: instana_events
    filters: {type: "{{ ['incident', 'issue'] }}", state: open}
    columns: {id: id, ts: ts, title: title, state: state, severity: severity, service: entity_label}
  alert_history:
    table: instana_events
    filters: {type: "{{ ['incident', 'issue'] }}"}
    columns: {id: id, ts: ts, title: title, state: state, severity: severity, service: entity_label}
  incidents:
    table: instana_events
    filters: {type: incident}
    columns: {id: id, ts: ts, title: title, state: state, severity: severity, service: entity_label}
  change_events:
    - table: instana_releases
      columns: {ts: ts, title: title, service: service, version: version}
    - table: instana_events
      filters: {type: change}
      columns: {ts: ts, title: title, service: entity_label}
  alert_rules:
    table: instana_smart_alert_config
    filters: {alert_id: "{{ rule_id or '' }}"}
    columns: {id: alert_id, name: name, threshold: threshold_value, query: metric}
    notes: "Application Smart Alerts only; the alert's event specification id is the config id."
