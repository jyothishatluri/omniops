  # ------------------------------------------------------------------------------------------
  - name: kibana_security_alerts
    title: Security detection alerts (POST /api/detection_engine/signals/search)
    description: >-
      Elastic Security detection alerts in the current space via the detection-engine search
      API (Query DSL body). One row per alert, newest first. Pushdown: workflow_status, severity,
      rule name, host, query.
    kind: alerts
    request:
      method: POST
      path: /api/detection_engine/signals/search
      body:
        size: "{{ [limit or 200, 1000] | min }}"
        sort:
          - "@timestamp": {order: desc}
        fields: ["@timestamp", "kibana.*", "host.name", "user.name", "source.ip", "destination.ip", "process.name"]
        _source: false
        query:
          bool:
            filter:
              - range:
                  "@timestamp":
                    gte: "{{ time.start | rfc3339_ms }}"
                    lte: "{{ time.end | rfc3339_ms }}"
              - "{{ {'terms': {'kibana.alert.workflow_status': filters.workflow_status | as_list} } if filters.workflow_status else None }}"
              - "{{ {'terms': {'kibana.alert.severity': filters.severity | as_list} } if filters.severity else None }}"
              - "{{ {'terms': {'kibana.alert.rule.name': filters.rule_name | as_list} } if filters.rule_name else None }}"
              - "{{ {'terms': {'host.name': filters.host | as_list} } if filters.host else None }}"
              - "{{ {'query_string': {'query': filters.query, 'default_operator': 'AND'} } if filters.query else None }}"
            must_not:
              - exists: {field: kibana.alert.building_block_type}
    filters:
      - {column: workflow_status, ops: ["=", "in"], fan_out: false, description: "open | acknowledged | closed", examples: ["open"]}
      - {column: severity, ops: ["=", "in"], fan_out: false, description: "low | medium | high | critical", examples: ["high"]}
      - {column: title, param: rule_name, ops: ["=", "in"], fan_out: false, description: "Detection rule name", examples: ["Unusual Process Execution"]}
      - {column: host, ops: ["=", "in"], fan_out: false, examples: ["Host-f43kkddfyc"]}
      - {column: query, description: "Lucene query_string over alert fields", examples: ['user.name:root']}
    time: {column: ts, default_lookback: 24h, max_window: 30d}
    response:
      rows_path: "$.hits.hits[*]"
    columns:
      - {name: ts, type: TIMESTAMP, transform: auto_time, expr: "((_['fields'] or {})['@timestamp'] or [none])[0]"}
      - {name: original_time, type: TIMESTAMP, transform: auto_time, expr: "((_['fields'] or {})['kibana.alert.original_time'] or [none])[0]"}
      - {name: id, expr: "((_['fields'] or {})['kibana.alert.uuid'] or [none])[0] or _['_id']"}
      - {name: title, expr: "((_['fields'] or {})['kibana.alert.rule.name'] or [none])[0]"}
      - {name: rule_id, expr: "((_['fields'] or {})['kibana.alert.rule.uuid'] or [none])[0]"}
      - {name: severity, expr: "((_['fields'] or {})['kibana.alert.severity'] or [none])[0]"}
      - {name: risk_score, type: DOUBLE, expr: "((_['fields'] or {})['kibana.alert.risk_score'] or [none])[0]"}
      - {name: status, expr: "((_['fields'] or {})['kibana.alert.status'] or [none])[0]"}
      - {name: workflow_status, expr: "((_['fields'] or {})['kibana.alert.workflow_status'] or [none])[0]"}
      - {name: message, expr: "((_['fields'] or {})['kibana.alert.reason'] or [none])[0]"}
      - {name: host, expr: "((_['fields'] or {})['host.name'] or [none])[0]"}
      - {name: user, expr: "((_['fields'] or {})['user.name'] or [none])[0]"}
      - {name: doc, type: JSON, path: "fields"}
      - {name: query, filter_only: true}
    pitfalls:
      - "Building-block alerts are excluded (as in the Alerts UI)."
      - "Needs the Security 'Alerts' read privilege in the space; the same documents are also readable from .alerts-security.alerts-<space> via elasticsearch_alerts."
    examples:
      - sql: "SELECT ts, title, severity, host, user, message FROM kibana_security_alerts WHERE workflow_status = 'open' AND severity IN ('high', 'critical') ORDER BY ts DESC"
        description: Open high/critical security alerts in the window.
    fixtures:
      - file: security_alerts_search.json
        note: "Envelope from the documented signals/search example response with one alert hit built from the documented Security alert schema fields (fields-API format)."
        expect_rows: 1
        expect_columns: {ts: "2025-01-17T09:12:44Z", title: Unusual Process Execution, severity: high, risk_score: 73.0, host: Host-f43kkddfyc, workflow_status: open}
      - file: security_alerts_search_aggs.json
        note: "Verbatim example response of the signals/search API reference (aggregation-only, no hits): must produce 0 rows without error."
        expect_rows: 0
    docs_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-searchalerts

  # ------------------------------------------------------------------------------------------
  - name: kibana_connectors
    title: Connectors (GET /api/actions/connectors)
    description: >-
      Action connectors that rules notify through (Slack, PagerDuty, email, webhook, index,
      Jira, ServiceNow ...): type, whether preconfigured, deprecated, missing secrets, and how
      many rules reference them. Join kibana_alerting_rules.actions[].id to id to see where a
      rule's notifications go.
    kind: entities
    request:
      method: GET
      path: /api/actions/connectors
    response:
      rows_path: "$"
    columns:
      - {name: id, path: "id"}
      - {name: name, path: "name"}
      - {name: type, path: "connector_type_id", description: ".slack, .slack_api, .pagerduty, .email, .webhook, .index, .jira, .servicenow, .opsgenie, .teams ..."}
      - {name: is_preconfigured, type: BOOLEAN, path: "is_preconfigured"}
      - {name: is_deprecated, type: BOOLEAN, path: "is_deprecated"}
      - {name: is_missing_secrets, type: BOOLEAN, path: "is_missing_secrets", description: "true: secrets lost (e.g. encryption key changed) - notifications through it fail"}
      - {name: is_system_action, type: BOOLEAN, path: "is_system_action"}
      - {name: referenced_by_count, type: BIGINT, path: "referenced_by_count", description: "Rules using this connector"}
      - {name: config, type: JSON, path: "config", description: "Non-secret configuration (index name, URL, channel ...)"}
    pitfalls:
      - "Connector execution failures are not listed here; a rule whose last_run_outcome is warning often means its action failed (see kibana_alerting_rules.last_run_warning)."
    examples:
      - sql: "SELECT name, type, referenced_by_count, is_missing_secrets FROM kibana_connectors ORDER BY referenced_by_count DESC"
        description: Notification channels and how many rules use each.
      - sql: "SELECT name, type FROM kibana_connectors WHERE is_missing_secrets OR is_deprecated"
        description: Broken or deprecated connectors (why nobody got paged).
    fixtures:
      - file: connectors.json
        note: "Verbatim example response getConnectorsResponse of the 'Get all connectors' API reference (get-actions-connectors)."
        expect_rows: 2
        expect_columns: {id: preconfigured-email-connector, name: my-preconfigured-email-notification, type: .email, is_preconfigured: true, referenced_by_count: 0, is_missing_secrets: null}
    docs_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-get-actions-connectors

  # ------------------------------------------------------------------------------------------
  - name: kibana_status
    title: Kibana status (GET /api/status)
    description: >-
      Overall Kibana health (available / degraded / unavailable / critical), Elasticsearch and
      saved-objects service levels, degraded plugins and the Kibana version. One row. Check when
      Kibana APIs fail or alerting rules stop running.
    kind: entities
    request:
      method: GET
      path: /api/status
    response:
      rows_path: "$"
    columns:
      - {name: name, path: "name"}
      - {name: version, path: "version.number"}
      - {name: status, path: "status.overall.level", description: "available | degraded | unavailable | critical"}
      - {name: summary, path: "status.overall.summary"}
      - {name: elasticsearch_status, path: "status.core.elasticsearch.level"}
      - {name: elasticsearch_summary, path: "status.core.elasticsearch.summary"}
      - {name: saved_objects_status, path: "status.core.savedObjects.level"}
      - name: degraded_plugins
        type: JSON
        description: "Names of plugins whose level is not 'available'"
        expr: "(_['status']['plugins'] or {}).items() | selectattr('1.level', 'ne', 'available') | map(attribute='0') | list"
      - {name: plugins, type: JSON, path: "status.plugins"}
      - {name: es_queued_requests, type: BIGINT, path: "metrics.elasticsearch_client.totalQueuedRequests"}
      - {name: updated_at, type: TIMESTAMP, path: "metrics.last_updated"}
    pitfalls:
      - "Without authentication (or without sufficient privileges) Kibana returns a redacted status with only the overall level; the other columns are then null."
    examples:
      - sql: "SELECT status, summary, elasticsearch_status, degraded_plugins, version FROM kibana_status"
        description: Is Kibana (and its Elasticsearch connection) healthy?
    fixtures:
      - file: status.json
        note: "Verbatim example response statusAvailableResponse of the 'Get Kibana's current status' API reference (get-status)."
        expect_rows: 1
        expect_columns: {name: kibana, version: 9.3.0, status: available, elasticsearch_status: available, saved_objects_status: available, degraded_plugins: "[]", es_queued_requests: 0}
      - file: status_redacted.json
        note: "Verbatim example response statusRedactedResponse of the same reference (unauthenticated / redacted)."
        expect_rows: 1
        expect_columns: {status: available, version: null, elasticsearch_status: null}
    docs_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-get-status

  # ------------------------------------------------------------------------------------------
  - name: kibana_alerting_health
    title: Alerting framework health (GET /api/alerting/_health)
    description: >-
      Health of the alerting framework itself: rule execution, decryption and read health with
      the time each was last checked, plus whether a permanent encryption key is set. One row.
      Check when alerts that should have fired did not.
    kind: entities
    request:
      method: GET
      path: /api/alerting/_health
    response:
      rows_path: "$"
    columns:
      - {name: execution_status, path: "alerting_framework_health.execution_health.status", description: "ok | warn | error"}
      - {name: execution_checked_at, type: TIMESTAMP, path: "alerting_framework_health.execution_health.timestamp"}
      - {name: decryption_status, path: "alerting_framework_health.decryption_health.status"}
      - {name: read_status, path: "alerting_framework_health.read_health.status"}
      - {name: has_permanent_encryption_key, type: BOOLEAN, path: "has_permanent_encryption_key", description: "false: rules and connectors cannot be decrypted after a restart"}
      - {name: is_sufficiently_secure, type: BOOLEAN, path: "is_sufficiently_secure"}
      - {name: health, type: JSON, path: "alerting_framework_health"}
    pitfalls:
      - "execution_status warn / error means rules are failing or falling behind cluster-wide (task manager overload): treat missing alerts as a monitoring outage, not as 'all healthy'."
    examples:
      - sql: "SELECT execution_status, decryption_status, read_status, execution_checked_at, has_permanent_encryption_key FROM kibana_alerting_health"
        description: Is the alerting framework running rules normally?
    fixtures:
      - file: alerting_health.json
