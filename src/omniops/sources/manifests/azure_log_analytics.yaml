          {%- if v is defined and v is not none and v != '' -%}
          {%- if v is sequence and v is not string %} | where {{ expr }} in ({{ v | map(conv) | join(', ') }})
          {%- else %} | where {{ expr }} {{ {'=': '==', '!=': '!=', '>': '>', '>=': '>=', '<': '<', '<=': '<='}.get(op or '=', '==') }} {{ v | int if conv == 'int' else v | float }}
          {%- endif -%}
          {%- endif -%}
          {%- endmacro -%}
          AppTraces
          {{- sf('_ResourceId', filters.app_resource_id, filters.app_resource_id__op) }}
          {{- sf('AppRoleName', filters.service, filters.service__op) }}
          {{- sf('Message', filters.message, filters.message__op) }}
          {{- nf('SeverityLevel', filters.severity_level, filters.severity_level__op) }}
          {%- if filters.kql_filter %} | where {{ filters.kql_filter }}{% endif %}
          | summarize Count = sum(ItemCount) by TimeGenerated = bin(TimeGenerated, {{ (filters.step_s or time.step_s) | int }}s), AppRoleName, SeverityLevel
          | order by TimeGenerated asc
      timeout_s: 200
    filters:
      - {column: service, ops: ["=", "in", "!=", "like"], fan_out: false, description: "Cloud role name", examples: ["checkout-api"]}
      - {column: severity_level, type: BIGINT, ops: ["=", "in", "!=", ">", ">=", "<", "<="], fan_out: false, description: "0 Verbose .. 4 Critical", examples: ["3"]}
      - {column: message, ops: ["like", "="], fan_out: false, description: "Only lines whose message contains the LIKE fragments", examples: ["%timeout%"]}
      - {column: step_s, type: BIGINT, description: "Bucket size in seconds (default auto)", examples: ["60"]}
      - {column: app_resource_id, ops: ["=", "in"], fan_out: false, description: "_ResourceId of the Application Insights component", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourcegroups/rg-shop-prod/providers/microsoft.insights/components/shop-appi"]}
      - {column: kql_filter, description: "Extra raw KQL predicate on AppTraces", examples: ["Message !has 'healthz'"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 1h, max_window: 31d, reapply: false, min_step: 60s, control_lookback: 6h}
    response: *la_columnar
    columns:
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time, description: "Bucket start"}
      - {name: service, path: "@r.AppRoleName"}
      - {name: severity_level, type: BIGINT, path: "@r.SeverityLevel"}
      - {name: level, expr: "{0: 'verbose', 1: 'information', 2: 'warning', 3: 'error', 4: 'critical'}.get(r['SeverityLevel'] | int) if r['SeverityLevel'] is not none else none"}
      - {name: count, type: DOUBLE, path: "@r.Count", description: "Log lines in the bucket (sum of ItemCount)"}
      - {name: message, filter_only: true}
      - {name: step_s, type: BIGINT, filter_only: true}
      - {name: app_resource_id, filter_only: true}
      - {name: kql_filter, filter_only: true}
      - {name: workspace_id, filter_only: true}
    max_rows: 20000
    sort_hint: "ascending by bucket"
    pitfalls:
      - "Empty buckets are absent, not zero."
    examples:
      - sql: >-
          SELECT ts, sum(count) AS error_lines FROM azure_log_analytics_log_counts
          WHERE service = 'checkout-api' AND severity_level >= 3 AND step_s = 60
            AND ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY ts ORDER BY ts
        description: Error log lines per minute across the incident and the hour before.
    fixtures:
      - file: log_counts.json
        filters: {service: checkout-api}
        note: "Built strictly from the documented query response format and the AppTraces schema, with the column names this table's summarize produces; no published example exists."
        expect_rows: 3
        expect_columns: {ts: "2026-10-01T11:40:00Z", service: checkout-api, severity_level: 1, level: information, count: 412.0}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apptraces

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_trace
    title: End-to-end transaction (all telemetry of one operation id)
    description: >-
      Everything Application Insights recorded for one distributed operation: AppRequests, AppDependencies,
      AppExceptions and AppTraces rows sharing OperationId (= W3C trace id), in time order. kind tells which table
      a row came from (request | dependency | exception | trace). trace_id is required. The window defaults to 24 h
      before the anchor; give a ts range around the trace if it is older.
    kind: traces
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          {%- set ids = filters.trace_id | as_list | map('squote') | join(', ') -%}
          union isfuzzy=true
          (AppRequests | where OperationId in ({{ ids }}) | extend Kind = 'request', Detail = strcat(Name, ' -> ', ResultCode)),
          (AppDependencies | where OperationId in ({{ ids }}) | extend Kind = 'dependency', Detail = strcat(DependencyType, ' ', Target, ' ', Name, ' -> ', ResultCode)),
          (AppExceptions | where OperationId in ({{ ids }}) | extend Kind = 'exception', Name = ExceptionType, Detail = coalesce(OuterMessage, Message, InnermostMessage)),
          (AppTraces | where OperationId in ({{ ids }}) | extend Kind = 'trace', Detail = Message)
          | project TimeGenerated, Kind, AppRoleName, AppRoleInstance, Name, Detail, DurationMs = column_ifexists('DurationMs', real(null)), Success = column_ifexists('Success', bool(null)), ResultCode = column_ifexists('ResultCode', ''), Target = column_ifexists('Target', ''), DependencyType = column_ifexists('DependencyType', ''), SeverityLevel = column_ifexists('SeverityLevel', int(null)), OperationId, Id = column_ifexists('Id', ''), ParentId, OperationName
          | order by TimeGenerated asc
          | take 2000
      timeout_s: 200
    filters:
      - {column: trace_id, required: true, ops: ["=", "in"], fan_out: false, description: "OperationId (W3C trace id)", examples: ["0af7651916cd43dd8448eb211c80319c"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 24h, max_window: 31d, control_lookback: 3d}
    response: *la_columnar
    columns:
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time}
      - {name: kind, path: "@r.Kind", description: "request | dependency | exception | trace"}
      - {name: service, path: "@r.AppRoleName"}
      - {name: host, path: "@r.AppRoleInstance"}
      - {name: resource, path: "@r.Name", description: "Request / dependency name, or exception type"}
      - {name: message, path: "@r.Detail", transform: redact, description: "Request -> result code, dependency call, exception message or log line"}
      - {name: duration_ms, type: DOUBLE, path: "@r.DurationMs"}
      - {name: success, type: BOOLEAN, path: "@r.Success"}
      - {name: result_code, path: "@r.ResultCode"}
      - {name: target, path: "@r.Target"}
      - {name: dependency_type, path: "@r.DependencyType"}
      - {name: severity_level, type: BIGINT, path: "@r.SeverityLevel"}
      - {name: trace_id, path: "@r.OperationId"}
      - {name: span_id, path: "@r.Id", description: "Span id (requests and dependencies only)"}
      - {name: parent_id, path: "@r.ParentId"}
      - {name: operation_name, path: "@r.OperationName"}
      - {name: workspace_id, filter_only: true}
    max_rows: 2000
    sort_hint: "oldest first (the call tree in time order)"
    pitfalls:
      - "Sampling is per operation, so a sampled-out trace is missing entirely (0 rows) even though the request happened."
      - "Services sending to other workspaces or other App Insights resources are not in this workspace: their spans are missing from the tree."
    examples:
      - sql: >-
          SELECT ts, kind, service, resource, message, duration_ms, success, span_id, parent_id
          FROM azure_log_analytics_trace WHERE trace_id = '0af7651916cd43dd8448eb211c80319c' ORDER BY ts
        description: Walk one failed transaction across services.
    fixtures:
      - file: trace.json
        filters: {trace_id: 0af7651916cd43dd8448eb211c80319c}
        note: "Built strictly from the documented query response format and the AppRequests / AppDependencies / AppExceptions / AppTraces schemas (union projected as the manifest's KQL does); no published example exists."
        expect_rows: 4
        expect_columns: {kind: request, service: checkout-api, resource: "POST /api/orders", duration_ms: 1834.5, success: false, span_id: "a4c2b3d1e5f60718"}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/transaction-search-and-diagnostics

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_app_services
    title: Application Insights services (cloud roles) with traffic and health
    description: >-
      Inventory of cloud roles (services) that sent requests in the window: requests, failures, failure_rate,
      p95 latency, instance count and versions seen (server-side summarize over AppRequests). Use it to find the
      exact service name to filter other tables with, and to spot which service degraded.
    kind: entities
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          AppRequests
          {%- if filters.service %} | where AppRoleName in~ ({{ filters.service | as_list | map('squote') | join(', ') }}){% endif %}
          | summarize Requests = sum(ItemCount), Failures = sumif(ItemCount, Success == false), P95 = percentile(DurationMs, 95), Instances = dcount(AppRoleInstance), Versions = make_set(AppVersion, 10), Apps = make_set(_ResourceId, 5), LastSeen = max(TimeGenerated) by AppRoleName
          | order by Requests desc
          | take 500
      timeout_s: 200
    filters:
      - {column: service, ops: ["=", "in"], fan_out: false, description: "Restrict to these cloud role names", examples: ["checkout-api"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 1h, max_window: 31d, reapply: false, control_lookback: 24h}
    response: *la_columnar
    columns:
      - {name: service, path: "@r.AppRoleName"}
      - {name: requests, type: DOUBLE, path: "@r.Requests"}
      - {name: failures, type: DOUBLE, path: "@r.Failures"}
      - {name: failure_rate, type: DOUBLE, expr: "((r['Failures'] | float) / (r['Requests'] | float)) if (r['Requests'] | float) > 0 else none"}
      - {name: p95_ms, type: DOUBLE, path: "@r.P95"}
      - {name: instances, type: BIGINT, path: "@r.Instances"}
      - {name: versions, type: JSON, path: "@r.Versions", transform: from_json, description: "AppVersion values seen (max 10)"}
      - {name: app_resource_ids, type: JSON, path: "@r.Apps", transform: from_json, description: "Application Insights components (_ResourceId) reporting this role"}
      - {name: ts, type: TIMESTAMP, path: "@r.LastSeen", transform: auto_time, description: "Last request seen in the window"}
      - {name: workspace_id, filter_only: true}
    max_rows: 1000
    pitfalls:
      - "Only services that received requests appear; background workers that only emit dependencies/traces are missing (query AppDependencies / AppTraces with azure_log_analytics_query)."
      - "Two versions in versions during the window usually means a rollout happened inside it."
    examples:
      - sql: "SELECT service, requests, failure_rate, p95_ms, instances, versions FROM azure_log_analytics_app_services ORDER BY failure_rate DESC NULLS LAST"
        description: Services ranked by failure rate in the analysis window.
    fixtures:
      - file: app_services.json
        note: "Built strictly from the documented query response format and the AppRequests schema, with the column names this table's summarize produces (make_set values arrive as JSON text, as dynamic columns do); no published example exists."
        expect_rows: 2
        expect_columns: {service: checkout-api, requests: 70800.0, instances: 3, versions: {not_null: true}}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apprequests

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_container_logs
    title: AKS container logs (ContainerLogV2)
    description: >-
      Container stdout/stderr collected by Container insights into ContainerLogV2: one row per log record with
      namespace, pod, container, host (node), level (LogLevel), stream (stdout/stderr) and message. Filters:
      cluster_resource_id (AKS _ResourceId), namespace, pod, container, host, level, message (LIKE), kql_filter.
      Newest 5000 rows. Works for any Container insights cluster (AKS, Arc-enabled Kubernetes).
    kind: logs
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          {%- macro sf(col, v, op) -%}
          {%- if v is defined and v is not none and v != '' -%}
          {%- if op == 'like' -%}
          {%- for f in (v | string).replace('_', '%').split('%') if f %} | where {{ col }} contains {{ f | squote }}{% endfor -%}
          {%- elif op == '!=' %} | where {{ col }} !in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- else %} | where {{ col }} in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- endif -%}
          {%- endif -%}
          {%- endmacro -%}
          ContainerLogV2
          {{- sf('_ResourceId', filters.cluster_resource_id, filters.cluster_resource_id__op) }}
          {{- sf('PodNamespace', filters.namespace, filters.namespace__op) }}
          {{- sf('PodName', filters.pod, filters.pod__op) }}
          {{- sf('ContainerName', filters.container, filters.container__op) }}
          {{- sf('Computer', filters.host, filters.host__op) }}
          {{- sf('LogLevel', filters.level, filters.level__op) }}
          {{- sf('tostring(LogMessage)', filters.message, filters.message__op) }}
          {%- if filters.kql_filter %} | where {{ filters.kql_filter }}{% endif %}
          | project TimeGenerated, Computer, PodNamespace, PodName, ContainerName, ContainerId, LogLevel, LogSource, Message = tostring(LogMessage), _ResourceId
          | order by TimeGenerated desc
          | take {{ [limit or 5000, 10000] | min }}
      timeout_s: 200
    filters:
      - {column: namespace, ops: ["=", "in", "!="], fan_out: false, description: "Kubernetes namespace (PodNamespace)", examples: ["checkout"]}
      - {column: pod, ops: ["=", "in", "like"], fan_out: false, description: "Pod name; LIKE 'checkout-api-%' for a deployment's pods", examples: ["checkout-api-7d9c6b5f4-x2k8p"]}
      - {column: container, ops: ["=", "in"], fan_out: false, description: "Container name", examples: ["checkout-api"]}
      - {column: host, ops: ["=", "in", "like"], fan_out: false, description: "Node name (Computer)", examples: ["aks-nodepool1-12345678-vmss000002"]}
      - {column: level, ops: ["=", "in", "!="], fan_out: false, description: "CRITICAL, ERROR, WARNING, INFO, DEBUG, TRACE, UNKNOWN", examples: ["ERROR"]}
      - {column: message, ops: ["like", "="], fan_out: false, description: "Message text; LIKE '%text%' becomes a contains filter", examples: ["%connection refused%"]}
      - {column: cluster_resource_id, ops: ["=", "in"], fan_out: false, description: "AKS cluster ARM id (_ResourceId, lower-case)", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourcegroups/rg-shop-prod/providers/microsoft.containerservice/managedclusters/aks-shop-prod"]}
      - {column: kql_filter, description: "Extra raw KQL predicate on ContainerLogV2", examples: ["LogSource == 'stderr'"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 1h, max_window: 31d, control_lookback: 6h}
    response: *la_columnar
    columns:
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time}
      - {name: namespace, path: "@r.PodNamespace"}
      - {name: pod, path: "@r.PodName"}
      - {name: container, path: "@r.ContainerName"}
      - {name: host, path: "@r.Computer", description: "Node name"}
      - {name: container_id, path: "@r.ContainerId"}
      - {name: level, path: "@r.LogLevel", description: "CRITICAL | ERROR | WARNING | INFO | DEBUG | TRACE | UNKNOWN"}
      - {name: stream, path: "@r.LogSource", description: "stdout | stderr"}
      - {name: message, path: "@r.Message", transform: redact, description: "Log message (JSON logs come back as JSON text)"}
      - {name: cluster_resource_id, path: "@r._ResourceId"}
      - {name: kql_filter, filter_only: true}
      - {name: workspace_id, filter_only: true}
    max_rows: 10000
    sort_hint: "newest first"
    pitfalls:
      - "Clusters still on the legacy ContainerLog schema have no ContainerLogV2 rows (0 rows, not an error): query ContainerLog (LogEntry, ContainerID) with azure_log_analytics_query."
      - "ContainerLogV2 is often switched to the Basic plan for cost; then use azure_log_analytics_query with plan = 'basic'."
      - "LogLevel is inferred from the line (UNKNOWN when no level keyword); do not rely on it alone - also filter message LIKE '%error%' or stream = 'stderr'."
      - "Logs of a crashed container are under its previous ContainerId: filter pod and look at the rows just before the restart."
    examples:
      - sql: >-
          SELECT ts, pod, container, level, message FROM azure_log_analytics_container_logs
          WHERE namespace = 'checkout' AND pod LIKE 'checkout-api-%' AND level IN ('ERROR', 'CRITICAL')
            AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts DESC LIMIT 200
        description: Error lines from a deployment's pods.
      - sql: >-
          SELECT pod, count(*) AS lines FROM azure_log_analytics_container_logs
          WHERE namespace = 'checkout' AND message LIKE '%OOMKilled%' GROUP BY 1 ORDER BY lines DESC
        description: Pods logging OOM kills.
    fixtures:
      - file: container_logs.json
        filters: {namespace: checkout}
        note: "Built strictly from the documented query response format and the ContainerLogV2 table reference (columns/types), projected as the manifest's KQL does; no published response example exists."
        expect_rows: 2
        expect_columns: {namespace: checkout, pod: checkout-api-7d9c6b5f4-x2k8p, container: checkout-api, level: ERROR, stream: stderr, host: aks-nodepool1-12345678-vmss000002}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/containerlogv2

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_kube_events
    title: Kubernetes events collected by Container insights (KubeEvents)
    description: >-
      Kubernetes events (scheduling failures, OOMKilled, BackOff, Unhealthy probes, FailedMount, evictions...)
      collected by Container insights into KubeEvents: one row per collected event record with namespace, object
      (involved object name and kind), reason, message, type (Normal / Warning), count, first/last seen, node and
      cluster. Unlike the live Kubernetes API (events expire after ~1 h) this keeps the workspace retention.
      Filters: cluster, namespace, type, reason, object_name, object_kind.
    kind: events
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          {%- macro sf(col, v, op) -%}
          {%- if v is defined and v is not none and v != '' -%}
          {%- if op == 'like' -%}
          {%- for f in (v | string).replace('_', '%').split('%') if f %} | where {{ col }} contains {{ f | squote }}{% endfor -%}
          {%- elif op == '!=' %} | where {{ col }} !in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- else %} | where {{ col }} in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- endif -%}
          {%- endif -%}
          {%- endmacro -%}
          KubeEvents
          {{- sf('ClusterName', filters.cluster, filters.cluster__op) }}
          {{- sf('Namespace', filters.namespace, filters.namespace__op) }}
          {{- sf('KubeEventType', filters.type, filters.type__op) }}
          {{- sf('Reason', filters.reason, filters.reason__op) }}
          {{- sf('Name', filters.object_name, filters.object_name__op) }}
          {{- sf('ObjectKind', filters.object_kind, filters.object_kind__op) }}
          | project TimeGenerated, ClusterName, Namespace, Name, ObjectKind, Reason, Message, KubeEventType, Count, FirstSeen, LastSeen, Computer, SourceComponent
          | order by TimeGenerated desc
          | take {{ [limit or 5000, 10000] | min }}
      timeout_s: 200
    filters:
      - {column: namespace, ops: ["=", "in", "!="], fan_out: false, description: "Involved object's namespace", examples: ["checkout"]}
      - {column: type, ops: ["=", "in"], fan_out: false, description: "Normal | Warning", examples: ["Warning"]}
      - {column: reason, ops: ["=", "in", "!="], fan_out: false, description: "Event reason: BackOff, OOMKilling, Unhealthy, FailedScheduling, FailedMount, Evicted, Killing, ...", examples: ["BackOff"]}
      - {column: object_name, ops: ["=", "in", "like"], fan_out: false, description: "Involved object name (pod, node, deployment...)", examples: ["checkout-api-7d9c6b5f4-x2k8p"]}
      - {column: object_kind, ops: ["=", "in"], fan_out: false, description: "Pod, Node, Deployment, ReplicaSet, HorizontalPodAutoscaler, ...", examples: ["Pod"]}
      - {column: cluster, ops: ["=", "in"], fan_out: false, description: "Cluster name (ClusterName)", examples: ["aks-shop-prod"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 1h, max_window: 31d, control_lookback: 24h}
    response: *la_columnar
    columns:
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time, description: "When the record was collected"}
      - {name: cluster, path: "@r.ClusterName"}
      - {name: namespace, path: "@r.Namespace"}
      - {name: object_name, path: "@r.Name", description: "Involved object name"}
      - {name: object_kind, path: "@r.ObjectKind"}
      - {name: reason, path: "@r.Reason"}
      - {name: message, path: "@r.Message"}
      - {name: type, path: "@r.KubeEventType", description: "Normal | Warning"}
      - {name: count, type: DOUBLE, path: "@r.Count", description: "Cumulative occurrence count of the event"}
      - {name: first_seen, type: TIMESTAMP, path: "@r.FirstSeen", transform: auto_time}
      - {name: last_seen, type: TIMESTAMP, path: "@r.LastSeen", transform: auto_time}
      - {name: host, path: "@r.Computer", description: "Node the event applies to (or the collecting node)"}
      - {name: source_component, path: "@r.SourceComponent", description: "kubelet, default-scheduler, ..."}
      - {name: workspace_id, filter_only: true}
    max_rows: 10000
    sort_hint: "newest first"
    pitfalls:
      - "Container insights collects only Warning events by default (Normal events need the ConfigMap setting), so type = 'Normal' can be legitimately empty."
      - "The same event can be collected several times with a growing count; deduplicate on (namespace, object_name, reason, message) and take max(count)."
    examples:
      - sql: >-
          SELECT namespace, object_name, reason, max(count) AS occurrences, max(last_seen) AS last_seen, any_value(message) AS message
          FROM azure_log_analytics_kube_events
          WHERE type = 'Warning' AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          GROUP BY 1, 2, 3 ORDER BY occurrences DESC LIMIT 30
        description: Deduplicated warning events during the incident.
      - sql: "SELECT ts, object_name, message FROM azure_log_analytics_kube_events WHERE namespace = 'checkout' AND reason IN ('BackOff', 'OOMKilling', 'Unhealthy') ORDER BY ts DESC"
        description: Crash loops, OOM kills and failing probes in one namespace.
    fixtures:
      - file: kube_events.json
        filters: {type: Warning}
        note: "Built strictly from the documented query response format and the KubeEvents table reference (columns/types), projected as the manifest's KQL does; no published response example exists."
        expect_rows: 2
        expect_columns: {namespace: checkout, object_name: checkout-api-7d9c6b5f4-x2k8p, object_kind: Pod, reason: BackOff, type: Warning, count: 14.0}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/kubeevents

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_kube_pod_inventory
    title: Kubernetes pod / container state collected by Container insights (KubePodInventory)
    description: >-
      Latest KubePodInventory record per (cluster, namespace, pod, container) in the window, plus how many times
      the container restarted INSIDE the window (restarts_in_window = max - min of ContainerRestartCount): pod phase
      (status), container state and its reason (CrashLoopBackOff, ImagePullBackOff, OOMKilled ...), last status,
      cumulative restarts, node (host), controller (ReplicaSet / StatefulSet ... name) and Kubernetes service.
      Filters: cluster, namespace, pod (=, IN, LIKE), status, host, controller, kql_filter. Unlike the live
      Kubernetes API this works for past windows (workspace retention). Rows are ordered by restarts_in_window.
    kind: entities
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          {%- macro sf(col, v, op) -%}
          {%- if v is defined and v is not none and v != '' -%}
          {%- if op == 'like' -%}
          {%- for f in (v | string).replace('_', '%').split('%') if f %} | where {{ col }} contains {{ f | squote }}{% endfor -%}
          {%- elif op == '!=' %} | where {{ col }} !in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- else %} | where {{ col }} in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- endif -%}
          {%- endif -%}
          {%- endmacro -%}
          KubePodInventory
          {{- sf('ClusterName', filters.cluster, filters.cluster__op) }}
          {{- sf('Namespace', filters.namespace, filters.namespace__op) }}
          {{- sf('Name', filters.pod, filters.pod__op) }}
          {{- sf('PodStatus', filters.status, filters.status__op) }}
          {{- sf('Computer', filters.host, filters.host__op) }}
          {{- sf('ControllerName', filters.controller, filters.controller__op) }}
          {%- if filters.kql_filter %} | where {{ filters.kql_filter }}{% endif %}
          | summarize RestartsInWindow = max(ContainerRestartCount) - min(ContainerRestartCount), arg_max(TimeGenerated, PodStatus, ContainerStatus, ContainerStatusReason, ContainerLastStatus, ContainerRestartCount, PodRestartCount, Computer, ControllerKind, ControllerName, ServiceName, PodIp, PodUid, PodCreationTimeStamp, ContainerStartTime, _ResourceId) by ClusterName, Namespace, Name, ContainerName
          | order by RestartsInWindow desc, Namespace asc, Name asc
          | take 5000
      timeout_s: 200
    filters:
      - {column: namespace, ops: ["=", "in", "!="], fan_out: false, description: "Kubernetes namespace", examples: ["checkout"]}
      - {column: pod, ops: ["=", "in", "like"], fan_out: false, description: "Pod name; LIKE 'checkout-api-%' for a deployment's pods", examples: ["checkout-api-7d9c6b5f4-x2k8p"]}
      - {column: status, ops: ["=", "in", "!="], fan_out: false, description: "Pod phase: Running | Pending | Succeeded | Failed | Unknown", examples: ["Running"]}
      - {column: host, ops: ["=", "in", "like"], fan_out: false, description: "Node name (Computer); empty for unscheduled pods", examples: ["aks-nodepool1-12345678-vmss000002"]}
      - {column: controller, ops: ["=", "in", "like"], fan_out: false, description: "Controller name (ReplicaSet / StatefulSet / DaemonSet / Job name)", examples: ["checkout-api-7d9c6b5f4"]}
      - {column: cluster, ops: ["=", "in"], fan_out: false, description: "Cluster name (ClusterName)", examples: ["aks-shop-prod"]}
      - {column: kql_filter, description: "Extra raw KQL predicate on KubePodInventory", examples: ["ContainerRestartCount > 0"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 1h, max_window: 31d, reapply: false, control_lookback: 24h}
    response: *la_columnar
    columns:
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time, description: "Last inventory record in the window (collected about every minute)"}
      - {name: cluster, path: "@r.ClusterName"}
      - {name: namespace, path: "@r.Namespace"}
      - {name: pod, path: "@r.Name"}
      - {name: container, expr: "((r['ContainerName'] or '').split('/') | last) or none", description: "Container name (ContainerName is 'poduid/container')"}
      - {name: status, path: "@r.PodStatus", description: "Pod phase (Running, Pending, Failed, ...)"}
      - {name: container_status, path: "@r.ContainerStatus", description: "running | waiting | terminated"}
      - {name: container_status_reason, path: "@r.ContainerStatusReason", description: "CrashLoopBackOff, ImagePullBackOff, OOMKilled, Error, Completed, ..."}
      - {name: container_last_status, path: "@r.ContainerLastStatus", description: "Last terminated state of the container as reported by Container insights"}
      - {name: restarts_in_window, type: BIGINT, path: "@r.RestartsInWindow", description: "Container restarts during the queried window"}
      - {name: restarts, type: BIGINT, path: "@r.ContainerRestartCount", description: "Cumulative container restart count"}
      - {name: pod_restarts, type: BIGINT, path: "@r.PodRestartCount", description: "Sum of restarts of all containers in the pod"}
      - {name: host, path: "@r.Computer", description: "Node"}
      - {name: controller_kind, path: "@r.ControllerKind"}
      - {name: controller, path: "@r.ControllerName"}
      - {name: service, path: "@r.ServiceName", description: "Kubernetes Service the pod belongs to (if any)"}
      - {name: pod_ip, path: "@r.PodIp"}
      - {name: pod_uid, path: "@r.PodUid"}
      - {name: pod_created, type: TIMESTAMP, path: "@r.PodCreationTimeStamp", transform: auto_time}
      - {name: container_started, type: TIMESTAMP, path: "@r.ContainerStartTime", transform: auto_time}
      - {name: cluster_resource_id, path: "@r._ResourceId"}
      - {name: kql_filter, filter_only: true}
      - {name: workspace_id, filter_only: true}
    max_rows: 5000
    sort_hint: "most restarts in the window first"
    pitfalls:
      - "restarts is cumulative since the container was created; use restarts_in_window to see crash loops during the incident."
      - "Deleted pods keep their last record: a pod whose ts is well before the window end no longer exists (rolled out or evicted)."
      - "Only clusters with Container insights sending to this workspace appear; Prometheus-only (managed Prometheus) setups have no KubePodInventory."
    examples:
      - sql: >-
          SELECT namespace, pod, container, status, container_status_reason, restarts_in_window, host FROM azure_log_analytics_kube_pod_inventory
          WHERE namespace = 'checkout' AND ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
            AND (restarts_in_window > 0 OR status <> 'Running')
          ORDER BY restarts_in_window DESC
        description: Pods that crash-looped or were not running during the incident.
      - sql: >-
          SELECT host, count(*) AS containers, sum(restarts_in_window) AS restarts FROM azure_log_analytics_kube_pod_inventory
          GROUP BY host ORDER BY restarts DESC LIMIT 10
        description: Which nodes host the restarting containers (node-level problem?).
    fixtures:
      - file: kube_pod_inventory.json
        filters: {namespace: checkout}
        note: "Built strictly from the documented query response format (tables[0].columns/rows) and the KubePodInventory table reference (column names and types), with the columns this table's summarize/arg_max produces; no published response example exists."
        expect_rows: 2
        expect_columns: {namespace: checkout, pod: checkout-api-7d9c6b5f4-x2k8p, container: checkout-api, status: Running, container_status: waiting, container_status_reason: CrashLoopBackOff, restarts_in_window: 6, restarts: 14, host: aks-nodepool1-12345678-vmss000002, controller: checkout-api-7d9c6b5f4, ts: "2026-10-01T11:59:12Z"}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/kubepodinventory

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_app_availability
    title: Application Insights availability tests (AppAvailabilityResults) per interval
    description: >-
      Server-side summarize over AppAvailabilityResults (standard / URL ping / custom TrackAvailability tests):
      one row per (time bucket, test, test location) with tests run, failures, availability (0..1), average
      duration and one sample failure message. Answers 'was the endpoint down from the outside, from where, and
      since when?'. Bucket = auto step unless step_s is given. Filters: test_name (=, IN, LIKE), location,
      app_resource_id, kql_filter.
    kind: timeseries
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          {%- macro sf(col, v, op) -%}
          {%- if v is defined and v is not none and v != '' -%}
          {%- if op == 'like' -%}
          {%- for f in (v | string).replace('_', '%').split('%') if f %} | where {{ col }} contains {{ f | squote }}{% endfor -%}
          {%- elif op == '!=' %} | where {{ col }} !in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- else %} | where {{ col }} in~ ({{ v | as_list | map('squote') | join(', ') }})
          {%- endif -%}
          {%- endif -%}
          {%- endmacro -%}
          AppAvailabilityResults
          {{- sf('_ResourceId', filters.app_resource_id, filters.app_resource_id__op) }}
          {{- sf('Name', filters.test_name, filters.test_name__op) }}
          {{- sf('Location', filters.location, filters.location__op) }}
          {%- if filters.kql_filter %} | where {{ filters.kql_filter }}{% endif %}
          | summarize Tests = sum(ItemCount), Failures = sumif(ItemCount, Success == false), AvgDurationMs = avg(DurationMs), FailureMessage = take_anyif(Message, Success == false) by TimeGenerated = bin(TimeGenerated, {{ (filters.step_s or time.step_s) | int }}s), Name, Location
          | order by TimeGenerated asc
      timeout_s: 200
    filters:
      - {column: test_name, ops: ["=", "in", "!=", "like"], fan_out: false, description: "Availability test name (Name)", examples: ["checkout-home-page"]}
      - {column: location, ops: ["=", "in", "!="], fan_out: false, description: "Test location display name, e.g. 'West Europe', 'East US'", examples: ["West Europe"]}
      - {column: step_s, type: BIGINT, description: "Bucket size in seconds (default auto; tests run every 5-15 minutes, so use >= 300)", examples: ["300"]}
      - {column: app_resource_id, ops: ["=", "in"], fan_out: false, description: "_ResourceId of the Application Insights component", examples: ["/subscriptions/11111111-2222-3333-4444-555555555555/resourcegroups/rg-shop-prod/providers/microsoft.insights/components/shop-appi"]}
      - {column: kql_filter, description: "Extra raw KQL predicate on AppAvailabilityResults", examples: ["Message has 'timeout'"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 3h, max_window: 31d, reapply: false, min_step: 300s, control_lookback: 24h}
    response: *la_columnar
    columns:
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time, description: "Bucket start"}
      - {name: test_name, path: "@r.Name"}
      - {name: location, path: "@r.Location", description: "Where the test ran from"}
      - {name: tests, type: DOUBLE, path: "@r.Tests"}
      - {name: failures, type: DOUBLE, path: "@r.Failures"}
      - {name: availability, type: DOUBLE, expr: "(1 - (r['Failures'] | float) / (r['Tests'] | float)) if (r['Tests'] | float) > 0 else none", description: "Share of successful tests (0..1)"}
      - {name: value, type: DOUBLE, expr: "(1 - (r['Failures'] | float) / (r['Tests'] | float)) if (r['Tests'] | float) > 0 else none", description: "Alias of availability"}
      - {name: avg_duration_ms, type: DOUBLE, path: "@r.AvgDurationMs"}
      - {name: message, path: "@r.FailureMessage", transform: redact, description: "One failure message from the bucket (empty when all passed)"}
      - {name: step_s, type: BIGINT, filter_only: true}
      - {name: app_resource_id, filter_only: true}
      - {name: kql_filter, filter_only: true}
      - {name: workspace_id, filter_only: true}
    max_rows: 20000
    sort_hint: "ascending by bucket"
    pitfalls:
      - "Tests run every 5-15 minutes per location: buckets shorter than the test frequency are empty (absent), not 'up'."
      - "A failure from a single location is often a network blip; an outage shows failures from most locations in the same bucket."
      - "Classic URL ping tests are being retired in favour of standard tests; both land in AppAvailabilityResults."
    examples:
      - sql: >-
          SELECT ts, location, availability, message FROM azure_log_analytics_app_availability
          WHERE test_name = 'checkout-home-page' AND step_s = 300
            AND ts BETWEEN TIMESTAMP '2026-10-01 10:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
          ORDER BY ts, location
        description: Availability of one test per location every 5 minutes around the incident.
      - sql: >-
          SELECT ts, count(*) AS locations, sum(CASE WHEN failures > 0 THEN 1 ELSE 0 END) AS failing_locations
          FROM azure_log_analytics_app_availability WHERE test_name = 'checkout-home-page' GROUP BY ts ORDER BY ts
        description: How many locations saw the endpoint fail in each bucket (global outage vs single location).
    fixtures:
      - file: app_availability.json
        filters: {test_name: checkout-home-page}
        note: "Built strictly from the documented query response format and the AppAvailabilityResults table reference (Name, Location, Success, DurationMs, Message, ItemCount), with the column names this table's summarize produces; no published response example exists."
        expect_rows: 3
        expect_columns: {ts: "2026-10-01T11:40:00Z", test_name: checkout-home-page, location: West Europe, tests: 1.0, failures: 0.0, availability: 1.0, avg_duration_ms: 412.7}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appavailabilityresults

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_heartbeat
    title: Agent heartbeats (VM / Arc / AKS node liveness)
    description: >-
      Latest Heartbeat per computer in the window (Azure Monitor agent / Log Analytics agent report once per
      minute): host, last heartbeat (ts), heartbeats received, OS, agent version and category, IP, Azure resource id
      and resource group. A computer whose ts stops well before the window end went silent (VM down, agent stopped,
      network cut). Filters: host, resource_group.
    kind: entities
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          Heartbeat
          {%- if filters.host %} | where Computer in~ ({{ filters.host | as_list | map('squote') | join(', ') }}){% endif %}
          {%- if filters.resource_group %} | where ResourceGroup in~ ({{ filters.resource_group | as_list | map('squote') | join(', ') }}){% endif %}
          | summarize Heartbeats = count(), arg_max(TimeGenerated, Category, OSType, OSName, Version, ComputerIP, Resource, ResourceGroup, ResourceType, _ResourceId, SubscriptionId) by Computer
          | order by TimeGenerated asc
          | take 5000
      timeout_s: 200
    filters:
      - {column: host, ops: ["=", "in"], fan_out: false, variants: hostname, description: "Computer name", examples: ["web-vm-01"]}
      - {column: resource_group, ops: ["=", "in"], fan_out: false, description: "Resource group of the machine", examples: ["rg-shop-prod"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 1h, max_window: 31d, reapply: false, control_lookback: 24h}
    response: *la_columnar
    columns:
      - {name: host, path: "@r.Computer"}
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time, description: "Last heartbeat in the window"}
      - {name: heartbeats, type: BIGINT, path: "@r.Heartbeats", description: "Heartbeats in the window (about 1 per minute when healthy)"}
      - {name: category, path: "@r.Category", description: "Azure Monitor Agent, Direct Agent, SCOM Agent, ..."}
      - {name: os_type, path: "@r.OSType"}
      - {name: os_name, path: "@r.OSName"}
      - {name: version, path: "@r.Version", description: "Agent version"}
      - {name: ip, path: "@r.ComputerIP"}
      - {name: resource, path: "@r.Resource", description: "Azure resource name"}
      - {name: resource_group, path: "@r.ResourceGroup"}
      - {name: resource_type, path: "@r.ResourceType"}
      - {name: resource_id, path: "@r._ResourceId"}
      - {name: subscription_id, path: "@r.SubscriptionId"}
      - {name: workspace_id, filter_only: true}
    max_rows: 5000
    sort_hint: "oldest last heartbeat first (silent machines on top)"
    pitfalls:
      - "Machines that sent no heartbeat at all in the window are absent; compare against a wider window or azure_monitor_resources to find machines that went silent before it."
      - "Heartbeat Computer names are the OS host names (short or FQDN depending on OS), not always the Azure VM name; resource holds the Azure name."
    examples:
      - sql: >-
          SELECT host, ts AS last_heartbeat, heartbeats, resource_group FROM azure_log_analytics_heartbeat
          WHERE ts BETWEEN TIMESTAMP '2026-10-01 11:00:00' AND TIMESTAMP '2026-10-01 12:00:00'
            AND ts < TIMESTAMP '2026-10-01 11:55:00'
          ORDER BY last_heartbeat
        description: Machines whose heartbeat stopped before the end of the incident window.
    fixtures:
      - file: heartbeat.json
        note: "Built strictly from the documented query response format and the Heartbeat table reference (columns/types), with the column order arg_max/summarize produces; no published response example exists."
        expect_rows: 2
        expect_columns: {host: web-vm-02, heartbeats: 41, os_type: Linux, resource_group: rg-shop-prod, ts: "2026-10-01T11:41:02.553Z"}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/heartbeat

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_table_usage
    title: Ingested volume per table and hour (Usage)
    description: >-
      The workspace's Usage table: one row per (hour, table/DataType, solution) with the ingested megabytes and
      whether it is billable. Use it to discover which tables exist and receive data, and to tell 'no errors' from
      'no data' (an ingestion drop shows as missing or shrinking hours). Filter table_name to one or more tables.
    kind: timeseries
    request:
      method: POST
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/query"
      body:
        timespan: "{{ (time.start | rfc3339) ~ '/' ~ (time.end | rfc3339) }}"
        query: |-
          Usage
          {%- if filters.table_name %} | where DataType in~ ({{ filters.table_name | as_list | map('squote') | join(', ') }}){% endif %}
          | project TimeGenerated, DataType, Solution, Quantity, QuantityUnit, IsBillable, Plan, StartTime, EndTime
          | order by TimeGenerated desc
          | take 10000
      timeout_s: 200
    filters:
      - {column: table_name, ops: ["=", "in"], fan_out: false, description: "Table name (DataType), e.g. AppRequests, ContainerLogV2, AzureDiagnostics", examples: ["AppRequests"]}
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    time: {column: ts, default_lookback: 24h, max_window: 31d, control_lookback: 3d}
    response: *la_columnar
    columns:
      - {name: ts, type: TIMESTAMP, path: "@r.TimeGenerated", transform: auto_time, description: "Hour the usage record covers"}
      - {name: table_name, path: "@r.DataType"}
      - {name: solution, path: "@r.Solution"}
      - {name: quantity_mb, type: DOUBLE, path: "@r.Quantity", description: "Ingested megabytes"}
      - {name: unit, path: "@r.QuantityUnit"}
      - {name: is_billable, type: BOOLEAN, path: "@r.IsBillable"}
      - {name: plan, path: "@r.Plan", description: "Analytics | Basic | Auxiliary"}
      - {name: start_time, type: TIMESTAMP, path: "@r.StartTime", transform: auto_time}
      - {name: end_time, type: TIMESTAMP, path: "@r.EndTime", transform: auto_time}
      - {name: workspace_id, filter_only: true}
    max_rows: 10000
    sort_hint: "newest hour first"
    pitfalls:
      - "Usage is aggregated per hour and lags ingestion; the current hour is incomplete."
    examples:
      - sql: >-
          SELECT table_name, sum(quantity_mb) AS mb, max(ts) AS last_hour FROM azure_log_analytics_table_usage
          GROUP BY 1 ORDER BY mb DESC
        description: Which tables exist and receive data (last 24 h).
      - sql: >-
          SELECT ts, quantity_mb FROM azure_log_analytics_table_usage
          WHERE table_name = 'AppRequests' AND ts >= TIMESTAMP '2026-09-30 12:00:00' ORDER BY ts
        description: Did AppRequests ingestion drop during the incident (telemetry gap vs real outage)?
    fixtures:
      - file: query_usage.json
        filters: {table_name: Usage}
        note: "Verbatim 200 response of the official example 'A simple POST query on a workspace' (Usage | take 10, la-post-example.json): the same Usage columns this table projects (Plan is absent in that older example, so plan is null)."
        expect_rows: 2
        expect_columns: {ts: "2017-08-24T06:59:59Z", table_name: Perf, solution: LogManagement, quantity_mb: 0.076408, is_billable: true, plan: null}
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/usage

  # ------------------------------------------------------------------------------------------
  - name: azure_log_analytics_schema
    title: Workspace schema (tables and their columns)
    description: >-
      The workspace metadata (GET /v1/workspaces/{id}/metadata): one row per table with its description, timespan
      column, related solutions and the column list (name, type, isPreferredFacet) as JSON. Use it before writing
      KQL against an unfamiliar table, especially custom _CL tables and resource-specific diagnostic tables.
    kind: entities
    request:
      method: GET
      path: "/v1/workspaces/{{ filters.workspace_id or env.AZURE_LOG_ANALYTICS_WORKSPACE_ID }}/metadata"
      timeout_s: 120
    filters:
      - {column: workspace_id, description: "Workspace GUID override", examples: ["63613592-b6f7-4c3d-a390-22ba13102111"]}
    response:
      rows_path: "$.tables[*]"
    columns:
      - {name: table_name, path: name}
      - {name: id, path: id}
      - {name: description, path: description}
      - {name: timespan_column, path: timespanColumn}
      - {name: columns, type: JSON, path: columns, description: "[{name, type, description, isPreferredFacet}]"}
      - {name: column_names, expr: "(_.columns or []) | map(attribute='name') | join(', ')", description: "Comma-separated column names"}
      - {name: solutions, type: JSON, path: "related.solutions"}
      - {name: workspace_id, filter_only: true}
    max_rows: 5000
    pitfalls:
      - "The metadata payload is large for workspaces with many solutions; filter in SQL (WHERE table_name LIKE 'App%')."
      - "A table listed here may still have no recent data; check azure_log_analytics_table_usage."
    examples:
      - sql: "SELECT table_name, column_names FROM azure_log_analytics_schema WHERE table_name LIKE '%_CL' OR table_name LIKE 'App%'"
        description: Custom log tables and Application Insights tables with their columns.
    fixtures:
      - file: metadata.json
        note: "Verbatim 200 response of the official example 'Metadata GET request' (Metadata - Get, v1 REST reference; metadata-get.json in the Log Analytics data-plane spec)."
        expect_min_rows: 1
        expect_columns: {table_name: ADAssessmentRecommendation, columns: {not_null: true}}
    docs_url: https://learn.microsoft.com/en-us/rest/api/logsquery/metadata/get?view=rest-logsquery-v1

roles:
  logs:
    - table: azure_log_analytics_app_traces
      filters:
        service: "{{ service }}"
        severity_level: "{{ [3, 4] if error_only else '' }}"
      columns: {ts: ts, service: service, message: message, level: level, host: host, trace_id: trace_id}
      notes: "Application Insights / OpenTelemetry logs; severity_level >= 3 for errors."
    - table: azure_log_analytics_container_logs
      filters:
        namespace: "{{ namespace }}"
        pod: "{{ pod }}"
        level: "{{ ['ERROR', 'CRITICAL'] if error_only else '' }}"
      columns: {ts: ts, message: message, level: level, host: host, namespace: namespace, pod: pod, container: container}
      notes: "AKS stdout/stderr (ContainerLogV2)."
  log_counts:
    table: azure_log_analytics_log_counts
    filters: {service: "{{ service }}"}
    columns: {ts: ts, value: count, count: count, level: level, service: service}
  traces:
    - table: azure_log_analytics_app_requests
      filters:
        service: "{{ service }}"
        success: "{{ false if error_only else '' }}"
      columns: {ts: ts, service: service, resource: resource, duration_ms: duration_ms, status_code: status_code, trace_id: trace_id, span_id: span_id, host: host}
    - table: azure_log_analytics_app_dependencies
      filters:
        service: "{{ service }}"
        success: "{{ false if error_only else '' }}"
      columns: {ts: ts, service: service, resource: resource, duration_ms: duration_ms, status_code: status_code, trace_id: trace_id, span_id: span_id, target: target}
  trace_detail:
    table: azure_log_analytics_trace
    columns: {ts: ts, trace_id: trace_id, span_id: span_id, parent_id: parent_id, service: service, duration_ms: duration_ms, resource: resource, message: message}
  service_map:
    table: azure_log_analytics_app_dependency_map
    columns: {source: service, service: service, target: target, type: dependency_type, requests: calls, errors: failures, ts: ts}
  services:
    table: azure_log_analytics_app_services
    columns: {service: service, ts: ts, version: versions}
  errors:
    table: azure_log_analytics_app_exception_groups
    filters: {service: "{{ service }}"}
    columns: {ts: ts, service: service, title: title, count: occurrences, message: message, id: problem_id}
  k8s_logs:
    table: azure_log_analytics_container_logs
    filters: {namespace: "{{ namespace }}", pod: "{{ pod }}", container: "{{ container }}"}
    columns: {ts: ts, message: message, level: level, namespace: namespace, pod: pod, container: container}
    notes: "Container insights ContainerLogV2; there is no 'previous container' switch - look at the rows just before the restart."
  k8s_state:
    table: azure_log_analytics_kube_pod_inventory
    filters: {namespace: "{{ namespace }}"}
    columns: {pod: pod, namespace: namespace, phase: status, restarts: restarts_in_window, waiting: container_status_reason, reason: container_status_reason, terminated: container_last_status, node: host, container: container, service: service, ts: ts}
    notes: "Container insights KubePodInventory: latest state per container in the window; restarts = restarts inside the window (restarts column is cumulative)."
  k8s_events:
    table: azure_log_analytics_kube_events
    filters: {type: Warning, namespace: "{{ namespace }}"}
    columns: {ts: ts, namespace: namespace, type: type, reason: reason, message: message, object: object_name, kind: object_kind, count: count}
  hosts:
    table: azure_log_analytics_heartbeat
    filters: {host: "{{ host }}"}
    columns: {host: host, ts: ts, health: heartbeats}
    notes: "Agent liveness: a host whose last heartbeat is well before the window end went silent."
