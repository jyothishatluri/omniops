# Datasource uids are a contract: OmniOps' grafana_* sources default to prometheus / loki / tempo,
# and the alert rules reference them. All three run in the same pod (127.0.0.1).
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: false
    jsonData:
      maxLines: 1000
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
