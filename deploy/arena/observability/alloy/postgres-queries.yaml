# postgres_exporter custom queries (metric = <query name>_<column>). Read-only catalog views only.
pg_lock_waiters:
  query: |
    SELECT datname, count(*)::float8 AS backends
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock' AND datname IS NOT NULL
    GROUP BY datname
  metrics:
    - datname:
        usage: LABEL
        description: Database name
    - backends:
        usage: GAUGE
        description: Backends currently waiting to acquire a lock

pg_oldest_transaction:
  query: |
    SELECT datname, COALESCE(MAX(EXTRACT(EPOCH FROM clock_timestamp() - xact_start)), 0)::float8 AS age_seconds
    FROM pg_stat_activity
    WHERE xact_start IS NOT NULL AND state IS DISTINCT FROM 'idle' AND backend_type = 'client backend'
      AND pid <> pg_backend_pid() AND datname IS NOT NULL
    GROUP BY datname
  metrics:
    - datname:
        usage: LABEL
        description: Database name
    - age_seconds:
        usage: GAUGE
        description: Age of the oldest open transaction in seconds
