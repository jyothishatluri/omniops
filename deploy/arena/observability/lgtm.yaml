# Grafana + Prometheus + Loki + Tempo + OTLP in one pod (grafana/otel-lgtm 0.36.0: Grafana 13.2.3,
# Prometheus 3.15 with remote-write and OTLP receivers, Loki 3.7, Tempo 3.1), sized for a laptop.
# Grafana reads OmniOps' provisioning (datasources with uids prometheus/loki/tempo, the generic symptom
# alert rules, contact points and the notification policy) from /omniops/provisioning.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: omniops-arena
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: observability
spec:
  selector:
    app: lgtm
  ports:
    - {name: grafana, port: 3000, targetPort: 3000}
    - {name: loki, port: 3100, targetPort: 3100}
    - {name: tempo, port: 3200, targetPort: 3200}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: prometheus, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: observability
  labels:
    app: lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.36.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
            - {name: GF_PATHS_PROVISIONING, value: /omniops/provisioning}
            - {name: GF_SERVER_ROOT_URL, value: "http://localhost:3000"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports:
            - containerPort: 3000
            - containerPort: 3100
            - containerPort: 3200
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 9090
          readinessProbe:
            exec:
              command: [cat, /tmp/ready]
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: loki-scratch, mountPath: /loki}
            - {name: provisioning, mountPath: /omniops/provisioning, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lgtm-data
        - name: loki-scratch
          emptyDir: {}
        - name: provisioning
          projected:
            sources:
              - configMap:
                  name: grafana-provisioning
                  items:
                    - {key: datasources.yaml, path: datasources/datasources.yaml}
                    - {key: dashboards.yaml, path: dashboards/dashboards.yaml}
                    - {key: arena-overview.json, path: dashboards/arena/arena-overview.json}
                    - {key: plugins.yaml, path: plugins/plugins.yaml}
                    - {key: alert-rules.yaml, path: alerting/alert-rules.yaml}
              - secret:
                  name: grafana-notifications
                  items:
                    - {key: contact-points.yaml, path: alerting/contact-points.yaml}
                    - {key: policies.yaml, path: alerting/policies.yaml}
